<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Lighthouse - Comparison</title>

  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <style>
    :root {
      --navy: #1e3a8a;
      --accent1: #2563eb;
      --accent2: #4f46e5;
    }

    body {
      font-family: Inter, system-ui, Arial;
      margin: 0;
      background: #f6f9fc;
      color: #0f172a;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      color: #fff;
    }

    header h1 {
      margin: 0;
      font-weight: 800;
      font-size: 1.05rem;
    }

    header .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: 0;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-blue {
      background: #fff;
      color: var(--navy);
    }

    .btn-gray {
      background: #eef2ff;
      color: var(--navy);
    }

    main {
      max-width: 1500px;
      margin: 20px auto;
      padding: 12px;
    }

    h2 {
      text-align: center;
      color: var(--navy);
      font-weight: 900;
      margin-bottom: 18px;
    }

    .table-wrapper {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(4, 8, 15, 0.05);
      overflow: auto;
      max-height: 80vh;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 1100px;
    }

    th, td {
      border: 1.5px solid #65738a;
      padding: 6px 8px;
      text-align: center;
      font-weight: 700;
    }

    thead th {
      position: sticky;
      top: 0;
      background: linear-gradient(90deg, #e0e7ff, #c7d2fe);
      color: var(--navy);
      z-index: 5;
    }

    tr.subtotal-row td {
      background: #fff7cc;
      font-weight: 900;
    }

    tr.grandtotal-row td {
      background: #bae6fd;
      font-weight: 900;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.7);
      z-index: 3000;
      font-weight: 900;
      color: var(--navy);
    }

    .overlay.show {
      display: flex;
    }

    @media(max-width:900px) {
      th, td {
        font-size: .85rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="left">
      <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo" style="height:40px">
      <h1>SMC Lighthouse - Monthly Comparison</h1>
    </div>
    <div class="toolbar">
      <a href="/dashboard"><button class="btn btn-gray">← Back to Dashboard</button></a>
      <button id="exportBtn" class="btn btn-blue">Export</button>
    </div>
  </header>

  <main>
    <h2>Month-wise Sales Comparison</h2>
    <div class="table-wrapper">
      <table id="comparisonTable">
        <thead id="comparisonHead"></thead>
        <tbody id="comparisonBody"></tbody>
      </table>
    </div>
  </main>

  <div id="overlay" class="overlay">Processing...</div>

  <script>
    const API_URL = "/get_data/lighthouse_sales";
    let rawData = [];

    function showOverlay() { document.getElementById('overlay').classList.add('show'); }
    function hideOverlay() { document.getElementById('overlay').classList.remove('show'); }
    function toNum(v) { return Number(v) || 0; }

    function parseDateFlexible(s){
      if(!s) return null;
      s = String(s).trim();
      if(/^\d{8}$/.test(s)){ const d=+s.slice(0,2),m=+s.slice(2,4),y=+s.slice(4,8); return new Date(y,m-1,d); }
      const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if(m) return new Date(+m[1],+m[2]-1,+m[3]);
      const d = new Date(s);
      return isNaN(d)?null:d;
    }

    function invoiceMonthLabel(s){
      const dt = parseDateFlexible(s);
      if(!dt) return "";
      return dt.toLocaleString('default',{month:'short',year:'2-digit'});
    }

    async function loadData(){
      showOverlay();
      try{
        const res = await axios.get(API_URL);
        const data = Array.isArray(res.data) ? res.data : [];
        rawData = data.map(r=>{
          const rawDate = (r.invoice_date || r.INVOICE_DATE || "").toString().trim();
          const parsed = parseDateFlexible(rawDate);
          return {
            state: (r.state || r.STATE || "").trim(),
            partyName: (r.party_name || r.PARTY_NAME || "").trim(),
            itemName: (r.item_name || r.ITEM_NAME || "").trim(),
            invoiceMonth: invoiceMonthLabel(rawDate),
            quantityCs: toNum(r.quantity_cs || r.Quantity_CS || 0)
          };
        }).filter(r => r.invoiceMonth);

        renderComparisonTable();
      } catch(e) {
        console.error("Error loading data", e);
      } finally {
        hideOverlay();
      }
    }

    function renderComparisonTable(){
      const head = document.getElementById("comparisonHead");
      const body = document.getElementById("comparisonBody");

      // Unique months sorted chronologically
      const months = [...new Set(rawData.map(r => r.invoiceMonth))];
      months.sort((a,b)=>new Date("01-"+a)-new Date("01-"+b));

      head.innerHTML = "<tr><th>State</th><th>Party_Name</th><th>Item_Name</th>" +
        months.map(m=>`<th>${m}</th>`).join("") + "</tr>";

      // Group data
      const stateMap = new Map();
      rawData.forEach(r=>{
        const {state, partyName, itemName, invoiceMonth, quantityCs} = r;
        if(!stateMap.has(state)) stateMap.set(state, new Map());
        const partyMap = stateMap.get(state);
        if(!partyMap.has(partyName)) partyMap.set(partyName, new Map());
        const itemMap = partyMap.get(partyName);
        if(!itemMap.has(itemName)) itemMap.set(itemName, {});
        itemMap.get(itemName)[invoiceMonth] = (itemMap.get(itemName)[invoiceMonth] || 0) + quantityCs;
      });

      let html = "";
      stateMap.forEach((partyMap, state)=>{
        let stateTotals = Object.fromEntries(months.map(m=>[m,0]));

        partyMap.forEach((itemMap, party)=>{
          let partyTotals = Object.fromEntries(months.map(m=>[m,0]));

          itemMap.forEach((monthData, item)=>{
            html += `<tr><td>${state}</td><td>${party}</td><td>${item}</td>`;
            months.forEach(m=>{
              const val = monthData[m] || 0;
              html += `<td>${val.toLocaleString()}</td>`;
              partyTotals[m] += val;
              stateTotals[m] += val;
            });
            html += `</tr>`;
          });

          // Party subtotal
          html += `<tr class='subtotal-row'><td></td><td><b>SUM ${party}</b></td><td></td>` +
            months.map(m=>`<td><b>${partyTotals[m].toLocaleString()}</b></td>`).join("") +
          `</tr>`;
        });

        // State total
        html += `<tr class='grandtotal-row'><td><b>TOTAL ${state}</b></td><td></td><td></td>` +
          months.map(m=>`<td><b>${stateTotals[m].toLocaleString()}</b></td>`).join("") +
        `</tr>`;
      });

      body.innerHTML = html;
    }

    // Export to Excel
    document.getElementById("exportBtn").addEventListener("click", async ()=>{
      showOverlay();
      try{
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet("Comparison");
        const rows = [...document.querySelectorAll("#comparisonTable tr")]
          .map(tr => [...tr.children].map(td => td.innerText.trim()));
        rows.forEach((r,i)=>{const row=ws.addRow(r); if(i===0) row.font={bold:true};});
        ws.columns.forEach(c=>c.width=16);
        const buf = await wb.xlsx.writeBuffer();
        saveAs(new Blob([buf]), `comparison_${new Date().toISOString().slice(0,10)}.xlsx`);
      } catch(e){
        console.error("Export failed", e);
        alert("Export failed: " + e.message);
      } finally {
        hideOverlay();
      }
    });

    // Init
    loadData();
  </script>
</body>
</html>
