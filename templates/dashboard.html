<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Madhusudan Dashboard</title>
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <style>
    body { font-family: 'Inter', sans-serif; background: #f9fafb; }

    /* Table styling */
    th, td {
      border: 2px solid #9ca3af;
      vertical-align: middle;
      font-size: 0.85rem;
      font-weight: 600; /* bold data */
    }
    th {
      background: linear-gradient(to right, #eef2ff, #e0e7ff);
      position: sticky; top: 0; z-index: 10;
      color: #1e3a8a; font-weight: 700;
      text-align: center;
    }
    td.numeric { text-align: center; }

    .btn {
      padding: 0.4rem 0.8rem; border-radius: 0.5rem;
      font-weight: 500; transition: 0.2s; font-size: 0.85rem;
    }
    .btn-blue { background: linear-gradient(to right, #2563eb, #4f46e5); color: white; }
    .btn-blue:hover { opacity: 0.9; }
    .btn-gray { background: #f3f4f6; color: #111827; }
    .btn-gray:hover { background: #e5e7eb; }

    /* Filter bar & boxes */
    .filter-bar {
      display: flex;
      overflow-x: auto;
      gap: 0.75rem;
      padding: 0.5rem;
      background: white;
      border-radius: 0.75rem;
      box-shadow: inset 0 0 4px #e5e7eb;
      scroll-behavior: smooth;
      transition: all 0.3s ease;
    }
    .filter-box {
      border: 1px solid #93c5fd;
      border-radius: 0.6rem;
      padding: 6px;
      width: 160px;
      font-size: 0.75rem;
      color: #1f2937;
      flex-shrink: 0;
      box-shadow: 0 3px 6px rgba(0,0,0,0.08);
      overflow-y: auto;
      max-height: 160px;
      background: linear-gradient(to bottom right, #f0f9ff, #dbeafe);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .filter-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .filter-box strong {
      display: block;
      text-align: center;
      color: #1d4ed8;
      font-size: 0.75rem;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .filter-box label {
      display: block;
      line-height: 1rem;
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 4px;
    }
    .filter-box label:hover {
      background: #bfdbfe;
      color: #1e3a8a;
    }
    .filter-box input[type=checkbox] {
      accent-color: #2563eb;
      margin-right: 4px;
      cursor: pointer;
    }

    .table-wrapper {
      max-height: 70vh;
      overflow: auto;
      border-radius: 0.75rem;
    }

    tfoot {
      background: #f3f4f6;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>

<body>
<header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <img src="{{ url_for('static', filename='onlylogo.png') }}" class="h-9 w-auto" alt="logo">
      <h1 class="text-lg font-bold text-indigo-700">SMC MADHUSUDAN DASHBOARD</h1>
    </div>
    <div class="flex gap-2">
      <button id="exportBtn" class="btn btn-blue">⬇ Export</button>
      <button id="clearFiltersBtn" class="btn btn-gray">🧹 Clear</button>
      <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
      <button id="toggleViewBtn" class="btn btn-blue">Switch to SKU View</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
  <section class="bg-white p-4 rounded-xl shadow">
    <div id="filtersContainer" class="filter-bar mb-3"></div>
    <div id="loader" class="text-center py-3 text-gray-500">Loading data...</div>

    <div class="table-wrapper mt-2">
      <table id="dataTable" class="min-w-full divide-y divide-gray-300 hidden">
        <thead id="tableHead"></thead>
        <tbody id="tableBody" class="divide-y divide-gray-200"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
  </section>
</main>

<footer class="mt-10 bg-gray-100 py-3 text-center text-xs text-gray-500">
  © {{ current_year }} SMC Madhusudan | All Rights Reserved
</footer>

<script>
let currentView = "product";
const baseTextCols = ["STATE","MANAGER_NAME","DISTRICT","PARTY_NAME","PRODUCT","SKU"];
const monthOrder = [
  "APR-23","MAY-23","JUN-23","AVG_Q1_2023-24",
  "JUL-23","AUG-23","SEP-23","AVG_Q2_2023-24",
  "OCT-23","NOV-23","DEC-23","AVG_Q3_2023-24",
  "JAN-24","FEB-24","MAR-24","AVG_Q4_2023-24","AVG_YEAR_2023-24",
  "APR-24","MAY-24","JUN-24","AVG_Q1_2024-25",
  "JUL-24","AUG-24","SEP-24","AVG_Q2_2024-25",
  "OCT-24","NOV-24","DEC-24","AVG_Q3_2024-25",
  "JAN-25","FEB-25","MAR-25","AVG_Q4_2024-25","AVG_YEAR_2024-25",
  "APR-25","MAY-25","JUN-25","AVG_Q1_2025-26",
  "JUL-25","AUG-25","SEP-25","AVG_Q2_2025-26","AVG_YEAR_2025-26"
];

async function loadData(view="product"){
  const res = await fetch(`/get_data/${view}`);
  const data = await res.json();

  const loader=document.getElementById("loader"),
        filters=document.getElementById("filtersContainer"),
        table=document.getElementById("dataTable"),
        thead=document.getElementById("tableHead"),
        tbody=document.getElementById("tableBody"),
        tfoot=document.getElementById("tableFoot");

  if(!data||data.error){loader.textContent="⚠️ Error loading data.";return;}
  if(!data.length){loader.textContent="No data found.";return;}

  loader.classList.add("hidden");
  table.classList.remove("hidden");

  const headers = Object.keys(data[0]).map(h=>h.toUpperCase());
  const textCols = baseTextCols.filter(c=>headers.includes(c));
  const numericCols = headers.filter(h=>!textCols.includes(h));
  const orderedNumeric = monthOrder.filter(m=>numericCols.includes(m));
  const orderedHeaders = [...textCols, ...orderedNumeric];

  thead.innerHTML = `<tr>${orderedHeaders.map(h=>`<th>${h}</th>`).join("")}</tr>`;

  // --- Build Filters ---
  filters.innerHTML = "";

  // Function to build filters with "All" option
  function buildFilter(col, color){
    const vals=[...new Set(data.map(d=>d[col.toLowerCase()]))].filter(Boolean).sort();
    const box=document.createElement("div");
    box.className="filter-box";
    box.style.background=color;
    box.innerHTML=`<strong>${col}</strong>
      <label><input type="checkbox" class="all-toggle" name="${col}" value="__ALL__">All</label>` +
      vals.map(v=>`<label><input type="checkbox" name="${col}" value="${v}">${v}</label>`).join("");
    filters.appendChild(box);
  }

  const colors=[
    "linear-gradient(to bottom right,#e0f7fa,#b2ebf2)",
    "linear-gradient(to bottom right,#ede9fe,#c7d2fe)",
    "linear-gradient(to bottom right,#fef9c3,#fde68a)",
    "linear-gradient(to bottom right,#fce7f3,#fbcfe8)",
    "linear-gradient(to bottom right,#dcfce7,#bbf7d0)"
  ];

  textCols.forEach((c,i)=>buildFilter(c,colors[i%colors.length]));

  // Month / Year & Comparison filters
  buildFilter("MONTH / YEAR","linear-gradient(to bottom right,#e0f2fe,#bae6fd)");
  buildFilter("COMPARISON","linear-gradient(to bottom right,#fef3c7,#fde68a)");

  // Show Columns filter
  const showBox=document.createElement("div");
  showBox.className="filter-box";
  showBox.style.background="linear-gradient(to bottom right,#e0e7ff,#c7d2fe)";
  showBox.innerHTML=`<strong>SHOW COLUMNS</strong>` +
    textCols.map(c=>`<label><input type="checkbox" name="showcol" value="${c}" checked>${c}</label>`).join("");
  filters.appendChild(showBox);

  // Total filter
  const totalBox=document.createElement("div");
  totalBox.className="filter-box";
  totalBox.style.background="linear-gradient(to bottom right,#fce7f3,#fbcfe8)";
  totalBox.innerHTML=`<strong>TOTAL</strong>` +
    textCols.map(c=>`<label><input type="checkbox" name="total" value="${c}">${c}</label>`).join("");
  filters.appendChild(totalBox);

  // ---- Render ----
  function render(rows, cols=orderedHeaders){
    tbody.innerHTML = rows.map(r=>{
      return `<tr>${cols.map((h,idx)=>{
        const key=h.toLowerCase();
        let val=r[key]; let style="";
        if(orderedNumeric.includes(h)){
          val=Number(val)||0;
          const prev=(idx>0 && orderedNumeric.includes(cols[idx-1]))?Number(r[cols[idx-1].toLowerCase()]):val;
          style=(val>prev?"color:green":val<prev?"color:red":"");
        }
        return `<td class="numeric" style="${style}">${val}</td>`;
      }).join("")}</tr>`;
    }).join("");
  }

  // ---- Apply Filters ----
  function applyFilters(){
    let filtered=[...data];

    textCols.forEach(c=>{
      const selected = Array.from(document.querySelectorAll(`input[name='${c}']:checked`)).map(e=>e.value);
      if(selected.length && !selected.includes("__ALL__"))
        filtered = filtered.filter(r=>selected.includes(r[c.toLowerCase()]));
    });

    const visibleCols = Array.from(document.querySelectorAll("input[name='showcol']:checked")).map(e=>e.value);
    const totalSel = Array.from(document.querySelectorAll("input[name='total']:checked")).map(e=>e.value);

    const colsToShow=[...visibleCols,...orderedNumeric];

    thead.innerHTML=`<tr>${colsToShow.map(h=>`<th>${h}</th>`).join("")}</tr>`;
    render(filtered,colsToShow);

    // --- Total Calculation ---
    if(totalSel.length){
      const totalRow={};
      orderedNumeric.forEach(n=>totalRow[n]=filtered.reduce((sum,r)=>sum+(Number(r[n.toLowerCase()])||0),0));
      totalSel.forEach(t=>totalRow[t]=`TOTAL ${t}`);
      tfoot.innerHTML=`<tr>${colsToShow.map(h=>{
        const key=h.toLowerCase();
        const val=totalRow[key]!==undefined?totalRow[key]:"";
        return `<td>${val}</td>`;
      }).join("")}</tr>`;
    } else tfoot.innerHTML="";
  }

  // --- "All" checkbox logic ---
  filters.addEventListener("change",e=>{
    const el=e.target;
    if(el.classList.contains("all-toggle")){
      const group=el.name;
      const allInGroup=document.querySelectorAll(`input[name='${group}']:not(.all-toggle)`);
      allInGroup.forEach(cb=>cb.checked=el.checked);
    }
    applyFilters();
  });

  // ---- Buttons ----
  document.getElementById("exportBtn").onclick=()=>{
    const rows=Array.from(tbody.querySelectorAll("tr")).map(tr => Array.from(tr.querySelectorAll("td")).map(td=>td.textContent));
    const csv=[orderedHeaders.join(","),...rows.map(r=>r.join(","))].join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`${currentView}_export.csv`;
    a.click();
  };

  document.getElementById("clearFiltersBtn").onclick=()=>{
    document.querySelectorAll("input[type='checkbox']").forEach(cb=>cb.checked=false);
    tfoot.innerHTML="";
    applyFilters();
  };

  const toggleBtn=document.getElementById("toggleFiltersBtn");
  toggleBtn.onclick=()=>{
    const vis=!filters.classList.contains("hidden");
    if(vis){filters.classList.add("hidden");toggleBtn.textContent="Show Filters";}
    else{filters.classList.remove("hidden");toggleBtn.textContent="Hide Filters";}
  };

  applyFilters();
}

document.getElementById("toggleViewBtn").addEventListener("click",function(){
  currentView=currentView==="product"?"sku":"product";
  this.textContent=currentView==="product"?"Switch to SKU View":"Switch to Product View";
  loadData(currentView);
});

document.addEventListener("DOMContentLoaded",()=>loadData(currentView));
</script>
</body>
</html>
