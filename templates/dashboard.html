<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Madhusudan Dashboard</title>

  <!-- Static CSS -->
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
</head>
<body>
  <header>
    <div class="container header-row">
      <div class="brand">
        <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo" class="logo">
        <h1>SMC Madhusudan Dashboard</h1>
      </div>

      <div class="toolbar">
        <button id="exportBtn" class="btn btn-blue">⬇ Export</button>
        <button id="clearBtn" class="btn btn-gray">🧹 Clear</button>
        <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
        <button id="toggleViewBtn" class="btn btn-blue">Switch to SKU View</button>
        <button id="themeToggle" class="btn btn-gray" id="themeToggle">🌙 Dark</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section>
      <!-- Filters row (flex, horizontal scroll) -->
      <div id="filtersContainer" class="filter-bar" aria-hidden="false"></div>

      <!-- small loader text -->
      <div id="loader" class="loader">Loading data...</div>

      <!-- overlay while updating -->
      <div id="overlayLoader" class="overlay hidden">Updating filters…</div>

      <!-- data table -->
      <div class="table-wrapper">
        <table id="dataTable" class="hidden" role="table" aria-label="data table">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
          <tfoot id="tableFoot"></tfoot>
        </table>
      </div>
    </section>
  </main>

<script>
/* ---------------------------
   Dashboard client-side logic
   --------------------------- */

let currentView = "product";
let fullData = [];
let originalKeys = [];

const baseTextCols = ["STATE","MANAGER_NAME","DISTRICT","PRODUCT","SKU","PARTY_NAME"];
const monthOrder = [
"APR-23","MAY-23","JUN-23","AVG_Q1_2023-24","JUL-23","AUG-23","SEP-23","AVG_Q2_2023-24",
"OCT-23","NOV-23","DEC-23","AVG_Q3_2023-24","JAN-24","FEB-24","MAR-24","AVG_Q4_2023-24","AVG_YEAR_2023-24",
"APR-24","MAY-24","JUN-24","AVG_Q1_2024-25","JUL-24","AUG-24","SEP-24","AVG_Q2_2024-25","OCT-24","NOV-24","DEC-24","AVG_Q3_2024-25",
"JAN-25","FEB-25","MAR-25","AVG_Q4_2024-25","AVG_YEAR_2024-25","APR-25","MAY-25","JUN-25","AVG_Q1_2025-26",
"JUL-25","AUG-25","SEP-25","AVG_Q2_2025-26","AVG_YEAR_2025-26"
];

const norm = s => String(s || "").toUpperCase().trim();
const getVal = (r,k)=> r?.[k] ?? r?.[k.toLowerCase()] ?? r?.[k.toUpperCase()] ?? "";

function debounce(fn, wait=350){
  let t;
  return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), wait); };
}

/* --------------- Initialization --------------- */
document.addEventListener("DOMContentLoaded", ()=> {
  initUI();
  loadData(currentView);
});

/* --------------- UI helpers --------------- */
function initUI(){
  document.getElementById("toggleFiltersBtn").addEventListener("click", toggleFilters);
  document.getElementById("clearBtn").addEventListener("click", clearFilters);
  document.getElementById("exportBtn").addEventListener("click", exportCSV);
  document.getElementById("toggleViewBtn").addEventListener("click", ()=>{
    currentView = currentView==="product"?"sku":"product";
    document.getElementById("toggleViewBtn").textContent = currentView==="product"?"Switch to SKU View":"Switch to Product View";
    loadData(currentView);
  });

  // theme persistence toggle
  const themeBtn = document.getElementById("themeToggle");
  if(localStorage.getItem("theme")==="dark"){ document.documentElement.classList.add("dark-mode"); themeBtn.textContent = "☀️ Light"; }
  themeBtn.addEventListener("click", ()=>{
    if(document.documentElement.classList.contains("dark-mode")){
      document.documentElement.classList.remove("dark-mode"); localStorage.setItem("theme","light"); themeBtn.textContent = "🌙 Dark";
    } else {
      document.documentElement.classList.add("dark-mode"); localStorage.setItem("theme","dark"); themeBtn.textContent = "☀️ Light";
    }
  });
}

function toggleFilters(){
  const bar = document.getElementById("filtersContainer");
  if(bar.style.maxHeight){ bar.style.maxHeight = null; this.textContent="Hide Filters"; }
  else { bar.style.maxHeight = "0"; this.textContent = "Show Filters"; }
}
function clearFilters(){
  const filters = document.getElementById("filtersContainer");
  filters.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.checked=false);
  applyFilters();
}

/* --------------- Data loading --------------- */
async function loadData(view){
  const loader = document.getElementById("loader");
  loader.classList.remove("hidden"); loader.textContent = "Loading data...";
  try {
    const res = await fetch(`/get_data/${view}`);
    if(!res.ok) throw new Error("Server returned "+res.status);
    const data = await res.json();
    if(!Array.isArray(data) || data.length===0){
      loader.textContent = "No data found";
      return;
    }
    fullData = data;
    originalKeys = Object.keys(data[0]);
    buildFilters();
    applyFilters();
  } catch(err){
    console.error("loadData error", err);
    loader.textContent = "⚠ Error loading data: "+err.message;
    // hide overlay if visible
    document.getElementById("overlayLoader").classList.add("hidden");
  } finally {
    // small delay so user sees "Loading"
    setTimeout(()=>loader.classList.add("hidden"), 200);
  }
}

/* --------------- Build filter UI --------------- */
function buildFilters(){
  const filters = document.getElementById("filtersContainer");
  filters.innerHTML = "";
  const headers = originalKeys.map(norm);
  const textCols = baseTextCols.filter(c => headers.includes(c));
  const order = currentView==="product"
    ? ["STATE","MANAGER_NAME","DISTRICT","PRODUCT","PARTY_NAME","SHOW COLUMNS","MONTH / YEAR","COMPARISON","TOTAL"]
    : ["STATE","MANAGER_NAME","DISTRICT","PRODUCT","SKU","PARTY_NAME","SHOW COLUMNS","MONTH / YEAR","COMPARISON","TOTAL"];

  function makeBox(title, vals=[], checkedAll=false){
    const box = document.createElement("div");
    box.className = "filter-box";
    const hdr = document.createElement("strong"); hdr.textContent = title; box.appendChild(hdr);
    const allLabel = document.createElement("label");
    allLabel.className = "all-label";
    const allCb = document.createElement("input"); allCb.type="checkbox"; allCb.dataset.all = title;
    allLabel.appendChild(allCb); allLabel.appendChild(document.createTextNode(" All"));
    box.appendChild(allLabel);
    const container = document.createElement("div"); container.className = "options";
    vals.forEach(v=>{
      const lab = document.createElement("label");
      const cb = document.createElement("input"); cb.type="checkbox"; cb.name = title; cb.value = v;
      if(checkedAll) cb.checked = true;
      lab.appendChild(cb); lab.appendChild(document.createTextNode(" "+v));
      container.appendChild(lab);
    });
    box.appendChild(container);
    filters.appendChild(box);
  }

  order.forEach(f=>{
    if(f==="SHOW COLUMNS") makeBox(f, textCols, true);
    else if(f==="MONTH / YEAR" || f==="COMPARISON") makeBox(f, monthOrder, true);
    else if(f==="TOTAL") makeBox(f, textCols, false);
    else if(textCols.includes(f)){
      const vals = [...new Set(fullData.map(r=>getVal(r,f)))].filter(Boolean).sort();
      makeBox(f, vals, false);
    }
  });

  // Add event listeners (delegated)
  filters.querySelectorAll("input[data-all]").forEach(cb=>{
    cb.addEventListener("change", e=>{
      const title = e.target.dataset.all;
      const checked = e.target.checked;
      filters.querySelectorAll(`input[name='${title}']`).forEach(i=>i.checked = checked);
      applyFilters();
    });
  });

  // Delegate checkboxes -> debounce applyFilters & cascade
  filters.addEventListener("change", debounce(()=>applyFilters(), 300), {passive:true});
}

/* --------------- Filtering, grouping, rendering --------------- */
function applyFilters(){
  const overlay = document.getElementById("overlayLoader");
  overlay.classList.remove("hidden");

  // do heavy work inside animation frame to keep UI responsive
  requestAnimationFrame(()=> {
    try {
      const tHead = document.getElementById("tableHead"),
            tBody = document.getElementById("tableBody"),
            tFoot = document.getElementById("tableFoot");
      if(!fullData.length){ tBody.innerHTML=""; tHead.innerHTML=""; overlay.classList.add("hidden"); return; }

      const filters = document.getElementById("filtersContainer");
      const selected = {};
      [...filters.querySelectorAll(".filter-box strong")].forEach(h=>{
        const title = h.textContent;
        selected[title] = [...filters.querySelectorAll(`input[name='${title}']:checked`)].map(i=>i.value);
      });

      // cascade filtering
      const cascade = currentView==="product"
        ? ["STATE","MANAGER_NAME","DISTRICT","PRODUCT","PARTY_NAME"]
        : ["STATE","MANAGER_NAME","DISTRICT","PRODUCT","SKU","PARTY_NAME"];

      let filtered = [...fullData];
      cascade.forEach((f, idx)=>{
        const sel = selected[f] || [];
        if(sel.length) filtered = filtered.filter(r=>sel.includes(getVal(r,f)));
        // update next filter options (smart cascade)
        const next = cascade[idx+1];
        if(next){
          const nextBox = [...filters.querySelectorAll(".filter-box")].find(b=>b.querySelector("strong").textContent===next);
          if(nextBox){
            const valid = new Set(filtered.map(r=>getVal(r,next)).filter(Boolean));
            nextBox.querySelectorAll("input[name='"+next+"']").forEach(cb=>{
              cb.closest("label").style.display = valid.has(cb.value) ? "" : "none";
              if(!valid.has(cb.value)) cb.checked = false;
            });
          }
        }
      });

      // columns to show
      const showCols = selected["SHOW COLUMNS"]?.length ? selected["SHOW COLUMNS"] : baseTextCols;
      const monthCols = selected["MONTH / YEAR"]?.length ? selected["MONTH / YEAR"] : monthOrder;
      const colsToShow = [...showCols, ...monthCols];
      if((selected["COMPARISON"]||[]).length===2) colsToShow.push("COMPARISON");

      // header
      tHead.innerHTML = "<tr>" + colsToShow.map(c=>`<th>${c}</th>`).join("") + "</tr>";

      // dedupe + sum numeric fields by showCols
      const map = new Map();
      filtered.forEach(r=>{
        const key = showCols.map(k=>getVal(r,k)).join("|");
        if(!map.has(key)){
          const obj = {};
          showCols.forEach(k=> obj[k] = getVal(r,k));
          monthCols.forEach(m=> obj[m] = Number(getVal(r,m)) || 0);
          map.set(key, obj);
        } else {
          const obj = map.get(key);
          monthCols.forEach(m=> obj[m] = obj[m] + (Number(getVal(r,m))||0));
        }
      });
      const grouped = [...map.values()];

      // render rows with optional subtotal groups
      tBody.innerHTML = "";
      const totalBy = selected["TOTAL"] || [];

      if(totalBy.length){
        // make groups based on totalBy columns
        const groups = {};
        grouped.forEach(row=>{
          const key = totalBy.map(k=>row[k]).join("|");
          if(!groups[key]) groups[key] = [];
          groups[key].push(row);
        });

        // render groups + subtotal after each
        Object.entries(groups).forEach(([gKey, rows])=>{
          rows.forEach(r => appendRow(r, colsToShow, tBody));
          // subtotal
          const subtotal = {};
          monthCols.forEach(m => subtotal[m] = rows.reduce((s,r)=>s + (Number(r[m])||0), 0));
          const subCells = colsToShow.map(c=>{
            if(monthOrder.includes(c)) return `<td class="numeric">${subtotal[c]||0}</td>`;
            if(totalBy.includes(c)) return `<td class="subtotal-label">Subtotal</td>`;
            return `<td></td>`;
          }).join("");
          tBody.insertAdjacentHTML('beforeend', `<tr class="subtotal-row">${subCells}</tr>`);
        });
      } else {
        grouped.forEach(r => appendRow(r, colsToShow, tBody));
      }

      // grand total footer
      tFoot.innerHTML = "";
      if(grouped.length){
        const totals = {};
        monthCols.forEach(m => totals[m] = grouped.reduce((s,r)=>s + (Number(r[m])||0), 0));
        const totalCells = colsToShow.map(c=>{
          if(monthOrder.includes(c)) return `<td class="numeric">${totals[c]||0}</td>`;
          if(showCols.includes(c)) return `<td class="subtotal-label">TOTAL</td>`;
          return `<td></td>`;
        }).join("");
        tFoot.innerHTML = `<tr class="grandtotal-row">${totalCells}</tr>`;
      }

      // show table
      document.getElementById("dataTable").classList.remove("hidden");
    } catch(err){
      console.error("applyFilters error:", err);
    } finally {
      overlay.classList.add("hidden");
    }
  });
}

/* Append one row with color coding vs previous numeric visible column */
function appendRow(row, colsToShow, tBody){
  // compute cell htmls
  const cells = colsToShow.map((c, idx)=>{
    if(c==="COMPARISON"){
      // skip, comparison handled by user choice separately (not aggregated)
      return `<td class="numeric">${row[c] ?? ""}</td>`;
    }
    if(monthOrder.includes(c)){
      // find previous visible numeric column value (in same row)
      let prevVal = null;
      for(let j = idx - 1; j >= 0; j--){
        if(monthOrder.includes(colsToShow[j])){
          prevVal = Number(row[colsToShow[j]]) || 0;
          break;
        }
      }
      const num = Number(row[c]) || 0;
      const cls = (prevVal !== null) ? (num > prevVal ? 'pos' : (num < prevVal ? 'neg' : '')) : '';
      return `<td class="numeric ${cls}">${num}</td>`;
    }
    // text column
    return `<td>${row[c] ?? ""}</td>`;
  });

  tBody.insertAdjacentHTML('beforeend', `<tr>${cells.join('')}</tr>`);
}

/* --------------- CSV export --------------- */
function exportCSV(){
  const rows = [...document.querySelectorAll("table tr")].map(r => [...r.children].map(td=>`"${td.innerText.replace(/"/g,'""')}"`).join(","));
  const csv = rows.join("\n");
  const blob = new Blob([csv], {type: "text/csv;charset=utf-8;"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${currentView}_export.csv`; a.click();
}
</script>
</body>
</html>
