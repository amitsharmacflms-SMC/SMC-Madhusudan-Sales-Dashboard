<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Madhusudan Dashboard</title>
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
  <style>
    body { font-family: Inter, sans-serif; }
    th, td {
      border: 1px solid #d1d5db;
      vertical-align: middle;
    }
    th { background-color: #f3f4f6; position: sticky; top: 0; z-index: 10; }
    td { transition: background-color 0.25s ease; }
    .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; transition: 0.2s; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-blue:hover { background: #2563eb; }
    .btn-gray { background: #f3f4f6; color: #111827; }
    .btn-gray:hover { background: #e5e7eb; }
    .hidden { display: none; }
    .table-wrapper { max-height: 75vh; overflow: auto; border-radius: 0.75rem; }
    .filter-group { border: 1px solid #e5e7eb; padding: 8px; border-radius: 8px; background: #fafafa; }
    .filter-group label { font-size: 0.85rem; display: block; }
    .filter-group input[type=checkbox] { margin-right: 5px; }
    .numeric-cell { text-align: center; }
  </style>
</head>

<body class="bg-gray-50 text-gray-900">
<header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <img src="{{ url_for('static', filename='onlylogo.png') }}" class="h-10 w-auto" alt="logo">
      <h1 class="text-xl font-bold text-indigo-700">SMC MADHUSUDAN DASHBOARD</h1>
    </div>
    <div class="flex gap-2">
      <button id="exportBtn" class="btn btn-blue">⬇ Export CSV</button>
      <button id="clearFiltersBtn" class="btn btn-gray">🧹 Clear</button>
      <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
      <button id="toggleViewBtn" class="btn btn-blue">Switch to SKU View</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
  <section class="bg-white p-6 rounded-xl shadow">
    <div id="filtersContainer" class="flex flex-wrap gap-4 mb-4"></div>
    <div id="loader" class="text-center py-4 text-gray-500">Loading data...</div>

    <div class="table-wrapper mt-2">
      <table id="dataTable" class="min-w-full divide-y divide-gray-200 hidden">
        <thead id="tableHead" class="bg-gray-100"></thead>
        <tbody id="tableBody" class="divide-y divide-gray-200"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="mt-10 bg-gray-100 py-4 text-center text-xs text-gray-500">
  © {{ current_year }} SMC Madhusudan | All Rights Reserved
</footer>

<script>
let currentView = "product";
const baseTextCols = ["STATE","MANAGER_NAME","DISTRICT","PARTY_NAME","PRODUCT","SKU"];

async function loadData(view="product"){
  const res = await fetch(`/get_data/${view}`);
  const data = await res.json();
  const loader=document.getElementById("loader"),
        filters=document.getElementById("filtersContainer"),
        table=document.getElementById("dataTable"),
        thead=document.getElementById("tableHead"),
        tbody=document.getElementById("tableBody");

  if(!data||data.error){loader.textContent="⚠️ Error loading data.";return;}
  if(!data.length){loader.textContent="No data found.";return;}

  loader.classList.add("hidden");
  table.classList.remove("hidden");

  const headers = Object.keys(data[0]).map(h=>h.toUpperCase());
  const textCols = baseTextCols.filter(c=>headers.includes(c));
  const numericCols = headers.filter(h=>!textCols.includes(h));

  // Sort month/date columns logically
  const monthOrder = ["APR","MAY","JUN","AVG_Q1","JUL","AUG","SEP","AVG_Q2","OCT","NOV","DEC","AVG_Q3","JAN","FEB","MAR","AVG_Q4","AVG_YEAR"];
  numericCols.sort((a,b)=>{
    const getOrder = c => {
      const m = monthOrder.findIndex(mo => c.startsWith(mo));
      return m === -1 ? 999 : m;
    };
    return getOrder(a) - getOrder(b);
  });

  const orderedHeaders = [...textCols, ...numericCols];

  // Build header row
  thead.innerHTML = `<tr>${orderedHeaders.map(h=>`
    <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700">${h}</th>`).join("")}</tr>`;

  // ---- FILTERS ----
  filters.innerHTML = "";

  // Text filters (checkbox style)
  textCols.forEach(col=>{
    const uniqueVals=[...new Set(data.map(d=>d[col.toLowerCase()]))].filter(Boolean).sort();
    const group = document.createElement("div");
    group.className = "filter-group";
    group.innerHTML = `<strong>${col}</strong>` + uniqueVals.map(v=>`
      <label><input type="checkbox" name="${col}" value="${v}">${v}</label>`).join("");
    filters.appendChild(group);
  });

  // Show/Hide Columns
  const showColsGroup = document.createElement("div");
  showColsGroup.className = "filter-group";
  showColsGroup.innerHTML = `<strong>SHOW COLUMNS</strong>` +
    textCols.map(c=>`<label><input type="checkbox" name="showcol" value="${c}" checked>${c}</label>`).join("");
  filters.appendChild(showColsGroup);

  // Group By
  const groupDiv = document.createElement("div");
  groupDiv.className = "filter-group";
  groupDiv.innerHTML = `<strong>GROUP BY</strong>` + textCols.map(c=>`
    <label><input type="checkbox" name="groupby" value="${c}">${c}</label>`).join("");
  filters.appendChild(groupDiv);

  // Comparison
  const compDiv = document.createElement("div");
  compDiv.className = "filter-group";
  compDiv.innerHTML = `<strong>COMPARISON (2)</strong>` +
    numericCols.map(c=>`<label><input type="checkbox" name="compare" value="${c}">${c}</label>`).join("");
  filters.appendChild(compDiv);

  // ---- RENDER FUNCTION ----
  function render(rows, cols=orderedHeaders){
    tbody.innerHTML = rows.map(r=>{
      return `<tr>${cols.map((h,idx)=>{
        const key=h.toLowerCase(); let val=r[key]; let style="";
        if(numericCols.includes(h)){
          val = Number(val)||0;
          const prev = idx>0 && numericCols.includes(cols[idx-1]) ? Number(r[cols[idx-1].toLowerCase()]) : val;
          if(val>prev) style="color:green"; else if(val<prev) style="color:red";
        }
        if(h==="COMPARISON"){const v=Number(val)||0;style=(v>0?"color:green":"color:red");}
        return `<td class="px-4 py-2 text-sm numeric-cell" style="${style}">${val}</td>`;
      }).join("")}</tr>`;
    }).join("");
  }

  // ---- APPLY FILTERS ----
  function applyFilters(){
    let filtered=[...data];

    // Text checkbox filters
    textCols.forEach(c=>{
      const selected = Array.from(document.querySelectorAll(`input[name='${c}']:checked`)).map(el=>el.value);
      if(selected.length) filtered = filtered.filter(r => selected.includes(r[c.toLowerCase()]));
    });

    // Group By
    const groupSelected = Array.from(document.querySelectorAll(`input[name='groupby']:checked`)).map(el=>el.value);
    if(groupSelected.length){
      const grouped = {};
      filtered.forEach(r=>{
        const key = groupSelected.map(g=>r[g.toLowerCase()]||"Unknown").join(" | ");
        if(!grouped[key]) grouped[key] = {};
        numericCols.forEach(n=>{
          grouped[key][n] = (grouped[key][n]||0) + Number(r[n.toLowerCase()]||0);
        });
        groupSelected.forEach(g=>grouped[key][g]=r[g.toLowerCase()]);
      });
      filtered = Object.values(grouped);
    }

    // Comparison (2)
    const comps = Array.from(document.querySelectorAll(`input[name='compare']:checked`)).map(el=>el.value);
    if(comps.length===2){
      const [a,b]=comps;
      filtered=filtered.map(r=>{
        const diff=(Number(r[b.toLowerCase()])||0)-(Number(r[a.toLowerCase()])||0);
        return {...r,comparison:diff};
      });
      if(!orderedHeaders.includes("COMPARISON")) orderedHeaders.push("COMPARISON");
    }

    // Show Columns
    const visibleCols = Array.from(document.querySelectorAll(`input[name='showcol']:checked`)).map(el=>el.value);
    const colsToShow = [...visibleCols, ...numericCols, ...(orderedHeaders.includes("COMPARISON")?["COMPARISON"]:[])];

    thead.innerHTML=`<tr>${colsToShow.map(h=>`<th class="px-4 py-2 text-sm font-semibold text-gray-700">${h}</th>`).join("")}</tr>`;
    render(filtered, colsToShow);
  }

  // Export CSV
  document.getElementById("exportBtn").onclick = function(){
    const rows = Array.from(tbody.querySelectorAll("tr")).map(tr => Array.from(tr.querySelectorAll("td")).map(td => td.textContent));
    const csv = [orderedHeaders.join(","), ...rows.map(r=>r.join(","))].join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${currentView}_export.csv`;
    a.click();
  };

  // Clear filters
  document.getElementById("clearFiltersBtn").onclick = ()=>{
    document.querySelectorAll("input[type='checkbox']").forEach(cb=>cb.checked=false);
    applyFilters();
  };

  // Toggle Filters
  const toggleBtn=document.getElementById("toggleFiltersBtn");
  toggleBtn.onclick=()=>{
    const vis=!filters.classList.contains("hidden");
    if(vis){filters.classList.add("hidden");toggleBtn.textContent="Show Filters";}
    else{filters.classList.remove("hidden");toggleBtn.textContent="Hide Filters";}
  };

  filters.addEventListener("change",applyFilters);
  applyFilters();
}

// Toggle Product ↔ SKU
document.getElementById("toggleViewBtn").addEventListener("click",function(){
  currentView=currentView==="product"?"sku":"product";
  this.textContent=currentView==="product"?"Switch to SKU View":"Switch to Product View";
  loadData(currentView);
});

document.addEventListener("DOMContentLoaded",()=>loadData(currentView));
</script>
</body>
</html>
