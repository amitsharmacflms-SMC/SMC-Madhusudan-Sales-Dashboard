<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Madhusudan Sales Dashboard</title>

  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <!-- ExcelJS + FileSaver for export with styling -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <style>
    /* ---------- TABLE + FILTERS ---------- */
    th, td { padding:4px 6px !important; height:22px !important; font-size:0.85rem; transition:background-color .35s ease; }
    .subtotal-row td, .grandtotal-row td { height:26px !important; font-weight:700; transition:background-color .35s ease; }

    #filtersWrapper { transition:all .35s ease; opacity:1; max-height:600px; overflow:hidden; }
    #filtersWrapper.hidden { opacity:0; max-height:0; overflow:hidden; }

    /* ---------- MOBILE FILTER ALIGNMENT + PERFORMANCE ---------- */
    @media (max-width: 768px) {
      body { font-size: 0.9rem; overflow-x: hidden; }
      header { flex-wrap: wrap; justify-content: center; text-align: center; gap: 8px; }
      .toolbar { flex-wrap: wrap; justify-content: center; gap: 6px; }
      #filtersContainer { display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #f9fafb; border-radius: 10px; max-height: 65vh; overflow-y: auto; scrollbar-width: thin; }
      .filter-box { width: 100%; border: 2px solid #1e3a8a; border-radius: 8px; background: #fff; padding: 8px 10px; box-shadow: none; }
      .filter-box strong { display: block; font-size: 0.9rem; text-align: left; color: #1e3a8a; font-weight: 700; margin-bottom: 6px; border-bottom: 1px solid #e2e8f0; padding-bottom: 3px; }
      .filter-box label { display: inline-block; font-size: 0.85rem; color: #000; padding: 2px 4px; margin: 2px 3px; border-radius: 4px; background: #f3f4f6; }
      .filter-box input[type="checkbox"] { margin-right: 4px; transform: scale(1.1); }
      #filtersWrapper { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
      #filtersWrapper.active { max-height: 600px; }
      .toolbar button { font-size: 0.8rem; padding: 6px 10px; border-radius: 6px; }
      .table-wrapper { max-height: 65vh; overflow-x: auto; overflow-y: auto; background: #fff; }
      table th, table td { font-size: 0.75rem; padding: 3px 4px; }
      .mobile-tip { display: block; text-align: center; font-size: 0.8rem; color: #4b5563; background: #f3f4f6; padding: 4px 6px; border-radius: 6px; margin: 8px auto; }
    }

    /* ---------- FILTER BOX VISUALS (Enhanced) ---------- */
    .filter-box {
      border: 2px solid #1e3a8a;
      border-radius: 10px;
      padding: 8px 10px;
      min-width: 180px;
      background: #fff;
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
      transition: all 0.25s ease-in-out;
    }
    .filter-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 10px rgba(0,0,0,0.08);
      border-color: #1d4ed8;
    }
    .filter-box label { color: #000; font-weight: 600; display: block; padding: 3px 0; }
    .filter-box strong {
      color: #1e3a8a; font-weight: 800; display: block; margin-bottom: 6px; text-transform: uppercase; text-align: center;
      border-bottom: 2px solid #e2e8f0; padding-bottom: 4px;
    }

    /* ---------- DARK MODE IMPROVEMENTS ---------- */
    .dark-mode .filter-box { background: #f9fafb; border-color: #1e3a8a; box-shadow: 0 2px 5px rgba(255,255,255,0.1); }
    .dark-mode .filter-box label { color: #000 !important; font-weight: 600; }
    .dark-mode .filter-box strong { color: #000 !important; border-color: #e5e7eb; }

    /* Sticky Header - ensure visible while scrolling */
    table { border-collapse:collapse; width:100%; }
    thead th {
      position: sticky; top:0; z-index:50;
      background: linear-gradient(90deg,#eef2ff,#e0e7ff);
      text-transform: uppercase; text-align: center !important;
    }
    .dark-mode thead th { background:#0b1220; color:#cfe8ff; }
    th.sortable { cursor:pointer; }
    th.sortable .sort-icon { margin-left:6px; color:#6b7280; font-size:0.85rem; }

    /* Scrollbar style */
    .table-wrapper::-webkit-scrollbar { height:10px; width:10px; }
    .table-wrapper::-webkit-scrollbar-thumb { background: linear-gradient(180deg,#2563eb,#4f46e5); border-radius:8px; }

    /* Background color coding for values */
    td.bg-pos { background-color:#d1fae5 !important; }  /* light green */
    td.bg-neg { background-color:#fee2e2 !important; }  /* light red */

    /* Overlay message */
    .overlay::after {
      content: "Processing...";
      display:inline-block;
      padding:8px 14px;
      border-radius:8px;
      background: rgba(0,0,0,.6);
      color:#fff;
      font-weight:700;
    }

    /* compact header and row */
    header .logo { height:40px; }
    header h1 { font-size:1.05rem; font-weight:800; color:#1e40af; margin-left:8px; }

    /* ensure numeric cells center */
    td.numeric { text-align:center !important; vertical-align:middle; font-weight:700; color:#000; }

    /* for dark mode: ensure numeric text is black, even with color coding */
    .dark-mode td.bg-pos, .dark-mode td.bg-neg { color: #000 !important; }

    /* ---------- DARK MODE VISIBILITY IMPROVEMENTS ---------- */
    .dark-mode td:not(.numeric):not(.bg-pos):not(.bg-neg):not(.subtotal-label) {
      background-color: #000 !important; color: #fff !important;
    }
    .dark-mode th { background-color: #111827 !important; color: #f9fafb !important; border-bottom: 1px solid #1f2937; }
    .dark-mode .subtotal-row td, .dark-mode .grandtotal-row td { background-color: #0f172a !important; color: #e2e8f0 !important; }
    .dark-mode td { border-bottom: 1px solid #1e293b; }
    .dark-mode .subtotal-row td.subtotal-label { background-color: #dbeafe !important; color: #1e3a8a !important; }
    .dark-mode .grandtotal-row td.subtotal-label { background-color: #e9d5ff !important; color: #4c1d95 !important; }

    @media(max-width:900px){ th, td { font-size:.78rem; padding:6px 8px; } }
  </style>
</head>

<body>
  <header>
    <div class="container header-row" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;">
      <div style="display:flex;align-items:center">
        <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo" class="logo">
        <h1>SMC Madhusudan Sales Dashboard</h1>
      </div>

      <div class="toolbar" style="display:flex;gap:8px;align-items:center">
        <button id="exportBtn" class="btn btn-blue">Export</button>
        <button id="clearBtn" class="btn btn-gray">Clear All Filters</button>
        <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
        <button id="toggleViewBtn" class="btn btn-blue">Switch to SKU View</button>
        <button id="themeToggle" class="btn btn-gray">Dark Mode</button>
      </div>
    </div>
  </header>

  <main class="container" style="max-width:1500px;margin:12px auto;padding:0 12px;">
    <section>
      <div id="filtersWrapper"><div id="filtersContainer" class="filter-bar" style="display:flex;gap:12px;padding:10px;background:#fff;border-radius:10px;overflow-x:auto;"></div></div>

      <div id="loader" class="loader" style="padding:8px;color:#6b7280">Loading data...</div>
      <div id="overlayLoader" class="overlay hidden" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3000;"></div>

      <div class="table-wrapper" style="margin-top:10px;background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(4,8,15,0.05);overflow:auto;max-height:75vh;">
        <table id="dataTable" class="hidden" role="table" aria-label="data table" style="min-width:1100px;">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
          <tfoot id="tableFoot"></tfoot>
        </table>
      </div>
    </section>
  </main>

  <footer style="text-align:center;padding:12px;margin-top:16px;border-top:1px solid #e5e7eb;background:#f9fafb">
    <p>© {{ current_year }} Created & Hosted by <strong>Amit Sharma</strong></p>
  </footer>

<script>
/* ================== Configuration & Helpers ================== */
let currentView = "product";
let fullData = [];
let originalKeys = [];
let currentGroupedData = []; // grouped rows (deduped + aggregated)
let currentSelectedFilters = {}; // last applied filters

const baseTextCols = ["STATE","MANAGER_NAME","DISTRICT","PRODUCT","SKU","PARTY_NAME"];
const monthOrder = [
  "APR-23","MAY-23","JUN-23","AVG_Q1_2023-24","JUL-23","AUG-23","SEP-23","AVG_Q2_2023-24",
  "OCT-23","NOV-23","DEC-23","AVG_Q3_2023-24","JAN-24","FEB-24","MAR-24","AVG_Q4_2023-24","AVG_YEAR_2023-24",
  "APR-24","MAY-24","JUN-24","AVG_Q1_2024-25","JUL-24","AUG-24","SEP-24","AVG_Q2_2024-25","OCT-24","NOV-24","DEC-24","AVG_Q3_2024-25",
  "JAN-25","FEB-25","MAR-25","AVG_Q4_2024-25","AVG_YEAR_2024-25","APR-25","MAY-25","JUN-25","AVG_Q1_2025-26","JUL-25","AUG-25","SEP-25","AVG_Q2_2025-26","OCT-25","AVG_Q3_2025-26","AVG_YEAR_2025-26"
];

// Normalize helper that is used widely for robust key lookups
const norm = s => String(s||"").toUpperCase().trim();
const getVal = (row, key) => {
  if (!row || !key) return "";
  if (Object.prototype.hasOwnProperty.call(row, key)) return row[key];
  const uk = key.toUpperCase();
  const lk = key.toLowerCase();
  if (Object.prototype.hasOwnProperty.call(row, uk)) return row[uk];
  if (Object.prototype.hasOwnProperty.call(row, lk)) return row[lk];
  // fallback: try to find a key in row ignoring punctuation/spacing differences
  const findKey = Object.keys(row).find(k => norm(k).replace(/[-_\s]/g,'') === norm(key).replace(/[-_\s]/g,''));
  return findKey ? row[findKey] : "";
};

/* Overlay helpers */
let __overlayTimer = null;
function showOverlay(delay=150){
  clearTimeout(__overlayTimer);
  __overlayTimer = setTimeout(()=>document.getElementById("overlayLoader").classList.remove("hidden"), delay);
}
function hideOverlay(){
  clearTimeout(__overlayTimer);
  document.getElementById("overlayLoader").classList.add("hidden");
}

/* Debounce + idle */
function debounce(fn, wait=350){ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=>fn(...a), wait); }; };
function runIdle(fn){ if("requestIdleCallback" in window) requestIdleCallback(fn, {timeout:300}); else setTimeout(fn, 200); };

/* -------------------- Initialization -------------------- */
document.addEventListener("DOMContentLoaded", ()=>{
  initUI();
  loadData(currentView);
});

function initUI(){
  document.getElementById("toggleFiltersBtn").addEventListener("click", toggleFilters);
  document.getElementById("clearBtn").addEventListener("click", ()=>{ runIdle(clearFilters); });
  document.getElementById("exportBtn").addEventListener("click", ()=>{ showOverlay(120); runIdle(exportExcel); });
  document.getElementById("toggleViewBtn").addEventListener("click", () => {
    localStorage.removeItem("savedFilters");
    localStorage.removeItem("default_avg_cols");
    currentView = currentView === "product" ? "sku" : "product";
    document.getElementById("toggleViewBtn").textContent =
      currentView === "product" ? "Switch to SKU View" : "Switch to Product View";
    loadData(currentView);
  });

  const themeBtn = document.getElementById("themeToggle");
  if(localStorage.getItem("theme")==="dark"){ document.documentElement.classList.add("dark-mode"); themeBtn.textContent = "Light Mode"; }
  themeBtn.addEventListener("click", ()=>{
    const html = document.documentElement;
    if(html.classList.contains("dark-mode")){
      html.classList.remove("dark-mode"); localStorage.setItem("theme","light"); themeBtn.textContent="Dark Mode";
    } else {
      html.classList.add("dark-mode"); localStorage.setItem("theme","dark"); themeBtn.textContent="Light Mode";
    }
  });
}

/* toggle filters (completely hide or show) */
let filtersVisible = window.innerWidth > 768; // visible on desktop, hidden on mobile initially
function toggleFilters() {
  const wrapper = document.getElementById("filtersWrapper");
  const btn = document.getElementById("toggleFiltersBtn");
  if (filtersVisible) {
    wrapper.classList.remove("active");
    wrapper.style.maxHeight = "0";
    btn.textContent = "Show Filters";
  } else {
    wrapper.classList.add("active");
    wrapper.style.maxHeight = "600px";
    btn.textContent = "Hide Filters";
  }
  filtersVisible = !filtersVisible;
}

/* clear filters */
function clearFilters(){
  console.log("🧹 Resetting to default: All data in all filters.");
  localStorage.removeItem("savedFilters");
  localStorage.removeItem("default_avg_cols");
  loadData(currentView);
}

/* -------------------- BUILD FILTER UI (robust) -------------------- */
function buildFilters() {
  const filters = document.getElementById("filtersContainer");
  filters.innerHTML = "";
  const headers = originalKeys.map(k => norm(k));
  const textCols = baseTextCols.filter(c => headers.includes(c)); // only those present in dataset

  const order =
    currentView === "product"
      ? ["SHOW COLUMNS","MONTH / YEAR","STATE","MANAGER_NAME","DISTRICT","PRODUCT","PARTY_NAME","COMPARISON","TOTAL"]
      : ["SHOW COLUMNS","MONTH / YEAR","STATE","MANAGER_NAME","DISTRICT","PRODUCT","SKU","PARTY_NAME","COMPARISON","TOTAL"];

  const colors = ["#fff7ed","#ecfdf5","#e0f2fe","#fdf2f8","#fef3c7","#e0f2fe","#f3e8ff","#fef2f2","#f3f4f6"];
  let ci = 0;

  function makeBox(title, vals = [], checkAll = false) {
    const box = document.createElement("div");
    box.className = "filter-box";
    box.style.background = colors[ci++ % colors.length];

    // sanitize title to create id for "All" checkbox (preserve slashes as in original)
    const allId = `all_${title.replace(/\s+/g,"_")}`;

    // options markup
    let optionsHtml = "";
    if (title === "MONTH / YEAR" || title === "COMPARISON") {
        optionsHtml = vals
            .map(v => `<label><input type="checkbox" name="${title}" value="${v}"> ${String(v).toUpperCase()}</label>`)
            .join("");
    } else {
        optionsHtml = vals
            .map(v => `<label><input type="checkbox" name="${title}" value="${v}" ${checkAll ? "checked" : ""}> ${v}</label>`)
            .join("");
    }

    box.innerHTML = `
      <strong>${title}</strong>
      <label class="all-label"><input type="checkbox" data-all="${title}" id="${allId}" ${checkAll ? "checked" : ""}> All</label>
      <div class="options" style="max-height:220px;overflow:auto;padding-right:6px;">${optionsHtml}</div>`;
    filters.appendChild(box);
  }

  // month/avg columns present in the data (preserve order in monthOrder)
  const actualMonthYearCols =
    monthOrder.filter(m => originalKeys.map(k=>k.toUpperCase()).includes(m.toUpperCase()));

  const actualComparisonCols = actualMonthYearCols.filter(
    c => !String(c).toUpperCase().startsWith("AVG_")
);


  order.forEach(f => {
    if (f === "SHOW COLUMNS") makeBox(f, textCols, true);
    else if (f === "MONTH / YEAR") makeBox(f, actualMonthYearCols, false);
    else if (f === "COMPARISON") makeBox(f, actualComparisonCols, false);
    else if (f === "TOTAL") {
        makeBox(f, textCols, false);
    }
    else if (textCols.includes(f)) {
      // gather distinct values for this field (case-robust)
      const vals = [...new Set(fullData.map(r => String(getVal(r, f))).filter(Boolean))].sort();
      makeBox(f, vals, true);
    }
  });

  // "All" checkbox listeners
  filters.querySelectorAll("input[data-all]").forEach(cb => {
    cb.addEventListener("change", e => {
      const grp = e.target.dataset.all;
      const checked = e.target.checked;
      filters.querySelectorAll(`input[name='${grp}']`).forEach(i => (i.checked = checked));
      runIdle(applyFilters);
    });
  });

  // change -> apply filters (debounced)
  filters.addEventListener(
    "change",
    debounce(() => {
      runIdle(() => applyFilters()); // applyFilters calls showOverlay
    }, 300)
  );
}

/* -------------------- LOAD DATA -------------------- */
async function loadData(view) {
  const loader = document.getElementById("loader");
  loader.classList.remove("hidden");
  loader.textContent = "Loading data...";
  showOverlay(100);

  try {
    const res = await fetch(`/get_data/${view}`);
    if (!res.ok) throw new Error("Server returned " + res.status);
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) {
      loader.textContent = "No data found";
      hideOverlay();
      return;
    }

    fullData = data.map(r => {
      // defensive normalization: create both raw and uppercase keys where needed (but keep original)
      const normalized = {};
      Object.keys(r).forEach(k => { normalized[k] = r[k]; normalized[k.toUpperCase()] = r[k]; });
      return normalized;
    });

    originalKeys = Object.keys(fullData[0] || {});
    console.log("originalKeys:", originalKeys);

    // detect avg columns present in data (normalized by removing [-_])
    const avgColsInData = Object.keys(fullData[0] || {}).filter(k => k.toUpperCase().startsWith("AVG_Q"));
    const normalizeKey = k => String(k||"").toUpperCase().replace(/[-_]/g, "");
    const avgColsSorted = monthOrder.filter(m => avgColsInData.some(k => normalizeKey(k) === normalizeKey(m)));
    const last5AvgCols = avgColsSorted.slice(-5);
    console.log("✅ Default last 5 AVG_Q columns:", last5AvgCols);

    buildFilters();

    // Saved filters OR defaults applied AFTER filters are built
setTimeout(() => {

    const getInputs = title =>
        Array.from(document.querySelectorAll(`#filtersContainer input[name='${title}']`));

    const saved = JSON.parse(localStorage.getItem("savedFilters") || "{}");
    const defaultSaved = JSON.parse(localStorage.getItem("defaultSavedFilters") || "{}");
    const defaults = JSON.parse(localStorage.getItem("default_avg_cols") || "[]");


    const hasAnySavedSelected = Object.values(saved).some(
        arr => Array.isArray(arr) && arr.length > 0
    );

    if (hasAnySavedSelected) {
        console.log("Restoring saved filters:", saved);

        Object.entries(saved).forEach(([title, values]) => {
            getInputs(title).forEach(cb => {
                cb.checked = values.some(
                    v => String(v).toUpperCase() === String(cb.value).toUpperCase()
                );
            });

            // Update “All” checkbox
            const allCb = document.getElementById(`all_${title.replace(/\s+/g, "_")}`);
            if (allCb) {
                const allOptions = getInputs(title);
                allCb.checked = allOptions.every(cb => cb.checked);
            }
        });

    } else {
        console.log("Applying new default behavior (STATE + ALL IN CASES + last 5 AVG_Q + TOTAL=STATE).");

        // --- 0) UNCHECK EVERYTHING FIRST ---
        document.querySelectorAll(`#filtersContainer input[type='checkbox']`)
            .forEach(cb => cb.checked = false);

        // --- 1) STATE = ALL SELECTED ---
        getInputs("STATE").forEach(cb => cb.checked = true);

        // --- 2) PRODUCT = ONLY “ALL IN CASES” ---
        getInputs("PRODUCT").forEach(cb => {
            cb.checked = (cb.value.toUpperCase().trim() === "ALL IN CASES");
        });

        // --- 3) MONTH / YEAR = ONLY LAST 5 AVG_Q ---
        getInputs("MONTH / YEAR").forEach(cb => {
            if (last5AvgCols.map(x => x.toUpperCase()).includes(cb.value.toUpperCase())) {
                cb.checked = true;
            }
        });

        // --- 4) TOTAL = ONLY STATE ---
        getInputs("TOTAL").forEach(cb => {
            cb.checked = (cb.value.toUpperCase().trim() === "STATE");
        });

        // --- 5) COMPARISON = NONE ---
        getInputs("COMPARISON").forEach(cb => cb.checked = false);

        // --- Update ALL checkboxes ---
        function updateAllBox(title) {
            const allCb = document.getElementById(`all_${title.replace(/\s+/g, "_")}`);
            if (!allCb) return;
            const opts = getInputs(title);
            allCb.checked = opts.length > 0 && opts.every(cb => cb.checked);
        }

        updateAllBox("STATE");
        updateAllBox("PRODUCT");
        updateAllBox("MONTH / YEAR");
        updateAllBox("TOTAL");

        // Save defaults for next load
        const defaultSave = {};
        [...document.querySelectorAll("#filtersContainer .filter-box strong")]
            .forEach(h => {
                const title = h.textContent.trim();
                defaultSave[title] = [...document.querySelectorAll(
                    `input[name='${title}']:checked`
                )].map(i => i.value);
            });

        localStorage.setItem("defaultSavedFilters", JSON.stringify(defaultSave));
        localStorage.setItem("default_avg_cols", JSON.stringify(last5AvgCols));
        }

    // Render table using the final applied defaults
    applyFilters(false);

}, 600); // <-- THIS NOW HAS A PROPER OPENING setTimeout(() => {


  } catch (err) {
    console.error("Error loading data:", err);
    loader.textContent = "⚠ Error loading data: " + err.message;
  } finally {
    hideOverlay();
    setTimeout(() => loader.classList.add("hidden"), 400);
  }
}

/* -------------------- Apply filters + smart cascade (keeps disabled options visible) -------------------- */
function applyFilters(save = true) {
  showOverlay(120);
  requestAnimationFrame(() => {
    try {
      const filters = document.getElementById("filtersContainer");
      const selected = {};
      [...filters.querySelectorAll(".filter-box strong")].forEach(h => {
        const title = h.textContent.trim();
        selected[title] = [...filters.querySelectorAll(`input[name='${title}']:checked`)].map(i => i.value);
      });

      // Small normalization: ensure selected "TOTAL" values are uppercase for consistent matching
      if (Array.isArray(selected["TOTAL"])) {
        selected["TOTAL"] = selected["TOTAL"].map(v => String(v).toUpperCase().trim());
      }

      if (save) localStorage.setItem("savedFilters", JSON.stringify(selected));
      currentSelectedFilters = selected;

      const cascade =
        currentView === "product"
          ? ["STATE", "MANAGER_NAME", "DISTRICT", "PRODUCT", "PARTY_NAME"]
          : ["STATE", "MANAGER_NAME", "DISTRICT", "PRODUCT", "SKU", "PARTY_NAME"];

      // Step 1 — filter the data based on current selection (work on fullData defensively)
      let filtered = [...fullData];
      cascade.forEach(f => {
        const sel = (selected[f] || []).map(s => String(s).trim()).filter(Boolean);
        if (sel.length) {
          filtered = filtered.filter(r => {
            const val = String(getVal(r, f));
            // compare case-insensitive
            return sel.some(s => String(s).toUpperCase() === val.toUpperCase());
          });
        }
      });

      // Step 2 — smart cascade: disable irrelevant options instead of hiding
      cascade.forEach(f => {
        const box = [...filters.querySelectorAll(".filter-box")].find(
          b => b.querySelector("strong")?.textContent.trim() === f
        );
        if (!box) return;
        const valid = new Set(filtered.map(r => String(getVal(r, f))).filter(Boolean));
        box.querySelectorAll(`input[name='${f}']`).forEach(cb => {
          const value = cb.value;
          const label = cb.closest("label");
          if (valid.has(value) || cb.checked) {
            cb.disabled = false;
            if (label) label.style.opacity = "1";
          } else {
            cb.disabled = true;
            if (label) label.style.opacity = "0.4";
          }
        });

        // Update the 'All' checkbox based on currently enabled/checked options
        const allCb = document.getElementById(`all_${f.replace(/\s+/g,"_")}`);
        if(allCb) {
            const options = box.querySelectorAll(`input[name='${f}']:not([disabled])`);
            const checkedOptions = box.querySelectorAll(`input[name='${f}']:checked:not([disabled])`);
            allCb.checked = (options.length > 0 && options.length === checkedOptions.length);
        }
      });

      // Step 3 — re-render table
      renderTable(filtered, selected);
    } finally {
      hideOverlay();
    }
  });
}

/* -------------------- Render table, grouping, subtotal, totals -------------------- */
function renderTable(dataToRender, selected, alreadyGrouped = false){
  const tHead = document.getElementById("tableHead");
  const tBody = document.getElementById("tableBody");
  const tFoot = document.getElementById("tableFoot");

  // Ensure SHOW COLUMNS are always available for grouping, even if not explicitly selected
  const showCols = (selected["SHOW COLUMNS"] && selected["SHOW COLUMNS"].length) ? selected["SHOW COLUMNS"] : baseTextCols;
  const availableMonthCols = monthOrder.filter(m => originalKeys.map(k => k.toUpperCase()).includes(m.toUpperCase()));
  const monthCols = (selected["MONTH / YEAR"] && selected["MONTH / YEAR"].length) ? selected["MONTH / YEAR"] : availableMonthCols;
  const totalCols = selected["TOTAL"] || [];

  // Compose colsToShow in order: showCols then monthCols (dedupe just in case)
  let colsToShow = [...showCols, ...monthCols].map(c => String(c));
  colsToShow = colsToShow.filter((v,i,arr) => arr.indexOf(v) === i);

  if((selected["COMPARISON"]||[]).length === 2) {
    // COMPARISON will be computed dynamically, but we keep the label "COMPARISON" in the columns
    if (!colsToShow.includes("COMPARISON")) colsToShow.push("COMPARISON");
  }

  // Determine index where first text column appears in colsToShow (safe computation)
  const normShowUpper = showCols.map(s => String(s).toUpperCase());
  const firstTextColIndex = colsToShow.findIndex(c => normShowUpper.includes(String(c).toUpperCase()));
  // If none found, set to -1 (handled later so no accidental equality matches)

  // Header row
  const isNumericCol = c => monthOrder.map(m=>m.toUpperCase()).includes(String(c).toUpperCase()) || c === "COMPARISON";
  tHead.innerHTML = "<tr>" + colsToShow.map(c => `<th class="${isNumericCol(c)?'sortable':''}" data-col="${c}">${c}${isNumericCol(c)?'<span class="sort-icon">↕️</span>':''}</th>`).join("") + "</tr>";
  addSorting(colsToShow); // Re-add sorting listeners after header update

  // Grouping and aggregation
  let grouped = dataToRender;
  if (!alreadyGrouped) {
    // Deduplicate & sum numeric months grouped by showCols
    const map = new Map();
    dataToRender.forEach(r=>{
      const key = showCols.map(k => String(getVal(r,k))).join("|");
      if(!map.has(key)){
        const obj = {};
        showCols.forEach(k => obj[k] = getVal(r,k));
        monthCols.forEach(m => obj[m] = Number(getVal(r,m)) || 0);
        map.set(key, obj);
      } else {
        const obj = map.get(key);
        monthCols.forEach(m => obj[m] = obj[m] + (Number(getVal(r,m)) || 0));
      }
    });
    grouped = [...map.values()];
  }
  currentGroupedData = grouped; // store for sorting

  // Build table body HTML
  let rowsHtml = "";

  if(Array.isArray(totalCols) && totalCols.length){
    // group by totalCols (normalize lookups)
    const groups = {};
    grouped.forEach(row => {
      // build grouping key robustly (try row[k], then uppercase/lowercase variants, then fallback "")
      const gKeyParts = totalCols.map(k => {
        const tryVal = getVal(row, k) ?? getVal(row, String(k).toUpperCase()) ?? getVal(row, String(k).toLowerCase()) ?? "";
        return String(tryVal);
      });
      const key = gKeyParts.join("|");
      if(!groups[key]) groups[key] = [];
      groups[key].push(row);
    });

    Object.entries(groups).forEach(([gKey, rows])=>{
      rows.forEach(r => rowsHtml += buildRowHtml(r, colsToShow, selected));
      // subtotal for this group
      const subtotal = {};
      monthCols.forEach(m => subtotal[m] = rows.reduce((s, rr) => s + (Number(rr[m])||0), 0));
      // build subtotal cells aligned with colsToShow order
      const subCells = colsToShow.map((c, idx) => {
        if(c === "COMPARISON" && (selected["COMPARISON"]||[]).length === 2){
          const [a,b] = selected["COMPARISON"];
          const diff = (subtotal[b]||0) - (subtotal[a]||0);
          const cls = diff > 0 ? 'bg-pos' : (diff < 0 ? 'bg-neg' : '');
          return `<td class="numeric ${cls}">${diff}</td>`;
        }
        if(monthOrder.map(m=>m.toUpperCase()).includes(String(c).toUpperCase())){
          const val = subtotal[c] || 0;
          // find previous visible month in colsToShow
          let prev = null;
          for(let j = idx-1; j >= 0; j--){ if(monthOrder.map(m=>m.toUpperCase()).includes(String(colsToShow[j]).toUpperCase())){ prev = subtotal[colsToShow[j]]; break; } }
          const cls = (prev !== null) ? (val > prev ? 'bg-pos' : (val < prev ? 'bg-neg' : '')) : '';
          return `<td class="numeric ${cls}">${val}</td>`;
        }
        if(idx === firstTextColIndex && firstTextColIndex >= 0) return `<td class="subtotal-label">Subtotal</td>`;
        return `<td></td>`;
      }).join("");
      rowsHtml += `<tr class="subtotal-row">${subCells}</tr>`;
    });

  } else {
    // simple rendering (no subtotal groups)
    grouped.forEach(r => rowsHtml += buildRowHtml(r, colsToShow, selected));
  }

  // Insert to DOM
  tBody.innerHTML = rowsHtml;

  // grand total footer
  tFoot.innerHTML = "";
  if(grouped.length){
    const totals = {};
    monthCols.forEach(m => totals[m] = grouped.reduce((s,r)=>s + (Number(r[m])||0), 0));
    const totalCells = colsToShow.map((c, idx) => {
      if(c === "COMPARISON" && (selected["COMPARISON"]||[]).length === 2){
        const [a,b] = selected["COMPARISON"];
        const diff = (totals[b]||0) - (totals[a]||0);
        const cls = diff > 0 ? 'bg-pos' : (diff < 0 ? 'bg-neg' : '');
        return `<td class="numeric ${cls}"><b>${diff}</b></td>`;
      }
      if(monthOrder.map(m=>m.toUpperCase()).includes(String(c).toUpperCase())){
        const val = totals[c] || 0;
        let prev = null;
        for(let j = idx-1; j >= 0; j--){ if(monthOrder.map(m=>m.toUpperCase()).includes(String(colsToShow[j]).toUpperCase())){ prev = totals[colsToShow[j]]; break; } }
        const cls = (prev !== null) ? (val > prev ? 'bg-pos' : (val < prev ? 'bg-neg' : '')) : '';
        return `<td class="numeric ${cls}"><b>${val}</b></td>`;
      }
      if(idx === firstTextColIndex && firstTextColIndex >= 0) return `<td class="subtotal-label"><b>TOTAL</b></td>`;
      return `<td></td>`;
    }).join("");
    tFoot.innerHTML = `<tr class="grandtotal-row">${totalCells}</tr>`;
  }

  document.getElementById("dataTable").classList.remove("hidden");
}

/* helper to build single row HTML */
function buildRowHtml(row, colsToShow, selected){
  const cells = colsToShow.map((c, idx) => {
    if(c === "COMPARISON"){
      const compare = (selected["COMPARISON"]||[]);
      if(compare.length === 2){
        const [a,b] = compare;
        const diff = (Number(row[b])||0) - (Number(row[a])||0);
        const cls = diff > 0 ? 'bg-pos' : (diff < 0 ? 'bg-neg' : '');
        return `<td class="numeric ${cls}">${diff}</td>`;
      } else return `<td class="numeric"></td>`;
    }

    if(monthOrder.map(m=>m.toUpperCase()).includes(String(c).toUpperCase())){
      const num = Number(row[c]) || 0;
      // find previous visible month in colsToShow
      let prevVal = null;
      for(let j = idx - 1; j >= 0; j--){
        if(monthOrder.map(m=>m.toUpperCase()).includes(String(colsToShow[j]).toUpperCase())){
          prevVal = Number(row[colsToShow[j]]) || 0;
          break;
        }
      }
      const cls = (prevVal !== null) ? (num > prevVal ? 'bg-pos' : (num < prevVal ? 'bg-neg' : '')) : '';
      return `<td class="numeric ${cls}">${num}</td>`;
    }

    // text columns (defensive)
    const txt = row[c] ?? row[String(c).toUpperCase()] ?? row[String(c).toLowerCase()] ?? "";
    return `<td>${txt}</td>`;
  });

  return `<tr>${cells.join("")}</tr>`;
}

/* -------------------- Sorting on numeric columns -------------------- */
function addSorting(colsToShow){
  const table = document.getElementById("dataTable");
  const ths = table.querySelectorAll("th.sortable");
  ths.forEach(th => {
    th.onclick = () => {
      const col = th.getAttribute("data-col");
      const asc = !th.classList.contains("asc");

      // Reset all sort icons
      table.querySelectorAll("th .sort-icon").forEach(icon => icon.textContent = '↕️');
      table.querySelectorAll("th").forEach(t => t.classList.remove("asc", "desc"));

      // Set current sort icon
      th.classList.add(asc ? "asc" : "desc");
      const sortIcon = th.querySelector('.sort-icon');
      if (sortIcon) sortIcon.textContent = asc ? '⬆️' : '⬇️';

      // Sort the globally stored grouped data (numeric sort)
      let sortedGrouped = [...currentGroupedData];

      sortedGrouped.sort((a, b) => {
        const A = Number(a[col]) || 0;
        const B = Number(b[col]) || 0;
        return asc ? A - B : B - A;
      });

      // Re-render the table with the sorted grouped data (alreadyGrouped = true)
      renderTable(sortedGrouped, currentSelectedFilters, true);
    };
  });
}

/* -------------------- Export to Excel (ExcelJS) -------------------- */
async function exportExcel(){
  try{
    const workbook = new ExcelJS.Workbook();
    const worksheet = workbook.addWorksheet("Dashboard Data");

    const table = document.getElementById("dataTable");
    const rows = Array.from(table.querySelectorAll("tr")).map(tr => Array.from(tr.querySelectorAll("th,td")).map(td => td.innerText.trim()));

    rows.forEach((r, i) => {
      const row = worksheet.addRow(r);
      if(i === 0){
        row.eachCell(cell => {
          cell.font = { bold: true, color: { argb: "1E3A8A" } };
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "E0E7FF" } };
          cell.alignment = { horizontal: "center", vertical: "middle" };
          cell.border = { top:{style:"thin"}, left:{style:"thin"}, bottom:{style:"thin"}, right:{style:"thin"} };
        });
      } else {
        row.eachCell((cell, colNumber) => {
          const val = String(cell.value ?? "");
          if(val.toUpperCase().includes("SUBTOTAL")){
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "E0F2FE" } };
            cell.font = { bold: true, color: { argb: "1E3A8A" } };
            cell.alignment = { horizontal: "center", vertical: "middle" };
          } else if(val.toUpperCase().includes("TOTAL")){
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "F3E8FF" } };
            cell.font = { bold: true, color: { argb: "4C1D95" } };
            cell.alignment = { horizontal: "center", vertical: "middle" };
          } else if(!isNaN(parseFloat(val))){
            const num = parseFloat(val);
            const bg = num > 0 ? "D1FAE5" : "FEE2E2";
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: bg } };
            cell.alignment = { horizontal: "center", vertical: "middle" };
          } else {
            cell.alignment = { horizontal: "center", vertical: "middle" };
          }
        });
      }
    });

    const colCount = Math.max(...rows.map(r=>r.length));
    worksheet.columns.forEach(col => col.width = 15);
    worksheet.views = [{ state: 'frozen', ySplit: 1 }];

    const buf = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const fileName = `${currentView}_export_${new Date().toISOString().split("T")[0]}.xlsx`;
    saveAs(blob, fileName);
  } catch (err) {
    console.error("Export failed", err);
    alert("Export failed: " + err.message);
  } finally {
    hideOverlay();
  }
}

/* ensure overlay hidden at start */
hideOverlay();

/* ---------- MOBILE PERFORMANCE OPTIMIZATION (defensive) ---------- */
const isMobile = window.matchMedia("(max-width: 768px)").matches;

if (isMobile) {
  console.log("📱 Mobile view detected — optimizing performance...");

  // Add tip message once
  const msg = document.createElement("div");
  msg.className = "mobile-tip";
  msg.textContent = "📊 Mobile mode active — optimized for speed.";
  document.querySelector("main").prepend(msg);

  // Lightweight table rendering (no hang)
  const originalRenderTable = renderTable;
  renderTable = function (filtered, selected, alreadyGrouped = false) {
    requestAnimationFrame(() => {
      originalRenderTable(filtered, selected, alreadyGrouped);
    });
  };

  // Add smooth scrolling if filters container exists
  const fContainer = document.getElementById("filtersContainer");
  if (fContainer) fContainer.style.scrollBehavior = "smooth";
}
