<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Madhusudan Dashboard</title>
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
  <style>
    td { transition: background-color 0.25s ease; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="SMC Logo" class="h-10 w-auto">
        <h1 class="text-xl font-bold text-gray-800">SMC Madhusudan Dashboard</h1>
      </div>
      <button id="toggleViewBtn"
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow">
        Switch to SKU View
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    <section class="bg-white p-6 rounded-xl shadow">
      <div id="filtersRow" class="flex flex-wrap gap-4 mb-4"></div>
      <div id="loader" class="text-center py-4 text-gray-500">Loading data...</div>

      <div class="overflow-x-auto">
        <table id="dataTable" class="min-w-full divide-y divide-gray-200 hidden">
          <thead id="tableHead" class="bg-gray-100"></thead>
          <tbody id="tableBody" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="mt-10 bg-gray-100 py-4 text-center text-sm text-gray-500">
    © {{ current_year }} SMC Madhusudan | All Rights Reserved
  </footer>

<script>
let currentView = "product";
const baseTextCols = ["STATE","MANAGER_NAME","DISTRICT","PARTY_NAME","PRODUCT","SKU"];

async function loadData(viewType="product"){
  const res = await fetch(`/get_data/${viewType}`);
  const data = await res.json();

  const loader=document.getElementById("loader"),
        filtersRow=document.getElementById("filtersRow"),
        table=document.getElementById("dataTable"),
        thead=document.getElementById("tableHead"),
        tbody=document.getElementById("tableBody");

  if(!data || data.error){ loader.textContent="⚠️ Error loading data."; return; }
  if(!data.length){ loader.textContent="No data found."; return; }

  loader.classList.add("hidden");
  table.classList.remove("hidden");

  const headers = Object.keys(data[0]);
  const textCols = baseTextCols.filter(c=>headers.includes(c));
  const numericCols = headers.filter(h=>!textCols.includes(h));

  // Build table header
  thead.innerHTML = `<tr>${headers.map(h=>`<th class="px-4 py-2 text-left text-sm font-semibold text-gray-700 whitespace-nowrap">${h}</th>`).join("")}</tr>`;

  // Build filters
  filtersRow.innerHTML = "";
  textCols.forEach(col=>{
    const unique=[...new Set(data.map(d=>d[col]))].filter(Boolean).sort();
    filtersRow.innerHTML += `
      <div>
        <label class="block text-sm font-medium text-gray-700">${col}</label>
        <select multiple id="filter_${col}" class="border border-gray-300 rounded-md p-2 text-sm w-44 h-24">
          ${unique.map(u=>`<option value="${u}">${u}</option>`).join("")}
        </select>
      </div>`;
  });

  // Group By
  filtersRow.innerHTML += `
    <div>
      <label class="block text-sm font-medium text-gray-700">Group By</label>
      <select id="groupBy" class="border border-gray-300 rounded-md p-2 text-sm w-48">
        <option value="">None</option>
        ${textCols.map(c=>`<option value="${c}">${c}</option>`).join("")}
      </select>
    </div>`;

  // Comparison
  filtersRow.innerHTML += `
    <div>
      <label class="block text-sm font-medium text-gray-700">Comparison (select 2)</label>
      <select multiple id="compareCols" class="border border-gray-300 rounded-md p-2 text-sm w-56 h-24">
        ${numericCols.map(c=>`<option value="${c}">${c}</option>`).join("")}
      </select>
    </div>`;

  // --- Helper for cell shading ---
  function cellColor(current, previous){
    const diff = current - previous;
    if(diff>0) return "color:green";
    if(diff<0) return "color:red";
    return "";
  }

  function render(rows){
    tbody.innerHTML = rows.map(r=>{
      return `<tr>${headers.map((h,idx)=>{
        let val = r[h];
        let style = "";
        if(numericCols.includes(h)){
          val = val===""?0:Number(val);
          const prev = idx>0 && numericCols.includes(headers[idx-1]) ? Number(r[headers[idx-1]]) : val;
          style = cellColor(val, prev);
        }
        if(h==="Comparison"){
          const v = Number(val);
          style = v>0 ? "color:green" : "color:red";
        }
        return `<td class="px-4 py-2 text-sm whitespace-nowrap" style="${style}">${val}</td>`;
      }).join("")}</tr>`;
    }).join("");
  }

  function applyFilters(){
    let filtered=[...data];

    // Apply text filters
    textCols.forEach(c=>{
      const selected = Array.from(document.getElementById(`filter_${c}`).selectedOptions).map(o=>o.value);
      if(selected.length>0){
        filtered = filtered.filter(r=>selected.includes(r[c]));
      }
    });

    // Group By
    const groupCol = document.getElementById("groupBy").value;
    if(groupCol){
      const grouped={};
      filtered.forEach(r=>{
        const key=r[groupCol]||"Unknown";
        if(!grouped[key]) grouped[key]={};
        numericCols.forEach(n=>{
          grouped[key][n]=(grouped[key][n]||0)+Number(r[n]||0);
        });
        textCols.forEach(t=>grouped[key][t]=key);
      });
      filtered=Object.values(grouped);
    }

    // Comparison
    const comps=Array.from(document.getElementById("compareCols").selectedOptions).map(o=>o.value);
    if(comps.length===2){
      const [c1,c2]=comps;
      filtered=filtered.map(r=>{
        const v1=Number(r[c1]||0), v2=Number(r[c2]||0);
        return {...r, Comparison:(v2-v1)};
      });
      if(!headers.includes("Comparison")) headers.push("Comparison");
      thead.innerHTML = `<tr>${headers.map(h=>`<th class="px-4 py-2 text-left text-sm font-semibold text-gray-700 whitespace-nowrap">${h}</th>`).join("")}</tr>`;
    }

    render(filtered);
  }

  filtersRow.addEventListener("change",applyFilters);
  applyFilters();
}

// Toggle product ↔ SKU
document.getElementById("toggleViewBtn").addEventListener("click",function(){
  currentView = currentView==="product"?"sku":"product";
  this.textContent = currentView==="product"?"Switch to SKU View":"Switch to Product View";
  loadData(currentView);
});

document.addEventListener("DOMContentLoaded",()=>loadData(currentView));
</script>
</body>
</html>
