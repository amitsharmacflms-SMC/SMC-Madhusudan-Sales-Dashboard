<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC - Madhusudan Sales Dashboard</title>

  <!-- Performance -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="{{ url_for('static', filename='css/output.css') }}" as="style">
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">

  <style>
    :root { --navy:#1e3a8a; --pos:#d1fae5; --neg:#fee2e2; }

    html,body{ margin:0;padding:0;font-family:Inter,system-ui; background:#fff; }
    
    /* === HEADER CENTERED === */
    header{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:12px 0;
      position:relative;
    }

    /* Centered Branding */
    .branding{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .branding img{ width:48px;height:48px;object-fit:contain }
    .branding h1{
      font-size:1.25rem;
      margin:0;
      color:var(--navy);
      font-weight:900;
      text-align:center;
      white-space:nowrap;
    }

    /* === RIGHT CORNER TOOLBAR === */
    .toolbar{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .btn{
      padding:6px 12px;
      border-radius:6px;
      font-weight:600;
      border:1px solid #d4d4d4;
      background:#f1f5f9;
      cursor:pointer;
      min-width:120px;
    }
    .btn-blue{ background:#1e3a8a;color:#fff;border:none }

    /* FILTERS */
    #filtersWrapper{
      min-height:90px;
      transition:max-height .2s ease;
    }

    /* TABLE AREA */
    .table-wrapper{
      background:#fff;
      border-radius:10px;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
      padding:10px;
      margin-top:12px;
      min-height:360px;
      overflow:auto;
    }

    /* SKELETON */
    .skeleton{
      width:100%;
      height:320px;
      border-radius:8px;
      background:linear-gradient(90deg,#f3f4f6,#e5e7eb,#f3f4f6);
      animation:pulse 1.6s infinite;
      background-size:200% 100%;
    }
    @keyframes pulse{
      0%{background-position:200% 0}
      100%{background-position:-200% 0}
    }

    /* === TABLE STYLE === */
    table{
      border-collapse:collapse;
      width:100%;
      content-visibility:auto;
    }

    thead th{
      position:sticky;
      top:0;
      background:#eef2ff;
      font-weight:800;
      font-size:0.8rem;
      padding:6px;
      border:2px solid #c7d2fe;
      z-index:20;
      text-align:center;
    }

    tbody td{
      padding:6px 8px;
      font-weight:700; /* ← BOLD DATA */
      border:1.8px solid #e2e8f0; /* ← BOLD GRIDLINES */
    }

    tfoot td{
      font-weight:900;
      border:2px solid #cbd5e1;
      background:#f1f5f9;
    }

    .hidden{display:none!important}
  </style>

  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}">
</head>

<body>

<header>
  <!-- CENTERED -->
  <div class="branding">
    <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo">
    <h1>SMC Madhusudan Sales Dashboard</h1>
  </div>

  <!-- RIGHT FLOATING TOOLBAR -->
  <div class="toolbar">
    <button id="backBtn" class="btn">← Back</button>
    <button id="clearBtn" class="btn">Clear Filters</button>
    <button id="toggleFiltersBtn" class="btn">Hide Filters</button>
    <button id="toggleViewBtn" class="btn btn-blue">Switch to SKU View</button>
    <button id="themeToggle" class="btn">Dark Mode</button>
    <button id="exportBtn" class="btn btn-blue">Export</button>
  </div>
</header>

<main class="container" style="padding:0 12px;">
  <section>

    <div id="filtersWrapper">
      <div id="filtersContainer"
           style="display:flex;gap:12px;padding:10px;background:white;border-radius:10px;border:1px solid #e5e7eb;overflow-x:auto;">
      </div>
    </div>

    <div id="loader" style="height:24px;line-height:24px;color:#6b7280;visibility:hidden">Loading...</div>
    <div id="overlayLoader" class="hidden"
         style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3000;"></div>

    <div class="table-wrapper">
      <div id="tableSkeleton" class="skeleton"></div>

      <div id="tableContainer" class="hidden">
        <table id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
          <tfoot id="tableFoot"></tfoot>
        </table>
      </div>
    </div>

  </section>
</main>

<footer style="text-align:center;padding:14px;font-weight:600;color:#1e3a8a;background:#f9fafb;margin-top:18px;border-top:1px solid #e2e8f0">
  © {{ current_year }} Created & Hosted by <strong>Amit Sharma</strong>
</footer>

<!-- Deferred Scripts -->
<script defer src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script defer src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

<script>
  /* Reveal skeleton → real table */
  window.__dashboardReveal = function(){
    document.getElementById('tableSkeleton')?.classList.add('hidden');
    document.getElementById('tableContainer')?.classList.remove('hidden');
    document.getElementById('loader').style.visibility = 'hidden';
  };
  setTimeout(()=>{ 
    if(document.getElementById('tableContainer')?.classList.contains('hidden'))
      window.__dashboardReveal();
  },2500);
</script>

</body>
</html>
