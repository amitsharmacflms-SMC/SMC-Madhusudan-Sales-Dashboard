<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMC Madhusudan Dashboard</title>

  <!-- ✅ Tailwind CSS -->
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <!-- ✅ SEO -->
  <meta name="description" content="SMC Madhusudan Sales Dashboard - Live performance data by product and SKU across managers and regions.">
</head>

<body class="bg-gray-50 text-gray-900">

  <!-- ✅ HEADER -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <!-- Logo & Title -->
      <div class="flex items-center space-x-3">
        <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="SMC Logo" class="h-10 w-auto">
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-gray-800">
          SMC Madhusudan Dashboard
        </h1>
      </div>

      <!-- Toggle -->
      <div>
        <button 
          id="toggleViewBtn"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg shadow transition">
          Switch to SKU View
        </button>
      </div>
    </div>
  </header>

  <!-- ✅ MAIN CONTENT -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    <section id="data-section" class="bg-white p-6 rounded-xl shadow overflow-x-auto">
      <!-- Filters -->
      <div class="flex items-center justify-start mb-6 flex-wrap gap-4" id="filterContainer">
        <!-- Filter controls generated dynamically -->
      </div>

      <!-- Loader -->
      <div id="loader" class="text-center py-8 text-gray-500">Loading data...</div>

      <!-- Data Table -->
      <div class="overflow-x-auto">
        <table id="dataTable" class="min-w-full divide-y divide-gray-200 hidden">
          <thead class="bg-gray-100" id="tableHead"></thead>
          <tbody id="dataBody" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ✅ FOOTER -->
  <footer class="mt-10 bg-gray-100 py-4 text-center text-sm text-gray-500">
    © {{ current_year }} SMC Madhusudan | All Rights Reserved
  </footer>

  <!-- ✅ SCRIPT -->
  <script>
  async function loadData(viewType = "product") {
    const loader = document.getElementById("loader");
    const table = document.getElementById("dataTable");
    const tbody = document.getElementById("dataBody");
    const thead = document.getElementById("tableHead");
    const filterContainer = document.getElementById("filterContainer");

    loader.classList.remove("hidden");
    table.classList.add("hidden");
    tbody.innerHTML = "";
    thead.innerHTML = "";

    const res = await fetch(`/get_data/${viewType}`);
    const data = await res.json();

    if (!data || data.error) {
      loader.textContent = "⚠️ Error loading data.";
      return;
    }
    if (!data.length) {
      loader.textContent = "No data found.";
      return;
    }

    loader.classList.add("hidden");
    table.classList.remove("hidden");

    const headers = Object.keys(data[0]);

    // Define which columns to show filters for
    const stringCols = ["STATE", "MANAGER_NAME", "DISTRICT", "PARTY_NAME", "PRODUCT", "SKU"];
    const monthCols = headers.filter(h =>
      !stringCols.includes(h) && /(\d{2}|\bAVG\b)/gi.test(h)
    );

    // 🧩 Build table headers dynamically
    thead.innerHTML = `<tr>${headers.map(h => `
      <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700 whitespace-nowrap">${h}</th>
    `).join("")}</tr>`;

    // 🧩 Build filters
    filterContainer.innerHTML = "";

    stringCols.forEach(col => {
      if (!headers.includes(col)) return;
      const unique = [...new Set(data.map(d => d[col]))].filter(Boolean);
      filterContainer.innerHTML += `
        <div>
          <label class="block text-sm font-medium text-gray-700">${col}</label>
          <select id="filter_${col}" class="border border-gray-300 rounded-md p-2 text-sm w-40">
            <option value="">All</option>
            ${unique.map(u => `<option value="${u}">${u}</option>`).join("")}
          </select>
        </div>`;
    });

    // Month/Average selector
    filterContainer.innerHTML += `
      <div>
        <label class="block text-sm font-medium text-gray-700">Month / Average</label>
        <select id="filterMonth" class="border border-gray-300 rounded-md p-2 text-sm w-44">
          <option value="">All</option>
          ${monthCols.map(col => `<option value="${col}">${col}</option>`).join("")}
        </select>
      </div>`;

    // 🧩 Render data
    const render = rows => {
      tbody.innerHTML = rows.map(r => `
        <tr>${headers.map(h => `
          <td class="px-4 py-2 text-sm text-gray-700 whitespace-nowrap">${r[h] || ""}</td>
        `).join("")}</tr>
      `).join("");
    };

    render(data);

    // 🧩 Apply filters dynamically
    filterContainer.addEventListener("change", () => {
      let filtered = data;

      // Text filters
      stringCols.forEach(col => {
        const val = document.getElementById(`filter_${col}`)?.value || "";
        if (val) filtered = filtered.filter(r => r[col] === val);
      });

      // Month/Avg numeric filter
      const monthCol = document.getElementById("filterMonth").value;
      if (monthCol) {
        filtered = filtered.filter(r => r[monthCol] && Number(r[monthCol]) !== 0);
      }

      render(filtered);
    });
  }

  // 🔁 Toggle between Product ↔ SKU
  document.getElementById("toggleViewBtn").addEventListener("click", function() {
    const isSKU = this.textContent.includes("SKU");
    const view = isSKU ? "sku" : "product";
    this.textContent = isSKU ? "Switch to Product View" : "Switch to SKU View";
    loadData(view);
  });

  // Initial load: Product View
  document.addEventListener("DOMContentLoaded", () => loadData("product"));
  </script>
</body>
</html>
