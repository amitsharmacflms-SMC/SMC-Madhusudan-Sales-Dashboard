<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMC Madhusudan Dashboard</title>

  <!-- ✅ Local Tailwind CSS -->
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">

  <!-- ✅ Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <meta name="description" content="Sales performance dashboard for SMC Madhusudan - view insights by product, SKU, region, and manager.">
</head>

<body class="bg-gray-50 text-gray-900">

  <!-- ✅ HEADER -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="SMC Logo" class="h-10 w-auto">
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-gray-800">SMC Madhusudan Dashboard</h1>
      </div>

      <div>
        <button 
          id="toggleViewBtn" 
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg shadow transition">
          Switch to SKU View
        </button>
      </div>
    </div>
  </header>

  <!-- ✅ MAIN DASHBOARD CONTENT -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    <section id="data-section" class="bg-white p-6 rounded-xl shadow overflow-x-auto">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">📊 Sales Data</h2>
        <div id="filterContainer" class="flex flex-wrap gap-4"></div>
      </div>

      <table id="dataTable" class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-100" id="tableHead"></thead>
        <tbody id="dataBody" class="divide-y divide-gray-200">
          <tr><td colspan="99" class="text-center py-6 text-gray-500">Loading data...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- ✅ FOOTER -->
  <footer class="mt-10 bg-gray-100 py-4 text-center text-sm text-gray-500">
    © {{ current_year }} SMC Madhusudan | All Rights Reserved
  </footer>

  <!-- ✅ SCRIPT SECTION -->
  <script>
  async function loadData(viewType = "product") {
    const res = await fetch(`/get_data/${viewType}`);
    const data = await res.json();

    const tbody = document.getElementById("dataBody");
    const thead = document.getElementById("tableHead");
    const filterContainer = document.getElementById("filterContainer");

    if (!data || data.error) {
      tbody.innerHTML = `<tr><td colspan="99" class="text-center py-6 text-red-500">⚠️ Error loading ${viewType} data</td></tr>`;
      return;
    }

    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="99" class="text-center py-6 text-gray-500">No data available</td></tr>`;
      return;
    }

    const headers = Object.keys(data[0]);
    const dateCols = headers.filter(h => h.toLowerCase().includes("date"));

    // Build dynamic table header
    thead.innerHTML = `<tr>${headers.map(h => `
      <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700">${h}</th>
    `).join("")}</tr>`;

    // Build date filters dynamically
    filterContainer.innerHTML = "";
    dateCols.forEach(col => {
      filterContainer.innerHTML += `
        <div>
          <label class="block text-sm font-medium text-gray-700">${col}</label>
          <input type="date" id="start_${col}" class="border border-gray-300 rounded-md p-2 text-sm">
          <input type="date" id="end_${col}" class="border border-gray-300 rounded-md p-2 text-sm">
        </div>`;
    });

    // Function to render data
    const render = rows => {
      tbody.innerHTML = rows.map(r => `
        <tr>${headers.map(h => `
          <td class="px-4 py-2 text-sm text-gray-700">${r[h] || ""}</td>
        `).join("")}</tr>
      `).join("");
    };

    render(data);

    // Date filter logic
    filterContainer.addEventListener("change", () => {
      let filtered = data;
      dateCols.forEach(col => {
        const start = document.getElementById(`start_${col}`).value;
        const end = document.getElementById(`end_${col}`).value;
        if (start || end) {
          filtered = filtered.filter(r => {
            const val = new Date(r[col]);
            if (isNaN(val)) return true;
            return (!start || val >= new Date(start)) && (!end || val <= new Date(end));
          });
        }
      });
      render(filtered);
    });
  }

  // Toggle Product ↔ SKU
  document.getElementById("toggleViewBtn").addEventListener("click", function() {
    const isSKU = this.textContent.includes("SKU");
    const view = isSKU ? "sku" : "product";
    this.textContent = isSKU ? "Switch to Product View" : "Switch to SKU View";
    loadData(view);
  });

  // Initial load
  document.addEventListener("DOMContentLoaded", () => loadData("product"));
  </script>
</body>
</html>
