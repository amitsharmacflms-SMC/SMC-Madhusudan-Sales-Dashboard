<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMC Madhusudan Dashboard</title>
<link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
<link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
<style>
  td{transition:background-color 0.25s ease;}
  .kpi-card{background:#f9fafb;border-radius:0.75rem;padding:0.75rem 1rem;box-shadow:0 1px 2px rgba(0,0,0,0.05);}
</style>
</head>
<body class="bg-gray-50 text-gray-900">

<header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <img src="{{ url_for('static', filename='onlylogo.png') }}" class="h-10" alt="logo">
      <h1 class="text-xl font-bold text-gray-800">SMC Madhusudan Dashboard</h1>
    </div>
    <button id="toggleViewBtn"
      class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow">
      Switch to SKU View
    </button>
  </div>
</header>

<main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
  <!-- KPI Summary -->
  <div id="summaryRow" class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6"></div>

  <section class="bg-white p-6 rounded-xl shadow">
    <div id="filtersRow" class="flex flex-wrap gap-4 mb-4"></div>
    <div id="loader" class="text-center py-4 text-gray-500">Loading data...</div>
    <div class="overflow-x-auto">
      <table id="dataTable" class="min-w-full divide-y divide-gray-200 hidden">
        <thead id="tableHead" class="bg-gray-100"></thead>
        <tbody id="tableBody" class="divide-y divide-gray-200"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="mt-10 bg-gray-100 py-4 text-center text-sm text-gray-500">
  © {{ current_year }} SMC Madhusudan | All Rights Reserved
</footer>

<script>
let currentView="product";
const baseTextCols=["state","manager_name","district","party_name","product","sku"];

async function loadData(view="product"){
  const res=await fetch(`/get_data/${view}`);
  const data=await res.json();
  const loader=document.getElementById("loader"),
        filters=document.getElementById("filtersRow"),
        table=document.getElementById("dataTable"),
        thead=document.getElementById("tableHead"),
        tbody=document.getElementById("tableBody"),
        summary=document.getElementById("summaryRow");
  if(!data||data.error){loader.textContent="Error loading data";return;}
  if(!data.length){loader.textContent="No data found";return;}

  loader.classList.add("hidden");
  table.classList.remove("hidden");

  const headers=Object.keys(data[0]);
  const textCols=baseTextCols.filter(c=>headers.includes(c));
  const numCols=headers.filter(h=>!textCols.includes(h));

  // Build headers
  thead.innerHTML=`<tr>${headers.map(h=>`<th class="px-4 py-2 text-left text-sm font-semibold">${h}</th>`).join("")}</tr>`;

  // Filters
  filters.innerHTML="";
  textCols.forEach(c=>{
    const unique=[...new Set(data.map(d=>d[c]))].filter(Boolean).sort();
    filters.innerHTML+=`
      <div>
        <label class="block text-sm font-medium">${c}</label>
        <select multiple id="filter_${c}" class="border border-gray-300 rounded-md p-2 text-sm w-44 h-24">
          ${unique.map(u=>`<option value="${u}">${u}</option>`).join("")}
        </select>
      </div>`;
  });

  // Group & Compare
  filters.innerHTML+=`
    <div>
      <label class="block text-sm font-medium">Group By</label>
      <select id="groupBy" class="border border-gray-300 rounded-md p-2 text-sm w-48">
        <option value="">None</option>
        ${textCols.map(c=>`<option value="${c}">${c}</option>`).join("")}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium">Comparison (2 columns)</label>
      <select multiple id="compareCols" class="border border-gray-300 rounded-md p-2 text-sm w-56 h-24">
        ${numCols.map(c=>`<option value="${c}">${c}</option>`).join("")}
      </select>
    </div>`;

  // Render Table
  function render(rows){
    tbody.innerHTML=rows.map(r=>{
      return `<tr>${headers.map((h,i)=>{
        let val=r[h], style="";
        if(numCols.includes(h)){
          val=Number(val)||0;
          const prev=(i>0&&numCols.includes(headers[i-1]))?Number(r[headers[i-1]]):val;
          style=(val>prev?"color:green":val<prev?"color:red":"");
        }
        if(h==="comparison"){
          style=(val>0?"color:green":"color:red");
        }
        return `<td class="px-4 py-2 text-sm whitespace-nowrap" style="${style}">${val}</td>`;
      }).join("")}</tr>`;
    }).join("");
  }

  function showSummary(rows){
    if(!rows.length){summary.innerHTML="";return;}
    const allVals=numCols.flatMap(c=>rows.map(r=>Number(r[c])||0));
    const total=allVals.reduce((a,b)=>a+b,0);
    const avg=Math.round(total/allVals.length);
    const pos=allVals.filter(v=>v>0).length;
    const neg=allVals.filter(v=>v<=0).length;
    summary.innerHTML=`
      <div class="kpi-card"><h3 class="text-sm text-gray-500">Total</h3><p class="text-lg font-bold">${total.toLocaleString()}</p></div>
      <div class="kpi-card"><h3 class="text-sm text-gray-500">Average</h3><p class="text-lg font-bold">${avg}</p></div>
      <div class="kpi-card"><h3 class="text-sm text-gray-500">Positive</h3><p class="text-lg font-bold text-green-600">${pos}</p></div>
      <div class="kpi-card"><h3 class="text-sm text-gray-500">Negative</h3><p class="text-lg font-bold text-red-600">${neg}</p></div>`;
  }

  function applyFilters(){
    let filtered=[...data];

    // Text filters
    textCols.forEach(c=>{
      const vals=Array.from(document.getElementById(`filter_${c}`).selectedOptions).map(o=>o.value);
      if(vals.length) filtered=filtered.filter(r=>vals.includes(r[c]));
    });

    // Group
    const g=document.getElementById("groupBy").value;
    if(g){
      const grouped={};
      filtered.forEach(r=>{
        const key=r[g]||"Unknown";
        if(!grouped[key]) grouped[key]={};
        numCols.forEach(n=>grouped[key][n]=(grouped[key][n]||0)+Number(r[n]||0));
        textCols.forEach(t=>grouped[key][t]=key);
      });
      filtered=Object.values(grouped);
    }

    // Comparison
    const comp=Array.from(document.getElementById("compareCols").selectedOptions).map(o=>o.value);
    if(comp.length===2){
      const [a,b]=comp;
      filtered=filtered.map(r=>{
        const diff=(Number(r[b])||0)-(Number(r[a])||0);
        return {...r,comparison:diff};
      });
      if(!headers.includes("comparison")) headers.push("comparison");
      thead.innerHTML=`<tr>${headers.map(h=>`<th class="px-4 py-2 text-left text-sm font-semibold">${h}</th>`).join("")}</tr>`;
    }

    render(filtered);
    showSummary(filtered);
  }

  filters.addEventListener("change",applyFilters);
  applyFilters();
}

document.getElementById("toggleViewBtn").addEventListener("click",function(){
  currentView=currentView==="product"?"sku":"product";
  this.textContent=currentView==="product"?"Switch to SKU View":"Switch to Product View";
  loadData(currentView);
});

document.addEventListener("DOMContentLoaded",()=>loadData(currentView));
</script>
</body>
</html>
