<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Madhusudan Sales Dashboard</title>

  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <!-- ExcelJS + FileSaver for export -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <style>
    /* ---------- BASE TABLE + FILTERS ---------- */
    th, td { padding:4px 6px !important; height:22px !important; font-size:0.85rem; transition:background-color .35s ease; }
    .subtotal-row td, .grandtotal-row td { height:26px !important; font-weight:700; transition:background-color .35s ease; }

    #filtersWrapper { transition:all .35s ease; opacity:1; max-height:600px; overflow:hidden; }
    #filtersWrapper.hidden { opacity:0; max-height:0; overflow:hidden; }

    /* ---------- FILTER BAR (Desktop + Mobile) ---------- */
    #filtersContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 10px;
      background: #fff;
      border-radius: 10px;
      overflow-y: auto;
      overflow-x: hidden;
      justify-content: flex-start;
    }

    .filter-box {
      border: 2px solid #1e3a8a;
      border-radius: 10px;
      padding: 8px 10px;
      min-width: 180px;
      background: #fff;
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
      transition: all 0.25s ease-in-out;
    }

    .filter-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 10px rgba(0,0,0,0.08);
      border-color: #1d4ed8;
    }

    .filter-box label { color:#000; font-weight:600; display:block; padding:3px 0; }
    .filter-box strong {
      color:#1e3a8a; font-weight:800; display:block; margin-bottom:6px;
      text-transform:uppercase; text-align:center; border-bottom:2px solid #e2e8f0;
      padding-bottom:4px;
    }

    /* ---------- DARK MODE ---------- */
    .dark-mode .filter-box { background:#f9fafb; border-color:#1e3a8a; box-shadow:none; }
    .dark-mode .filter-box label, .dark-mode .filter-box strong { color:#000 !important; }

    /* Sticky Header */
    table { border-collapse:collapse; width:100%; }
    thead th { position: sticky; top:0; z-index:50; background: linear-gradient(90deg,#eef2ff,#e0e7ff); }
    .dark-mode thead th { background:#0b1220; color:#cfe8ff; }

    th.sortable { cursor:pointer; }
    th.sortable .sort-icon { margin-left:6px; color:#6b7280; font-size:0.85rem; }

    /* Scrollbar */
    .table-wrapper::-webkit-scrollbar { height:10px; width:10px; }
    .table-wrapper::-webkit-scrollbar-thumb { background: linear-gradient(180deg,#2563eb,#4f46e5); border-radius:8px; }

    /* Colors for positive/negative */
    td.bg-pos { background-color:#d1fae5 !important; }
    td.bg-neg { background-color:#fee2e2 !important; }

    /* Overlay loader */
    .overlay::after {
      content: "Processing...";
      display:inline-block;
      padding:8px 14px;
      border-radius:8px;
      background: rgba(0,0,0,.6);
      color:#fff;
      font-weight:700;
    }

    header .logo { height:40px; }
    header h1 { font-size:1.05rem; font-weight:800; color:#1e40af; margin-left:8px; }
    td.numeric { text-align:center; vertical-align:middle; font-weight:700; color:#000; }

    /* ---------- MOBILE RESPONSIVE ---------- */
    @media(max-width:768px){
      body { font-size: 0.9rem; }
      header { flex-wrap: wrap; }
      .toolbar { flex-wrap: wrap; justify-content: center; gap: 6px; }
      .table-wrapper { max-height: 60vh; overflow-x: auto; }
      table th, table td { font-size: 0.75rem; padding: 3px 4px; }
      .filter-box { width:100%; border-width:1.5px; margin-bottom:10px; }
      #filtersContainer { display:block; padding:8px; }
      #filtersWrapper { max-height:0; overflow:hidden; transition:max-height 0.4s ease; }
      #filtersWrapper.active { max-height:600px; }
      .toolbar button { font-size:0.8rem; padding:6px 10px; border-radius:6px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="container header-row" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;">
      <div style="display:flex;align-items:center">
        <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo" class="logo">
        <h1>SMC Madhusudan Sales Dashboard</h1>
      </div>

      <div class="toolbar" style="display:flex;gap:8px;align-items:center">
        <button id="exportBtn" class="btn btn-blue">Export</button>
        <button id="clearBtn" class="btn btn-gray">Clear Filters</button>
        <button id="toggleFiltersBtn" class="btn btn-gray">Show Filters</button>
        <button id="toggleViewBtn" class="btn btn-blue">Switch to SKU View</button>
        <button id="themeToggle" class="btn btn-gray">Dark Mode</button>
      </div>
    </div>
  </header>

  <main class="container" style="max-width:1500px;margin:12px auto;padding:0 12px;">
    <section>
      <div id="filtersWrapper"><div id="filtersContainer"></div></div>
      <div id="loader" class="loader" style="padding:8px;color:#6b7280">Loading data...</div>
      <div id="overlayLoader" class="overlay hidden" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3000;"></div>
      <div class="table-wrapper" style="margin-top:10px;background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(4,8,15,0.05);overflow:auto;max-height:75vh;">
        <table id="dataTable" class="hidden" style="min-width:1100px;">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
          <tfoot id="tableFoot"></tfoot>
        </table>
      </div>
    </section>
  </main>

  <footer style="text-align:center;padding:12px;margin-top:16px;border-top:1px solid #e5e7eb;background:#f9fafb">
    <p>© {{ current_year }} Created & Hosted by <strong>Amit Sharma</strong></p>
  </footer>

<script>
let currentView = "product";
let fullData = [];
let originalKeys = [];

const baseTextCols = ["STATE","MANAGER_NAME","DISTRICT","PRODUCT","SKU","PARTY_NAME"];
const monthOrder = [
  "APR-23","MAY-23","JUN-23","AVG_Q1_2023-24","JUL-23","AUG-23","SEP-23","AVG_Q2_2023-24",
  "OCT-23","NOV-23","DEC-23","AVG_Q3_2023-24","JAN-24","FEB-24","MAR-24","AVG_Q4_2023-24","AVG_YEAR_2023-24",
  "APR-24","MAY-24","JUN-24","AVG_Q1_2024-25","JUL-24","AUG-24","SEP-24","AVG_Q2_2024-25","OCT-24","NOV-24","DEC-24","AVG_Q3_2024-25",
  "JAN-25","FEB-25","MAR-25","AVG_Q4_2024-25","AVG_YEAR_2024-25","APR-25","MAY-25","JUN-25","AVG_Q1_2025-26","JUL-25","AUG-25","SEP-25","AVG_Q2_2025-26","AVG_YEAR_2025-26"
];

const norm = s => String(s||"").toUpperCase().trim();
const getVal = (r,k) => r?.[k] ?? r?.[k.toLowerCase()] ?? r?.[k.toUpperCase()] ?? "";

/* Overlay */
let __overlayTimer = null;
function showOverlay(delay=150){ clearTimeout(__overlayTimer); __overlayTimer=setTimeout(()=>document.getElementById("overlayLoader").classList.remove("hidden"),delay);}
function hideOverlay(){clearTimeout(__overlayTimer);document.getElementById("overlayLoader").classList.add("hidden");}

/* Debounce + Idle */
function debounce(fn,wait=350){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),wait);};}
function runIdle(fn){if("requestIdleCallback" in window)requestIdleCallback(fn,{timeout:300});else setTimeout(fn,200);}

/* -------------------- Initialization -------------------- */
document.addEventListener("DOMContentLoaded",()=>{
  initUI();
  loadData(currentView);

  // Mobile detection for filter toggle
  if (window.innerWidth <= 768) {
    document.getElementById("filtersWrapper").classList.remove("active");
    document.getElementById("toggleFiltersBtn").textContent = "Show Filters";
  }
});

function initUI(){
  document.getElementById("toggleFiltersBtn").addEventListener("click",toggleFilters);
  document.getElementById("clearBtn").addEventListener("click",()=>{runIdle(clearFilters);});
  document.getElementById("exportBtn").addEventListener("click",()=>{showOverlay(120);runIdle(exportExcel);});
  document.getElementById("toggleViewBtn").addEventListener("click",()=>{
    currentView=currentView==="product"?"sku":"product";
    document.getElementById("toggleViewBtn").textContent=currentView==="product"?"Switch to SKU View":"Switch to Product View";
    loadData(currentView);
  });
  const themeBtn=document.getElementById("themeToggle");
  if(localStorage.getItem("theme")==="dark"){document.documentElement.classList.add("dark-mode");themeBtn.textContent="Light Mode";}
  themeBtn.addEventListener("click",()=>{
    const html=document.documentElement;
    if(html.classList.contains("dark-mode")){html.classList.remove("dark-mode");localStorage.setItem("theme","light");themeBtn.textContent="Dark Mode";}
    else{html.classList.add("dark-mode");localStorage.setItem("theme","dark");themeBtn.textContent="Light Mode";}
  });
}

/* Toggle Filters */
let filtersVisible=true;
function toggleFilters(){
  const wrapper=document.getElementById("filtersWrapper");
  const btn=document.getElementById("toggleFiltersBtn");
  if(window.innerWidth<=768){
    wrapper.classList.toggle("active");
    btn.textContent=wrapper.classList.contains("active")?"Hide Filters":"Show Filters";
  }else{
    if(filtersVisible){wrapper.classList.add("hidden");setTimeout(()=>wrapper.style.display="none",420);btn.textContent="Show Filters";filtersVisible=false;}
    else{wrapper.style.display="";setTimeout(()=>wrapper.classList.remove("hidden"),20);btn.textContent="Hide Filters";filtersVisible=true;}
  }
}

/* Clear Filters */
function clearFilters(){document.querySelectorAll("#filtersContainer input[type=checkbox]").forEach(cb=>cb.checked=false);applyFilters();}

/* -------------------- Build Filters -------------------- */
function buildFilters(){
  const filters=document.getElementById("filtersContainer");
  filters.innerHTML="";
  const headers=originalKeys.map(norm);
  const textCols=baseTextCols.filter(c=>headers.includes(c));
  const order=currentView==="product"
    ?["SHOW COLUMNS","MONTH / YEAR","STATE","MANAGER_NAME","DISTRICT","PRODUCT","PARTY_NAME","COMPARISON","TOTAL"]
    :["SHOW COLUMNS","MONTH / YEAR","STATE","MANAGER_NAME","DISTRICT","PRODUCT","SKU","PARTY_NAME","COMPARISON","TOTAL"];

  const colors=["#fff7ed","#ecfdf5","#e0f2fe","#fdf2f8","#fef3c7","#e0f2fe","#f3e8ff","#fef2f2","#f3f4f6"];
  let ci=0;

  function makeBox(title,vals=[],checkAll=false){
    const box=document.createElement("div");
    box.className="filter-box";
    box.style.background=colors[ci++%colors.length];
    const allId=`all_${title.replace(/\s+/g,"_")}`;
    const shouldCheck=(title!=="MONTH / YEAR"&&checkAll);
    const optionsHtml=vals.map(v=>`<label><input type="checkbox" name="${title}" value="${v}" ${shouldCheck?"checked":""}> ${v}</label>`).join("");
    box.innerHTML=`<strong>${title}</strong>
    <label class="all-label"><input type="checkbox" data-all="${title}" id="${allId}"> All</label>
    <div class="options" style="max-height:220px;overflow:auto;padding-right:6px;">${optionsHtml}</div>`;
    filters.appendChild(box);
  }

  order.forEach(f=>{
    if(f==="SHOW COLUMNS")makeBox(f,textCols,true);
    else if(f==="MONTH / YEAR"||f==="COMPARISON")makeBox(f,monthOrder,false);
    else if(f==="TOTAL")makeBox(f,textCols,false);
    else if(textCols.includes(f)){
      const vals=[...new Set(fullData.map(r=>getVal(r,f)))].filter(Boolean).sort();
      makeBox(f,vals,false);
    }
  });

  filters.querySelectorAll("input[data-all]").forEach(cb=>{
    cb.addEventListener("change",e=>{
      const grp=e.target.dataset.all;
      const checked=e.target.checked;
      filters.querySelectorAll(`input[name='${grp}']`).forEach(i=>i.checked=checked);
      runIdle(applyFilters);
    });
  });

  filters.addEventListener("change",debounce(()=>{showOverlay(150);runIdle(()=>applyFilters());},300));
}

/* -------------------- Load Data -------------------- */
async function loadData(view){
  const loader=document.getElementById("loader");
  loader.classList.remove("hidden");loader.textContent="Loading data...";
  try{
    const res=await fetch(`/get_data/${view}`);
    if(!res.ok)throw new Error("Server returned "+res.status);
    const data=await res.json();
    if(!Array.isArray(data)||!data.length){loader.textContent="No data found";return;}
    fullData=data;
    originalKeys=Object.keys(data[0]||{});
    const avgColsInData=originalKeys.filter(k=>k.toUpperCase().startsWith("AVG_Q"));
    const avgColsSorted=monthOrder.filter(m=>avgColsInData.some(k=>k.toUpperCase()===m.toUpperCase()));
    const last5AvgCols=avgColsSorted.slice(-5);
    localStorage.setItem("default_avg_cols",JSON.stringify(last5AvgCols));
    buildFilters();
    setTimeout(()=>{
      const saved=JSON.parse(localStorage.getItem("savedFilters")||"{}");
      const defaults=JSON.parse(localStorage.getItem("default_avg_cols")||"[]");
      const getInputs=title=>Array.from(document.querySelectorAll(`#filtersContainer input[name='${title}']`));
      const hasAnySelected=Object.values(saved).some(arr=>Array.isArray(arr)&&arr.length>0);
      if(hasAnySelected){
        Object.entries(saved).forEach(([title,values])=>{
          getInputs(title).forEach(cb=>{
            cb.checked=values.some(v=>v.toUpperCase()===cb.value.toUpperCase());
          });
        });
      }else{
        getInputs("MONTH / YEAR").forEach(cb=>{
          cb.checked=defaults.some(v=>v.toUpperCase()===cb.value.toUpperCase());
        });
      }
      applyFilters(false);
    },500);
  }catch(err){console.error("Error loading data:",err);loader.textContent="⚠ Error: "+err.message;}
  finally{setTimeout(()=>loader.classList.add("hidden"),300);}
}

/* -------------------- Apply Filters -------------------- */
function applyFilters(save=true){
  showOverlay(120);
  requestAnimationFrame(()=>{
    try{
      const filters=document.getElementById("filtersContainer");
      const selected={};
      [...filters.querySelectorAll(".filter-box strong")].forEach(h=>{
        const title=h.textContent.trim();
        selected[title]=[...filters.querySelectorAll(`input[name='${title}']:checked`)].map(i=>i.value);
      });
      if(save)localStorage.setItem("savedFilters",JSON.stringify(selected));
      const cascade=currentView==="product"?["STATE","MANAGER_NAME","DISTRICT","PRODUCT","PARTY_NAME"]:["STATE","MANAGER_NAME","DISTRICT","PRODUCT","SKU","PARTY_NAME"];
      let filtered=[...fullData];
      cascade.forEach(f=>{
        const sel=selected[f]||[];
        if(sel.length)filtered=filtered.filter(r=>sel.includes(getVal(r,f)));
      });
      renderTable(filtered,selected);
    }finally{hideOverlay();}
  });
}

/* -------------------- Render Table -------------------- */
function renderTable(filtered,selected){
  const tHead=document.getElementById("tableHead"),tBody=document.getElementById("tableBody"),tFoot=document.getElementById("tableFoot");
  const showCols=(selected["SHOW COLUMNS"]&&selected["SHOW COLUMNS"].length)?selected["SHOW COLUMNS"]:baseTextCols;
  const monthCols=(selected["MONTH / YEAR"]&&selected["MONTH / YEAR"].length)?selected["MONTH / YEAR"]:monthOrder;
  const totalCols=selected["TOTAL"]||[];
  let colsToShow=[...showCols,...monthCols];
  if((selected["COMPARISON"]||[]).length===2)colsToShow.push("COMPARISON");
  const isNumeric=c=>monthOrder.includes(c)||c==="COMPARISON";
  tHead.innerHTML="<tr>"+colsToShow.map(c=>`<th class="${isNumeric(c)?'sortable':''}" data-col="${c}">${c}${isNumeric(c)?'<span class='+"sort-icon"+'>↕️</span>':''}</th>`).join("")+"</tr>";
  tBody.innerHTML=filtered.map(r=>buildRowHtml(r,colsToShow,selected)).join("");
  addSorting(colsToShow);
}

function buildRowHtml(row,colsToShow,selected){
  return "<tr>"+colsToShow.map(c=>{
    if(c==="COMPARISON"){
      const compare=selected["COMPARISON"]||[];
      if(compare.length===2){
        const [a,b]=compare;const diff=(Number(row[b])||0)-(Number(row[a])||0);
        const cls=diff>0?"bg-pos":"bg-neg";return `<td class="numeric ${cls}">${diff}</td>`;
      }return "<td></td>";
    }
    if(monthOrder.includes(c)){
      const num=Number(row[c])||0;return `<td class='numeric'>${num}</td>`;
    }
    return `<td>${row[c]??""}</td>`;
  }).join("")+"</tr>";
}

/* -------------------- Sorting -------------------- */
function addSorting(colsToShow){
  const ths=document.querySelectorAll("th.sortable");
  ths.forEach(th=>{
    th.onclick=()=>{
      const col=th.getAttribute("data-col");
      const rows=Array.from(document.querySelectorAll("#dataTable tbody tr"));
      const asc=!th.classList.contains("asc");
      document.querySelectorAll("th").forEach(t=>t.classList.remove("asc","desc"));
      th.classList.add(asc?"asc":"desc");
      rows.sort((a,b)=>{
        const A=parseFloat(a.querySelectorAll("td")[colsToShow.indexOf(col)]?.innerText)||0;
        const B=parseFloat(b.querySelectorAll("td")[colsToShow.indexOf(col)]?.innerText)||0;
        return asc?A-B:B-A;
      });
      const tbody=document.querySelector("#dataTable tbody");
      rows.forEach(r=>tbody.appendChild(r));
    };
  });
}

/* -------------------- Export Excel -------------------- */
async function exportExcel(){
  try{
    const workbook=new ExcelJS.Workbook();
    const worksheet=workbook.addWorksheet("Dashboard Data");
    const rows=Array.from(document.querySelectorAll("tr")).map(tr=>Array.from(tr.querySelectorAll("th,td")).map(td=>td.innerText.trim()));
    rows.forEach((r,i)=>{
      const row=worksheet.addRow(r);
      if(i===0){row.eachCell(cell=>{cell.font={bold:true,color:{argb:"1E3A8A"}};cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"E0E7FF"}};});}
    });
    worksheet.columns.forEach(col=>col.width=15);
    const buf=await workbook.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    saveAs(blob,`${currentView}_export_${new Date().toISOString().split("T")[0]}.xlsx`);
  }catch(err){alert("Export failed: "+err.message);}finally{hideOverlay();}
}
</script>
</body>
</html>
