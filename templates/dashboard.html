<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>SMC Madhusudan Dashboard</title>
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
  <style>
    :root {
      --blue-50:#eff6ff; --blue-100:#dbeafe;
      --border:#9ca3af; --bg:#f9fafb;
    }
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);}
    header{background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,0.05);}
    header h1{font-weight:700;color:#1e40af;}
    .toolbar{display:flex;flex-wrap:wrap;gap:6px;}
    .btn{padding:.4rem .8rem;border-radius:.4rem;font-weight:600;font-size:.85rem;border:none;cursor:pointer;}
    .btn-blue{background:linear-gradient(90deg,#2563eb,#4f46e5);color:#fff;}
    .btn-gray{background:#f3f4f6;color:#111827;}
    .btn-blue:hover{opacity:.9;}
    .container{max-width:1500px;margin:auto;padding:1rem;}
    .filter-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.75rem;background:white;padding:.75rem;border-radius:.75rem;box-shadow:inset 0 0 5px #e5e7eb;overflow-x:auto;}
    .filter-box{border:2px solid #93c5fd;border-radius:.75rem;padding:6px;background:linear-gradient(180deg,#f0f9ff,#dbeafe);font-size:.8rem;max-height:190px;overflow:auto;}
    .filter-box strong{text-align:center;display:block;color:#1d4ed8;margin-bottom:4px;font-size:.75rem;}
    .filter-box label{display:block;padding:2px 4px;cursor:pointer;border-radius:4px;}
    .filter-box label:hover{background:#bfdbfe;}
    .filter-box input{margin-right:5px;accent-color:#2563eb;}
    .table-wrapper{margin-top:1rem;overflow:auto;background:white;border-radius:.75rem;box-shadow:0 3px 10px rgba(0,0,0,0.05);}
    table{border-collapse:collapse;width:100%;min-width:1200px;}
    th,td{border:2px solid #4b5563;padding:8px;font-weight:700;font-size:.85rem;}
    th{background:linear-gradient(90deg,var(--blue-100),#e0e7ff);position:sticky;top:0;color:#1e3a8a;}
    td.numeric{text-align:center;}
    tfoot td{background:#f3f4f6;font-weight:800;text-align:center;}
    .loader{text-align:center;padding:1rem;color:#6b7280;}
    .hidden{display:none!important;}
    @media(max-width:900px){
      .filter-box{max-height:150px;font-size:.75rem;}
      th,td{font-size:.78rem;padding:6px;}
    }
  </style>
</head>
<body>
  <header>
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="{{ url_for('static', filename='onlylogo.png') }}" style="height:38px;">
        <h1>SMC Madhusudan Dashboard</h1>
      </div>
      <div class="toolbar">
        <button id="exportBtn" class="btn btn-blue">⬇ Export</button>
        <button id="clearBtn" class="btn btn-gray">🧹 Clear</button>
        <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
        <button id="toggleViewBtn" class="btn btn-blue">Switch to SKU View</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section style="background:white;border-radius:.75rem;padding:1rem;box-shadow:0 2px 6px rgba(0,0,0,.05);">
      <div id="filtersContainer" class="filter-bar"></div>
      <div id="loader" class="loader">Loading data...</div>
      <div class="table-wrapper">
        <table id="dataTable" class="hidden">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
          <tfoot id="tableFoot"></tfoot>
        </table>
      </div>
    </section>
  </main>

<script>
let currentView="product";
let fullData=[];let originalKeys=[];

const baseTextCols=["STATE","MANAGER_NAME","DISTRICT","PRODUCT","SKU","PARTY_NAME"];
const monthOrder=[
"APR-23","MAY-23","JUN-23","AVG_Q1_2023-24","JUL-23","AUG-23","SEP-23","AVG_Q2_2023-24",
"OCT-23","NOV-23","DEC-23","AVG_Q3_2023-24","JAN-24","FEB-24","MAR-24","AVG_Q4_2023-24","AVG_YEAR_2023-24",
"APR-24","MAY-24","JUN-24","AVG_Q1_2024-25","JUL-24","AUG-24","SEP-24","AVG_Q2_2024-25","OCT-24","NOV-24","DEC-24","AVG_Q3_2024-25",
"JAN-25","FEB-25","MAR-25","AVG_Q4_2024-25","AVG_YEAR_2024-25","APR-25","MAY-25","JUN-25","AVG_Q1_2025-26",
"JUL-25","AUG-25","SEP-25","AVG_Q2_2025-26","AVG_YEAR_2025-26"
];
const norm=s=>String(s||"").toUpperCase().trim();
const getVal=(r,k)=>r[k]??r[k.toLowerCase()]??r[k.toUpperCase()]??"";

document.addEventListener("DOMContentLoaded",()=>loadData(currentView));
async function loadData(view){
 const loader=document.getElementById("loader");loader.classList.remove("hidden");loader.textContent="Loading data...";
 try{
  const res=await fetch(`/get_data/${view}`);if(!res.ok){loader.textContent="⚠ Error loading data";return;}
  const data=await res.json();if(!Array.isArray(data)||!data.length){loader.textContent="No data";return;}
  fullData=data;originalKeys=Object.keys(data[0]);
  buildFilters();applyFilters();loader.classList.add("hidden");
 }catch(e){loader.textContent="⚠ Failed to load";}
}

function buildFilters(){
 const filters=document.getElementById("filtersContainer");filters.innerHTML="";
 const headers=originalKeys.map(norm);
 const textCols=baseTextCols.filter(c=>headers.includes(c));
 const numCols=originalKeys.filter(k=>!textCols.includes(norm(k)));
 const orderMap={};monthOrder.forEach((m,i)=>orderMap[m]=i);
 const orderedNums=[...numCols].sort((a,b)=>(orderMap[norm(a)]??999)-(orderMap[norm(b)]??999));

 // Filter order dynamic
 const order=currentView==="product"
 ?["STATE","MANAGER_NAME","DISTRICT","PRODUCT","PARTY_NAME","SHOW COLUMNS","MONTH / YEAR","COMPARISON","TOTAL"]
 :["STATE","MANAGER_NAME","DISTRICT","PRODUCT","SKU","PARTY_NAME","SHOW COLUMNS","MONTH / YEAR","COMPARISON","TOTAL"];

 function makeBox(title,vals,checkedAll,color){
  const box=document.createElement("div");box.className="filter-box";box.style.background=color;
  box.innerHTML=`<strong>${title}</strong><label><input type="checkbox" data-all="${title}">All</label>`+
  vals.map(v=>`<label><input type="checkbox" name="${title}" value="${v}" ${checkedAll?'checked':''}>${v}</label>`).join("");
  filters.appendChild(box);
 }

 const colors=["#e0f7fa","#ede9fe","#fef9c3","#fce7f3","#dcfce7","#e0f2fe","#fffbe6","#eef2ff","#fff0f6"];

 order.forEach((f,i)=>{
  if(f==="SHOW COLUMNS") makeBox(f,textCols,true,colors[i%colors.length]);
  else if(f==="MONTH / YEAR"||f==="COMPARISON") makeBox(f,monthOrder,true,colors[i%colors.length]);
  else if(f==="TOTAL") makeBox(f,textCols,false,colors[i%colors.length]);
  else if(textCols.includes(f)) {
    const vals=[...new Set(fullData.map(r=>getVal(r,f)))].filter(Boolean).sort();
    makeBox(f,vals,false,colors[i%colors.length]);
  }
 });

 // "All" toggles
 filters.querySelectorAll("input[data-all]").forEach(cb=>{
  cb.addEventListener("change",e=>{
    const group=e.target.getAttribute("data-all");
    const boxes=filters.querySelectorAll(`input[name='${group}']`);
    boxes.forEach(x=>x.checked=e.target.checked);
    applyFilters();
  });
 });
 filters.addEventListener("change",()=>applyFilters());
 document.getElementById("toggleFiltersBtn").onclick=()=>{
  filters.classList.toggle("hidden");
  document.getElementById("toggleFiltersBtn").textContent=filters.classList.contains("hidden")?"Show Filters":"Hide Filters";
 };
 document.getElementById("clearBtn").onclick=()=>{
  filters.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.checked=false);
  applyFilters();
 };
 document.getElementById("exportBtn").onclick=()=>exportCSV();
 document.getElementById("toggleViewBtn").onclick=()=>{
  currentView=currentView==="product"?"sku":"product";
  document.getElementById("toggleViewBtn").textContent=currentView==="product"?"Switch to SKU View":"Switch to Product View";
  loadData(currentView);
 };
}

function applyFilters(){
 const tHead=document.getElementById("tableHead"),tBody=document.getElementById("tableBody"),tFoot=document.getElementById("tableFoot");
 if(!fullData.length) return;
 const filters=document.getElementById("filtersContainer");
 const allInputs=[...filters.querySelectorAll(".filter-box strong")].map(e=>e.textContent);
 const selected={};
 allInputs.forEach(f=>{
  selected[f]=[...filters.querySelectorAll(`input[name='${f}']:checked`)].map(i=>i.value);
 });
 let filtered=[...fullData];
 // Cascade order dynamic
 const cascade=currentView==="product"?["STATE","MANAGER_NAME","DISTRICT","PRODUCT","PARTY_NAME"]:["STATE","MANAGER_NAME","DISTRICT","PRODUCT","SKU","PARTY_NAME"];
 cascade.forEach(f=>{
  const sel=selected[f]||[];
  if(sel.length) filtered=filtered.filter(r=>sel.includes(getVal(r,f)));
 });

 // Columns visible
 const showCols=selected["SHOW COLUMNS"]?.length?selected["SHOW COLUMNS"]:baseTextCols;
 const monthCols=selected["MONTH / YEAR"]?.length?selected["MONTH / YEAR"]:monthOrder;
 const colsToShow=[...showCols,...monthCols];
 if((selected["COMPARISON"]||[]).length===2) colsToShow.push("COMPARISON");
 tHead.innerHTML="<tr>"+colsToShow.map(c=>`<th>${c}</th>`).join("")+"</tr>";

 tBody.innerHTML="";
 filtered.forEach(r=>{
  const cells=colsToShow.map((c,i)=>{
    if(c==="COMPARISON"){
      const [a,b]=selected["COMPARISON"];
      const diff=(Number(getVal(r,b))||0)-(Number(getVal(r,a))||0);
      const color=diff>0?"color:green":diff<0?"color:red":"";
      return `<td class="numeric" style="${color}">${diff}</td>`;
    }
    const val=getVal(r,c);
    if(monthOrder.includes(c)){const v=Number(val)||0;return `<td class="numeric">${v}</td>`;}
    return `<td>${val}</td>`;
  });
  tBody.innerHTML+=`<tr>${cells.join("")}</tr>`;
 });

 // Grouped totals
 const totalBy=selected["TOTAL"]||[];
 if(totalBy.length){
  const groupKeys=totalBy;
  const groups={};
  filtered.forEach(r=>{
    const key=groupKeys.map(g=>getVal(r,g)).join("|");
    groups[key]=groups[key]||[];
    groups[key].push(r);
  });
  tFoot.innerHTML="";
  Object.entries(groups).forEach(([gKey,rows])=>{
    const totals={};
    monthOrder.forEach(m=>totals[m]=rows.reduce((a,b)=>a+(Number(getVal(b,m))||0),0));
    const totalCells=colsToShow.map(c=>{
      if(monthOrder.includes(c)) return `<td>${totals[c]||0}</td>`;
      if(groupKeys.includes(c)) return `<td>TOTAL ${gKey.split("|")[groupKeys.indexOf(c)]||""}</td>`;
      return `<td></td>`;
    });
    tFoot.innerHTML+=`<tr>${totalCells.join("")}</tr>`;
  });
 } else tFoot.innerHTML="";
 document.getElementById("dataTable").classList.remove("hidden");
}

function exportCSV(){
 const rows=[...document.querySelectorAll("table tr")].map(r=>[...r.children].map(td=>`"${td.innerText.replace(/"/g,'""')}"`).join(","));
 const csv=rows.join("\n");
 const blob=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download=`${currentView}_export.csv`;a.click();
}
</script>
</body>
</html>
