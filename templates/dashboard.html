<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Madhusudan Dashboard</title>
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <style>
    body { font-family: Inter, sans-serif; }
    th { background-color: #f3f4f6; position: sticky; top: 0; z-index: 10; }
    td { transition: background-color 0.25s ease; }
    select[multiple] { height: 6rem; }
    .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; transition: 0.2s; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-blue:hover { background: #2563eb; }
    .btn-gray { background: #f3f4f6; color: #111827; }
    .btn-gray:hover { background: #e5e7eb; }
    .hidden { display: none; }
    .table-wrapper { max-height: 75vh; overflow: auto; border-radius: 0.75rem; }
  </style>
</head>

<body class="bg-gray-50 text-gray-900">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img src="{{ url_for('static', filename='onlylogo.png') }}" class="h-10 w-auto" alt="logo">
        <h1 class="text-xl font-bold text-indigo-700">SMC MADHUSUDAN DASHBOARD</h1>
      </div>
      <div class="flex gap-2">
        <button id="exportBtn" class="btn btn-blue">⬇ Export CSV</button>
        <button id="clearFiltersBtn" class="btn btn-gray">🧹 Clear All</button>
        <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
        <button id="toggleViewBtn" class="btn btn-blue">Switch to SKU View</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    <section class="bg-white p-6 rounded-xl shadow">
      <div id="filtersContainer" class="flex flex-wrap gap-4 mb-4"></div>
      <div id="loader" class="text-center py-4 text-gray-500">Loading data...</div>

      <div class="table-wrapper mt-2">
        <table id="dataTable" class="min-w-full divide-y divide-gray-200 hidden">
          <thead id="tableHead" class="bg-gray-100"></thead>
          <tbody id="tableBody" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="mt-10 bg-gray-100 py-4 text-center text-xs text-gray-500">
    © {{ current_year }} SMC Madhusudan | All Rights Reserved
  </footer>

<script>
let currentView = "product";
const baseTextCols = ["STATE","MANAGER_NAME","DISTRICT","PARTY_NAME","PRODUCT","SKU"];

async function loadData(view="product"){
  const res = await fetch(`/get_data/${view}`);
  const data = await res.json();
  const loader=document.getElementById("loader"),
        filters=document.getElementById("filtersContainer"),
        table=document.getElementById("dataTable"),
        thead=document.getElementById("tableHead"),
        tbody=document.getElementById("tableBody");

  if(!data||data.error){loader.textContent="⚠️ Error loading data.";return;}
  if(!data.length){loader.textContent="No data found.";return;}

  loader.classList.add("hidden");
  table.classList.remove("hidden");

  // Capitalize headers
  const headers = Object.keys(data[0]).map(h=>h.toUpperCase());
  const textCols = baseTextCols.filter(c=>headers.includes(c));
  const numericCols = headers.filter(h=>!textCols.includes(h));

  const orderedHeaders = [...textCols, ...numericCols];

  thead.innerHTML = `<tr>${orderedHeaders.map(h=>`
    <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700 whitespace-nowrap">${h}</th>`).join("")}</tr>`;

  // Filters UI
  filters.innerHTML = "";
  textCols.forEach(col=>{
    const uniqueVals=[...new Set(data.map(d=>d[col.toLowerCase()]))].filter(Boolean).sort();
    filters.innerHTML += `
      <div>
        <label class="block text-sm font-medium text-gray-700">${col}</label>
        <select multiple id="filter_${col}" class="border border-gray-300 rounded-md p-2 text-sm w-44 h-24">
          ${uniqueVals.map(v=>`<option value="${v}">${v}</option>`).join("")}
        </select>
      </div>`;
  });

  filters.innerHTML += `
    <div>
      <label class="block text-sm font-medium text-gray-700">DATE / AVG COLUMNS</label>
      <select multiple id="filterCols" class="border border-gray-300 rounded-md p-2 text-sm w-56 h-24">
        ${numericCols.map(c=>`<option value="${c}">${c}</option>`).join("")}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">GROUP BY</label>
      <select id="groupBy" class="border border-gray-300 rounded-md p-2 text-sm w-44">
        <option value="">None</option>
        ${textCols.map(c=>`<option value="${c}">${c}</option>`).join("")}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">COMPARISON (2)</label>
      <select multiple id="compareCols" class="border border-gray-300 rounded-md p-2 text-sm w-56 h-24">
        ${numericCols.map(c=>`<option value="${c}">${c}</option>`).join("")}
      </select>
    </div>`;

  // Cascade filters
  textCols.forEach((col,i)=>{
    const el=document.getElementById(`filter_${col}`);
    if(i>0){
      const parent=document.getElementById(`filter_${textCols[i-1]}`);
      parent.addEventListener("change",()=>{
        const selected=Array.from(parent.selectedOptions).map(o=>o.value);
        const subset=data.filter(r=>selected.includes(r[textCols[i-1].toLowerCase()]));
        const vals=[...new Set(subset.map(r=>r[col.toLowerCase()]))].filter(Boolean);
        el.innerHTML=vals.map(v=>`<option value="${v}">${v}</option>`).join("");
      });
    }
  });

  function render(rows, cols=orderedHeaders){
    tbody.innerHTML=rows.map(r=>{
      return `<tr>${cols.map((h,idx)=>{
        const key=h.toLowerCase(); let val=r[key]; let style="";
        if(numericCols.includes(h)){
          val=Number(val)||0;
          const prev=(idx>0&&numericCols.includes(cols[idx-1]))?Number(r[cols[idx-1].toLowerCase()]):val;
          style=(val>prev?"color:green":val<prev?"color:red":"");
        }
        if(h==="COMPARISON"){const v=Number(val)||0;style=(v>0?"color:green":"color:red");}
        return `<td class="px-4 py-2 text-sm whitespace-nowrap" style="${style}">${val}</td>`;
      }).join("")}</tr>`;
    }).join("");
  }

  function applyFilters(){
    let filtered=[...data];
    textCols.forEach(c=>{
      const vals=Array.from(document.getElementById(`filter_${c}`).selectedOptions).map(o=>o.value);
      if(vals.length) filtered=filtered.filter(r=>vals.includes(r[c.toLowerCase()]));
    });

    const g=document.getElementById("groupBy").value;
    if(g){
      const grouped={};
      filtered.forEach(r=>{
        const key=r[g.toLowerCase()]||"Unknown";
        if(!grouped[key]) grouped[key]={};
        numericCols.forEach(n=>grouped[key][n]=(grouped[key][n]||0)+Number(r[n.toLowerCase()]||0));
        textCols.forEach(t=>grouped[key][t]=key);
      });
      filtered=Object.values(grouped);
    }

    const comp=Array.from(document.getElementById("compareCols").selectedOptions).map(o=>o.value);
    if(comp.length===2){
      const [a,b]=comp;
      filtered=filtered.map(r=>{
        const diff=(Number(r[b.toLowerCase()])||0)-(Number(r[a.toLowerCase()])||0);
        return {...r,comparison:diff};
      });
      if(!orderedHeaders.includes("COMPARISON")) orderedHeaders.push("COMPARISON");
    }

    const colsSel=Array.from(document.getElementById("filterCols").selectedOptions).map(o=>o.value);
    const colsToShow=colsSel.length?[...textCols,...colsSel,...(orderedHeaders.includes("COMPARISON")?["COMPARISON"]:[])]:orderedHeaders;

    thead.innerHTML=`<tr>${colsToShow.map(h=>`<th class="px-4 py-2 text-left text-sm font-semibold">${h}</th>`).join("")}</tr>`;
    render(filtered,colsToShow);
  }

  // Export CSV
  document.getElementById("exportBtn").onclick=function(){
    const rows=Array.from(tbody.querySelectorAll("tr")).map(tr=>Array.from(tr.querySelectorAll("td")).map(td=>td.textContent));
    const csv=[orderedHeaders.join(","),...rows.map(r=>r.join(","))].join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`${currentView}_export.csv`;
    a.click();
  };

  // Clear filters
  document.getElementById("clearFiltersBtn").onclick=function(){
    document.querySelectorAll("#filtersContainer select").forEach(s=>s.selectedIndex=-1);
    applyFilters();
  };

  // Toggle filters
  const toggleBtn=document.getElementById("toggleFiltersBtn");
  toggleBtn.onclick=()=>{
    const vis=!filters.classList.contains("hidden");
    if(vis){filters.classList.add("hidden");toggleBtn.textContent="Show Filters";}
    else{filters.classList.remove("hidden");toggleBtn.textContent="Hide Filters";}
  };

  filters.addEventListener("change",applyFilters);
  applyFilters();
}

document.getElementById("toggleViewBtn").addEventListener("click",function(){
  currentView=currentView==="product"?"sku":"product";
  this.textContent=currentView==="product"?"Switch to SKU View":"Switch to Product View";
  loadData(currentView);
});

document.addEventListener("DOMContentLoaded",()=>loadData(currentView));
</script>
</body>
</html>
