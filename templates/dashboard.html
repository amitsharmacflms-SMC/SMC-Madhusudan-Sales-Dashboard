<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC - Madhusudan Sales Dashboard</title>

  <!-- Tailwind / app CSS (keep your output.css) -->
  <link rel="preload" href="{{ url_for('static', filename='css/output.css') }}" as="style" importance="high">
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
  <!-- Optimized local CSS for dashboard (critical + helpers) -->
  

  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <!-- Defer heavy libs so they don't block first paint -->
  <script defer src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <!-- Minimal critical styles kept inline to improve first paint -->
  <style>
    /* Very small critical CSS; full styles live in dashboard.css */
    :root{--navy:#1e3a8a;--green:#d1fae5;--red:#fee2e2}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    .hidden{display:none}
    .skeleton{height:200px;border-radius:8px;background:linear-gradient(90deg,#f3f4f6,#e2e8f0,#f3f4f6);background-size:200% 100%;animation:pulse 1.6s infinite}
    @keyframes pulse{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
</head>

<body>
<!-- helps LCP: tiny placeholder so page paints quickly -->
<div id="instantPaint" style="height:1px;overflow:hidden"></div>



  <header>
    <div class="container header-row" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;">
      <div style="display:flex;align-items:center">
        <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo" class="logo" style="height:40px;" width="40" height="40">
        <h1 style="font-size:1.05rem;margin-left:8px;color:var(--navy)">SMC Madhusudan Sales Dashboard</h1>
      </div>

      <div class="toolbar" style="display:flex;gap:8px;align-items:center">
        
        <button id="clearBtn" class="btn btn-gray">Clear All Filters</button>
        <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
        <button id="toggleViewBtn" class="btn btn-blue">Switch to SKU View</button>
        <button id="themeToggle" class="btn btn-gray">Dark Mode</button>
        <button id="backBtn" class="btn btn-gray">← Back</button>
        <button id="exportBtn" class="btn btn-blue">Export</button>        
        
      </div>
    </div>
  </header>

  <main class="container" style="max-width:1500px;margin:12px auto;padding:0 12px;">
    <section>
      <div id="filtersWrapper"><div id="filtersContainer" class="filter-bar" style="display:flex;gap:12px;padding:10px;background:#fff;border-radius:10px;overflow-x:auto;"></div></div>

      <div id="loader" class="loader" style="padding:8px;color:#6b7280">Loading data...</div>
      <div id="overlayLoader" class="overlay hidden" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3000"></div>

      <!-- skeleton until table renders -->
      <div class="table-wrapper" style="margin-top:10px;">
        <table id="dataTable" class="hidden" role="table" aria-label="data table" style="min-width:1100px;">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
          <tfoot id="tableFoot"></tfoot>
        </table>
      </div>
    </section>
  </main>

  <footer style="text-align:center;padding:12px;margin-top:16px;border-top:1px solid #e5e7eb;background:#f9fafb">
    <p>© {{ current_year }} Created & Hosted by <strong>Amit Sharma</strong></p>
  </footer>

  <!-- Dashboard logic (deferred, placed at bottom) -->
  <!-- Dashboard Script (load last) -->
  <script defer src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>
</html>
