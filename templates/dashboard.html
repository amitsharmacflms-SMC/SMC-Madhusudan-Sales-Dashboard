<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC - Madhusudan Sales Dashboard</title>

  <!-- Preconnect + Preload improves LCP -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload"
        href="{{ url_for('static', filename='css/output.css') }}"
        as="style" importance="high" fetchpriority="high">

  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">

  <style>
    /* ===========================================================
       Critical CSS (tiny) — prevents CLS & paints first frame fast
       Full styling lives in output.css
    ============================================================ */

    :root {
      --navy:#1e3a8a;
      --pos:#d1fae5;
      --neg:#fee2e2;
    }

    body {
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background:#fff;
      color:#111;
    }

    /* Centered header + reserved space = no CLS */
    header {
      padding:10px 0;
      box-sizing:border-box;
      width:100%;
    }

    .header-center {
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      gap:10px;
    }

    .logo {
      width:60px;
      height:60px;
      object-fit:contain;
    }

    h1 {
      font-size:1.35rem;
      color:var(--navy);
      font-weight:800;
      margin:0;
      text-align:center;
      line-height:1;
    }

    /* Right-aligned toolbar */
    .toolbar {
      display:flex;
      justify-content:flex-end;
      width:100%;
      gap:8px;
      flex-wrap:wrap;
      padding:6px 12px 0 12px;
      box-sizing:border-box;
    }

    .btn {
      padding:6px 10px;
      border-radius:6px;
      background:#f3f4f6;
      border:1px solid #cbd5e1;
      cursor:pointer;
      font-weight:600;
    }

    .btn-blue {
      background:#1e3a8a;
      color:#fff;
      border:none;
    }

    .container {
      max-width:1500px;
      margin:0 auto;
      padding:0 12px;
      box-sizing:border-box;
    }

    /* Loader and skeleton */
    .skeleton {
      height:340px;
      background:linear-gradient(90deg,#f3f4f6,#e2e8f0,#f3f4f6);
      background-size:200% 100%;
      animation:pulse 1.6s infinite;
      border-radius:8px;
    }

    @keyframes pulse {
      0%{background-position:200% 0}
      100%{background-position:-200% 0}
    }

    .hidden { display:none !important; }

    /* Table: sticky headers + bold gridlines */
    table {
      border-collapse:collapse;
      width:100%;
    }

    thead th {
      position:sticky;
      top:0;
      background:linear-gradient(90deg,#eef2ff,#e0e7ff);
      font-size:0.8rem;
      text-align:center;
      font-weight:800;
      padding:6px;
      border:1px solid #94a3b8;
      z-index:20;
    }

    tbody td {
      padding:6px 8px;
      font-size:0.82rem;
      font-weight:700;
      border:1px solid #cbd5e1;
      text-align:center;
    }

    .subtotal-row td, .grandtotal-row td {
      border-top:2px solid #1e3a8a !important;
      border-bottom:2px solid #1e3a8a !important;
      background:#f1f5f9;
      font-weight:800;
    }

    .bg-pos { background:var(--pos) !important; }
    .bg-neg { background:var(--neg) !important; }

    footer {
      padding:12px;
      background:#f9fafb;
      text-align:center;
      border-top:1px solid #e2e8f0;
    }
  </style>

  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}">
</head>

<body>
  <!-- Prevent layout jump -->
  <div id="instantPaint" style="height:1px;overflow:hidden"></div>

  <header>
    <div class="container header-center">
        <img src="{{ url_for('static', filename='onlylogo.png') }}"
             class="logo" width="60" height="60" fetchpriority="high">
        <h1>SMC Madhusudan Sales Dashboard</h1>
    </div>

    <div class="toolbar">
      <button id="backBtn" class="btn">← Back</button>
      <button id="clearBtn" class="btn">Clear Filters</button>
      <button id="toggleFiltersBtn" class="btn">Hide Filters</button>
      <button id="toggleViewBtn" class="btn btn-blue">Switch to SKU View</button>
      <button id="themeToggle" class="btn">Dark Mode</button>
      <button id="exportBtn" class="btn btn-blue">Export</button>
    </div>
  </header>

  <main class="container">
    <section>
      <div id="filtersWrapper" style="transition:all .25s ease;overflow:hidden;">
        <div id="filtersContainer"
             style="display:flex;gap:12px;padding:10px;background:#fff;border-radius:10px;overflow-x:auto;border:1px solid #cbd5e1;">
        </div>
      </div>

      <div id="loader" style="padding:8px;color:#6b7280;visibility:hidden;">Loading data...</div>
      <div id="overlayLoader" class="hidden"
           style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3000;">
      </div>

      <div class="table-wrapper"
           style="background:#fff;border-radius:10px;padding:10px;box-shadow:0 6px 18px rgba(4,8,15,0.05);">
        <div id="tableSkeleton" class="skeleton"></div>

        <div id="tableContainer" class="hidden">
          <table id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
            <tfoot id="tableFoot"></tfoot>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer>
    © {{ current_year }} Created & Hosted by <b>Amit Sharma</b>
  </footer>

  <!-- Libraries -->
  <script defer src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <!-- Dashboard JS -->
  <script defer src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

  <script>
    /* Reveal table once dashboard.js loads */
    window.__dashboardReveal = function() {
      document.getElementById("tableSkeleton")?.classList.add("hidden");
      document.getElementById("tableContainer")?.classList.remove("hidden");

      const loader = document.getElementById("loader");
      if(loader) loader.style.visibility = "hidden";

      const inst = document.getElementById("instantPaint");
      if(inst) inst.remove();
    };
  </script>
</body>
</html>
