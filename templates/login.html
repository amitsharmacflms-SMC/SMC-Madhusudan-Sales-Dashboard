<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login - SMC Madhusudan Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md bg-white p-8 rounded shadow">
      <h1 class="text-2xl font-bold mb-4">SMC Madhusudan Dashboard</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div>
            {% for cat, msg in messages %}
              <div class="p-2 mb-2 rounded {{ 'bg-green-100 text-green-800' if cat=='success' else 'bg-red-100 text-red-800' }}">{{ msg }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('login') }}" method="post" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">User ID</label>
          <input name="user_id" required class="w-full mt-1 border rounded p-2" />
        </div>
        <div>
          <label class="block text-sm font-medium">Password</label>
          <input type="password" name="password" required class="w-full mt-1 border rounded p-2" />
        </div>
        <button class="w-full bg-blue-600 text-white p-2 rounded">Login</button>
      </form>

      <p class="text-xs text-gray-500 mt-4">© {{ current_year }} SMC Madhusudan | All Rights Reserved</p>
    </div>
  </div>
</body>
</html>
