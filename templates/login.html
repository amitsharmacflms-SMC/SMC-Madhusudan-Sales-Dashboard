<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMC Madhusudan Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-blue-300 flex items-center justify-center min-h-screen">

  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-sm text-center">
    <!-- Logo -->
    <div class="flex justify-center mb-4">
      <img src="/static/logo.png" alt="SMC Logo" class="h-14">
    </div>

    <h2 class="text-2xl font-semibold text-gray-800 mb-1">Welcome Back</h2>
    <p class="text-gray-500 mb-6">Please log in to continue</p>

    <!-- Error message -->
    {% if error %}
      <div class="bg-red-100 text-red-600 px-3 py-2 rounded mb-4 text-sm">
        {{ error }}
      </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" class="space-y-4">
      <div class="text-left">
        <label class="block text-gray-700 font-medium mb-1" for="username">Username</label>
        <input type="text" id="username" name="username" required
               class="w-full border border-gray-300 px-3 py-2 rounded-lg focus:ring focus:ring-blue-200 focus:outline-none">
      </div>

      <div class="text-left">
        <label class="block text-gray-700 font-medium mb-1" for="password">Password</label>
        <input type="password" id="password" name="password" required
               class="w-full border border-gray-300 px-3 py-2 rounded-lg focus:ring focus:ring-blue-200 focus:outline-none">
      </div>

      <button type="submit"
              class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition duration-200">
        Login
      </button>
    </form>

    <!-- Footer -->
    <footer class="text-gray-500 text-xs mt-6">
      © {{ current_year }} SMC Madhusudan | All Rights Reserved
    </footer>
  </div>

</body>
</html>
