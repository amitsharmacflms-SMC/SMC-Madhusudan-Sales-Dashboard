{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-semibold text-gray-700 mb-4">Sign in</h2>
  <form action="{{ url_for('login') }}" method="post" class="space-y-4">
    <div>
      <label class="block text-sm text-gray-600 mb-1">User ID</label>
      <input name="user_id" required class="w-full px-3 py-2 border rounded" placeholder="Enter your User ID">
    </div>
    <div>
      <label class="block text-sm text-gray-600 mb-1">Password</label>
      <input type="password" name="password" required class="w-full px-3 py-2 border rounded" placeholder="Enter your Password">
    </div>
    <button class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Login</button>
  </form>
</div>
{% endblock %}
