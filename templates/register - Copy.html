{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-semibold mb-4">Create Account</h2>
  <form action="{{ url_for('register') }}" method="post" class="grid grid-cols-1 gap-3">
    <input name="user_id" placeholder="User ID" required class="px-3 py-2 border rounded">
    <input type="password" name="password" placeholder="Password" required class="px-3 py-2 border rounded">
    <select name="role" class="px-3 py-2 border rounded">
      <option>User</option>
      <option>Admin</option>
    </select>
    <input name="state" placeholder="State" class="px-3 py-2 border rounded">
    <input name="manager_name" placeholder="Manager Name" class="px-3 py-2 border rounded">
    <input name="district" placeholder="District" class="px-3 py-2 border rounded">
    <button class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Create Account</button>
  </form>
</div>
{% endblock %}
