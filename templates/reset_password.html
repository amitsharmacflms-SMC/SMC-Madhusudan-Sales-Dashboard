<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Reset Password</title></head>
<body class="flex items-center justify-center h-screen bg-gray-100">
  <form method="POST" class="bg-white p-6 rounded shadow-md w-96">
    <h2 class="text-xl mb-4 text-center">Reset Password</h2>
    <p class="text-gray-600 text-center mb-2">For: {{ email }}</p>
    <input type="password" name="password" placeholder="New password" class="w-full border p-2 rounded mb-3" required>
    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded">Reset</button>
  </form>
</body>
</html>
