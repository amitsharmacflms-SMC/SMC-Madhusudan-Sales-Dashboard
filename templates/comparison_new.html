<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMC - Plant to Depot Sales Dashboard</title>
<link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

<!-- external libs -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>
:root{
  --navy:#1e3a8a;
  --accent1:#2563eb;
  --accent2:#4f46e5;
  --up-bg:rgba(220,252,231,0.9);
  --down-bg:rgba(254,226,226,0.9);
  --subtotal-bg:rgba(255,247,204,0.55);
  --state-bg:rgba(230,246,255,0.55);
  --grand-bg:rgba(186,230,253,0.6);
  --thead-top:200px;
}

/* basics */
*{box-sizing:border-box;}
body{font-family:Inter,system-ui,Arial;margin:0;background:#f6f9fc;color:#0f172a;}

/* header */
header{display:flex;align-items:center;justify-content:center;gap:16px;
  padding:14px 16px;background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#fff;position:sticky;top:0;z-index:1400;}
header img{height:56px;}
header h1{margin:0;font-weight:900;font-size:1.35rem;}

/* toolbar */
.toolbar{display:flex;justify-content:center;gap:10px;padding:8px;background:#fff;
  position:sticky;top:64px;z-index:1350;align-items:center;}
.btn{border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:800;}
.btn-blue{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;}
.btn-gray{background:#eef2ff;color:var(--navy);}

/* filters */
#filtersWrapper{display:flex;justify-content:center;background:#f8fafc;
  border-bottom:1px solid #dbeafe;position:sticky;top:calc(64px + 48px);z-index:1320;}
.filters{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding:12px;
  max-width:1500px;width:100%;}
.filter-box{background:#fff;border-radius:12px;padding:10px 12px;
  border:2px solid #c7d2fe;min-width:160px;}
.filter-box label{display:block;font-weight:800;color:var(--navy);margin-bottom:6px;}
.filter-box select{width:200px;padding:6px;border-radius:8px;border:1.5px solid #c7d2fe;
  background:#fff;font-weight:700;height:120px;}
select option:disabled{color:#999;background:#f3f4f6;}

/* table */
.table-wrapper{max-width:1500px;margin:18px auto;border-radius:8px;overflow:auto;
  background:#fff;box-shadow:0 6px 18px rgba(4,8,15,0.06);height:calc(100vh - 260px);}
table{border-collapse:collapse;width:100%;min-width:1100px;}
thead th, tbody td{text-align:center;padding:6px 8px;border:2px solid #2d3748;
  font-weight:700;vertical-align:middle;}
thead th{position:sticky;top:var(--thead-top);
  background:linear-gradient(90deg,#e0e7ff,#c7d2fe);color:var(--navy);z-index:1310;}
tbody tr:nth-child(odd){background:#ffffff;}
tbody tr:nth-child(even){background:#f9fafb;}
tr.subtotal-row td{background:var(--subtotal-bg);font-weight:900;}
tr.state-total-row td{background:var(--state-bg);font-weight:900;}
tr.grandtotal-row td{background:var(--grand-bg);font-weight:900;}
tr.state-total-row td:first-child{border-top:3px solid var(--navy);}
tr.subtotal-row td:first-child{border-top:2px solid var(--navy);}
tbody td{height:34px;}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.75);z-index:3000;font-weight:900;color:var(--navy);}
.overlay.show{display:flex;}
</style>
</head>
<body>
<header>
  <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo">
  <h1>SMC - Plant to Depot Sales Dashboard</h1>
</header>

<div class="toolbar">
  <a href="/dashboard/plant"><button class="btn btn-gray">← Back to Plant</button></a>
  <button id="exportBtn" class="btn btn-blue">Export</button>
  <button id="clearBtn" class="btn btn-gray">Clear</button>
  <button id="toggleFiltersBtn" class="btn btn-blue">Hide Filters</button>
</div>

<div id="filtersWrapper">
  <div class="filters" id="filtersRow">
    <div class="filter-box">
      <label>Show Columns</label>
      <select id="showColumns" multiple>
        <option value="State" selected>State</option>
        <option value="Party_Name" selected>Party_Name</option>
        <option value="Item_Name" selected>Item_Name</option>
      </select>
    </div>
    <div class="filter-box"><label>State</label><select id="stateFilter" multiple></select></div>
    <div class="filter-box"><label>Party Name</label><select id="partyFilter" multiple></select></div>
    <div class="filter-box"><label>Item Name</label><select id="itemFilter" multiple></select></div>
    <div class="filter-box"><label>Month_Name</label><select id="monthFilter" multiple></select></div>
    <div class="filter-box"><label>Comparison Month</label><select id="comparisonMonth" multiple></select></div>
  </div>
</div>

<div class="table-wrapper">
  <table id="comparisonTable">
    <thead id="comparisonHead"></thead>
    <tbody id="comparisonBody"></tbody>
    <tfoot id="comparisonFoot"></tfoot>
  </table>
</div>

<div id="overlay" class="overlay">Processing...</div>

<script>
const API_URL = "/get_data/lighthouse_sales";
let rawData = [];

function showOverlay(){document.getElementById('overlay').classList.add('show');}
function hideOverlay(){document.getElementById('overlay').classList.remove('show');}
function toNum(v){return Number(v)||0;}
function debounce(fn,ms=200){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function escapeHTML(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
function parseDateFlexible(s){if(!s)return null;s=String(s).trim();if(/^\d{8}$/.test(s)){const d=+s.slice(0,2),m=+s.slice(2,4),y=+s.slice(4,8);return new Date(y,m-1,d);}const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(s);return isNaN(d)?null:d;}
function invoiceMonthLabel(s){const dt=parseDateFlexible(s);return dt?dt.toLocaleString('default',{month:'short',year:'2-digit'}):"";}

async function loadData(){
  showOverlay();
  try{
    const res = await axios.get(API_URL);
    const rows = Array.isArray(res.data) ? res.data : [];
    rawData = rows.map(r=>{
      const rawDate = (r.invoice_date || r.INVOICE_DATE || "").toString().trim();
      const month = invoiceMonthLabel(rawDate);
      const state = (r.state || r.STATE || "").trim();
      const party = (r.party_name || r.PARTY_NAME || "").trim();
      const item = (r.item_name || r.ITEM_NAME || "").trim().replace(/\s+/g,' ');
      return { state, party, item, month, qty: toNum(r.quantity_cs || r.Quantity_CS || 0) };
    }).filter(r => r.state && r.party && r.item);

    initFilters();
    setDynamicTheadTop();
    window.addEventListener('resize', debounce(setDynamicTheadTop, 200));
    applyFilters();
  }catch(e){
    console.error(e); alert('Failed to load data');
  }finally{
    hideOverlay();
  }
}

function setDynamicTheadTop(){
  const header = document.querySelector('header');
  const toolbar = document.querySelector('.toolbar');
  const filters = document.getElementById('filtersWrapper');
  let topVal = 0;
  if(header) topVal += header.getBoundingClientRect().height;
  if(toolbar) topVal += toolbar.getBoundingClientRect().height;
  if(filters) topVal += filters.getBoundingClientRect().height;
  document.documentElement.style.setProperty('--thead-top', Math.max(0, topVal) + 'px');
}

function initFilters(){
  const states = [...new Set(rawData.map(r=>r.state))].sort();
  const parties = [...new Set(rawData.map(r=>r.party))].sort();
  const items = [...new Set(rawData.map(r=>r.item))].sort();
  const months = [...new Set(rawData.map(r=>r.month).filter(Boolean))].sort((a,b)=>new Date('01 '+a)-new Date('01 '+b));
  const fill = (id,list)=>{const el=document.getElementById(id);el.innerHTML='';list.forEach(v=>el.innerHTML+=`<option value="${escapeHTML(v)}">${escapeHTML(v)}</option>`);};
  fill('stateFilter', states); fill('partyFilter', parties); fill('itemFilter', items); fill('monthFilter', months); fill('comparisonMonth', months);
  if(months.length >= 2){
    const last2 = months.slice(-2);
    [...document.getElementById('comparisonMonth').options].forEach(o=>{ if(last2.includes(o.value)) o.selected = true; });
  }
}

/* build grouped array (one entry per unique state|party|item) */
function groupData(){
  const map = new Map();
  for(const r of rawData){
    const key = `${r.state}||${r.party}||${r.item}`;
    if(!map.has(key)) map.set(key,{state:r.state,party:r.party,item:r.item,months:{}});
    const g = map.get(key);
    if(r.month) g.months[r.month] = (g.months[r.month]||0) + r.qty;
    else g.months.__no_month__ = (g.months.__no_month__||0) + r.qty;
  }
  return [...map.values()];
}

function updateSoftCascade(monthsToShow){
  const monthsFilter = monthsToShow && monthsToShow.length ? monthsToShow : [...new Set(rawData.map(r=>r.month).filter(Boolean))];
  const allowed = { states:new Set(), parties:new Set(), items:new Set() };
  rawData.forEach(r=>{
    if(monthsFilter.length){
      if(r.month && monthsFilter.includes(r.month)){
        allowed.states.add(r.state); allowed.parties.add(r.party); allowed.items.add(r.item);
      }
    } else {
      allowed.states.add(r.state); allowed.parties.add(r.party); allowed.items.add(r.item);
    }
  });
  const applyDisable = (id,setAllowed)=>{
    const sel = document.getElementById(id); if(!sel) return;
    [...sel.options].forEach(opt => { if(!setAllowed.has(opt.value) && !opt.selected) opt.disabled = true; else opt.disabled = false; });
  };
  applyDisable('stateFilter', allowed.states); applyDisable('partyFilter', allowed.parties); applyDisable('itemFilter', allowed.items);
}

function getVals(id){ const el=document.getElementById(id); if(!el) return []; return [...el.selectedOptions].map(o=>o.value); }

function applyFilters(){
  showOverlay();
  setTimeout(()=>{
    const showCols = getVals('showColumns');
    const selStates = getVals('stateFilter');
    const selParties = getVals('partyFilter');
    const selItems = getVals('itemFilter');
    const monthsSel = getVals('monthFilter');
    const compSel = getVals('comparisonMonth');

    const data = groupData();
    const monthsAll = [...new Set(rawData.map(r=>r.month))].filter(Boolean).sort((a,b)=>new Date('01 '+a)-new Date('01 '+b));
    const monthsToShow = monthsSel.length ? monthsSel : monthsAll;
    const compSorted = compSel.slice().sort((a,b)=>new Date('01 '+a)-new Date('01 '+b));
    const compPair = compSorted.length >= 2 ? compSorted.slice(-2) : [];

    updateSoftCascade(monthsToShow);

    const headers = [...showCols, ...monthsToShow];
    if(compPair.length >= 2) headers.push('Δ','% Change');
    document.getElementById('comparisonHead').innerHTML = '<tr>' + headers.map(h=>`<th>${escapeHTML(h)}</th>`).join('') + '</tr>';

    // filter and sort grouped data
    const filtered = data.filter(d=>
      (!selStates.length || selStates.includes(d.state)) &&
      (!selParties.length || selParties.includes(d.party)) &&
      (!selItems.length || selItems.includes(d.item))
    ).sort((a,b)=>{
      if(a.state !== b.state) return a.state.localeCompare(b.state);
      if(a.party !== b.party) return a.party.localeCompare(b.party);
      return a.item.localeCompare(b.item);
    });

    let html = '';
    const grand = Object.fromEntries(monthsToShow.map(m=>[m,0]));

    let currentState = null;
    let currentParty = null;
    let partySums = null;
    let stateSums = null;

    const flushPartySubtotal = () => {
      if(!partySums) return;
      html += '<tr class="subtotal-row">';
      for(const h of headers){
        if(monthsToShow.includes(h)) html += `<td><b>${partySums[h].toLocaleString()}</b></td>`;
        else if(['State','Party_Name','Item_Name'].includes(h)) html += `<td><b>SUM ${escapeHTML(currentParty)}</b></td>`;
        else html += '<td></td>';
      }
      html += '</tr>';
      partySums = null;
    };

    const flushStateTotal = () => {
      if(!stateSums) return;
      html += '<tr class="state-total-row">';
      for(const h of headers){
        if(monthsToShow.includes(h)) html += `<td><b>${stateSums[h].toLocaleString()}</b></td>`;
        else if(['State','Party_Name','Item_Name'].includes(h)) html += `<td><b>TOTAL ${escapeHTML(currentState)}</b></td>`;
        else html += '<td></td>';
      }
      html += '</tr>';
      stateSums = null;
    };

    for(const g of filtered){
      // check visibility: only show rows that have at least one non-zero in monthsToShow
      const hasVisibleValue = monthsToShow.length ? monthsToShow.some(m => (g.months[m]||0) > 0) : true;
      if(!hasVisibleValue) continue;

      if(currentState && g.state !== currentState){
        flushPartySubtotal();
        flushStateTotal();
      }
      if(currentParty && g.party !== currentParty){
        flushPartySubtotal();
      }
      if(!stateSums || g.state !== currentState) stateSums = Object.fromEntries(monthsToShow.map(m=>[m,0]));
      if(!partySums || g.party !== currentParty) partySums = Object.fromEntries(monthsToShow.map(m=>[m,0]));

      // render row
      html += '<tr>';
      for(const h of headers){
        if(h === 'State') html += `<td>${escapeHTML(g.state)}</td>`;
        else if(h === 'Party_Name') html += `<td>${escapeHTML(g.party)}</td>`;
        else if(h === 'Item_Name') html += `<td>${escapeHTML(g.item)}</td>`;
        else if(monthsToShow.includes(h)){
          const v = g.months[h] || 0;
          const idx = monthsToShow.indexOf(h);
          let bg = '';
          if(idx > 0){
            const prev = monthsToShow[idx-1];
            const prevV = g.months[prev] || 0;
            bg = v > prevV ? `background:${'var(--up-bg)'};` : `background:${'var(--down-bg)'};`;
          }
          html += `<td style="${bg}">${v ? v.toLocaleString() : ''}</td>`;
          partySums[h] += v; stateSums[h] += v; grand[h] += v;
        } else if(h === 'Δ' || h === '% Change'){
          if(compPair.length >= 2){
            const v1 = g.months[compPair[0]] || 0;
            const v2 = g.months[compPair[1]] || 0;
            if(h === 'Δ'){
              const diff = v2 - v1;
              const bg = diff > 0 ? 'var(--up-bg)' : 'var(--down-bg)';
              html += `<td style="background:${bg};">${diff>0?'+':''}${diff.toLocaleString()}</td>`;
            } else {
              const pct = v1 ? (((v2 - v1) / v1) * 100) : (v2 ? 100 : 0);
              const col = pct > 0 ? '#16a34a' : '#dc2626';
              html += `<td style="color:${col}">${pct>0?'+':''}${pct.toFixed(1)}%</td>`;
            }
          } else html += '<td></td>';
        } else html += '<td></td>';
      }
      html += '</tr>';

      currentState = g.state;
      currentParty = g.party;
    } // end loop

    flushPartySubtotal();
    flushStateTotal();

    // grand total
    let f = '<tr class="grandtotal-row">';
    for(const h of headers){
      if(monthsToShow.includes(h)) f += `<td><b>${grand[h].toLocaleString()}</b></td>`;
      else if(['State','Party_Name','Item_Name'].includes(h)) f += `<td><b>GRAND TOTAL</b></td>`;
      else f += '<td></td>';
    }
    f += '</tr>';

    document.getElementById('comparisonBody').innerHTML = html || `<tr><td colspan="${headers.length}">No Data</td></tr>`;
    document.getElementById('comparisonFoot').innerHTML = f;
    hideOverlay();
  }, 80);
}

/* events */
['showColumns','stateFilter','partyFilter','itemFilter','monthFilter','comparisonMonth'].forEach(id=>{
  document.getElementById(id).addEventListener('change', ()=>{
    const monthsToShow = getVals('monthFilter');
    updateSoftCascade(monthsToShow);
    debounce(applyFilters, 150)();
  });
});

document.getElementById('clearBtn').onclick = ()=> location.reload();
document.getElementById('toggleFiltersBtn').onclick = ()=>{
  const row = document.getElementById('filtersRow'), btn=document.getElementById('toggleFiltersBtn');
  if(row.style.display==='none'){ row.style.display='flex'; btn.textContent='Hide Filters'; }
  else { row.style.display='none'; btn.textContent='Show Filters'; }
};

/* Export (Excel) */
document.getElementById('exportBtn').onclick = async ()=>{
  showOverlay();
  try{
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Comparison');
    const rows = [...document.querySelectorAll('#comparisonTable tr')].map(tr=>[...tr.children].map(td=>td.innerText.trim()));
    rows.forEach((r,i)=>{ const row = ws.addRow(r); if(i===0) row.font = { bold: true }; });
    ws.columns.forEach(c=>c.width = 18);
    const buf = await wb.xlsx.writeBuffer();
    saveAs(new Blob([buf]), `comparison_${new Date().toISOString().slice(0,10)}.xlsx`);
  }catch(e){ console.error(e); alert('Export failed'); }
  finally{ hideOverlay(); }
};

function getVals(id){ const el=document.getElementById(id); if(!el) return []; return [...el.selectedOptions].map(o=>o.value); }

function updateSoftCascade(monthsToShow){
  // reuse implementation above (no-op here because defined earlier)
  // calling original logic again to ensure consistent behaviour
  const monthsFilter = monthsToShow && monthsToShow.length ? monthsToShow : [...new Set(rawData.map(r=>r.month).filter(Boolean))];
  const allowed = { states:new Set(), parties:new Set(), items:new Set() };
  rawData.forEach(r=>{
    if(monthsFilter.length){
      if(r.month && monthsFilter.includes(r.month)){
        allowed.states.add(r.state); allowed.parties.add(r.party); allowed.items.add(r.item);
      }
    } else {
      allowed.states.add(r.state); allowed.parties.add(r.party); allowed.items.add(r.item);
    }
  });
  const applyDisable = (id,setAllowed)=>{ const sel=document.getElementById(id); if(!sel) return; [...sel.options].forEach(opt=>{ if(!setAllowed.has(opt.value) && !opt.selected) opt.disabled=true; else opt.disabled=false; }); };
  applyDisable('stateFilter',allowed.states); applyDisable('partyFilter',allowed.parties); applyDisable('itemFilter',allowed.items);
}

/* initialize */
loadData();
</script>
</body>
</html>
