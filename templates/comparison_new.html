<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SMC - Plant to Depot Sales Dashboard</title>
<link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

<!-- libraries -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>
:root {
  --navy: #1e3a8a;
  --accent1: #2563eb;
  --accent2: #4f46e5;
}
* { box-sizing: border-box; }
body {
  font-family: Inter, system-ui, Arial;
  margin: 0;
  background: #f6f9fc;
  color: #0f172a;
}

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 14px 16px;
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 1100;
}
header img { height: 56px; }
header h1 { margin: 0; font-weight: 900; font-size: 1.35rem; }

/* Toolbar */
.toolbar {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 10px;
  background: #fff;
  position: sticky;
  top: 80px;
  z-index: 1050;
}
.btn {
  border: 0;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 800;
}
.btn-blue {
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  color: #fff;
}
.btn-gray {
  background: #eef2ff;
  color: var(--navy);
}

/* Filters */
#filtersWrapper {
  display: flex;
  justify-content: center;
  background: #f8fafc;
  border-bottom: 1px solid #dbeafe;
}
.filters {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  flex-wrap: nowrap;
  overflow-x: auto;
  padding: 12px;
  max-width: 1500px;
  width: 100%;
  scrollbar-width: thin;
  scrollbar-color: #93c5fd #f3f4f6;
}
.filters::-webkit-scrollbar { height: 8px; }
.filters::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 4px; }
.filter-box {
  background: #fff;
  border-radius: 12px;
  padding: 10px 12px;
  border: 2px solid #c7d2fe;
  min-width: 160px;
  box-shadow: 0 4px 12px rgba(37,99,235,0.06);
  flex: 0 0 auto;
}
.filter-box label {
  display: block;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 6px;
}
.filter-box select {
  width: 200px;
  padding: 6px;
  border-radius: 8px;
  border: 1.5px solid #c7d2fe;
  background: #fff;
  font-weight: 700;
}

/* Table */
.table-wrapper {
  max-width: 1500px;
  margin: 18px auto;
  border-radius: 8px;
  overflow: auto;
  background: #fff;
  box-shadow: 0 6px 18px rgba(4,8,15,0.06);
}
table {
  border-collapse: collapse;
  width: 100%;
  min-width: 1100px;
}
thead th, tbody td {
  text-align: center;
  padding: 4px 6px;
  border: 2px solid #2d3748;
  font-weight: 700;
  vertical-align: middle;
}
thead th {
  position: sticky;
  top: 0;
  background: linear-gradient(90deg, #e0e7ff, #c7d2fe);
  color: var(--navy);
  z-index: 10;
}
tr.subtotal-row td { background: #fff7cc; font-weight: 900; }
tr.state-total-row td { background: #e6f6ff; font-weight: 900; }
tr.grandtotal-row td { background: #bae6fd; font-weight: 900; }
.overlay {
  position: fixed; inset: 0;
  display: none; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.75);
  z-index: 3000;
  font-weight: 900; color: var(--navy);
}
.overlay.show { display: flex; }
</style>
</head>

<body>
<header>
  <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo">
  <h1>SMC - Plant to Depot Sales Dashboard</h1>
</header>

<div class="toolbar">
  <a href="/dashboard/plant"><button class="btn btn-gray">← Back to Plant</button></a>
  <button id="exportBtn" class="btn btn-blue">Export</button>
  <button id="clearBtn" class="btn btn-gray">Clear</button>
  <button id="toggleFiltersBtn" class="btn btn-blue">Hide Filters</button>
</div>

<!-- Filters -->
<div id="filtersWrapper">
  <div class="filters" id="filtersRow">
    <div class="filter-box">
      <label>Show Columns</label>
      <select id="showColumns" multiple>
        <option value="State" selected>State</option>
        <option value="Party_Name" selected>Party_Name</option>
        <option value="Item_Name" selected>Item_Name</option>
      </select>
    </div>
    <div class="filter-box"><label>State</label><select id="stateFilter" multiple></select></div>
    <div class="filter-box"><label>Party Name</label><select id="partyFilter" multiple></select></div>
    <div class="filter-box"><label>Item Name</label><select id="itemFilter" multiple></select></div>
    <div class="filter-box"><label>Month_Name</label><select id="monthFilter" multiple></select></div>
    <div class="filter-box"><label>Comparison Month</label><select id="comparisonMonth" multiple></select></div>
  </div>
</div>

<div class="table-wrapper">
  <table id="comparisonTable">
    <thead id="comparisonHead"></thead>
    <tbody id="comparisonBody"></tbody>
    <tfoot id="comparisonFoot"></tfoot>
  </table>
</div>

<div id="overlay" class="overlay">Processing...</div>

<script>
const API_URL = "/get_data/lighthouse_sales";
let rawData = [];
function showOverlay(){document.getElementById('overlay').classList.add('show');}
function hideOverlay(){document.getElementById('overlay').classList.remove('show');}
function toNum(v){return Number(v)||0;}
function parseDateFlexible(s){if(!s)return null;s=String(s).trim();if(/^\d{8}$/.test(s)){const d=+s.slice(0,2),m=+s.slice(2,4),y=+s.slice(4,8);return new Date(y,m-1,d);}const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(s);return isNaN(d)?null:d;}
function invoiceMonthLabel(s){const dt=parseDateFlexible(s);if(!dt)return"";return dt.toLocaleString('default',{month:'short',year:'2-digit'});}
function debounce(fn,ms=200){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);}}

/* --- Load Data --- */
async function loadData(){
  showOverlay();
  try{
    const res = await axios.get(API_URL);
    const rows = Array.isArray(res.data)?res.data:[];
    rawData = rows.map(r=>{
      const rawDate=(r.invoice_date||r.INVOICE_DATE||"").toString().trim();
      const month=invoiceMonthLabel(rawDate);
      return{
        state:(r.state||r.STATE||"").trim(),
        party:(r.party_name||r.PARTY_NAME||"").trim(),
        item:(r.item_name||r.ITEM_NAME||"").trim(),
        month,
        qty:toNum(r.quantity_cs||r.Quantity_CS||0)
      };
    }).filter(r=>r.month&&r.state&&r.party&&r.item);
    initFilters(); applyFilters();
  }catch(e){console.error(e);alert("Failed to load data.");}
  finally{hideOverlay();}
}

/* --- Filters --- */
function initFilters(){
  const states=[...new Set(rawData.map(r=>r.state))].sort();
  const parties=[...new Set(rawData.map(r=>r.party))].sort();
  const items=[...new Set(rawData.map(r=>r.item))].sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}));
  const months=[...new Set(rawData.map(r=>r.month))].sort((a,b)=>new Date("01 "+a)-new Date("01 "+b));
  const fill=(id,list)=>{const el=document.getElementById(id);el.innerHTML='';list.forEach(v=>el.innerHTML+=`<option>${v}</option>`);};
  fill('stateFilter',states); fill('partyFilter',parties); fill('itemFilter',items); fill('monthFilter',months); fill('comparisonMonth',months);
  if(months.length>=2){const last2=months.slice(-2);[...document.getElementById('comparisonMonth').options].forEach(o=>{if(last2.includes(o.value))o.selected=true;});}
}

/* --- Apply Filters & Render Table --- */
function getVals(id){return[...document.getElementById(id).selectedOptions].map(o=>o.value);}
function applyFilters(){
  showOverlay();
  setTimeout(()=>{
    const showCols=getVals("showColumns"),states=getVals("stateFilter"),parties=getVals("partyFilter"),items=getVals("itemFilter"),visible=getVals("monthFilter"),comp=getVals("comparisonMonth");
    const allMonths=[...new Set(rawData.map(r=>r.month))].sort((a,b)=>new Date("01 "+a)-new Date("01 "+b));
    const monthsToShow=visible.length?visible:allMonths;
    const compSorted=comp.slice().sort((a,b)=>new Date("01 "+a)-new Date("01 "+b));
    const compPair=compSorted.length>=2?compSorted.slice(-2):[];
    const filtered=rawData.filter(r=>(!states.length||states.includes(r.state))&&(!parties.length||parties.includes(r.party))&&(!items.length||items.includes(r.item)));
    const stateMap=new Map();
    filtered.forEach(r=>{
      if(!stateMap.has(r.state))stateMap.set(r.state,new Map());
      const p=stateMap.get(r.state);
      if(!p.has(r.party))p.set(r.party,new Map());
      const i=p.get(r.party);
      if(!i.has(r.item))i.set(r.item,{});
      i.get(r.item)[r.month]=(i.get(r.item)[r.month]||0)+r.qty;
    });

    const thead=document.getElementById("comparisonHead"),tbody=document.getElementById("comparisonBody"),tfoot=document.getElementById("comparisonFoot");
    const headers=[...showCols,...monthsToShow]; if(compPair.length>=2)headers.push("Δ","% Change");
    thead.innerHTML="<tr>"+headers.map(h=>`<th>${h}</th>`).join("")+"</tr>";

    let html="",grand=Object.fromEntries(monthsToShow.map(m=>[m,0]));

    /* === BUILD TABLE WITH MERGED CELLS === */
    stateMap.forEach((pMap,state)=>{
      const st=Object.fromEntries(monthsToShow.map(m=>[m,0]));
      const partiesArr=[...pMap.entries()];
      let stateRowCount=0;
      partiesArr.forEach(([_,iMap])=>stateRowCount+=iMap.size+(iMap.size>1?1:0));
      let stateAdded=false;
      partiesArr.forEach(([party,iMap])=>{
        const arr=[...iMap.entries()];
        const ps=Object.fromEntries(monthsToShow.map(m=>[m,0]));
        let partyAdded=false;
        arr.forEach(([item,mon])=>{
          html+="<tr>";
          headers.forEach(h=>{
            if(h==="State"){ if(!stateAdded){ html+=`<td rowspan="${stateRowCount}" style="font-weight:900;">${state}</td>`; stateAdded=true; } }
            else if(h==="Party_Name"){ if(!partyAdded){ const rowspan=arr.length+(arr.length>1?1:0); html+=`<td rowspan="${rowspan}" style="font-weight:800;">${party}</td>`; partyAdded=true; } }
            else if(h==="Item_Name"){ html+=`<td>${item}</td>`; }
            else if(monthsToShow.includes(h)){
              const v=mon[h]||0; const prevMonth=monthsToShow[monthsToShow.indexOf(h)-1]; let bg="";
              if(prevMonth&&mon[prevMonth]!==undefined){const prev=mon[prevMonth]||0; bg=v>prev?"background-color:#dcfce7;":"background-color:#fee2e2;";}
              html+=`<td style="${bg}">${v?v.toLocaleString():""}</td>`;
              ps[h]+=v; st[h]+=v; grand[h]+=v;
            }
            else if(h==="Δ"||h==="% Change"){
              if(compPair.length>=2){
                const[v1,v2]=[mon[compPair[0]]||0,mon[compPair[1]]||0];
                if(h==="Δ"){const diff=v2-v1;const bg=diff>0?"background-color:#dcfce7;":"background-color:#fee2e2;";html+=`<td style="${bg}"><b>${diff>0?'+':''}${diff.toLocaleString()}</b></td>`;}
                else{const pct=v1?(((v2-v1)/v1)*100):(v2?100:0);const col=pct>0?"#16a34a":"#dc2626";html+=`<td style="color:${col}">${pct>0?'+':''}${pct.toFixed(1)}%</td>`;}
              } else html+="<td></td>";
            } else html+="<td></td>";
          });
          html+="</tr>";
        });
        if(arr.length>1){
          html+="<tr class='subtotal-row'>";
          headers.forEach((h,i)=>{
            if(monthsToShow.includes(h))html+=`<td><b>${ps[h].toLocaleString()}</b></td>`;
            else if(h==="Δ"||h==="% Change")html+="<td></td>";
            else if(h==="Item_Name")html+=`<td><b>SUM ${party}</b></td>`;
            else html+="<td></td>";
          });
          html+="</tr>";
        }
      });
      html+="<tr class='state-total-row'>";
      headers.forEach((h,i)=>{
        if(monthsToShow.includes(h))html+=`<td><b>${st[h].toLocaleString()}</b></td>`;
        else if(h==="Δ"||h==="% Change")html+="<td></td>";
        else if(h==="Item_Name")html+=`<td><b>TOTAL ${state}</b></td>`;
        else html+="<td></td>";
      });
      html+="</tr>";
    });

    /* === GRAND TOTAL === */
    let f="<tr class='grandtotal-row'>";
    headers.forEach((h,i)=>{
      if(monthsToShow.includes(h)){f+=`<td><b>${grand[h].toLocaleString()}</b></td>`;}
      else if(h==="Δ"||h==="% Change")f+="<td></td>";
      else if(h==="Item_Name")f+=`<td><b>GRAND TOTAL</b></td>`;
      else f+="<td></td>";
    });
    f+="</tr>";

    tbody.innerHTML=html||`<tr><td colspan="${headers.length}">No Data</td></tr>`;
    tfoot.innerHTML=f;
    hideOverlay();
  },100);
}

/* --- Event Bindings --- */
const debouncedApply=debounce(applyFilters,250);
["showColumns","stateFilter","partyFilter","itemFilter","monthFilter","comparisonMonth"].forEach(id=>document.getElementById(id).addEventListener("change",debouncedApply));
document.getElementById("clearBtn").onclick=()=>location.reload();
document.getElementById("toggleFiltersBtn").onclick=()=>{
  const row=document.getElementById("filtersRow");
  const btn=document.getElementById("toggleFiltersBtn");
  if(row.style.display==="none"){row.style.display="flex";btn.textContent="Hide Filters";}
  else{row.style.display="none";btn.textContent="Show Filters";}
};
document.getElementById("exportBtn").onclick=async()=>{
  showOverlay();
  try{
    const wb=new ExcelJS.Workbook(); const ws=wb.addWorksheet("Comparison");
    const rows=[...document.querySelectorAll("#comparisonTable tr")].map(tr=>[...tr.children].map(td=>td.innerText.trim()));
    rows.forEach((r,i)=>{const row=ws.addRow(r);if(i===0)row.font={bold:true};});
    ws.columns.forEach(c=>c.width=18);
    const buf=await wb.xlsx.writeBuffer();
    saveAs(new Blob([buf]),`comparison_${new Date().toISOString().slice(0,10)}.xlsx`);
  }catch(err){console.error("Export failed:",err);alert("Export failed");}
  finally{hideOverlay();}
};
loadData();
</script>
</body>
</html>
