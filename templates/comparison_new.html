<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SMC - Plant to Depot Sales Dashboard</title>
<link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>
:root{--navy:#1e3a8a;--accent1:#2563eb;--accent2:#4f46e5;--green:#16a34a;--red:#ef4444}
body{font-family:Inter,system-ui,Arial;margin:0;background:#f6f9fc;color:#0f172a}
header{
  display:flex;align-items:center;justify-content:center;
  padding:14px 16px;background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#fff;position:sticky;top:0;z-index:1200;
}
header img{height:56px;margin-right:12px}
header h1{margin:0;font-weight:900;font-size:1.35rem;letter-spacing:.6px}

/* Toolbar */
.toolbar{
  display:flex;gap:10px;align-items:center;justify-content:center;
  padding:10px;background:#fff;box-shadow:0 2px 8px rgba(30,58,138,.06);
  position:sticky;top:74px;z-index:1100;
}
.btn{border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700}
.btn-blue{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff}
.btn-gray{background:#eef2ff;color:var(--navy)}

/* Filters (horizontal scroll row) */
.filters{
  display:flex;gap:12px;align-items:flex-start;justify-content:flex-start;
  overflow-x:auto;padding:10px 12px;margin:12px auto;
  scrollbar-width:thin;scrollbar-color:#93c5fd #f3f4f6;
  background:rgba(255,255,255,0.95);border-radius:10px;
  max-width:1500px;box-shadow:0 6px 18px rgba(4,8,15,.08);
}
.filters::-webkit-scrollbar{height:8px}
.filters::-webkit-scrollbar-thumb{background:#93c5fd;border-radius:4px}
.filter-box{
  flex:0 0 auto;min-width:160px;background:linear-gradient(180deg,#fff,#f3f6ff);
  border-radius:10px;border:2px solid #c7d2fe;padding:8px 10px;
  box-shadow:0 2px 8px rgba(37,99,235,0.06);
}
.filter-box label{display:block;font-weight:800;color:var(--navy);margin-bottom:6px}
select.multi{width:200px;padding:6px;border-radius:8px;border:1.5px solid #c7d2fe;background:#fff;font-weight:700}
select.multi[multiple]{height:86px}

/* Table styling */
.table-wrapper{max-width:1500px;margin:10px auto;border-radius:10px;overflow:auto;background:#fff;box-shadow:0 6px 18px rgba(4,8,15,.05);max-height:72vh}
table{width:100%;border-collapse:collapse;min-width:1000px;text-align:center}
th,td{padding:8px 10px;text-align:center;border:2px solid #23304a;font-weight:800}
thead th{position:sticky;top:0;background:linear-gradient(90deg,#e0e7ff,#c7d2fe);color:var(--navy);z-index:5}
tr.subtotal-row td{background:#fff7cc}
tr.grandtotal-row td{background:#bae6fd}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.72);z-index:3000;font-weight:900;color:var(--navy)}
.overlay.show{display:flex}
</style>
</head>

<body>
<header>
  <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo">
  <h1>SMC - Plant to Depot Sales Dashboard</h1>
</header>

<div class="toolbar">
  <a href="/dashboard/plant"><button class="btn btn-gray">← Back to Plant</button></a>
  <button id="exportBtn" class="btn btn-blue">Export</button>
  <button id="clearBtn" class="btn btn-gray">Clear</button>
  <button id="toggleFiltersBtn" class="btn btn-blue">Hide Filters</button>
</div>

<div id="filtersWrapper" class="filters">
  <div class="filter-box">
    <label>Show Columns</label>
    <select id="showColumns" class="multi" multiple>
      <option value="State" selected>State</option>
      <option value="Party_Name" selected>Party_Name</option>
      <option value="Item_Name" selected>Item_Name</option>
    </select>
  </div>

  <div class="filter-box"><label>State</label><select id="stateFilter" class="multi" multiple></select></div>
  <div class="filter-box"><label>Party Name</label><select id="partyFilter" class="multi" multiple></select></div>
  <div class="filter-box"><label>Item Name</label><select id="itemFilter" class="multi" multiple></select></div>
  <div class="filter-box"><label>Month_Name</label><select id="monthFilter" class="multi" multiple></select></div>
  <div class="filter-box"><label>Comparison Month</label><select id="comparisonMonth" class="multi" multiple></select></div>
</div>

<div class="table-wrapper">
  <table id="comparisonTable">
    <thead id="comparisonHead"></thead>
    <tbody id="comparisonBody"></tbody>
    <tfoot id="comparisonFoot"></tfoot>
  </table>
</div>

<div id="overlay" class="overlay">Processing...</div>

<script>
const API_URL="/get_data/lighthouse_sales";let rawData=[],monthsMaster=[];
function showOverlay(){document.getElementById('overlay').classList.add('show');}
function hideOverlay(){document.getElementById('overlay').classList.remove('show');}
function toNum(v){return Number(v)||0;}
function parseDateFlexible(s){if(!s)return null;s=String(s).trim();if(/^\d{8}$/.test(s)){const d=+s.slice(0,2),m=+s.slice(2,4),y=+s.slice(4,8);return new Date(y,m-1,d);}const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(s);return isNaN(d)?null:d;}
function invoiceMonthLabel(s){const dt=parseDateFlexible(s);if(!dt)return"";return dt.toLocaleString('default',{month:'short',year:'2-digit'});}
function debounce(fn,ms=200){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);}}

/* Load data */
async function loadData(){
showOverlay();
try{
const res=await axios.get(API_URL);const data=Array.isArray(res.data)?res.data:[];
rawData=data.map(r=>{
const rawDate=(r.invoice_date||r.INVOICE_DATE||"").trim();
const parsed=parseDateFlexible(rawDate);
return{state:(r.state||r.STATE||"").trim(),party:(r.party_name||r.PARTY_NAME||"").trim(),item:(r.item_name||r.ITEM_NAME||"").trim(),month:invoiceMonthLabel(rawDate),qty:toNum(r.quantity_cs||r.Quantity_CS||0)};
}).filter(r=>r.month&&r.state);
monthsMaster=[...new Set(rawData.map(r=>r.month))].sort((a,b)=>new Date("01-"+a)-new Date("01-"+b));
const fill=(id,list)=>{const s=document.getElementById(id);s.innerHTML='';list.forEach(v=>{const o=document.createElement('option');o.value=v;o.text=v;s.appendChild(o);});};
fill('stateFilter',[...new Set(rawData.map(r=>r.state))].sort());
fill('partyFilter',[...new Set(rawData.map(r=>r.party))].sort());
let items=[...new Set(rawData.map(r=>r.item))].filter(Boolean);
items.sort((a,b)=>{const pa=a.split(' ')[0].toUpperCase(),pb=b.split(' ')[0].toUpperCase();if(pa===pb)return a.localeCompare(b,undefined,{numeric:true});return pa.localeCompare(pb);});
fill('itemFilter',items);fill('monthFilter',monthsMaster);fill('comparisonMonth',monthsMaster);
if(monthsMaster.length>=2){const sel=document.getElementById('comparisonMonth');const last2=monthsMaster.slice(-2);[...sel.options].forEach(o=>{if(last2.includes(o.value))o.selected=true;});}
[...document.getElementById('monthFilter').options].forEach(o=>o.selected=true);
applyFilters();
}catch(e){console.error(e);alert("Failed to load data.");}
finally{hideOverlay();}
}

/* Apply filters */
function applyFilters(){
showOverlay();
setTimeout(()=>{
const showCols=[...document.getElementById('showColumns').selectedOptions].map(o=>o.value);
const selStates=[...document.getElementById('stateFilter').selectedOptions].map(o=>o.value);
const selParties=[...document.getElementById('partyFilter').selectedOptions].map(o=>o.value);
const selItems=[...document.getElementById('itemFilter').selectedOptions].map(o=>o.value);
const visibleMonths=[...document.getElementById('monthFilter').selectedOptions].map(o=>o.value);
const compMonths=[...document.getElementById('comparisonMonth').selectedOptions].map(o=>o.value);
const monthsToShow=visibleMonths.length?visibleMonths:monthsMaster.slice();
let filtered=rawData.filter(r=>{if(selStates.length&&!selStates.includes(r.state))return false;if(selParties.length&&!selParties.includes(r.party))return false;if(selItems.length&&!selItems.includes(r.item))return false;return true;});
const stateMap=new Map();
filtered.forEach(r=>{if(!stateMap.has(r.state))stateMap.set(r.state,new Map());const p=stateMap.get(r.state);if(!p.has(r.party))p.set(r.party,new Map());const i=p.get(r.party);if(!i.has(r.item))i.set(r.item,{});i.get(r.item)[r.month]=(i.get(r.item)[r.month]||0)+r.qty;});
const compSorted=compMonths.slice().sort((a,b)=>monthsMaster.indexOf(a)-monthsMaster.indexOf(b));
const hasComp=compSorted.length>=2;const lastTwo=hasComp?compSorted.slice(-2):[];
const head=document.getElementById('comparisonHead'),body=document.getElementById('comparisonBody'),foot=document.getElementById('comparisonFoot');
const headers=[...showCols,...monthsToShow];if(hasComp){headers.push('Δ','% Change');}
head.innerHTML='<tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr>';
let tbodyHtml='';const grandTotals=Object.fromEntries(monthsToShow.map(m=>[m,0]));
stateMap.forEach((pMap,state)=>{const stateTotals=Object.fromEntries(monthsToShow.map(m=>[m,0]));
pMap.forEach((iMap,party)=>{const itemsArr=[...iMap.entries()];
itemsArr.forEach(([itemName,monthObj])=>{
tbodyHtml+='<tr>';
headers.forEach(h=>{
if(monthsToShow.includes(h)){const v=monthObj[h]||0;tbodyHtml+=`<td>${v?v.toLocaleString():""}</td>`;stateTotals[h]+=v;grandTotals[h]+=v;}
else if(h==='Δ'){if(hasComp){const v1=monthObj[lastTwo[0]]||0,v2=monthObj[lastTwo[1]]||0;const diff=v2-v1;const sign=diff>0?'+':'';const color=diff>0?'var(--green)':'var(--red)';tbodyHtml+=`<td style="color:${color}">${diff?sign+diff.toLocaleString():""}</td>`;}else tbodyHtml+='<td></td>';}
else if(h==='% Change'){if(hasComp){const v1=monthObj[lastTwo[0]]||0,v2=monthObj[lastTwo[1]]||0;const pct=v1?(((v2-v1)/v1)*100):(v2?100:0);const disp=v1?((pct>0?'+':'')+pct.toFixed(1)+'%'):(v2?'+100%':'0%');const color=(v2-v1)>0?'var(--green)':'var(--red)';tbodyHtml+=`<td style="color:${color}">${v1||v2?disp:""}</td>`;}else tbodyHtml+='<td></td>';}
else{if(h==='State')tbodyHtml+=`<td>${state}</td>`;else if(h==='Party_Name')tbodyHtml+=`<td>${party}</td>`;else if(h==='Item_Name')tbodyHtml+=`<td>${itemName}</td>`;else tbodyHtml+='<td></td>';}});tbodyHtml+='</tr>';});
if(itemsArr.length>=2){const partySub=Object.fromEntries(monthsToShow.map(m=>[m,0]));itemsArr.forEach(([_i,mObj])=>monthsToShow.forEach(m=>partySub[m]+=(mObj[m]||0)));
tbodyHtml+='<tr class="subtotal-row">';
headers.forEach((h,i)=>{if(monthsToShow.includes(h)){tbodyHtml+=`<td>${partySub[h].toLocaleString()}</td>`;}
else if(h==='Δ'||h==='% Change'){if(hasComp){const v1=partySub[lastTwo[0]]||0,v2=partySub[lastTwo[1]]||0;const diff=v2-v1;const sign=diff>0?'+':'';const color=diff>0?'var(--green)':'var(--red)';if(h==='Δ')tbodyHtml+=`<td style="color:${color}">${diff?sign+diff.toLocaleString():""}</td>`;else{const pct=v1?(((v2-v1)/v1)*100):(v2?100:0);const disp=v1?((pct>0?'+':'')+pct.toFixed(1)+'%'):(v2?'+100%':'0%');tbodyHtml+=`<td style="color:${color}">${disp}</td>`;}}else tbodyHtml+='<td></td>';}
else{if(i===0)tbodyHtml+=`<td><b>SUM ${party}</b></td>`;else tbodyHtml+='<td></td>';}});tbodyHtml+='</tr>';}});tbodyHtml+='<tr class="grandtotal-row">';
headers.forEach((h,i)=>{if(monthsToShow.includes(h)){tbodyHtml+=`<td><b>${stateTotals[h].toLocaleString()}</b></td>`;}
else if(h==='Δ'||h==='% Change'){if(hasComp){const v1=stateTotals[lastTwo[0]]||0,v2=stateTotals[lastTwo[1]]||0;const diff=v2-v1;const sign=diff>0?'+':'';const color=diff>0?'var(--green)':'var(--red)';if(h==='Δ')tbodyHtml+=`<td style="color:${color}"><b>${diff?sign+diff.toLocaleString():""}</b></td>`;else{const pct=v1?(((v2-v1)/v1)*100):(v2?100:0);const disp=v1?((pct>0?'+':'')+pct.toFixed(1)+'%'):(v2?'+100%':'0%');tbodyHtml+=`<td style="color:${color}"><b>${disp}</b></td>`;}}else tbodyHtml+='<td></td>';}
else{if(i===0)tbodyHtml+=`<td><b>TOTAL ${state}</b></td>`;else tbodyHtml+='<td></td>';}});tbodyHtml+='</tr>';});
let grandHtml='<tr class="grandtotal-row">';
headers.forEach((h,i)=>{if(monthsToShow.includes(h)){grandHtml+=`<td><b>${grandTotals[h].toLocaleString()}</b></td>`;}
else if(h==='Δ'||h==='% Change'){if(hasComp){const v1=grandTotals[lastTwo[0]]||0,v2=grandTotals[lastTwo[1]]||0;const diff=v2-v1;const sign=diff>0?'+':'';const color=diff>0?'var(--green)':'var(--red)';if(h==='Δ')grandHtml+=`<td style="color:${color}"><b>${diff?sign+diff.toLocaleString():""}</b></td>`;else{const pct=v1?(((v2-v1)/v1)*100):(v2?100:0);const disp=v1?((pct>0?'+':'')+pct.toFixed(1)+'%'):(v2?'+100%':'0%');grandHtml+=`<td style="color:${color}"><b>${disp}</b></td>`;}}else grandHtml+='<td></td>';}
else{if(i===0)grandHtml+=`<td><b>GRAND TOTAL</b></td>`;else grandHtml+='<td></td>';}});grandHtml+='</tr>';
body.innerHTML=tbodyHtml||`<tr><td colspan="${headers.length}">No data</td></tr>`;document.getElementById('comparisonFoot').innerHTML=grandHtml;
hideOverlay();},80);}

/* Events */
const debouncedApply=debounce(applyFilters,180);
['showColumns','stateFilter','partyFilter','itemFilter','monthFilter','comparisonMonth'].forEach(id=>document.getElementById(id).addEventListener('change',debouncedApply));
document.getElementById('clearBtn').onclick=()=>{location.reload();};
document.getElementById('toggleFiltersBtn').onclick=()=>{const w=document.getElementById('filtersWrapper'),b=document.getElementById('toggleFiltersBtn');if(w.style.display==='none'){w.style.display='flex';b.textContent='Hide Filters';}else{w.style.display='none';b.textContent='Show Filters';}};
document.getElementById('exportBtn').onclick=async()=>{showOverlay();try{const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet('Comparison');const rows=[...document.querySelectorAll('#comparisonTable tr')].map(tr=>[...tr.children].map(td=>td.innerText.trim()));rows.forEach((r,i)=>{const row=ws.addRow(r);if(i===0)row.font={bold:true};});ws.columns.forEach(c=>c.width=18);const buf=await wb.xlsx.writeBuffer();saveAs(new Blob([buf]),`comparison_${new Date().toISOString().slice(0,10)}.xlsx`);}catch(e){alert('Export failed');}finally{hideOverlay();}};
loadData();
</script>
</body>
</html>
