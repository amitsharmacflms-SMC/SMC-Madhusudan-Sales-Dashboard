<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SMC - Plant to Depot Sales Dashboard</title>
<link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>
:root {
  --navy: #1e3a8a;
  --accent1: #2563eb;
  --accent2: #4f46e5;
}
body {
  font-family: Inter, system-ui, Arial;
  margin: 0;
  background: #f6f9fc;
  color: #0f172a;
}
header {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 14px 16px;
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  color: #fff;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  position: sticky;
  top: 0;
  z-index: 1000;
}
header img {
  height: 48px;
  margin-right: 12px;
}
header h1 {
  margin: 0;
  font-weight: 900;
  font-size: 1.4rem;
  letter-spacing: 0.5px;
}
.toolbar {
  position: sticky;
  top: 70px;
  background: #fff;
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 10px;
  z-index: 999;
  box-shadow: 0 2px 8px rgba(30,58,138,0.08);
}
.btn {
  border: 0;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  transition: all 0.25s ease;
}
.btn-blue {
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  color: #fff;
}
.btn-blue:hover {
  box-shadow: 0 0 8px rgba(37,99,235,0.6);
}
.btn-gray {
  background: #eef2ff;
  color: var(--navy);
}
.filters {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 16px auto;
  padding: 10px;
}
.filter-box {
  background: rgba(255,255,255,0.85);
  border-radius: 12px;
  border: 2px solid #c7d2fe;
  box-shadow: 0 4px 16px rgba(37,99,235,0.08);
  padding: 10px 14px;
  transition: all 0.25s ease;
}
.filter-box:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(37,99,235,0.18);
}
.filter-box label {
  font-weight: 800;
  color: var(--navy);
}
select {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1.5px solid #c7d2fe;
  background: #fff;
  font-weight: 600;
}
.table-wrapper {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(4,8,15,0.06);
  overflow: auto;
  margin: 20px auto;
  max-width: 1500px;
  max-height: 75vh;
}
table {
  border-collapse: collapse;
  width: 100%;
  text-align: center;
}
th, td {
  border: 2px solid #374151;
  padding: 8px 10px;
  font-weight: 700;
  text-align: center;
}
thead th {
  position: sticky;
  top: 0;
  background: linear-gradient(90deg, #e0e7ff, #c7d2fe);
  color: var(--navy);
  z-index: 5;
}
tr.subtotal-row td { background: #fff7cc; font-weight: 900; }
tr.grandtotal-row td { background: #bae6fd; font-weight: 900; }
.overlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.7);
  z-index: 3000;
  font-weight: 900;
  color: var(--navy);
}
.overlay.show { display: flex; }
.tooltip {
  font-size: 0.8rem;
  color: #374151;
}
</style>
</head>

<body>
<header>
  <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo">
  <h1>SMC - Plant to Depot Sales Dashboard</h1>
</header>

<div class="toolbar">
  <a href="/dashboard/plant"><button class="btn btn-gray">← Back to Plant</button></a>
  <button id="exportBtn" class="btn btn-blue">Export</button>
  <button id="clearBtn" class="btn btn-gray">Clear</button>
  <button id="toggleFiltersBtn" class="btn btn-blue">Hide Filters</button>
</div>

<div id="filtersWrapper" class="filters">
  <div class="filter-box" title="Select which columns to display">
    <label>Show Columns</label><br>
    <select id="showColumns" multiple size="3">
      <option value="State" selected>State</option>
      <option value="Party_Name" selected>Party_Name</option>
      <option value="Item_Name" selected>Item_Name</option>
    </select>
  </div>

  <div class="filter-box" title="Filter data by state">
    <label>State</label><br>
    <select id="stateFilter">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-box" title="Filter data by party name">
    <label>Party Name</label><br>
    <select id="partyFilter">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-box" title="Filter data by item name">
    <label>Item Name</label><br>
    <select id="itemFilter">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-box" title="Choose which months to display in the table">
    <label>Month_Name</label><br>
    <select id="monthFilter" multiple size="3"></select>
    <button id="selectAllMonths" class="btn btn-gray" style="margin-top:4px;">Select All</button>
  </div>

  <div class="filter-box" title="Select months to compare; % Change column appears if 2+ selected">
    <label>Comparison Month</label><br>
    <select id="comparisonMonth" multiple size="3"></select>
    <button id="selectAllComparison" class="btn btn-gray" style="margin-top:4px;">Select All</button>
  </div>
</div>

<div class="table-wrapper">
  <table id="comparisonTable">
    <thead id="comparisonHead"></thead>
    <tbody id="comparisonBody"></tbody>
  </table>
</div>

<div id="overlay" class="overlay">Processing...</div>

<script>
const API_URL = "/get_data/lighthouse_sales";
let rawData = [];

function showOverlay(){document.getElementById('overlay').classList.add('show');}
function hideOverlay(){document.getElementById('overlay').classList.remove('show');}
function toNum(v){return Number(v)||0;}
function parseDateFlexible(s){
  if(!s)return null;
  s=String(s).trim();
  if(/^\d{8}$/.test(s)){const d=+s.slice(0,2),m=+s.slice(2,4),y=+s.slice(4,8);return new Date(y,m-1,d);}
  const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  const d=new Date(s);
  return isNaN(d)?null:d;
}
function invoiceMonthLabel(s){
  const dt=parseDateFlexible(s);
  if(!dt)return "";
  return dt.toLocaleString('default',{month:'short',year:'2-digit'});
}
function debounce(fn, delay){
  let t; return function(...args){clearTimeout(t);t=setTimeout(()=>fn(...args),delay);}
}

// Load and setup
async function loadData(){
  showOverlay();
  try{
    const res = await axios.get(API_URL);
    const data = Array.isArray(res.data)?res.data:[];
    rawData = data.map(r=>{
      const rawDate=(r.invoice_date||r.INVOICE_DATE||"").trim();
      const parsed=parseDateFlexible(rawDate);
      return {
        state:(r.state||r.STATE||"").trim(),
        party:(r.party_name||r.PARTY_NAME||"").trim(),
        item:(r.item_name||r.ITEM_NAME||"").trim(),
        month:invoiceMonthLabel(rawDate),
        qty:toNum(r.quantity_cs||r.Quantity_CS||0)
      };
    }).filter(r=>r.month);

    initFilters();
    applyFilters();
  }finally{hideOverlay();}
}

function initFilters(){
  const states=[...new Set(rawData.map(r=>r.state))].sort();
  const parties=[...new Set(rawData.map(r=>r.party))].sort();
  const items=[...new Set(rawData.map(r=>r.item))].sort((a,b)=>{
    const pa=a.split(' ')[0].toUpperCase(), pb=b.split(' ')[0].toUpperCase();
    if(pa===pb)return a.localeCompare(b,undefined,{numeric:true});
    return pa.localeCompare(pb);
  });
  const months=[...new Set(rawData.map(r=>r.month))].sort((a,b)=>new Date("01-"+a)-new Date("01-"+b));

  const stateSel=document.getElementById("stateFilter");
  states.forEach(s=>stateSel.innerHTML+=`<option>${s}</option>`);
  const partySel=document.getElementById("partyFilter");
  parties.forEach(p=>partySel.innerHTML+=`<option>${p}</option>`);
  const itemSel=document.getElementById("itemFilter");
  items.forEach(i=>itemSel.innerHTML+=`<option>${i}</option>`);
  const monthSel=document.getElementById("monthFilter");
  months.forEach(m=>monthSel.innerHTML+=`<option>${m}</option>`);
  const compSel=document.getElementById("comparisonMonth");
  months.forEach(m=>compSel.innerHTML+=`<option>${m}</option>`);

  // preselect last 2 months
  if(months.length>=2){
    const last2=months.slice(-2);
    for(const opt of compSel.options){if(last2.includes(opt.value))opt.selected=true;}
  }
}

function applyFilters(){
  showOverlay();
  setTimeout(()=>{
    const showCols=[...document.getElementById("showColumns").selectedOptions].map(o=>o.value);
    const state=document.getElementById("stateFilter").value;
    const party=document.getElementById("partyFilter").value;
    const item=document.getElementById("itemFilter").value;
    const months=[...document.getElementById("monthFilter").selectedOptions].map(o=>o.value);
    const compMonths=[...document.getElementById("comparisonMonth").selectedOptions].map(o=>o.value);

    let filtered=rawData.filter(r=>
      (!state||r.state===state)&&(!party||r.party===party)&&(!item||r.item===item)
    );

    const allMonths=[...new Set(rawData.map(r=>r.month))].sort((a,b)=>new Date("01-"+a)-new Date("01-"+b));
    const visibleMonths=months.length?months:allMonths;

    // group data
    const map=new Map();
    filtered.forEach(r=>{
      const key=[r.state,r.party,r.item].join("|");
      if(!map.has(key))map.set(key,{State:r.state,Party_Name:r.party,Item_Name:r.item});
      const o=map.get(key);
      o[r.month]=(o[r.month]||0)+r.qty;
    });
    const rows=[...map.values()];

    const thead=document.getElementById("comparisonHead");
    const tbody=document.getElementById("comparisonBody");

    let headers=[...showCols,...visibleMonths];
    if(compMonths.length>=2)headers.push("Δ","% Change");

    thead.innerHTML="<tr>"+headers.map(h=>`<th>${h}</th>`).join("")+"</tr>";

    let html="";
    rows.forEach(r=>{
      html+="<tr>";
      headers.forEach(h=>{
        if(h==="Δ"){
          const [m1,m2]=compMonths.slice(-2);
          const diff=(r[m2]||0)-(r[m1]||0);
          const color=diff>0?"#22c55e":"#ef4444";
          html+=`<td style="color:${color}">${diff>0?"+":""}${diff.toLocaleString()}</td>`;
        } else if(h==="% Change"){
          const [m1,m2]=compMonths.slice(-2);
          const v1=r[m1]||0, v2=r[m2]||0;
          const pct=v1?(((v2-v1)/v1)*100).toFixed(1):0;
          const color=pct>=0?"#22c55e":"#ef4444";
          html+=`<td style="color:${color}">${pct>0?"+":""}${pct}%</td>`;
        } else {
          html+=`<td>${r[h]!==undefined?r[h].toLocaleString():""}</td>`;
        }
      });
      html+="</tr>";
    });

    tbody.innerHTML=html||`<tr><td colspan="${headers.length}">No Data</td></tr>`;
    hideOverlay();
  },100);
}

const debouncedApply=debounce(applyFilters,200);
["stateFilter","partyFilter","itemFilter","monthFilter","comparisonMonth","showColumns"]
  .forEach(id=>document.getElementById(id).addEventListener("change",debouncedApply));

document.getElementById("selectAllMonths").onclick=()=>{
  const sel=document.getElementById("monthFilter");
  [...sel.options].forEach(o=>o.selected=true);
  debouncedApply();
};
document.getElementById("selectAllComparison").onclick=()=>{
  const sel=document.getElementById("comparisonMonth");
  [...sel.options].forEach(o=>o.selected=true);
  debouncedApply();
};
document.getElementById("clearBtn").onclick=()=>{location.reload();};
document.getElementById("toggleFiltersBtn").onclick=()=>{
  const w=document.getElementById("filtersWrapper");
  const b=document.getElementById("toggleFiltersBtn");
  if(w.style.display==="none"){w.style.display="flex";b.textContent="Hide Filters";}
  else{w.style.display="none";b.textContent="Show Filters";}
};
document.getElementById("exportBtn").onclick=async()=>{
  showOverlay();
  try{
    const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet("Comparison");
    const rows=[...document.querySelectorAll("#comparisonTable tr")].map(tr=>[...tr.children].map(td=>td.innerText.trim()));
    rows.forEach((r,i)=>{const row=ws.addRow(r);if(i===0)row.font={bold:true};});
    ws.columns.forEach(c=>c.width=18);
    const buf=await wb.xlsx.writeBuffer();
    saveAs(new Blob([buf]),`comparison_${new Date().toISOString().slice(0,10)}.xlsx`);
  }finally{hideOverlay();}
};

loadData();
</script>
</body>
</html>
