<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SMC - Plant to Depot Sales Dashboard</title>

<link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>
:root{
  --navy:#1e3a8a;
  --accent1:#2563eb;
  --accent2:#4f46e5;
  --muted:#6b7280;
  --green-bg:#e6ffed;
  --red-bg:#ffecec;
  --subtotal-bg:#fff7cc;
  --grand-bg:#bae6fd;
}

body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0; background:#f6f9fc; color:#0f172a;
}

.header-wrap{
  display:flex; align-items:center; justify-content:center;
  gap:16px; padding:14px 12px;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#fff; box-shadow:0 4px 14px rgba(2,6,23,0.12); position:relative;
}
.header-wrap img.logo{ width:70px; height:70px; object-fit:contain; }
.header-wrap h1{ margin:0; font-weight:900; font-size:1.3rem; text-align:center; }
.toolbar{ position:absolute; right:12px; top:50%; transform:translateY(-50%);
  display:flex; gap:8px; align-items:center; }
.btn{ border:0; padding:8px 10px; border-radius:8px; cursor:pointer; font-weight:700; }
.btn-blue{ background:#fff; color:var(--navy); }
.btn-gray{ background:#eef2ff; color:var(--navy); }

main{ max-width:1400px; margin:18px auto; padding:0 12px; }

.filters-row{
  display:flex; gap:12px; align-items:flex-start; overflow:auto;
  padding:10px 6px; scrollbar-width:thin; margin-bottom:12px;
  transition: opacity .3s ease, max-height .3s ease;
}
.filters-row.hidden{ opacity:0; max-height:0; overflow:hidden; pointer-events:none; }

.filter-box{
  min-width:220px; background:linear-gradient(180deg,#fff,#f7fbff);
  border:2px solid var(--navy); border-radius:10px; padding:10px 12px;
  box-shadow:0 6px 14px rgba(30,58,138,0.06); display:inline-flex; flex-direction:column;
}
.filter-box strong{ text-align:center; color:var(--navy); font-weight:900; margin-bottom:8px; }
.filter-box .options{ max-height:220px; overflow:auto; padding-top:6px; display:flex; flex-direction:column; gap:6px; }
.filter-box label{ display:flex; align-items:center; gap:8px; font-weight:700; cursor:pointer; padding:4px 6px; border-radius:6px; background:#fbfeff; }
.filter-box label.dim{ opacity:.45; }

.table-wrapper{
  background:#fff; border-radius:10px; box-shadow:0 8px 26px rgba(4,8,15,0.06);
  overflow:auto; max-height:72vh; padding:12px;
}
table{ border-collapse:collapse; width:100%; min-width:1000px; }
th, td{ border:1.5px solid #65738a; padding:8px 10px; text-align:center; font-weight:700; vertical-align:middle; }
thead th{ position:sticky; top:0; background:linear-gradient(90deg,#e0e7ff,#c7d2fe); color:var(--navy); z-index:5; }
td.num{ text-align:right; font-weight:800; }

tr.subtotal-row td{ background:var(--subtotal-bg); font-weight:900; }
tr.state-total-row td{ background:var(--grand-bg); font-weight:900; }

.cell-positive{ background:var(--green-bg); }
.cell-negative{ background:var(--red-bg); }

@media (max-width:640px){
  .header-wrap img.logo{ width:50px; height:50px; }
  .header-wrap h1{ font-size:1rem; }
}
</style>
</head>
<body>

<div class="header-wrap">
  <img src="{{ url_for('static', filename='onlylogo.png') }}" class="logo" alt="logo">
  <h1>SMC - Plant to Depot Sales Dashboard</h1>
  <div class="toolbar">
    <a href="/dashboard/plant"><button class="btn btn-gray">← Back to Plant</button></a>
    <button id="exportBtn" class="btn btn-blue">Export</button>
    <button id="clearBtn" class="btn btn-gray">Clear Filters</button>
    <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
  </div>
</div>

<main>
  <div id="filters" class="filters-row">
    <div class="filter-box">
      <strong>Show Columns</strong>
      <div class="options">
        <label><input type="checkbox" name="SHOW_COL" value="STATE" checked> State</label>
        <label><input type="checkbox" name="SHOW_COL" value="PARTY_NAME" checked> Party_Name</label>
        <label><input type="checkbox" name="SHOW_COL" value="ITEM_NAME" checked> Item_Name</label>
      </div>
    </div>

    <div class="filter-box"><strong>State</strong><div class="options" id="stateOptions"></div></div>
    <div class="filter-box"><strong>Party_Name</strong><div class="options" id="partyOptions"></div></div>
    <div class="filter-box"><strong>Item_Name</strong><div class="options" id="itemOptions"></div></div>
    <div class="filter-box"><strong>Comparison_Month</strong><div class="options" id="compMonthOptions"></div></div>
  </div>

  <div class="table-wrapper">
    <table id="comparisonTable">
      <thead id="comparisonHead"></thead>
      <tbody id="comparisonBody"></tbody>
      <tfoot id="comparisonFoot"></tfoot>
    </table>
  </div>
  <div style="margin-top:8px;color:var(--muted)" id="recordsInfo"></div>
</main>

<div id="overlay" style="display:none;position:fixed;inset:0;justify-content:center;align-items:center;background:rgba(255,255,255,0.7);z-index:9999;font-weight:900;color:var(--navy);">
  Processing...
</div>

<script>
const API_URL = "/get_data/lighthouse_sales";
let rawData=[],monthsList=[],allStates=[],allParties=[],allItems=[];
const toNum=v=>Number(v)||0;

function showOverlay(){document.getElementById("overlay").style.display="flex";}
function hideOverlay(){document.getElementById("overlay").style.display="none";}

function parseDateFlexible(s){
  if(!s)return null;
  s=String(s).trim();
  if(/^\d{8}$/.test(s)){const d=+s.slice(0,2),m=+s.slice(2,4),y=+s.slice(4,8);return new Date(y,m-1,d);}
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(s);return isNaN(d.getTime())?null:d;
}
function invoiceMonthLabel(s){const dt=parseDateFlexible(s);if(!dt)return"";return dt.toLocaleString("default",{month:"short",year:"2-digit"});}
function sortMonthsChronologically(a,b){return new Date("01 "+a)-new Date("01 "+b);}
function itemSortKey(item){if(!item)return{p:"",n:Infinity,s:item||""};const s=item.trim();const m=s.match(/^([A-Za-z\W]+?)\s*([0-9]+)?(.*)$/);if(m){return{p:(m[1]||"").trim().toUpperCase(),n:m[2]?+m[2]:Infinity,s:(m[3]||"").trim().toUpperCase(),orig:s};}return{p:s.toUpperCase(),n:Infinity,s:"",orig:s};}
function compareItemNames(a,b){const A=itemSortKey(a),B=itemSortKey(b);if(A.p<B.p)return-1;if(A.p>B.p)return 1;if(A.n<B.n)return-1;if(A.n>B.n)return 1;if(A.s<B.s)return-1;if(A.s>B.s)return 1;return 0;}
function escapeHtml(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
function escapeHtmlAttr(s){return String(s).replaceAll('"',"&quot;").replaceAll("'","&#39;");}

async function loadData(){
  showOverlay();
  try{
    const res=await axios.get(API_URL);
    const data=Array.isArray(res.data)?res.data:[];
    rawData=data.map(r=>{
      const rawDate=(r.invoice_date||r.INVOICE_DATE||"").trim();
      const parsed=parseDateFlexible(rawDate);
      return{
        state:(r.state||r.STATE||"").trim(),
        partyName:(r.party_name||r.PARTY_NAME||"").trim(),
        itemName:(r.item_name||r.ITEM_NAME||"").trim(),
        invoiceMonth:invoiceMonthLabel(rawDate),
        invoiceDateObj:parsed,
        quantityCs:toNum(r.quantity_cs||r.Quantity_CS||0)
      };
    }).filter(r=>r.invoiceMonth);
    allStates=[...new Set(rawData.map(r=>r.state))].sort();
    allParties=[...new Set(rawData.map(r=>r.partyName))].sort();
    allItems=[...new Set(rawData.map(r=>r.itemName))].sort(compareItemNames);
    monthsList=[...new Set(rawData.map(r=>r.invoiceMonth))].sort(sortMonthsChronologically);
    buildFilters();
    preselectLatestTwoMonths();
    applyFilters();
  }catch(e){console.error(e);alert("Failed to load data");}finally{hideOverlay();}
}

function buildFilters(){
  document.getElementById("stateOptions").innerHTML=allStates.map(s=>`<label><input type="checkbox" name="STATE" value="${escapeHtmlAttr(s)}">${escapeHtml(s)}</label>`).join("");
  document.getElementById("partyOptions").innerHTML=allParties.map(s=>`<label><input type="checkbox" name="PARTY" value="${escapeHtmlAttr(s)}">${escapeHtml(s)}</label>`).join("");
  document.getElementById("itemOptions").innerHTML=allItems.map(s=>`<label><input type="checkbox" name="ITEM" value="${escapeHtmlAttr(s)}">${escapeHtml(s)}</label>`).join("");
  document.getElementById("compMonthOptions").innerHTML=monthsList.map(m=>`<label><input type="checkbox" name="COMP_MONTH" value="${escapeHtmlAttr(m)}">${escapeHtml(m)}</label>`).join("");
  document.getElementById("filters").addEventListener("change",()=>{clearTimeout(window._cmpDeb);window._cmpDeb=setTimeout(applyFilters,80);});
}
function preselectLatestTwoMonths(){const i=[...document.querySelectorAll("input[name='COMP_MONTH']")];i.forEach(e=>e.checked=false);const L=monthsList.length;if(L>=1)i.find(x=>x.value===monthsList[L-1])?.checked=true;if(L>=2)i.find(x=>x.value===monthsList[L-2])?.checked=true;}

function applyFilters(){
  showOverlay();
  setTimeout(()=>{
    const showCols=[...document.querySelectorAll("input[name='SHOW_COL']:checked")].map(i=>i.value);
    const selStates=[...document.querySelectorAll("input[name='STATE']:checked")].map(i=>i.value);
    const selParties=[...document.querySelectorAll("input[name='PARTY']:checked")].map(i=>i.value);
    const selItems=[...document.querySelectorAll("input[name='ITEM']:checked")].map(i=>i.value);
    const selMonths=[...document.querySelectorAll("input[name='COMP_MONTH']:checked")].map(i=>i.value).sort(sortMonthsChronologically);
    let filtered=rawData.filter(r=>(!selStates.length||selStates.includes(r.state))&&(!selParties.length||selParties.includes(r.partyName))&&(!selItems.length||selItems.includes(r.itemName))&&(!selMonths.length||selMonths.includes(r.invoiceMonth)));
    const monthsToShow=selMonths.length?selMonths.slice():monthsList.slice();
    const map=new Map();
    filtered.forEach(r=>{
      const key=`${r.state}||${r.partyName}||${r.itemName}`;
      if(!map.has(key))map.set(key,{STATE:r.state,PARTY_NAME:r.partyName,ITEM_NAME:r.itemName,monthValues:{}});
      const o=map.get(key);o.monthValues[r.invoiceMonth]=(o.monthValues[r.invoiceMonth]||0)+r.quantityCs;
    });
    const rows=[...map.values()].sort((a,b)=>a.STATE.localeCompare(b.STATE)||a.PARTY_NAME.localeCompare(b.PARTY_NAME)||compareItemNames(a.ITEM_NAME,b.ITEM_NAME));
    const grouped=new Map();
    rows.forEach(r=>{if(!grouped.has(r.STATE))grouped.set(r.STATE,new Map());const pMap=grouped.get(r.STATE);if(!pMap.has(r.PARTY_NAME))pMap.set(r.PARTY_NAME,[]);pMap.get(r.PARTY_NAME).push(r);});
    renderTable({grouped,monthsToShow,showCols});
    hideOverlay();
  },60);
}

function renderTable({grouped,monthsToShow,showCols}){
  const head=document.getElementById("comparisonHead"),body=document.getElementById("comparisonBody"),foot=document.getElementById("comparisonFoot");
  const cols=showCols.length?showCols:["STATE","PARTY_NAME","ITEM_NAME"];
  const monthCols=monthsToShow.slice();
  const showComparison=monthCols.length>=2;
  const compFirst=showComparison?monthCols[0]:null;
  const compLast=showComparison?monthCols[monthCols.length-1]:null;
  const headers=[...cols.map(c=>`<th>${c.replace(/_/g," ")}</th>`),...monthCols.map(m=>`<th>${m}</th>`)];
  if(showComparison){headers.push(`<th>Δ (${compLast}-${compFirst})</th>`);headers.push("<th>% Change</th>");}
  head.innerHTML=`<tr>${headers.join("")}</tr>`;
  let html="";
  grouped.forEach((pMap,state)=>{
    pMap.forEach((items,party)=>{
      items.forEach(r=>{
        html+="<tr>";
        cols.forEach(c=>html+=`<td>${escapeHtml(r[c])}</td>`);
        monthCols.forEach(m=>html+=`<td class='num'>${(r.monthValues[m]||0).toLocaleString()}</td>`);
        if(showComparison){
          const first=r.monthValues[compFirst]||0,last=r.monthValues[compLast]||0,delta=last-first,pct=first?((delta/first)*100):null;
          html+=`<td class='num ${delta>0?'cell-positive':'cell-negative'}'>${delta.toLocaleString()}</td>`;
          html+=`<td class='num ${(pct??0)>0?'cell-positive':'cell-negative'}'>${pct===null?'N/A':pct.toFixed(1)+'%'}</td>`;
        }
        html+="</tr>";
      });
    });
  });
  body.innerHTML=html||"<tr><td colspan='10'>No data</td></tr>";
  foot.innerHTML="";
  document.getElementById("recordsInfo").textContent=`Groups: ${[...grouped.keys()].length}`;
}

document.getElementById("toggleFiltersBtn").addEventListener("click",()=>{
  const f=document.getElementById("filters");
  const btn=document.getElementById("toggleFiltersBtn");
  const hidden=f.classList.toggle("hidden");
  btn.textContent=hidden?"Show Filters":"Hide Filters";
});

document.getElementById("clearBtn").addEventListener("click",()=>{
  document.querySelectorAll("input[name='STATE'],input[name='PARTY'],input[name='ITEM'],input[name='COMP_MONTH']").forEach(cb=>cb.checked=false);
  preselectLatestTwoMonths();
  applyFilters();
});

document.getElementById("exportBtn").addEventListener("click",async()=>{
  showOverlay();
  try{
    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet("Comparison");
    [...document.querySelectorAll("#comparisonTable tr")].map(tr=>[...tr.children].map(td=>td.innerText.trim())).forEach((r,i)=>{const row=ws.addRow(r);if(i===0)row.font={bold:true};});
    ws.columns.forEach(c=>c.width=18);
    const buf=await wb.xlsx.writeBuffer();
    saveAs(new Blob([buf]),`comparison_${new Date().toISOString().slice(0,10)}.xlsx`);
  }catch(e){console.error(e);alert("Export failed");}finally{hideOverlay();}
});

loadData();
</script>
</body>
</html>
