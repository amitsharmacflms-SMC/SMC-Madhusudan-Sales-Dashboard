<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SMC Lighthouse - Comparison</title>

<link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>
:root{--navy:#1e3a8a;--accent1:#2563eb;--accent2:#4f46e5;--green:#dff7e6;--red:#ffe6e6;}
body{font-family:Inter,system-ui,Arial;margin:0;background:#f6f9fc;color:#0f172a;}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;}
.header-left{display:flex;align-items:center;gap:12px;}
.header-center{flex:1;text-align:center;font-weight:900;font-size:1.05rem}
.toolbar{display:flex;gap:8px;align-items:center;}
.btn{border:0;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:700}
.btn-blue{background:#fff;color:var(--navy)}
.btn-gray{background:#eef2ff;color:var(--navy)}
main{max-width:1400px;margin:18px auto;padding:12px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#filtersWrapper{transition:all .2s ease}
#filtersContainer{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.filter-box{background:linear-gradient(180deg,#fff,#f7f9ff);border:1.8px solid var(--navy);border-radius:10px;padding:10px;flex:1 1 240px;box-shadow:0 6px 18px rgba(30,58,138,0.05)}
.filter-box strong{display:block;text-align:center;color:var(--navy);font-weight:800;margin-bottom:8px}
.filter-box .options{max-height:220px;overflow:auto;padding-top:6px}
.filter-box label{display:block;padding:6px;border-radius:6px;margin:4px 2px;background:#fff;font-weight:700;cursor:pointer}
.filter-box label.dim{opacity:.45}
.table-wrapper{background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(4,8,15,0.05);overflow:auto;max-height:72vh}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{border:1.5px solid #65738a;padding:6px 8px;text-align:center;font-weight:700}
thead th{position:sticky;top:0;background:linear-gradient(90deg,#e0e7ff,#c7d2fe);z-index:5;color:var(--navy)}
tr.subtotal-row td{background:#fff7cc;font-weight:900}
tr.total-row td{background:#e6f0ff;font-weight:900}
tr.grandtotal-row td{background:#bae6fd;font-weight:900}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.7);z-index:3000;font-weight:900;color:var(--navy)}
.overlay.show{display:flex}
.small{font-size:.875rem;color:#6b7280}
.legend{display:flex;gap:8px;align-items:center}
.legend div{padding:6px 8px;border-radius:6px;font-weight:800}
.green{background:var(--green)}
.red{background:var(--red)}
@media(max-width:900px){.filter-box{flex:1 1 100%}th,td{font-size:.85rem}}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo" style="height:40px">
  </div>
  <div class="header-center">SMC - Plant to Depot Sales Dashboard</div>
  <div class="toolbar">
    <a href="/dashboard/plant"><button class="btn btn-gray">← Back to Plant</button></a>
    <button id="exportBtn" class="btn btn-blue">Export</button>
    <button id="clearBtn" class="btn btn-gray">Clear Filters</button>
    <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
  </div>
</header>

<main>
  <div class="controls">
    From: <input type="date" id="dateFrom">
    To: <input type="date" id="dateTo">
    Invoice Month: <select id="monthQuick"><option value="">--All--</option></select>
    <div style="margin-left:auto" class="legend small">
      <div class="green">▲ Positive</div>
      <div class="red">▼ Zero / Negative</div>
    </div>
  </div>

  <div id="filtersWrapper">
    <div id="filtersContainer"></div>
  </div>

  <div class="table-wrapper" aria-live="polite">
    <table id="comparisonTable" role="table" aria-label="Comparison table">
      <thead id="comparisonHead"></thead>
      <tbody id="comparisonBody"></tbody>
      <tfoot id="comparisonFoot"></tfoot>
    </table>
  </div>
</main>

<div id="overlay" class="overlay">Processing...</div>

<script>
/* Configuration */
const API_URL = "/get_data/lighthouse_sales";
const COLUMN_KEYS = {
  STATE: "State",
  PARTY: "Party_Name",
  ITEM: "Item_Name",
  INVOICE_MONTH: "Invoice_Month",
  QTY_CS: "Quantity_CS",
  DIFF: "Difference",
  PCT: "% Change"
};
let rawData = [];
let allStates = [], allParties = [], allItems = [], allMonths = [];

/* Helpers */
function showOverlay(){ document.getElementById('overlay').classList.add('show'); }
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function toNum(v){ return Number(v)||0; }
function parseDateFlexible(s){
  if(!s) return null;
  s = String(s).trim();
  if(/^\d{8}$/.test(s)){ const d=+s.slice(0,2), m=+s.slice(2,4), y=+s.slice(4,8); return new Date(y,m-1,d); }
  const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(iso) return new Date(+iso[1],+iso[2]-1,+iso[3]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function monthLabelShort(s){
  const dt = parseDateFlexible(s);
  if(!dt) return "";
  return dt.toLocaleString('default', { month: 'short', year: '2-digit' }); // e.g. "Sep 25"
}
function monthSortKey(monLabel){
  // input like "Sep 25" => returns Date for 1 Sep 2025
  const parts = monLabel.split(' ');
  if(parts.length<2) return new Date(0);
  const month = Date.parse(parts[0] + " 1, 20" + parts[1]); // '20' + '25'
  return new Date(month);
}
function escapeHtml(s){ return String(s||"").replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

/* Load data */
async function loadData(){
  showOverlay();
  try{
    const res = await axios.get(API_URL);
    const data = Array.isArray(res.data) ? res.data : [];
    rawData = data.map(r=>{
      const rawDate = (r.invoice_date || r.INVOICE_DATE || "").toString().trim();
      const dt = parseDateFlexible(rawDate);
      const invoiceMonth = monthLabelShort(rawDate);
      return {
        state: (r.state || r.STATE || "").toString().trim(),
        party: (r.party_name || r.PARTY_NAME || "").toString().trim(),
        item: (r.item_name || r.ITEM_NAME || "").toString().trim(),
        invoice_date_obj: dt,
        invoice_date: dt ? `${String(dt.getDate()).padStart(2,'0')}${String(dt.getMonth()+1).padStart(2,'0')}${dt.getFullYear()}` : "",
        invoice_month: invoiceMonth,
        quantity_cs: toNum(r.quantity_cs || r.Quantity_CS || 0),
        quantity_kg: toNum(r.quantity_kg || r.Quantity_KG || 0),
        bill_amount: toNum(r.bill_amount || r.Bill_Amount || 0)
      };
    }).filter(r => r.invoice_month); // keep rows with month label

    allStates = [...new Set(rawData.map(r=>r.state).filter(Boolean))].sort();
    allParties = [...new Set(rawData.map(r=>r.party).filter(Boolean))].sort();
    allItems = [...new Set(rawData.map(r=>r.item).filter(Boolean))].sort();
    allMonths = [...new Set(rawData.map(r=>r.invoice_month).filter(Boolean))].sort((a,b)=>monthSortKey(a)-monthSortKey(b));

    // populate monthQuick
    const monthQuick = document.getElementById("monthQuick");
    monthQuick.innerHTML = `<option value="">--All--</option>` + allMonths.map(m=>`<option value="${m}">${m}</option>`).join("");

    // default dates to current month
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
    document.getElementById("dateFrom").value = `${first.getFullYear()}-${String(first.getMonth()+1).padStart(2,'0')}-${String(first.getDate()).padStart(2,'0')}`;
    document.getElementById("dateTo").value = `${last.getFullYear()}-${String(last.getMonth()+1).padStart(2,'0')}-${String(last.getDate()).padStart(2,'0')}`;

    buildFilters();
    applyFilters();
  } catch(err){
    console.error("loadData:", err);
    alert("Failed to load comparison data.");
  } finally{ hideOverlay(); }
}

/* Build filters (SHOW COLUMNS first) */
function buildFilters(){
  const container = document.getElementById("filtersContainer");
  container.innerHTML = "";

  // Show Columns (defaults checked)
  const showCols = ["State","Party_Name","Item_Name"];
  const showHtml = showCols.map(v => `<label><input type="checkbox" name="SHOW_COLUMNS" value="${escapeHtml(v)}" checked> ${escapeHtml(v)}</label>`).join("");
  container.insertAdjacentHTML('beforeend', `<div class="filter-box"><strong>Show Columns</strong><div class="options">${showHtml}</div></div>`);

  // Invoice Month filter (multi)
  const monthsHtml = allMonths.map(m => `<label><input type="checkbox" name="INVOICE_MONTH" value="${escapeHtml(m)}"> ${escapeHtml(m)}</label>`).join("");
  container.insertAdjacentHTML('beforeend', `<div class="filter-box"><strong>Invoice_Month</strong><label><input type="checkbox" data-all="INVOICE_MONTH"> All</label><div class="options">${monthsHtml}</div></div>`);

  // Comparison Month filter (multi)
  container.insertAdjacentHTML('beforeend', `<div class="filter-box"><strong>Comparison_Month</strong><label><input type="checkbox" data-all="CMP_MONTH"> All</label><div class="options">${monthsHtml}</div></div>`);

  // State, Party, Item filters
  const stateHtml = allStates.map(v=>`<label><input type="checkbox" name="STATE" value="${escapeHtml(v)}"> ${escapeHtml(v)}</label>`).join("");
  container.insertAdjacentHTML('beforeend', `<div class="filter-box"><strong>State</strong><label><input type="checkbox" data-all="STATE"> All</label><div class="options">${stateHtml}</div></div>`);
  const partyHtml = allParties.map(v=>`<label><input type="checkbox" name="PARTY" value="${escapeHtml(v)}"> ${escapeHtml(v)}</label>`).join("");
  container.insertAdjacentHTML('beforeend', `<div class="filter-box"><strong>Party_Name</strong><label><input type="checkbox" data-all="PARTY"> All</label><div class="options">${partyHtml}</div></div>`);
  const itemHtml = allItems.map(v=>`<label><input type="checkbox" name="ITEM" value="${escapeHtml(v)}"> ${escapeHtml(v)}</label>`).join("");
  container.insertAdjacentHTML('beforeend', `<div class="filter-box"><strong>Item_Name</strong><label><input type="checkbox" data-all="ITEM"> All</label><div class="options">${itemHtml}</div></div>`);

  // wire "All" checkboxes
  container.querySelectorAll("input[data-all]").forEach(cb=>{
    cb.addEventListener('change', e=>{
      const grp = e.target.dataset.all;
      if(grp === "CMP_MONTH"){ container.querySelectorAll(`input[name="Comparison_Month"], input[name='CMP_PLACEHOLDER']`); } // no-op
      container.querySelectorAll(`input[name="${grp}"], input[name='${grp}']`).forEach(i=>i.checked = e.target.checked);
      // fallback: target names differ; we will simply toggle matching name attributes where used
      if(grp === "INVOICE_MONTH") container.querySelectorAll(`input[name='INVOICE_MONTH']`).forEach(i=>i.checked = e.target.checked);
      if(grp === "CMP_MONTH") container.querySelectorAll(`.filter-box strong`).forEach(()=>{}); // placeholder
      // For our implementation we used names: INVOICE_MONTH, Comparison_Month -> handle directly:
      if(cb.closest('.filter-box')?.querySelector('strong')?.textContent.trim() === "Comparison_Month"){
        container.querySelectorAll(`input[name='Comparison_Month']`).forEach(i=>i.checked = e.target.checked);
      }
      if(cb.closest('.filter-box')?.querySelector('strong')?.textContent.trim() === "INVOICE_MONTH"){
        container.querySelectorAll(`input[name='INVOICE_MONTH']`).forEach(i=>i.checked = e.target.checked);
      }
      if(cb.closest('.filter-box')?.querySelector('strong')?.textContent.trim() === "STATE"){
        container.querySelectorAll(`input[name='STATE']`).forEach(i=>i.checked = e.target.checked);
      }
      if(cb.closest('.filter-box')?.querySelector('strong')?.textContent.trim() === "PARTY_Name" || cb.closest('.filter-box')?.querySelector('strong')?.textContent.trim() === "Party_Name"){
        container.querySelectorAll(`input[name='PARTY']`).forEach(i=>i.checked = e.target.checked);
      }
      if(cb.closest('.filter-box')?.querySelector('strong')?.textContent.trim() === "ITEM_NAME" || cb.closest('.filter-box')?.querySelector('strong')?.textContent.trim() === "Item_Name"){
        container.querySelectorAll(`input[name='ITEM']`).forEach(i=>i.checked = e.target.checked);
      }
      setTimeout(applyFilters, 80);
    });
  });

  // Listen for changes
  container.addEventListener('change', (e)=> {
    // small debounce handled by applyFilters itself
    setTimeout(applyFilters, 120);
  });
}

/* Utility to read selections */
function readSelections(){
  const sel = {};
  document.querySelectorAll(".filter-box strong").forEach(h=>{
    const k = h.textContent.trim();
    // names used: SHOW_COLUMNS (inputs name SHOW_COLUMNS), INVOICE_MONTH, Comparison_Month, STATE, PARTY, ITEM
    if(k === "Show Columns"){
      sel.SHOW_COLUMNS = [...document.querySelectorAll(`input[name='SHOW_COLUMNS']:checked`)].map(i=>i.value);
    } else if(k === "Invoice_Month"){
      sel.INVOICE_MONTH = [...document.querySelectorAll(`input[name='INVOICE_MONTH']:checked`)].map(i=>i.value);
    } else if(k === "Comparison_Month"){
      sel.COMPARISON_MONTH = [...document.querySelectorAll(`input[name='Comparison_Month']:checked`)].map(i=>i.value);
    } else if(k === "State"){
      sel.STATE = [...document.querySelectorAll(`input[name='STATE']:checked`)].map(i=>i.value);
    } else if(k === "Party_Name"){
      sel.PARTY = [...document.querySelectorAll(`input[name='PARTY']:checked`)].map(i=>i.value);
    } else if(k === "Item_Name"){
      sel.ITEM = [...document.querySelectorAll(`input[name='ITEM']:checked`)].map(i=>i.value);
    }
  });
  return sel;
}

/* Apply filters, cascade, aggregation, render */
function applyFilters(){
  showOverlay();
  setTimeout(()=>{
    const sel = readSelections();
    // date range
    const fromISO = document.getElementById("dateFrom").value;
    const toISO = document.getElementById("dateTo").value;
    const fromD = fromISO ? new Date(fromISO + "T00:00:00") : null;
    const toD = toISO ? new Date(toISO + "T23:59:59") : null;
    // Invoice month quick
    const monthQuick = document.getElementById("monthQuick").value;
    // Build preview for cascade
    let preview = [...rawData];
    if(monthQuick) preview = preview.filter(r=> r.invoice_month === monthQuick);
    else if(fromD || toD){
      preview = preview.filter(r=>{
        const d = r.invoice_date_obj;
        if(!d) return false;
        if(fromD && d < fromD) return false;
        if(toD && d > toD) return false;
        return true;
      });
    }
    if(sel.STATE && sel.STATE.length) preview = preview.filter(r => sel.STATE.includes(r.state));
    if(sel.PARTY && sel.PARTY.length) preview = preview.filter(r => sel.PARTY.includes(r.party));
    if(sel.ITEM && sel.ITEM.length) preview = preview.filter(r => sel.ITEM.includes(r.item));

    // Smart cascade: mark options invalid but keep them selectable (dim)
    const validStates = new Set(preview.map(r=>r.state));
    const validParties = new Set(preview.map(r=>r.party));
    const validItems = new Set(preview.map(r=>r.item));
    document.querySelectorAll("input[name='STATE']").forEach(cb=>{
      const lbl = cb.closest('label');
      if(validStates.has(cb.value) || cb.checked) lbl.classList.remove('dim'); else lbl.classList.add('dim');
    });
    document.querySelectorAll("input[name='PARTY']").forEach(cb=>{
      const lbl = cb.closest('label');
      if(validParties.has(cb.value) || cb.checked) lbl.classList.remove('dim'); else lbl.classList.add('dim');
    });
    document.querySelectorAll("input[name='ITEM']").forEach(cb=>{
      const lbl = cb.closest('label');
      if(validItems.has(cb.value) || cb.checked) lbl.classList.remove('dim'); else lbl.classList.add('dim');
    });

    // Final filtered data for rendering
    let filtered = [...rawData];
    if(monthQuick) filtered = filtered.filter(r=> r.invoice_month === monthQuick);
    else if(fromD || toD){
      filtered = filtered.filter(r=>{
        const d = r.invoice_date_obj; if(!d) return false;
        if(fromD && d < fromD) return false;
        if(toD && d > toD) return false;
        return true;
      });
    }
    if(sel.STATE && sel.STATE.length) filtered = filtered.filter(r => sel.STATE.includes(r.state));
    if(sel.PARTY && sel.PARTY.length) filtered = filtered.filter(r => sel.PARTY.includes(r.party));
    if(sel.ITEM && sel.ITEM.length) filtered = filtered.filter(r => sel.ITEM.includes(r.item));
    // Invoice month filter (to determine visible month columns)
    const visibleMonths = sel.INVOICE_MONTH && sel.INVOICE_MONTH.length ? sel.INVOICE_MONTH.slice().sort((a,b)=>monthSortKey(a)-monthSortKey(b)) : allMonths.slice();
    // Comparison months selected
    const cmpMonths = sel.COMPARISON_MONTH && sel.COMPARISON_MONTH.length ? sel.COMPARISON_MONTH.slice().sort((a,b)=>monthSortKey(a)-monthSortKey(b)) : [];

    // Aggregate: group by state -> party -> item -> month sums
    // structure: stateMap[state][party][item][month] = sum
    const stateMap = new Map();
    filtered.forEach(r=>{
      const st = r.state || "Undefined";
      const pa = r.party || "Undefined";
      const it = r.item || "Undefined";
      const mo = r.invoice_month || "";
      if(!stateMap.has(st)) stateMap.set(st, new Map());
      const partyMap = stateMap.get(st);
      if(!partyMap.has(pa)) partyMap.set(pa, new Map());
      const itemMap = partyMap.get(pa);
      if(!itemMap.has(it)) itemMap.set(it, {});
      const row = itemMap.get(it);
      row[mo] = (row[mo]||0) + toNum(r.quantity_cs);
    });

    // Build rows array for rendering and totals
    const monthsToShow = visibleMonths.slice().sort((a,b)=>monthSortKey(a)-monthSortKey(b));
    const headerCols = [COLUMN_KEYS.STATE, COLUMN_KEYS.PARTY, COLUMN_KEYS.ITEM, ...monthsToShow];
    const showColumnsSelected = (sel.SHOW_COLUMNS && sel.SHOW_COLUMNS.length) ? sel.SHOW_COLUMNS : ["State","Party_Name","Item_Name"];

    // If comparison months chosen, append Comparison columns: Difference and % Change (difference between last and first selected months)
    const showComparison = cmpMonths.length >= 1;
    const cmpFirst = cmpMonths.length ? cmpMonths[0] : null;
    const cmpLast = cmpMonths.length ? cmpMonths[cmpMonths.length-1] : null;

    // Render header
    const thead = document.getElementById("comparisonHead");
    let headHtml = "<tr>";
    // ensure showColumnsSelected order: State/Party/Item first
    const showOrder = ["State","Party_Name","Item_Name"];
    showOrder.forEach(col => {
      if(showColumnsSelected.includes(col)) headHtml += `<th>${escapeHtml(col)}</th>`;
    });
    monthsToShow.forEach(m => headHtml += `<th>${escapeHtml(m)}</th>`);
    if(showComparison){
      headHtml += `<th>${escapeHtml(COLUMN_KEYS.DIFF)}</th><th>${escapeHtml(COLUMN_KEYS.PCT)}</th>`;
    }
    headHtml += "</tr>";
    thead.innerHTML = headHtml;

    // Render body
    const tbody = document.getElementById("comparisonBody");
    let bodyHtml = "";
    let grandTotals = Object.fromEntries(monthsToShow.map(m=>[m,0]));
    // iterate states
    stateMap.forEach((partyMap, state)=>{
      // state total per month
      let stateTotals = Object.fromEntries(monthsToShow.map(m=>[m,0]));
      partyMap.forEach((itemMap, party)=>{
        // party total per month
        let partyTotals = Object.fromEntries(monthsToShow.map(m=>[m,0]));
        itemMap.forEach((monthObj, item)=>{
          // item row
          bodyHtml += "<tr>";
          if(showColumnsSelected.includes("State")) bodyHtml += `<td>${escapeHtml(state)}</td>`;
          if(showColumnsSelected.includes("Party_Name")) bodyHtml += `<td>${escapeHtml(party)}</td>`;
          if(showColumnsSelected.includes("Item_Name")) bodyHtml += `<td>${escapeHtml(item)}</td>`;

          monthsToShow.forEach(m=>{
            const val = toNum(monthObj[m] || 0);
            bodyHtml += `<td>${val.toLocaleString()}</td>`;
            partyTotals[m] += val;
            stateTotals[m] += val;
            grandTotals[m] += val;
          });

          // comparison cells per item (difference between last & first selected months)
          if(showComparison){
            const firstVal = toNum(monthObj[cmpFirst] || 0);
            const lastVal = toNum(monthObj[cmpLast] || 0);
            const diff = lastVal - firstVal;
            const pct = (firstVal === 0) ? null : (diff / firstVal) * 100;
            const diffClass = diff > 0 ? "green" : "red";
            const pctClass = (pct !== null && pct > 0) ? "green" : "red";
            bodyHtml += `<td class="${diffClass}">${diff.toLocaleString()}</td>`;
            const pctText = (pct === null) ? "-" : `${pct>=0?"+":""}${pct.toFixed(1)}%`;
            bodyHtml += `<td class="${pctClass}">${pctText}</td>`;
          }

          bodyHtml += "</tr>";
        });

        // Party subtotal row
        bodyHtml += `<tr class="subtotal-row">`;
        if(showColumnsSelected.includes("State")) bodyHtml += `<td></td>`;
        if(showColumnsSelected.includes("Party_Name")) bodyHtml += `<td><b>SUM ${escapeHtml(party)}</b></td>`; else bodyHtml += `<td></td>`;
        if(showColumnsSelected.includes("Item_Name")) bodyHtml += `<td></td>`;
        monthsToShow.forEach(m=>{
          bodyHtml += `<td><b>${partyTotals[m].toLocaleString()}</b></td>`;
        });
        if(showComparison){
          // compute party-level cmp sums
          const partyFirst = partyTotals[cmpFirst] || 0;
          const partyLast = partyTotals[cmpLast] || 0;
          const diffP = partyLast - partyFirst;
          const pctP = (partyFirst === 0) ? null : (diffP / partyFirst) * 100;
          const diffClassP = diffP > 0 ? "green" : "red";
          const pctClassP = (pctP !== null && pctP > 0) ? "green" : "red";
          bodyHtml += `<td class="${diffClassP}"><b>${diffP.toLocaleString()}</b></td>`;
          const pctTextP = (pctP===null) ? "-" : `${pctP>=0?"+":""}${pctP.toFixed(1)}%`;
          bodyHtml += `<td class="${pctClassP}"><b>${pctTextP}</b></td>`;
        }
        bodyHtml += `</tr>`;
      });

      // State total row
      bodyHtml += `<tr class="total-row">`;
      if(showColumnsSelected.includes("State")) bodyHtml += `<td><b>TOTAL ${escapeHtml(state)}</b></td>`; else bodyHtml += `<td></td>`;
      if(showColumnsSelected.includes("Party_Name")) bodyHtml += `<td></td>`;
      if(showColumnsSelected.includes("Item_Name")) bodyHtml += `<td></td>`;
      monthsToShow.forEach(m=>{
        bodyHtml += `<td><b>${stateTotals[m].toLocaleString()}</b></td>`;
      });
      if(showComparison){
        const stFirst = stateTotals[cmpFirst] || 0;
        const stLast = stateTotals[cmpLast] || 0;
        const diffS = stLast - stFirst;
        const pctS = (stFirst === 0) ? null : (diffS / stFirst) * 100;
        const diffClassS = diffS > 0 ? "green" : "red";
        const pctClassS = (pctS !== null && pctS > 0) ? "green" : "red";
        bodyHtml += `<td class="${diffClassS}"><b>${diffS.toLocaleString()}</b></td>`;
        bodyHtml += `<td class="${pctClassS}"><b>${pctS===null?'-':(pctS>=0?'+':'')+pctS.toFixed(1)+'%'}</b></td>`;
      }
      bodyHtml += `</tr>`;
    });

    tbody.innerHTML = bodyHtml || `<tr><td colspan="${3 + monthsToShow.length + (showComparison?2:0)}">No data</td></tr>`;

    // Grand total footer
    const tfoot = document.getElementById("comparisonFoot");
    let footHtml = `<tr class="grandtotal-row">`;
    if(showColumnsSelected.includes("State")) footHtml += `<td><b>GRAND TOTAL</b></td>`; else footHtml += `<td></td>`;
    if(showColumnsSelected.includes("Party_Name")) footHtml += `<td></td>`; else footHtml += `<td></td>`;
    if(showColumnsSelected.includes("Item_Name")) footHtml += `<td></td>`; else footHtml += `<td></td>`;
    monthsToShow.forEach(m=>{
      footHtml += `<td><b>${grandTotals[m].toLocaleString()}</b></td>`;
    });
    if(showComparison){
      const grandFirst = grandTotals[cmpFirst] || 0;
      const grandLast = grandTotals[cmpLast] || 0;
      const grandDiff = grandLast - grandFirst;
      const grandPct = (grandFirst === 0) ? null : (grandDiff / grandFirst) * 100;
      const diffClassG = grandDiff > 0 ? "green" : "red";
      const pctClassG = (grandPct !== null && grandPct > 0) ? "green" : "red";
      footHtml += `<td class="${diffClassG}"><b>${grandDiff.toLocaleString()}</b></td>`;
      footHtml += `<td class="${pctClassG}"><b>${grandPct===null?'-':(grandPct>=0?'+':'')+grandPct.toFixed(1)+'%'}</b></td>`;
    }
    footHtml += `</tr>`;
    tfoot.innerHTML = footHtml;

    hideOverlay();
  }, 60);
}

/* UI events */
document.getElementById("toggleFiltersBtn").addEventListener("click", ()=>{
  const wrapper = document.getElementById("filtersWrapper");
  const btn = document.getElementById("toggleFiltersBtn");
  if(wrapper.style.display === "none" || wrapper.style.display === ""){
    wrapper.style.display = "block";
    btn.textContent = "Hide Filters";
  } else {
    wrapper.style.display = "none";
    btn.textContent = "Show Filters";
  }
});
document.getElementById("clearBtn").addEventListener("click", ()=>{
  // clear checkboxes, reset dates to current month, reset months quick
  document.querySelectorAll("#filtersContainer input[type=checkbox]").forEach(cb=> cb.checked = false );
  // default Show Columns back to checked
  document.querySelectorAll(`input[name='SHOW_COLUMNS']`).forEach(cb=> cb.checked = true );
  document.getElementById("monthQuick").value = "";
  const now = new Date(), first = new Date(now.getFullYear(), now.getMonth(), 1), last = new Date(now.getFullYear(), now.getMonth()+1, 0);
  document.getElementById("dateFrom").value = `${first.getFullYear()}-${String(first.getMonth()+1).padStart(2,'0')}-${String(first.getDate()).padStart(2,'0')}`;
  document.getElementById("dateTo").value = `${last.getFullYear()}-${String(last.getMonth()+1).padStart(2,'0')}-${String(last.getDate()).padStart(2,'0')}`;
  setTimeout(applyFilters, 100);
});
document.getElementById("monthQuick").addEventListener("change", (e)=>{
  const val = e.target.value;
  if(!val){ applyFilters(); return; }
  const [mon, yr] = val.split(' ');
  const monthIdx = new Date(`${mon} 1, 20${yr}`).getMonth();
  const first = new Date(`20${yr}`, monthIdx, 1);
  const last = new Date(`20${yr}`, monthIdx+1, 0);
  document.getElementById("dateFrom").value = `${first.getFullYear()}-${String(first.getMonth()+1).padStart(2,'0')}-${String(first.getDate()).padStart(2,'0')}`;
  document.getElementById("dateTo").value = `${last.getFullYear()}-${String(last.getMonth()+1).padStart(2,'0')}-${String(last.getDate()).padStart(2,'0')}`;
  applyFilters();
});
document.getElementById("exportBtn").addEventListener("click", async ()=>{
  showOverlay();
  try{
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet("Comparison");
    const rows = [...document.querySelectorAll("#comparisonTable tr")].map(tr=> [...tr.children].map(td=> td.innerText.trim() ));
    rows.forEach((r,i)=>{ const row = ws.addRow(r); if(i===0) row.font = {bold:true}; });
    ws.columns.forEach(c=> c.width = 16 );
    const buf = await wb.xlsx.writeBuffer();
    saveAs(new Blob([buf]), `comparison_${new Date().toISOString().slice(0,10)}.xlsx`);
  } catch(e){ console.error("Export failed", e); alert("Export failed: " + e.message); }
  finally{ hideOverlay(); }
});

/* Initialize */
loadData();
</script>
</body>
