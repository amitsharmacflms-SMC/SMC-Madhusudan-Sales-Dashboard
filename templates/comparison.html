<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SMC - Plant to Depot Sales Dashboard</title>

<link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>
:root{
  --navy:#1e3a8a;
  --accent1:#2563eb;
  --accent2:#4f46e5;
  --green-bg: #dff7e6;
  --red-bg: #ffe6e6;
}
* {box-sizing:border-box}
body{font-family:Inter,system-ui,Arial;margin:0;background:#f6f9fc;color:#0f172a}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff}
header .left{display:flex;align-items:center;gap:12px}
header h1{margin:0;font-weight:900;font-size:1.05rem;text-align:center;flex:1}
.toolbar{display:flex;gap:8px;align-items:center}
.btn{border:0;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:700}
.btn-blue{background:#fff;color:var(--navy)}
.btn-gray{background:#eef2ff;color:var(--navy)}

main{max-width:1400px;margin:16px auto;padding:12px}
.filters-row{display:flex;gap:10px;align-items:center;overflow:auto;padding-bottom:6px;margin-bottom:8px}
.filter-box{background:#fff;border:1px solid #e6eef9;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.filter-box strong{font-weight:800;color:var(--navy);margin-right:6px}
.filter-box .options{display:flex;gap:8px;align-items:center}
.filter-box label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;padding:4px}
.filter-box label.dim{opacity:.45}

.table-wrapper{background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(4,8,15,0.05);overflow:auto;max-height:72vh}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{border:1.4px solid #9aa7b2;padding:6px 8px;text-align:center;font-weight:700}
thead th{position:sticky;top:0;background:linear-gradient(90deg,#e0e7ff,#c7d2fe);z-index:5;color:var(--navy)}
tr.subtotal-row td{background:#fff7cc;font-weight:900}
tr.state-total td{background:#dbeefe;font-weight:900}
tr.grandtotal-row td{background:#bae6fd;font-weight:900}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.7);z-index:3000;font-weight:900;color:var(--navy)}
.overlay.show{display:flex}
.small-note{color:#475569;font-weight:700;margin-left:8px}
@media(max-width:900px){ .filter-box{padding:6px} th,td{font-size:.85rem} }
</style>
</head>
<body>
<header>
  <div class="left">
    <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo" style="height:36px">
  </div>

  <h1>SMC - Plant to Depot Sales Dashboard</h1>

  <div class="toolbar">
    <a href="/dashboard/plant"><button class="btn btn-gray">← Back to Plant</button></a>
    <button id="exportBtn" class="btn btn-blue">Export</button>
    <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
    <button id="clearBtn" class="btn btn-gray">Clear</button>
  </div>
</header>

<main>
  <div id="filtersWrapper">
    <div class="filters-row" id="filtersRow">
      <!-- Show Columns -->
      <div class="filter-box" id="showColsBox">
        <strong>Show Columns</strong>
        <div class="options" id="showColsOptions"></div>
      </div>

      <!-- State -->
      <div class="filter-box" id="stateBox">
        <strong>State</strong>
        <div class="options" id="stateOptions"></div>
      </div>

      <!-- Party -->
      <div class="filter-box" id="partyBox">
        <strong>Party_Name</strong>
        <div class="options" id="partyOptions"></div>
      </div>

      <!-- Item -->
      <div class="filter-box" id="itemBox">
        <strong>Item_Name</strong>
        <div class="options" id="itemOptions"></div>
      </div>

      <!-- Comparison Month -->
      <div class="filter-box" id="cmpMonthBox">
        <strong>Comparison Month</strong>
        <div class="options" id="cmpMonthOptions"></div>
      </div>

      <div class="small-note" id="noteInfo"></div>
    </div>
  </div>

  <div class="table-wrapper" aria-live="polite">
    <table id="comparisonTable" role="table" aria-label="Monthly comparison table">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
      <tfoot id="tableFoot"></tfoot>
    </table>
  </div>
</main>

<div id="overlay" class="overlay">Processing...</div>

<script>
/* Comparison page using /get_data/lighthouse_sales
   - Show Columns default: State, Party_Name, Item_Name
   - Comparison Month auto-select latest two months
   - Multi-select filters with smart cascade (dim invalid options; still selectable)
   - Month columns show chronologically; difference & % between earliest & latest selected months
*/

const API_URL = "/get_data/lighthouse_sales";
let rawData = [];
let monthsList = []; // chronological labels like "Sep 25"
let allStates = [], allParties = [], allItems = [];
const DEFAULT_SHOW_COLS = ["State","Party Name","Item Name"];

// small helpers
function showOverlay(){ document.getElementById('overlay').classList.add('show'); }
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function toNum(v){ return Number(v)||0; }
function parseDateFlexible(s){
  if(!s) return null;
  s = String(s).trim();
  if(/^\d{8}$/.test(s)){ const d=+s.slice(0,2),m=+s.slice(2,4),y=+s.slice(4,8); return new Date(y,m-1,d); }
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  const d = new Date(s); return isNaN(d)?null:d;
}
function invoiceMonthLabel(s){ const dt = parseDateFlexible(s); if(!dt) return ""; return dt.toLocaleString('default',{month:'short',year:'2-digit'}); }
function isoMonthSortKey(label){ // convert "Sep 25" to Date for sorting
  const parts = String(label).split(' ');
  if(parts.length<2) return new Date(0);
  const mon = parts[0], yr = parts[1].length===2 ? '20'+parts[1] : parts[1];
  return new Date(`${mon} 01, ${yr}`);
}
function escapeHtml(s){ return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

// load and initialize
async function loadData(){
  showOverlay();
  try{
    const res = await axios.get(API_URL);
    const data = Array.isArray(res.data) ? res.data : [];
    rawData = data.map(r => {
      const raw = (r.invoice_date || r.INVOICE_DATE || r.Invoice_Date || "").toString().trim();
      const dt = parseDateFlexible(raw);
      return {
        state: (r.state || r.STATE || "").toString().trim(),
        party: (r.party_name || r.PARTY_NAME || "").toString().trim(),
        item: (r.item_name || r.ITEM_NAME || "").toString().trim(),
        invoice_date_obj: dt,
        invoice_date_raw: raw,
        invoice_month: invoiceMonthLabel(raw),
        quantity_cs: toNum(r.quantity_cs || r.Quantity_CS || 0),
        quantity_kg: toNum(r.quantity_kg || r.Quantity_KG || 0),
        bill_amount: toNum(r.bill_amount || r.Bill_Amount || 0)
      };
    }).filter(r => r.invoice_date_obj); // remove rows with no valid date

    allStates = [...new Set(rawData.map(r=>r.state).filter(Boolean))].sort();
    allParties = [...new Set(rawData.map(r=>r.party).filter(Boolean))].sort();
    allItems = [...new Set(rawData.map(r=>r.item).filter(Boolean))].sort();

    monthsList = [...new Set(rawData.map(r=>r.invoice_month).filter(Boolean))].sort((a,b)=>isoMonthSortKey(a)-isoMonthSortKey(b));

    buildFilters();
    // default: latest two months auto selected
    const lastTwo = monthsList.slice(-2);
    if(lastTwo.length) {
      // check corresponding checkboxes
      setTimeout(()=> {
        lastTwo.forEach(m => {
          const el = document.querySelector(`#cmpMonthOptions input[value="${m}"]`);
          if(el) el.checked = true;
        });
        applyFilters();
      }, 40);
    } else {
      applyFilters();
    }
  } catch(err){
    console.error("loadData error", err);
    alert("Failed to load data from server. Make sure /get_data/lighthouse_sales is accessible.");
  } finally {
    hideOverlay();
  }
}

/* Build filters UI */
function buildFilters(){
  // show columns
  const showColsOptions = document.getElementById('showColsOptions');
  showColsOptions.innerHTML = '';
  const cols = ["State","Party Name","Item Name"]; // controlled columns only
  cols.forEach(c => {
    const lbl = document.createElement('label');
    const inp = document.createElement('input');
    inp.type = 'checkbox'; inp.name = 'SHOW_COLS'; inp.value = c;
    if(DEFAULT_SHOW_COLS.includes(c)) inp.checked = true;
    inp.addEventListener('change', ()=> applyFilters());
    lbl.appendChild(inp); lbl.appendChild(document.createTextNode(' '+c));
    showColsOptions.appendChild(lbl);
  });

  // state
  const stateOptions = document.getElementById('stateOptions');
  stateOptions.innerHTML = allStates.map(s => `<label><input type="checkbox" name="STATE" value="${escapeHtml(s)}"> ${escapeHtml(s)}</label>`).join('');
  // party
  const partyOptions = document.getElementById('partyOptions');
  partyOptions.innerHTML = allParties.map(s => `<label><input type="checkbox" name="PARTY" value="${escapeHtml(s)}"> ${escapeHtml(s)}</label>`).join('');
  // item
  const itemOptions = document.getElementById('itemOptions');
  itemOptions.innerHTML = allItems.map(s => `<label><input type="checkbox" name="ITEM" value="${escapeHtml(s)}"> ${escapeHtml(s)}</label>`).join('');

  // comparison months
  const cmpMonthOptions = document.getElementById('cmpMonthOptions');
  cmpMonthOptions.innerHTML = monthsList.map(m => `<label><input type="checkbox" name="CMP_MONTH" value="${escapeHtml(m)}"> ${escapeHtml(m)}</label>`).join('');

  // wire change listeners
  ['STATE','PARTY','ITEM','CMP_MONTH','SHOW_COLS'].forEach(name => {
    document.querySelectorAll(`input[name='${name}']`).forEach(i => i.addEventListener('change', ()=> applyFilters()));
  });

  // note
  document.getElementById('noteInfo').textContent = 'Tip: Select multiple months to compare (Difference & % show when 2+ selected).';
}

/* Read selections */
function getSelections(){
  const showCols = [...document.querySelectorAll("input[name='SHOW_COLS']:checked")].map(i=>i.value);
  const states = [...document.querySelectorAll("input[name='STATE']:checked")].map(i=>i.value);
  const parties = [...document.querySelectorAll("input[name='PARTY']:checked")].map(i=>i.value);
  const items = [...document.querySelectorAll("input[name='ITEM']:checked")].map(i=>i.value);
  const cmpMonths = [...document.querySelectorAll("input[name='CMP_MONTH']:checked")].map(i=>i.value)
    .sort((a,b)=>isoMonthSortKey(a)-isoMonthSortKey(b)); // chronological
  return {showCols, states, parties, items, cmpMonths};
}

/* Smart cascade (dim invalid options but keep selectable) */
function updateCascades(filteredPreview){
  const validStates = new Set(filteredPreview.map(r=>r.state));
  const validParties = new Set(filteredPreview.map(r=>r.party));
  const validItems = new Set(filteredPreview.map(r=>r.item));

  document.querySelectorAll("input[name='STATE']").forEach(cb=>{
    const lbl = cb.closest('label');
    if(validStates.has(cb.value)) { lbl.classList.remove('dim'); lbl.style.opacity=1; }
    else { lbl.classList.add('dim'); lbl.style.opacity=.45; }
  });
  document.querySelectorAll("input[name='PARTY']").forEach(cb=>{
    const lbl = cb.closest('label');
    if(validParties.has(cb.value)) { lbl.classList.remove('dim'); lbl.style.opacity=1; }
    else { lbl.classList.add('dim'); lbl.style.opacity=.45; }
  });
  document.querySelectorAll("input[name='ITEM']").forEach(cb=>{
    const lbl = cb.closest('label');
    if(validItems.has(cb.value)) { lbl.classList.remove('dim'); lbl.style.opacity=1; }
    else { lbl.classList.add('dim'); lbl.style.opacity=.45; }
  });
}

/* Aggregate and render table */
function applyFilters(){
  showOverlay();
  setTimeout(()=> {
    const sel = getSelections();

    // build preview for cascade: apply months selection only
    let preview = [...rawData];
    if(sel.cmpMonths.length) {
      preview = preview.filter(r => sel.cmpMonths.includes(r.invoice_month));
    }
    // apply explicit selected states/parties/items to preview so other options narrow (but we won't block them)
    if(sel.states.length) preview = preview.filter(r => sel.states.includes(r.state));
    if(sel.parties.length) preview = preview.filter(r => sel.parties.includes(r.party));
    if(sel.items.length) preview = preview.filter(r => sel.items.includes(r.item));

    updateCascades(preview);

    // Now produce filtered rows (final dataset)
    let filtered = [...rawData];
    if(sel.cmpMonths.length) filtered = filtered.filter(r => sel.cmpMonths.includes(r.invoice_month));
    if(sel.states.length) filtered = filtered.filter(r => sel.states.includes(r.state));
    const finalParties = [...document.querySelectorAll("input[name='PARTY']:checked")].map(i=>i.value);
    const finalItems = [...document.querySelectorAll("input[name='ITEM']:checked")].map(i=>i.value);
    if(finalParties.length) filtered = filtered.filter(r => finalParties.includes(r.party));
    if(finalItems.length) filtered = filtered.filter(r => finalItems.includes(r.item));

    // Determine months to show: if none selected -> default latest two
    let monthsToShow = sel.cmpMonths.length ? sel.cmpMonths.slice() : monthsList.slice(-2);
    monthsToShow = [...new Set(monthsToShow)].sort((a,b)=>isoMonthSortKey(a)-isoMonthSortKey(b));

    // grouping: always aggregate by State->Party->Item (but visibility of columns controlled by showCols)
    // We need for each group sums per month
    const groupMap = new Map(); // key: state|party|item -> { state, party, item, months: {m:sum}, __count }
    filtered.forEach(r=>{
      const key = `${r.state}||${r.party}||${r.item}`;
      if(!groupMap.has(key)){
        const monthsObj = {};
        monthsToShow.forEach(m=> monthsObj[m]=0);
        groupMap.set(key, {state:r.state, party:r.party, item:r.item, months:monthsObj, SUM_QUANTITY_CS:0, SUM_QUANTITY_KG:0, SUM_BILL_AMOUNT:0, __count:0});
      }
      const o = groupMap.get(key);
      if(monthsToShow.includes(r.invoice_month)) o.months[r.invoice_month] += r.quantity_cs;
      // accumulate overall sums for subtotals/grand totals
      o.SUM_QUANTITY_CS += r.quantity_cs;
      o.SUM_QUANTITY_KG += r.quantity_kg;
      o.SUM_BILL_AMOUNT += r.bill_amount;
      o.__count += 1;
    });
    const rows = [...groupMap.values()];

    // Build hierarchical structure by state -> party -> items arrays
    const stateMap = new Map();
    rows.forEach(r=>{
      if(!stateMap.has(r.state)) stateMap.set(r.state, new Map());
      const partyMap = stateMap.get(r.state);
      if(!partyMap.has(r.party)) partyMap.set(r.party, []);
      partyMap.get(r.party).push(r);
    });

    // Build headers based on showCols + months + diff/% if >=2 months
    const showColsNormalized = sel.showCols.length ? sel.showCols.slice() : DEFAULT_SHOW_COLS.slice();
    // ensure names match columns we have: "State","Party Name","Item Name"
    const headerCols = [...showColsNormalized];
    monthsToShow.forEach(m => headerCols.push(m));
    const showComparisonCols = (monthsToShow.length >= 2);
    if(showComparisonCols){ headerCols.push('Difference'); headerCols.push('% Change'); }

    // Render table head
    const thead = document.getElementById('tableHead');
    thead.innerHTML = `<tr>` + headerCols.map(h=>`<th>${escapeHtml(h)}</th>`).join('') + `</tr>`;

    // Render body with party subtotals (if party has >=2 rows) and state totals
    const tbody = document.getElementById('tableBody');
    let html = '';
    stateMap.forEach((partyMap, state)=>{
      let stateTotals = {}; monthsToShow.forEach(m=> stateTotals[m]=0);
      let stateQty = 0;
      partyMap.forEach((itemsArr, party)=>{
        let partyTotals = {}; monthsToShow.forEach(m=> partyTotals[m]=0);
        itemsArr.forEach(itemRow=>{
          // build row cells according to headerCols
          html += '<tr>';
          headerCols.forEach(col=>{
            if(col === 'State'){
              html += `<td>${escapeHtml(itemRow.state)}</td>`;
            } else if(col === 'Party Name'){
              html += `<td>${escapeHtml(itemRow.party)}</td>`;
            } else if(col === 'Item Name'){
              html += `<td>${escapeHtml(itemRow.item)}</td>`;
            } else if(monthsToShow.includes(col)){
              // month cell: we will color vs previous month for that row
              const val = itemRow.months[col] || 0;
              html += `<td data-val="${val}">${val.toLocaleString()}</td>`;
              partyTotals[col] += val; stateTotals[col] += val;
            } else if(col === 'Difference' || col === '% Change'){
              // placeholders - we'll compute after row rendered using months values
              html += `<td data-diff></td>`;
            } else {
              html += `<td></td>`;
            }
          });
          html += '</tr>';
        });

        // party subtotal row (always show as requirement keep subtotals)
        const partySub = partyTotals;
        const partyRow = `<tr class="subtotal-row">` + headerCols.map((col,i)=>{
          if(col === 'State') return `<td></td>`;
          if(col === 'Party Name') return `<td><b>SUM ${escapeHtml(party)}</b></td>`;
          if(col === 'Item Name') return `<td></td>`;
          if(monthsToShow.includes(col)) return `<td><b>${(partySub[col]||0).toLocaleString()}</b></td>`;
          if(col === 'Difference'){
            // diff between last and first month for party
            const first = partySub[monthsToShow[0]]||0, last = partySub[monthsToShow[monthsToShow.length-1]]||0;
            const diff = last - first;
            return `<td><b>${diff.toLocaleString()}</b></td>`;
          }
          if(col === '% Change'){
            const first = partySub[monthsToShow[0]]||0, last = partySub[monthsToShow[monthsToShow.length-1]]||0;
            const pct = first===0 ? (last===0 ? 0 : null) : ((last-first)/first*100);
            return `<td><b>${pct===null ? '—' : pct.toFixed(1)+'%'}</b></td>`;
          }
          return `<td></td>`;
        }).join('') + `</tr>`;
        html += partyRow;
      });

      // state total row
      const stateRow = `<tr class="state-total">` + headerCols.map(col=>{
        if(col === 'State') return `<td><b>TOTAL ${escapeHtml(state)}</b></td>`;
        if(col === 'Party Name') return `<td></td>`;
        if(col === 'Item Name') return `<td></td>`;
        if(monthsToShow.includes(col)) return `<td><b>${(stateTotals[col]||0).toLocaleString()}</b></td>`;
        if(col === 'Difference'){
          const first = stateTotals[monthsToShow[0]]||0, last = stateTotals[monthsToShow[monthsToShow.length-1]]||0;
          const diff = last - first;
          return `<td><b>${diff.toLocaleString()}</b></td>`;
        }
        if(col === '% Change'){
          const first = stateTotals[monthsToShow[0]]||0, last = stateTotals[monthsToShow[monthsToShow.length-1]]||0;
          const pct = first===0 ? (last===0 ? 0 : null) : ((last-first)/first*100);
          return `<td><b>${pct===null ? '—' : pct.toFixed(1)+'%'}</b></td>`;
        }
        return `<td></td>`;
      }).join('') + `</tr>`;
      html += stateRow;
    });

    tbody.innerHTML = html || `<tr><td colspan="${headerCols.length}">No data</td></tr>`;

    // After rendering body, compute per-row Difference and % and color month cells vs previous month
    // Color month cells: compare with previous month in monthsToShow for that row
    const rowsNodes = Array.from(tbody.querySelectorAll('tr')).filter(tr=>!tr.classList.contains('subtotal-row') && !tr.classList.contains('state-total'));
    rowsNodes.forEach(tr=>{
      // gather month cell values for the row
      const monthCells = monthsToShow.map(m => {
        const td = tr.querySelector(`td:nth-child(${headerCols.indexOf(m)+1})`);
        return {td, val: td ? Number(td.getAttribute('data-val')||0) : 0};
      });
      // color each month comparing to previous
      for(let i=1;i<monthCells.length;i++){
        const cur = monthCells[i], prev = monthCells[i-1];
        if(!cur.td) continue;
        if(cur.val > prev.val) cur.td.style.background = 'var(--green-bg)';
        else cur.td.style.background = 'var(--red-bg)';
      }
      // compute diff & % between earliest and latest months
      if(monthsToShow.length >= 2){
        const firstVal = monthCells[0] ? monthCells[0].val : 0;
        const lastVal = monthCells[monthCells.length-1] ? monthCells[monthCells.length-1].val : 0;
        const diff = lastVal - firstVal;
        const pct = (firstVal === 0) ? (lastVal === 0 ? 0 : null) : ((diff / firstVal)*100);
        // find the difference and % td placeholders and fill them
        const diffIdx = headerCols.indexOf('Difference');
        const pctIdx = headerCols.indexOf('% Change');
        if(diffIdx >= 0){
          const td = tr.children[diffIdx];
          if(td){ td.innerText = diff.toLocaleString(); td.style.background = diff>0 ? 'var(--green-bg)' : 'var(--red-bg)'; }
        }
        if(pctIdx >= 0){
          const td = tr.children[pctIdx];
          if(td) { td.innerText = pct===null ? '—' : pct.toFixed(1)+'%'; td.style.background = (pct===null ? 'transparent' : (pct>0 ? 'var(--green-bg)' : 'var(--red-bg)')); }
        }
      }
    });

    // Grand total footer
    const tfoot = document.getElementById('tableFoot');
    const grand = {}; monthsToShow.forEach(m=>grand[m]=0);
    stateMap.forEach(partyMap=>{
      partyMap.forEach(itemsArr=>{
        itemsArr.forEach(it=>{
          monthsToShow.forEach(m=> grand[m] += (it.months[m]||0));
        });
      });
    });
    const grandDiff = (monthsToShow.length>=2) ? (grand[monthsToShow[monthsToShow.length-1]] - grand[monthsToShow[0]]) : 0;
    const grandPct = (monthsToShow.length>=2) ? (grand[monthsToShow[0]]===0 ? (grand[monthsToShow[monthsToShow.length-1]]===0 ? 0 : null) : (grandDiff/grand[monthsToShow[0]]*100)) : 0;

    let footHtml = `<tr class="grandtotal-row">`;
    headerCols.forEach(col=>{
      if(col === 'State') footHtml += `<td><b>GRAND TOTAL</b></td>`;
      else if(col === 'Party Name' || col === 'Item Name') footHtml += `<td></td>`;
      else if(monthsToShow.includes(col)) footHtml += `<td><b>${(grand[col]||0).toLocaleString()}</b></td>`;
      else if(col === 'Difference') footHtml += `<td><b>${grandDiff.toLocaleString()}</b></td>`;
      else if(col === '% Change') footHtml += `<td><b>${grandPct===null ? '—' : grandPct.toFixed(1)+'%'}</b></td>`;
      else footHtml += `<td></td>`;
    });
    footHtml += `</tr>`;
    tfoot.innerHTML = footHtml;

    // update records note
    document.getElementById('noteInfo').textContent = `Groups: ${rows.length} — Months: ${monthsToShow.join(', ')}`;

    hideOverlay();
  }, 60);
}

/* Clear filters */
document.getElementById('clearBtn').addEventListener('click', ()=>{
  // reset all checkboxes
  document.querySelectorAll("#filtersRow input[type=checkbox]").forEach(cb=>cb.checked=false);
  // default show columns
  document.querySelectorAll("input[name='SHOW_COLS']").forEach(i=> i.checked = DEFAULT_SHOW_COLS.includes(i.value));
  // default months: latest two
  monthsList.slice(-2).forEach(m=>{
    const el = document.querySelector(`#cmpMonthOptions input[value="${m}"]`);
    if(el) el.checked = true;
  });
  applyFilters();
});

/* Toggle filters visible */
document.getElementById('toggleFiltersBtn').addEventListener('click', ()=>{
  const wrapper = document.getElementById('filtersWrapper');
  const btn = document.getElementById('toggleFiltersBtn');
  if(wrapper.style.display === 'none'){ wrapper.style.display = 'block'; btn.textContent = 'Hide Filters'; }
  else { wrapper.style.display = 'none'; btn.textContent = 'Show Filters'; }
});

/* Export */
document.getElementById('exportBtn').addEventListener('click', async ()=>{
  showOverlay();
  try{
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet("Comparison");
    const rows = [...document.querySelectorAll("#comparisonTable tr")].map(tr => [...tr.children].map(td => td.innerText.trim()));
    rows.forEach((r,i)=> { const row = ws.addRow(r); if(i===0) row.font = {bold:true}; });
    ws.columns.forEach(c=> c.width = 18);
    const buf = await wb.xlsx.writeBuffer();
    saveAs(new Blob([buf]), `comparison_${new Date().toISOString().slice(0,10)}.xlsx`);
  } catch(err){ console.error("export error", err); alert("Export failed"); }
  finally{ hideOverlay(); }
});

/* init */
loadData();

</script>
</body>
</html>
