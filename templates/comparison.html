<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SMC Lighthouse - Comparison</title>

<link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>
:root{--navy:#1e3a8a;--accent1:#2563eb;--accent2:#4f46e5;--green:#dff7e6;--red:#ffe6e6}
body{font-family:Inter,system-ui,Arial;margin:0;background:#f6f9fc;color:#0f172a}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff}
header h1{margin:0;font-weight:800;font-size:1.05rem}
.header-left{display:flex;align-items:center;gap:12px}
.toolbar{display:flex;gap:8px;align-items:center}
.btn{border:0;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:700}
.btn-blue{background:#fff;color:var(--navy)}
.btn-gray{background:#eef2ff;color:var(--navy)}
main{max-width:1400px;margin:16px auto;padding:12px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.filters-area{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.filter-box{background:linear-gradient(180deg,#fff,#f0f4ff);border:2px solid var(--navy);border-radius:10px;padding:10px 12px;flex:1 1 240px;box-shadow:0 6px 18px rgba(30,58,138,0.06);}
.filter-box strong{display:block;text-align:center;color:var(--navy);font-weight:900;margin-bottom:6px;border-bottom:2px solid #e6eef9;padding-bottom:6px}
.options{max-height:220px;overflow:auto;padding-top:6px}
.options label{display:block;padding:6px 8px;margin:4px 0;border-radius:6px;background:#fbfeff;font-weight:800;cursor:pointer}
.options label.dim{opacity:.45}
.table-wrapper{background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(4,8,15,0.05);overflow:auto;max-height:72vh}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{border:1.5px solid #65738a;padding:6px 8px;text-align:center;font-weight:700;height:22px}
thead th{position:sticky;top:0;background:linear-gradient(90deg,#e0e7ff,#c7d2fe);color:var(--navy);z-index:5}
tr.subtotal-row td{background:#fff7cc;font-weight:900}
tr.state-total-row td{background:#dbeafe;font-weight:900}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.7);z-index:3000;font-weight:900;color:var(--navy)}
.overlay.show{display:flex}
.small{font-size:.9rem;color:#475569}
.legend{display:flex;gap:8px;align-items:center;margin-left:10px}
.legend div{display:flex;align-items:center;gap:6px}
.legend .g{width:18px;height:14px;background:var(--green);border:1px solid #bfe6c7}
.legend .r{width:18px;height:14px;background:var(--red);border:1px solid #f0bcbc}
@media(max-width:900px){.filter-box{flex:1 1 100%}th,td{font-size:.85rem}}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo" style="height:40px">
    <h1>SMC Lighthouse - Monthly Comparison</h1>
  </div>
  <div class="toolbar">
    <a href="/dashboard/plant"><button class="btn btn-gray">← Back (Plant)</button></a>
    <button id="exportBtn" class="btn btn-blue">Export</button>
    <button id="clearBtn" class="btn btn-gray">Clear</button>
    <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
  </div>
</header>

<main>
  <div class="controls">
    <div class="small">Select filters (multi-select):</div>
    <div class="legend"><div class="g"></div><div class="small">↑ improved</div><div class="r"></div><div class="small">↓ same or lower</div></div>
    <div id="recordsInfo" style="margin-left:auto" class="small"></div>
  </div>

  <div id="filtersWrapper">
    <div id="filtersContainer" class="filters-area"></div>
  </div>

  <div class="table-wrapper">
    <table id="comparisonTable" aria-label="Monthly comparison table">
      <thead id="comparisonHead"></thead>
      <tbody id="comparisonBody"></tbody>
      <tfoot id="comparisonFoot"></tfoot>
    </table>
  </div>
</main>

<div id="overlay" class="overlay">Processing...</div>

<script>
/* =============================
   CONFIG & UTIL
   ============================= */
const API_URL = "/get_data/lighthouse_sales";
let rawData = [];
let allStates = [], allParties = [], allItems = [], allMonths = [];

function showOverlay(){ document.getElementById('overlay').classList.add('show'); }
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function toNum(v){ return Number(v) || 0; }

// flexible date parse that supports DDMMYYYY, DD-MM-YYYY, YYYY-MM-DD, native
function parseDateFlexible(s){
  if(!s) return null;
  s = String(s).trim();
  if(/^\d{8}$/.test(s)){ const d=+s.slice(0,2), m=+s.slice(2,4), y=+s.slice(4,8); return new Date(y,m-1,d); }
  let m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s);
  return isNaN(d.getTime())? null : d;
}
function invoiceMonthLabel(dateStr){
  const dt = parseDateFlexible(dateStr);
  if(!dt) return "";
  return dt.toLocaleString('default',{month:'short', year:'2-digit'}); // e.g. Sep-25
}
function sortMonthLabels(months){
  // Convert "Sep-25" -> Date by prefixing "01-"
  return months.slice().sort((a,b)=>{
    const da = new Date("01 " + a), db = new Date("01 " + b);
    return da - db;
  });
}

/* =============================
   LOAD DATA
   ============================= */
async function loadData(){
  showOverlay();
  try{
    const res = await axios.get(API_URL);
    const data = Array.isArray(res.data) ? res.data : [];

    rawData = data.map(r=>{
      const rawDate = (r.invoice_date || r.INVOICE_DATE || r.Invoice_Date || "").toString().trim();
      const dt = parseDateFlexible(rawDate);
      return {
        state: (r.state || r.STATE || "").toString().trim(),
        party: (r.party_name || r.PARTY_NAME || r.Party_Name || "").toString().trim(),
        item: (r.item_name || r.ITEM_NAME || r.Item_Name || "").toString().trim(),
        invoiceDateRaw: rawDate,
        invoiceDateObj: dt,
        invoiceDate: dt ? `${String(dt.getDate()).padStart(2,'0')}${String(dt.getMonth()+1).padStart(2,'0')}${dt.getFullYear()}` : "",
        invoiceMonth: invoiceMonthLabel(rawDate),
        qty_cs: toNum(r.quantity_cs || r.Quantity_CS || r.QTY_CS || 0),
        qty_kg: toNum(r.quantity_kg || r.Quantity_KG || 0),
        bill_amount: toNum(r.bill_amount || r.Bill_Amount || 0)
      };
    }).filter(x => x.invoiceMonth); // drop rows with no month

    allStates = [...new Set(rawData.map(r=>r.state).filter(Boolean))].sort();
    allParties = [...new Set(rawData.map(r=>r.party).filter(Boolean))].sort();
    allItems = [...new Set(rawData.map(r=>r.item).filter(Boolean))].sort();
    allMonths = sortMonthLabels([...new Set(rawData.map(r=>r.invoiceMonth).filter(Boolean))]);

    buildFilters();
    // default comparison months -> last 2 months if available
    const defaults = (allMonths.length >= 2) ? allMonths.slice(-2) : allMonths.slice(-1);
    setDefaultComparisonSelection(defaults);
    applyFilters();
  } catch(e){
    console.error("loadData", e);
    alert("Failed to load data.");
  } finally {
    hideOverlay();
  }
}

/* =============================
   BUILD FILTER UI
   ============================= */
function buildFilters(){
  const c = document.getElementById("filtersContainer");
  c.innerHTML = "";

  // helper to render options
  function renderOptions(name, values, defaults = []) {
    const defSet = new Set(defaults);
    return `<div class="filter-box">
      <strong>${name}</strong>
      <label><input type="checkbox" data-all="${name}"> All</label>
      <div class="options">${values.map(v=>`<label><input type="checkbox" name="${name}" value="${escapeHtml(v)}" ${defSet.has(v) ? 'checked' : ''}> ${escapeHtml(v)}</label>`).join("")}</div>
    </div>`;
  }

  // Show boxes in requested order: State, Party_Name, Item_Name, Month_name (invoice month)
  c.innerHTML += renderOptions("STATE", allStates);
  c.innerHTML += renderOptions("PARTY_NAME", allParties);
  c.innerHTML += renderOptions("ITEM_NAME", allItems);
  c.innerHTML += renderOptions("INVOICE_MONTH", allMonths);
  // Comparison months box (separate)
  c.innerHTML += renderOptions("COMPARISON_MONTH", allMonths);

  // wire all-buttons
  c.querySelectorAll("input[data-all]").forEach(cb=>{
    cb.addEventListener("change", e=>{
      const grp = e.target.dataset.all;
      c.querySelectorAll(`input[name='${grp}']`).forEach(i=> i.checked = e.target.checked );
      debounceApplyFilters();
    });
  });

  // any change triggers apply (debounced)
  c.addEventListener("change", ()=> debounceApplyFilters());
}

/* simple escape for HTML */
function escapeHtml(s){ return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }

/* set default comparison months (checks the checkboxes) */
function setDefaultComparisonSelection(months){
  // uncheck first
  document.querySelectorAll("input[name='COMPARISON_MONTH']").forEach(i=> i.checked=false);
  months.forEach(m => {
    const el = [...document.querySelectorAll("input[name='COMPARISON_MONTH']")].find(i=> i.value === m);
    if(el) el.checked = true;
  });
}

/* =============================
   FILTER LOGIC (smart cascade multi-select)
   ============================= */
function getSelections(){
  const sel = {};
  document.querySelectorAll(".filter-box strong").forEach(h=>{
    const k = h.textContent.trim();
    sel[k] = [...document.querySelectorAll(`input[name='${k}']:checked`)].map(i=>i.value);
  });
  return sel;
}

function updateCascadePreview(){
  // Create preview by applying selected filters to rawData (to find valid options)
  const sel = getSelections();
  let preview = [...rawData];

  // If invoice_month selected, filter preview to those months (so other filters reflect it)
  if(sel["INVOICE_MONTH"] && sel["INVOICE_MONTH"].length) preview = preview.filter(r => sel["INVOICE_MONTH"].includes(r.invoiceMonth));

  // Apply currently selected state/party/item in preview to narrow other options
  if(sel["STATE"] && sel["STATE"].length) preview = preview.filter(r => sel["STATE"].includes(r.state));
  if(sel["PARTY_NAME"] && sel["PARTY_NAME"].length) preview = preview.filter(r => sel["PARTY_NAME"].includes(r.party));
  if(sel["ITEM_NAME"] && sel["ITEM_NAME"].length) preview = preview.filter(r => sel["ITEM_NAME"].includes(r.item));

  const validStates = new Set(preview.map(r=>r.state));
  const validParties = new Set(preview.map(r=>r.party));
  const validItems = new Set(preview.map(r=>r.item));
  const validMonths = new Set(preview.map(r=>r.invoiceMonth));

  // visually dim options not present in preview, but keep them selectable
  document.querySelectorAll("input[name='STATE']").forEach(cb=>{
    const lbl = cb.closest("label");
    lbl.classList.toggle("dim", !validStates.has(cb.value));
  });
  document.querySelectorAll("input[name='PARTY_NAME']").forEach(cb=>{
    const lbl = cb.closest("label");
    lbl.classList.toggle("dim", !validParties.has(cb.value));
  });
  document.querySelectorAll("input[name='ITEM_NAME']").forEach(cb=>{
    const lbl = cb.closest("label");
    lbl.classList.toggle("dim", !validItems.has(cb.value));
  });
  document.querySelectorAll("input[name='INVOICE_MONTH']").forEach(cb=>{
    const lbl = cb.closest("label");
    lbl.classList.toggle("dim", !validMonths.has(cb.value));
  });
  // Comparison months list should remain fully selectable (user may compare months outside current invoice filter),
  // but we still visually indicate which comparison months exist in preview.
  document.querySelectorAll("input[name='COMPARISON_MONTH']").forEach(cb=>{
    const lbl = cb.closest("label");
    lbl.classList.toggle("dim", !validMonths.has(cb.value));
  });

  // update "All" checkbox states (indeterminate logic)
  ["STATE","PARTY_NAME","ITEM_NAME","INVOICE_MONTH","COMPARISON_MONTH"].forEach(updateAllCheckbox);
}

function updateAllCheckbox(group){
  const inputs = [...document.querySelectorAll(`input[name='${group}']`)];
  const allCb = document.querySelector(`input[data-all='${group}']`);
  if(!allCb) return;
  const checked = inputs.filter(i=>i.checked).length;
  allCb.checked = checked === inputs.length && inputs.length > 0;
  allCb.indeterminate = checked > 0 && checked < inputs.length;
}

/* =============================
   APPLY FILTERS & RENDER TABLE
   ============================= */
function getFilteredRows(){
  const sel = getSelections();
  let filtered = [...rawData];

  // invoice month selection acts as data filter for rows if present
  if(sel["INVOICE_MONTH"] && sel["INVOICE_MONTH"].length) filtered = filtered.filter(r => sel["INVOICE_MONTH"].includes(r.invoiceMonth));

  if(sel["STATE"] && sel["STATE"].length) filtered = filtered.filter(r => sel["STATE"].includes(r.state));
  if(sel["PARTY_NAME"] && sel["PARTY_NAME"].length) filtered = filtered.filter(r => sel["PARTY_NAME"].includes(r.party));
  if(sel["ITEM_NAME"] && sel["ITEM_NAME"].length) filtered = filtered.filter(r => sel["ITEM_NAME"].includes(r.item));

  return filtered;
}

function buildMonthColumns(selectedComparisonMonths){
  // ensure chronological order
  const months = sortMonthLabels(selectedComparisonMonths);
  return months;
}

function aggregateForMonths(filtered, months){
  // aggregate into hierarchical map: state -> party -> item -> {month: qty}
  const stateMap = new Map();
  filtered.forEach(r => {
    if(!stateMap.has(r.state)) stateMap.set(r.state, new Map());
    const partyMap = stateMap.get(r.state);
    if(!partyMap.has(r.party)) partyMap.set(r.party, new Map());
    const itemMap = partyMap.get(r.party);
    if(!itemMap.has(r.item)) itemMap.set(r.item, {});
    const entry = itemMap.get(r.item);
    entry[r.invoiceMonth] = (entry[r.invoiceMonth] || 0) + r.qty_cs;
  });
  return stateMap;
}

function renderComparisonTable(){
  showOverlay();
  setTimeout(()=>{ // small UI breathing room
    const sel = getSelections();
    // get selected comparison months; default to last two if none
    let compSel = sel["COMPARISON_MONTH"] && sel["COMPARISON_MONTH"].length ? sel["COMPARISON_MONTH"].slice() : [];
    if(compSel.length === 0){
      compSel = (allMonths.length >= 2) ? allMonths.slice(-2) : allMonths.slice(-1);
      setDefaultComparisonSelection(compSel);
    }
    const months = buildMonthColumns(compSel);
    const filtered = getFilteredRows();
    updateCascadePreview(); // refresh dims and all-check states

    const stateMap = aggregateForMonths(filtered, months);

    // build header
    const head = document.getElementById("comparisonHead");
    const body = document.getElementById("comparisonBody");
    const foot = document.getElementById("comparisonFoot");

    const monthThs = months.map(m => `<th>${m}</th>`).join("");
    // add final comparison delta column if at least 2 months selected
    const addComparisonCol = months.length >= 2;
    head.innerHTML = `<tr><th>State</th><th>Party_Name</th><th>Item_Name</th>${monthThs}${addComparisonCol ? '<th>Comparison (Δ)</th>' : ''}</tr>`;

    // render rows with party subtotals and state totals
    let html = "";
    let grandTotals = Object.fromEntries(months.map(m=>[m,0]));
    let grandCompareTotal = 0;

    stateMap.forEach((partyMap, state) => {
      let stateTotals = Object.fromEntries(months.map(m=>[m,0]));
      partyMap.forEach((itemMap, party) => {
        let partyTotals = Object.fromEntries(months.map(m=>[m,0]));
        // items
        itemMap.forEach((monthData, item) => {
          html += `<tr>`;
          html += `<td>${escapeHtml(state)}</td><td>${escapeHtml(party)}</td><td>${escapeHtml(item)}</td>`;
          // months
          months.forEach((m, idx)=>{
            const val = monthData[m] || 0;
            // determine compare to previous month (if previous month exists in months list)
            let prevVal = 0;
            if(idx > 0){
              const prevMonth = months[idx-1];
              prevVal = monthData[prevMonth] || 0;
            }
            // color cell based on comparison to previous month's value
            let style = "";
            if(idx > 0){
              style = (val > prevVal) ? ` style="background:${'var(--green)'}"` : ` style="background:${'var(--red)'}"`;
            }
            html += `<td${style}>${val.toLocaleString()}</td>`;
            partyTotals[m] += val;
            stateTotals[m] += val;
            grandTotals[m] += val;
          });
          // comparison delta between last and previous if available
          if(addComparisonCol){
            const last = months[months.length-1];
            const prev = months[months.length-2];
            const lastVal = monthData[last] || 0;
            const prevVal = monthData[prev] || 0;
            const delta = lastVal - prevVal;
            const cmpStyle = delta > 0 ? ` style="background:${'var(--green)'}"` : ` style="background:${'var(--red)'}"`;
            html += `<td${cmpStyle}>${delta.toLocaleString()}</td>`;
            grandCompareTotal += delta;
          }
          html += `</tr>`;
        });

        // party subtotal row (only if more than one item OR always keep subtotals as requested)
        const partyHasMultiple = itemMap.size >= 1; // keep subtotal row in any case as user asked to keep both
        if(partyHasMultiple){
          html += `<tr class="subtotal-row">`;
          html += `<td></td><td><b>SUM ${escapeHtml(party)}</b></td><td></td>`;
          months.forEach(m=>{
            html += `<td><b>${partyTotals[m].toLocaleString()}</b></td>`;
          });
          if(addComparisonCol){
            // compute party delta
            const last = months[months.length-1];
            const prev = months[months.length-2];
            const delta = (partyTotals[last] || 0) - (partyTotals[prev] || 0);
            const cmpStyle = delta > 0 ? ` style="background:${'var(--green)'}"` : ` style="background:${'var(--red)'}"`;
            html += `<td${cmpStyle}><b>${delta.toLocaleString()}</b></td>`;
          }
          html += `</tr>`;
        }
      });

      // state total row
      html += `<tr class="state-total-row">`;
      html += `<td><b>TOTAL ${escapeHtml(state)}</b></td><td></td><td></td>`;
      months.forEach(m=>{
        html += `<td><b>${stateTotals[m].toLocaleString()}</b></td>`;
      });
      if(addComparisonCol){
        const last = months[months.length-1];
        const prev = months[months.length-2];
        const delta = (stateTotals[last] || 0) - (stateTotals[prev] || 0);
        const cmpStyle = delta > 0 ? ` style="background:${'var(--green)'}"` : ` style="background:${'var(--red)'}"`;
        html += `<td${cmpStyle}><b>${delta.toLocaleString()}</b></td>`;
      }
      html += `</tr>`;
    });

    // footer grand totals
    let footHtml = `<tr class="grandtotal-row"><td><b>GRAND TOTAL</b></td><td></td><td></td>`;
    months.forEach(m=>{
      footHtml += `<td><b>${grandTotals[m].toLocaleString()}</b></td>`;
    });
    if(addComparisonCol){
      footHtml += `<td><b>${grandCompareTotal.toLocaleString()}</b></td>`;
    }
    footHtml += `</tr>`;

    head.scrollIntoView({block:'nearest'});
    body.innerHTML = html || `<tr><td colspan="${3 + months.length + (addComparisonCol?1:0)}">No data</td></tr>`;
    foot.innerHTML = footHtml;

    document.getElementById("recordsInfo").textContent = `Groups: ${Array.from(stateMap.keys()).length} | Rows: ${filtered.length}`;
    hideOverlay();
  }, 30);
}

/* =============================
   DEBOUNCE HELPERS
   ============================= */
function debounce(fn, delay=220){
  let t;
  return function(...a){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,a), delay); };
}
const debounceApplyFilters = debounce(()=>{ applyFilters(); }, 220);

/* wrapper to update preview + render */
function applyFilters(){
  updateCascadePreview();
  renderComparisonTable();
}

/* =============================
   UI: Clear / Toggle / Export
   ============================= */
document.getElementById("toggleFiltersBtn").addEventListener("click", ()=>{
  const w = document.getElementById("filtersWrapper");
  const btn = document.getElementById("toggleFiltersBtn");
  if(w.style.display === "none"){ w.style.display = "block"; btn.textContent = "Hide Filters"; }
  else { w.style.display = "none"; btn.textContent = "Show Filters"; }
});

document.getElementById("clearBtn").addEventListener("click", ()=>{
  // uncheck everything and re-init defaults
  document.querySelectorAll("#filtersContainer input[type=checkbox]").forEach(cb=> cb.checked = false);
  const defaults = (allMonths.length >= 2) ? allMonths.slice(-2) : allMonths.slice(-1);
  setDefaultComparisonSelection(defaults);
  applyFilters();
});

document.getElementById("exportBtn").addEventListener("click", async ()=>{
  showOverlay();
  try{
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet("Comparison");

    // header
    const headers = [...document.querySelectorAll("#comparisonHead th")].map(h => h.innerText.trim());
    ws.addRow(headers).font = {bold:true};

    // body rows
    [...document.querySelectorAll("#comparisonBody tr")].forEach(tr=>{
      const vals = [...tr.children].map(td=> td.innerText.trim());
      ws.addRow(vals);
    });
    // footer
    [...document.querySelectorAll("#comparisonFoot tr")].forEach(tr=>{
      const vals = [...tr.children].map(td=> td.innerText.trim());
      const row = ws.addRow(vals);
      row.font = {bold:true};
    });

    ws.columns.forEach(c => c.width = 16);
    const buf = await wb.xlsx.writeBuffer();
    saveAs(new Blob([buf]), `comparison_${new Date().toISOString().slice(0,10)}.xlsx`);
  } catch(e){
    console.error("Export failed", e);
    alert("Export failed: " + (e.message || e));
  } finally { hideOverlay(); }
});

/* =============================
   INIT
   ============================= */
loadData();
</script>
</body>
</html>
