<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daily Sale — Single Page</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body { padding:16px; background:#f8fafc; font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial; }
    .small-muted { color:#6b7280; font-size:.9rem; }
    .table-wrap { width:100%; overflow:auto; max-height:66vh; border:1px solid #e6e6e6; border-radius:6px; background:#fff; }
    table { border-collapse:collapse; width:100%; }
    thead th { position:sticky; top:0; background:#fff; z-index:4; border-bottom:1px solid #ddd; text-align:center; padding:8px; }
    tbody td { border-bottom:1px solid #f1f5f9; padding:8px; vertical-align:middle; }
    td.center { text-align:center; }
    td.left { text-align:left; padding-left:10px; }
    .subtotal-row td { background:#f3f6f9; font-weight:700; text-align:center; }
    .grand-row td { background:#e9eef5; font-weight:800; text-align:center; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">🧾 Daily Sale</h4>
      <div>
        <a href="{{ url_for('dashboard_stock') }}" class="btn btn-outline-secondary btn-sm me-2">← Stock</a>
        <button id="exportBtn" class="btn btn-success btn-sm">Export Excel</button>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-3">
            <label class="form-label small-muted">Month</label>
            <select id="filterMonth" class="form-select"></select>
          </div>
          <div class="col-md-3">
            <label class="form-label small-muted">State</label>
            <select id="filterState" class="form-select"><option value="">All</option></select>
          </div>
          <div class="col-md-3">
            <label class="form-label small-muted">SKU (search)</label>
            <input id="filterSKU" list="skuList" class="form-control" placeholder="Type or choose SKU">
            <datalist id="skuList"></datalist>
          </div>
          <div class="col-md-2">
            <label class="form-label small-muted">From</label>
            <input id="filterFrom" type="date" class="form-control">
          </div>
          <div class="col-md-1 d-flex align-items-end">
            <button id="clearFilters" class="btn btn-outline-secondary btn-sm w-100">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table id="saleTable" class="table table-sm mb-0">
        <thead>
          <tr>
            <th data-col="state" style="min-width:120px;">State</th>
            <th data-col="date" style="min-width:120px;">Date</th>
            <th data-col="party_name" style="min-width:320px; text-align:left;">Party Name</th>
            <th data-col="district" style="min-width:160px;">District</th>
            <th data-col="sku" style="min-width:220px;">SKU</th>
            <th data-col="quantity" style="min-width:120px;">Quantity</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr class="grand-row">
            <td colspan="5" class="text-end">Grand Total →</td>
            <td id="grand_qty"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  const parseDatePreferDMY = s => {
    if (!s) return null;
    const iso = new Date(s);
    if (!isNaN(iso)) return iso;
    const m = String(s).trim().match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
    if (m) {
      const day = +m[1], mon = +m[2]-1, year = +m[3] < 100 ? 2000 + +m[3] : +m[3];
      return new Date(year, mon, day);
    }
    const fb = new Date(s);
    return isNaN(fb) ? null : fb;
  };
  const fmt = v => (v == null || isNaN(+v)) ? '' : Number(v).toLocaleString();

  let RAW = [], FILTERED = [];
  const tbody = document.querySelector('#saleTable tbody');
  const filterMonth = document.getElementById('filterMonth');
  const filterState = document.getElementById('filterState');
  const filterSKU = document.getElementById('filterSKU');
  const skuList = document.getElementById('skuList');
  const filterFrom = document.getElementById('filterFrom');
  const clearFilters = document.getElementById('clearFilters');
  const exportBtn = document.getElementById('exportBtn');

  async function loadData() {
    try {
      const res = await fetch('/api/get_daily_sale');
      const raw = await res.json();
      RAW = raw.map(r => {
        const obj = {};
        for (const k in r) obj[k.trim().toLowerCase()] = r[k];
        obj.state = (obj.state||'').toString().trim();
        obj.date = (obj.date||'').toString().trim();
        obj.party_name = (obj.party_name||'').toString().trim();
        obj.district = (obj.district||'').toString().trim();
        obj.sku = (obj.sku||'').toString().trim();
        obj.quantity = Number(obj.quantity) || 0;
        obj._parsed_date = parseDatePreferDMY(obj.date);
        obj._month_key = obj._parsed_date ? `${obj._parsed_date.getFullYear()}-${String(obj._parsed_date.getMonth()+1).padStart(2,'0')}` : '';
        return obj;
      });

      // dedupe exact duplicates
      const seen = new Set();
      RAW = RAW.filter(r => {
        const key = JSON.stringify([r.state, r.date, r.party_name, r.district, r.sku, r.quantity]);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      populateFilters();
      applyFilters();
    } catch (e) {
      console.error('Failed load', e);
      tbody.innerHTML = '<tr><td colspan="6" class="text-danger p-3">Failed to load data</td></tr>';
    }
  }

  function populateFilters() {
    const months = Array.from(new Set(RAW.map(r=>r._month_key).filter(Boolean))).sort();
    filterMonth.innerHTML = '<option value="">All</option>' + months.map(m=>{
      const [y,mm] = m.split('-'); const d=new Date(y,Number(mm)-1,1);
      return `<option value="${m}">${d.toLocaleString(undefined,{month:'long'})} ${y}</option>`;
    }).join('');

    const states = Array.from(new Set(RAW.map(r=>r.state).filter(Boolean))).sort();
    filterState.innerHTML = '<option value="">All</option>' + states.map(s=>`<option>${s}</option>`).join('');

    const skus = Array.from(new Set(RAW.map(r=>r.sku).filter(Boolean))).sort();
    filterSKU.value=''; skuList.innerHTML = skus.map(s=>`<option value="${s}">`).join('');
  }

  [filterMonth, filterState, filterSKU, filterFrom].forEach(el => el.addEventListener('change', ()=>applyFilters()));
  filterSKU.addEventListener('input', ()=>applyFilters());
  clearFilters.addEventListener('click', ()=>{ filterMonth.value=''; filterState.value=''; filterSKU.value=''; filterFrom.value=''; applyFilters(); });

  function applyFilters() {
    const m = filterMonth.value; const s = filterState.value; const skuQ = (filterSKU.value||'').toLowerCase();
    const from = filterFrom.value ? new Date(filterFrom.value) : null;
    FILTERED = RAW.filter(r => {
      if (m && r._month_key !== m) return false;
      if (s && (r.state||'') !== s) return false;
      if (skuQ && !r.sku.toLowerCase().includes(skuQ)) return false;
      if (from && (!r._parsed_date || r._parsed_date < from)) return false;
      return true;
    });
    renderWithSubtotals();
  }

  // group by state + date + sku (daily sale doesn't have depot by default)
  function renderWithSubtotals() {
    FILTERED.sort((a,b)=>{
      if (a.state !== b.state) return a.state.localeCompare(b.state);
      const da = a._parsed_date ? a._parsed_date.getTime() : 0;
      const db = b._parsed_date ? b._parsed_date.getTime() : 0;
      if (da !== db) return da - db;
      if (a.sku !== b.sku) return a.sku.localeCompare(b.sku);
      return 0;
    });

    let html = '';
    let grand = 0;
    let i=0;
    while (i < FILTERED.length) {
      const key = `${FILTERED[i].state}||${FILTERED[i].date}||${FILTERED[i].sku}`;
      const group = [];
      let j=i;
      while (j < FILTERED.length) {
        const keyj = `${FILTERED[j].state}||${FILTERED[j].date}||${FILTERED[j].sku}`;
        if (keyj !== key) break;
        group.push(FILTERED[j]); j++;
      }

      group.forEach(r => {
        html += `<tr>
          <td class="center">${escapeHtml(r.state)}</td>
          <td class="center">${escapeHtml(r.date)}</td>
          <td class="left">${escapeHtml(r.party_name)}</td>
          <td class="center">${escapeHtml(r.district)}</td>
          <td class="left">${escapeHtml(r.sku)}</td>
          <td class="center">${fmt(r.quantity)}</td>
        </tr>`;
      });

      if (group.length >= 2) {
        const subtotal = group.reduce((s,r)=>s + (Number(r.quantity)||0), 0);
        html += `<tr class="subtotal-row"><td colspan="5">Subtotal →</td><td class="center">${fmt(subtotal)}</td></tr>`;
      }

      grand += group.reduce((s,r)=>s + (Number(r.quantity)||0), 0);
      i = j;
    }

    tbody.innerHTML = html;
    document.getElementById('grand_qty').textContent = fmt(grand);
  }

  function escapeHtml(s){ if (s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function exportToExcel() {
    const header = ["State","Date","Party Name","District","SKU","Quantity"];
    const wsData = [header];
    const rows = Array.from(tbody.querySelectorAll('tr'));
    rows.forEach(tr => {
      const cells = Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim());
      wsData.push(cells);
    });
    wsData.push(["Grand Total","","","","", document.getElementById('grand_qty').textContent]);
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "DailySale");
    XLSX.writeFile(wb, `daily_sale_export_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  exportBtn.addEventListener('click', exportToExcel);
  // initial load
  loadData();
  </script>
</body>
</html>
