<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC - Daily Sale (F1)</title>

  <link rel="stylesheet" href="/static/css/f1-style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="/static/js/f1-core.js" defer></script>

  <style>
    .page-pad { padding: 12px; }
    .f1-controls .btn { margin-left: 6px; }
  </style>
</head>
<body>
  <div class="page-pad">
    <div class="f1-header">
      <div class="f1-logo">
        <img src="/static/onlylogo.png" alt="SMC" onerror="this.style.display='none'">
        <h1>SMC - Daily Sale</h1>
      </div>

      <div class="f1-controls">
        <a href="{{ url_for('sales_levels') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
        <a href="{{ url_for('dashboard_stock') }}" class="btn btn-outline-primary btn-sm">Stock</a>

        <button id="toggleFiltersBtnDS" class="btn btn-light btn-sm">Filters</button>
        <button id="yesterdayBtnDS" class="btn btn-info btn-sm text-white">Yesterday</button>

        <div class="dropdown">
          <button class="btn btn-outline-dark btn-sm dropdown-toggle" data-bs-toggle="dropdown">Columns</button>
          <div class="dropdown-menu dropdown-menu-end col-toggle p-3" id="dailyColToggle">
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="state" type="checkbox" checked> <label class="form-check-label">State</label></div>
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="district" type="checkbox" checked> <label class="form-check-label">District</label></div>
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="date" type="checkbox" checked> <label class="form-check-label">Date</label></div>
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="party_name" type="checkbox" checked> <label class="form-check-label">Party Name</label></div>
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="sku" type="checkbox" checked> <label class="form-check-label">SKU</label></div>
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="quantity" type="checkbox" checked> <label class="form-check-label">Quantity</label></div>
          </div>
        </div>

        <button id="exportDailyBtn" class="btn btn-success btn-sm">Export Excel</button>
      </div>
    </div>

    <div id="dailyFilterPanel" class="f1-filter" style="display:none;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div><label class="form-label small-muted">Month</label><select id="dailyFilterMonth" class="form-select"><option value="">All</option></select></div>
        <div><label class="form-label small-muted">State</label><select id="dailyFilterState" class="form-select"><option value="">All</option></select></div>
        <div><label class="form-label small-muted">District</label><select id="dailyFilterDistrict" class="form-select"><option value="">All</option></select></div>
        <div style="flex:1"><label class="form-label small-muted">SKU (search)</label><input id="dailyFilterSKU" list="dailySkuList" class="form-control" placeholder="Type or pick SKU"><datalist id="dailySkuList"></datalist></div>
        <div><label class="form-label small-muted">From</label><input id="dailyFilterFrom" type="date" class="form-control"></div>
        <div><label class="form-label small-muted">To</label><input id="dailyFilterTo" type="date" class="form-control"></div>
        <div><button id="dailyClearFilters" class="btn btn-outline-secondary">Reset</button></div>
      </div>
    </div>

    <div id="dailyContainer" class="f1-table-wrap">
      <div class="f1-table-head">
        <div class="f1-thead"></div>
      </div>
      <div class="f1-body"></div>
    </div>
  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', ()=>{

    const dailyCols = [
      { key:'state', label:'State', width:130, frozen:true },
      { key:'district', label:'District', width:150, frozen:true },
      { key:'date', label:'Date', width:110 },
      { key:'party_name', label:'Party Name', width:360 },
      { key:'sku', label:'SKU', width:300 },
      { key:'quantity', label:'Quantity', width:120 }
    ];

    F1.init({
      container: '#dailyContainer',
      apiUrl: '/api/get_daily_sale',
      colWidthsKey: 'smc_col_widths_daily',
      colWidths: { state:130, district:150, date:110, party_name:360, sku:300, quantity:120 },
      columns: dailyCols,
      onReady: ({ merged })=>{
        // populate filters from merged rows
        const months = [...new Set(merged.map(r=>r._month).filter(Boolean))].sort();
        document.getElementById('dailyFilterMonth').innerHTML = '<option value="">All</option>' + months.map(m=>{ const [y,mm]=m.split('-'); const d=new Date(y,mm-1,1); return `<option value="${m}">${d.toLocaleString(undefined,{month:'long'})} ${y}</option>`; }).join('');
        const states = [...new Set(merged.map(r=>r.state).filter(Boolean))].sort();
        document.getElementById('dailyFilterState').innerHTML = '<option value="">All</option>' + states.map(s=>`<option>${s}</option>`).join('');
        const districts = [...new Set(merged.map(r=>r.district).filter(Boolean))].sort();
        document.getElementById('dailyFilterDistrict').innerHTML = '<option value="">All</option>' + districts.map(d=>`<option>${d}</option>`).join('');
        const skus = [...new Set(merged.map(r=>r.sku).filter(Boolean))].sort();
        document.getElementById('dailySkuList').innerHTML = skus.map(s=>`<option value="${s}">`).join('');
      }
    });

    // UI interactions
    document.getElementById('toggleFiltersBtnDS').addEventListener('click', ()=> {
      const panel = document.getElementById('dailyFilterPanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('yesterdayBtnDS').addEventListener('click', ()=> {
      const d = new Date(); d.setDate(d.getDate()-1);
      const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      document.getElementById('dailyFilterFrom').value = val;
      document.getElementById('dailyFilterTo').value = val;
      F1.refresh();
    });

    document.querySelectorAll('#dailyColToggle .col-toggle-checkbox').forEach(ch=>{
      ch.addEventListener('change', ()=>{ const col = ch.dataset.col; document.querySelectorAll(`[data-col="${col}"]`).forEach(el=> el.style.display = ch.checked ? '' : 'none'); F1.refresh(); });
    });

    document.getElementById('exportDailyBtn').addEventListener('click', ()=> {
      F1.export(`daily_sale_export_${new Date().toISOString().slice(0,10)}.xlsx`);
    });

    document.getElementById('dailyClearFilters').addEventListener('click', ()=>{
      document.getElementById('dailyFilterMonth').value=''; document.getElementById('dailyFilterState').value=''; document.getElementById('dailyFilterDistrict').value=''; document.getElementById('dailyFilterSKU').value=''; document.getElementById('dailyFilterFrom').value=''; document.getElementById('dailyFilterTo').value='';
      F1.refresh();
    });

  });
  </script>
</body>
</html>
