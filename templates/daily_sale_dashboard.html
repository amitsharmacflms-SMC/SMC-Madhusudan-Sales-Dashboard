<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC - Daily Sale (Patched - Option 2)</title>

  <!-- Bootstrap & SheetJS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --smc-blue:#0d6efd;
      --soft-blue:#e7f1ff;
      --muted:#6b7280;
      --border:#9fb1c8;
      --card-bg:#ffffff;
      --totals-shade:#e6f0ff;
    }
    body{
      background: linear-gradient(180deg,#f6fbff,#f2f6fb 60%);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      padding:18px;
    }

    /* Auto width and wrap for long columns */
    #saleTable th[data-col="party_name"],
    #saleTable th[data-col="sku"],
    #saleTable td[data-col="party_name"],
    #saleTable td[data-col="sku"] { white-space: normal !important; }
    #saleTable th[data-col="state"], #saleTable th[data-col="date"], #saleTable th[data-col="district"], #saleTable th[data-col="quantity"],
    #saleTable td[data-col="state"], #saleTable td[data-col="date"], #saleTable td[data-col="district"], #saleTable td[data-col="quantity"] { white-space: nowrap !important; }
    #saleTable { table-layout: auto !important; }
    #saleTable.table-sm th, #saleTable.table-sm td { padding: 8px 12px !important; }

    .top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
    .logo-title{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#0d6efd22,#0d6efd11);
      border-radius:10px;padding:10px 14px;border-left:6px solid var(--smc-blue);box-shadow:0 6px 18px rgba(13,110,253,0.06)}
    .logo-title img{height:46px}
    .logo-title h1{margin:0;font-size:1.05rem;color:#073763;font-weight:800}

    .controls{display:flex;gap:8px;align-items:center}
    .btn-pill{border-radius:999px;padding:8px 14px}

    .filter-panel{background:linear-gradient(180deg,#ffffffb8,#ffffffb0);border-radius:10px;padding:14px;
      box-shadow:0 6px 18px rgba(2,6,23,0.06);margin-bottom:12px;transition:all .28s ease}
    .filter-row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
    .filter-row .form-label{font-weight:600;color:var(--muted);font-size:.9rem}

    .table-wrap{border-radius:10px;overflow:auto;background:var(--card-bg);box-shadow:0 8px 30px rgba(2,6,23,0.05);
      border:2px solid var(--border);max-height:68vh}
    table{width:100%;border-collapse:collapse;}
    table,th,td{border:2px solid var(--border)}
    thead th{position:sticky;top:0;z-index:6;background:linear-gradient(90deg,#f0f8ff,#ffffff);padding:12px;text-align:center;
      font-weight:800;color:#0b3b66;box-shadow:inset 0 -1px 0 rgba(0,0,0,0.02);cursor:pointer}
    tbody td{padding:10px 12px;vertical-align:middle}
    td.center{text-align:center}
    td.left{text-align:left}

    tr:hover td{background:#fbfdff}

    .subtotal-row td{background:var(--totals-shade);font-weight:700;text-align:center}
    .state-grand-row td{background:var(--totals-shade);font-weight:900;text-align:center}
    .overall-grand-row td{background:linear-gradient(90deg,#dff2ff,#d0eaff);font-weight:900;text-align:center;color:#05284a}

    .col-toggle{max-height:260px;overflow:auto;padding:10px;width:260px}

    .sort-indicator{ font-size:0.85rem; margin-left:6px; color:#0b3b66; opacity:0.7; }

    @media (max-width:900px){.filter-row{display:block}.top-row{flex-direction:column;align-items:flex-start;gap:8px}}
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="top-row">
      <div class="logo-title">
        <img src="/static/onlylogo.png" alt="SMC" onerror="this.style.display='none'">
        <h1>SMC - Daily Sale</h1>
      </div>

      <div class="controls">
        <a href="{{ url_for('dashboard_stock') }}" class="btn btn-outline-secondary btn-sm">← Stock</a>

        <button id="toggleFiltersBtn" class="btn btn-light btn-pill">Filters</button>
        <button id="yesterdayBtn" class="btn btn-info btn-pill text-white">Yesterday</button>

        <div class="dropdown">
          <button class="btn btn-outline-dark btn-sm dropdown-toggle" id="colToggleBtn" data-bs-toggle="dropdown">Columns</button>
          <div class="dropdown-menu dropdown-menu-end col-toggle" aria-labelledby="colToggleBtn">
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="state" type="checkbox" checked> <label class="form-check-label">State</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" id="dateColCheckbox" data-col="date" type="checkbox" checked> <label class="form-check-label">Date</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="party_name" type="checkbox" checked> <label class="form-check-label">Party Name</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="district" type="checkbox" checked> <label class="form-check-label">District</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="sku" type="checkbox" checked> <label class="form-check-label">SKU</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="quantity" type="checkbox" checked> <label class="form-check-label">Quantity</label></div>
          </div>
        </div>

        <button id="exportBtn" class="btn btn-success">Export Excel</button>
      </div>
    </div>

    <div id="filterPanel" class="filter-panel" style="display:none;">
      <div class="filter-row">
        <div style="flex:1; min-width:160px;">
          <label class="form-label">Month</label>
          <select id="filterMonth" class="form-select"><option value="">All</option></select>
        </div>

        <div style="flex:1; min-width:160px;">
          <label class="form-label">State</label>
          <select id="filterState" class="form-select"><option value="">All</option></select>
        </div>

        <div style="flex:1; min-width:160px;">
          <label class="form-label">District</label>
          <input id="filterDistrict" list="districtList" class="form-control" placeholder="Type or pick District">
          <datalist id="districtList"></datalist>
        </div>

        <div style="flex:1; min-width:220px;">
          <label class="form-label">Party Name</label>
          <input id="filterParty" list="partyList" class="form-control" placeholder="Type or pick Party">
          <datalist id="partyList"></datalist>
        </div>

        <div style="flex:2; min-width:220px;">
          <label class="form-label">SKU (search)</label>
          <input id="filterSKU" list="skuList" class="form-control" placeholder="Type or pick SKU">
          <datalist id="skuList"></datalist>
        </div>

        <div style="min-width:140px;">
          <label class="form-label">From</label>
          <input id="filterFrom" type="date" class="form-control">
        </div>

        <div style="min-width:120px; display:flex; align-items:end;">
          <button id="clearFilters" class="btn btn-outline-secondary w-100">Reset</button>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table id="saleTable" class="table table-sm mb-0">
        <thead>
          <tr>
            <th data-col="state">State <span class="sort-indicator" data-col="state"></span></th>
            <th data-col="date">Date <span class="sort-indicator" data-col="date"></span></th>
            <th data-col="party_name">Party Name <span class="sort-indicator" data-col="party_name"></span></th>
            <th data-col="district">District <span class="sort-indicator" data-col="district"></span></th>
            <th data-col="sku">SKU <span class="sort-indicator" data-col="sku"></span></th>
            <th data-col="quantity">Quantity <span class="sort-indicator" data-col="quantity"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  // ---------- Utilities ----------
  const pad2 = n => String(n).padStart(2,'0');
  const fmt = v => (v == null || isNaN(+v)) ? '' : Number(v).toLocaleString();

  function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function parseDMYtoUTC(s){
    if(!s) return null;
    const m = String(s).trim().match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
    if(m){
      const day = +m[1], mon = +m[2], year = +m[3];
      return new Date(Date.UTC(year, mon-1, day));
    }
    const iso = new Date(s);
    return isNaN(iso) ? null : new Date(Date.UTC(iso.getUTCFullYear(), iso.getUTCMonth(), iso.getUTCDate()));
  }
  function parseInputDateUTC(val){ if(!val) return null; const [y,m,d] = val.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
  function formatDateDDMMYYYYUTC(d){ if(!d) return ''; return `${pad2(d.getUTCDate())}-${pad2(d.getUTCMonth()+1)}-${d.getUTCFullYear()}`; }

  // ---------- DOM refs ----------
  const tbody = document.querySelector('#saleTable tbody');
  const filterPanel = document.getElementById('filterPanel');
  const toggleFiltersBtn = document.getElementById('toggleFiltersBtn');
  const yesterdayBtn = document.getElementById('yesterdayBtn');

  const filterMonth = document.getElementById('filterMonth');
  const filterState = document.getElementById('filterState');
  const filterDistrict = document.getElementById('filterDistrict');
  const filterParty = document.getElementById('filterParty');
  const filterSKU = document.getElementById('filterSKU');
  const skuList = document.getElementById('skuList');
  const districtList = document.getElementById('districtList');
  const partyList = document.getElementById('partyList');
  const filterFrom = document.getElementById('filterFrom');
  const clearFilters = document.getElementById('clearFilters');
  const exportBtn = document.getElementById('exportBtn');
  const colCheckboxes = Array.from(document.querySelectorAll('.col-toggle-checkbox'));
  const dateColCheckbox = document.getElementById('dateColCheckbox');

  // ---------- App state ----------
  let RAW = [], MERGED = [], FILTERED = [];
  let currentSort = { col: null, dir: 1 }; // dir: 1 ascending, -1 descending

  // ---------- Load data ----------
  async function loadData(){
    try{
      const res = await fetch('/api/get_daily_sale');
      RAW = await res.json();

      // normalize fields, compute parsed date and month key
      RAW = RAW.map(r=>{
        const o={};
        for(const k in r) o[k.trim().toLowerCase()] = r[k];
        o.state = (o.state||'').toString().trim();
        o.date = (o.date||'').toString().trim();
        o.party_name = (o.party_name||'').toString().trim();
        o.district = (o.district||'').toString().trim();
        o.sku = (o.sku||'').toString().trim();
        o.quantity = Number(o.quantity) || 0;
        o._parsed_date = parseDMYtoUTC(o.date);
        o._month_key = o._parsed_date ? `${o._parsed_date.getUTCFullYear()}-${pad2(o._parsed_date.getUTCMonth()+1)}` : '';
        return o;
      });

      // MERGE duplicates using the FULL key (STATE|DATE|PARTY|DISTRICT|SKU) — this handles normal/day mode merge
      const map = new Map();
      RAW.forEach(r=>{
        const key = `${r.state}||${r.date}||${r.party_name}||${r.district}||${r.sku}`;
        if(!map.has(key)){
          map.set(key, Object.assign({}, r));
        } else {
          map.get(key).quantity += r.quantity || 0;
        }
      });
      MERGED = Array.from(map.values());

      populateFilters();
      applyFilters();
    }catch(err){
      console.error('Failed to load daily sale', err);
      tbody.innerHTML = '<tr><td colspan="6" class="text-danger p-3">Failed to load data</td></tr>';
    }
  }

  // ---------- Populate filters ----------
  function populateFilters(){
    const months = Array.from(new Set(MERGED.map(r=>r._month_key).filter(Boolean))).sort();
    filterMonth.innerHTML = '<option value="">All</option>' + months.map(m=>{
      const [y,mm] = m.split('-'); const d = new Date(Date.UTC(y,mm-1,1));
      return `<option value="${m}">${d.toLocaleString(undefined,{month:'long'})} ${y}</option>`;
    }).join('');

    const states = Array.from(new Set(MERGED.map(r=>r.state).filter(Boolean))).sort();
    filterState.innerHTML = '<option value="">All</option>' + states.map(s=>`<option>${s}</option>`).join('');

    const districts = Array.from(new Set(MERGED.map(r=>r.district).filter(Boolean))).sort();
    districtList.innerHTML = districts.map(d=>`<option value="${d}">`).join('');
    const parties = Array.from(new Set(MERGED.map(r=>r.party_name).filter(Boolean))).sort();
    partyList.innerHTML = parties.map(p=>`<option value="${p}">`).join('');
    const skus = Array.from(new Set(MERGED.map(r=>r.sku).filter(Boolean))).sort();
    skuList.innerHTML = skus.map(s=>`<option value="${s}">`).join('');
  }

  // ---------- Events ----------
  [filterMonth, filterState, filterDistrict, filterParty, filterFrom].forEach(el => el.addEventListener('change', applyFilters));
  filterSKU.addEventListener('input', applyFilters);
  clearFilters.addEventListener('click', ()=>{ filterMonth.value=''; filterState.value=''; filterDistrict.value=''; filterParty.value=''; filterSKU.value=''; filterFrom.value=''; applyFilters(); });

  colCheckboxes.forEach(ch => ch.addEventListener('change', ()=>{ reapplyColumnVisibility(); renderSmart(); }));

  yesterdayBtn.addEventListener('click', ()=>{ const now=new Date(); const y=new Date(now.getFullYear(), now.getMonth(), now.getDate()-1); filterFrom.value = `${y.getFullYear()}-${pad2(y.getMonth()+1)}-${pad2(y.getDate())}`; applyFilters(); yesterdayBtn.classList.add('btn-success'); setTimeout(()=>yesterdayBtn.classList.remove('btn-success'),900); });

  toggleFiltersBtn.addEventListener('click', ()=> { filterPanel.style.display = (filterPanel.style.display === 'none' || filterPanel.style.display === '') ? 'block' : 'none'; });

  // header sort click:
  document.querySelectorAll('#saleTable thead th').forEach(th=>{
    th.addEventListener('click', ()=>{
      const col = th.dataset.col;
      if(!col) return;
      if(currentSort.col === col) currentSort.dir *= -1;
      else { currentSort.col = col; currentSort.dir = 1; }
      // update indicators
      document.querySelectorAll('.sort-indicator').forEach(el=> el.textContent = '');
      const ind = document.querySelector(`.sort-indicator[data-col="${col}"]`);
      if(ind) ind.textContent = currentSort.dir === 1 ? '▲' : '▼';
      applyFilters(); // sorting runs during render
    });
  });

  // ---------- Apply filters ----------
  function applyFilters(){
    const m = filterMonth.value;
    const s = filterState.value;
    const d = (filterDistrict.value||'').trim();
    const p = (filterParty.value||'').trim();
    const skuQ = (filterSKU.value||'').toLowerCase().trim();
    const from = parseInputDateUTC(filterFrom.value);

    FILTERED = MERGED.filter(r=>{
      if(m && r._month_key !== m) return false;
      if(s && r.state !== s) return false;
      if(d && r.district !== d) return false;
      if(p && r.party_name !== p) return false;
      if(skuQ && !r.sku.toLowerCase().includes(skuQ)) return false;
      if(from && (!r._parsed_date || r._parsed_date < from)) return false;
      return true;
    });

    renderSmart();
  }

  // ---------- Smart render decision ----------
  // Option 2: Month summary ignores DATE -> group by state + party + district + sku
  function renderSmart(){
    const monthSelected = !!filterMonth.value;
    const dateVisible = (dateColCheckbox && dateColCheckbox.checked);
    const summaryMode = monthSelected || !dateVisible; // if month selected OR date column hidden -> summary
    if(summaryMode) renderMonthSummary();
    else renderDateMode();
  }

  // ---------- Date mode (group by full key; each group -> 1 row) ----------
  function renderDateMode(){
    // FILTERED is already deduped by MERGED merging step (state|date|party|district|sku)
    const rows = FILTERED.slice();

    // apply sort if set
    if(currentSort.col){
      rows.sort((a,b)=>{
        const c = currentSort.col;
        let va = (a[c] ?? ''), vb = (b[c] ?? '');
        // handle dates and numeric
        if(c === 'date'){ const da = a._parsed_date ? a._parsed_date.getTime() : 0; const db = b._parsed_date ? b._parsed_date.getTime() : 0; return (da - db) * currentSort.dir; }
        if(c === 'quantity'){ return ((Number(va)||0) - (Number(vb)||0)) * currentSort.dir; }
        va = String(va).toLowerCase(); vb = String(vb).toLowerCase();
        return va.localeCompare(vb) * currentSort.dir;
      });
    } else {
      // default stable sort: state, date, sku
      rows.sort((a,b)=>{
        if(a.state !== b.state) return a.state.localeCompare(b.state);
        const da = a._parsed_date ? a._parsed_date.getTime() : 0;
        const db = b._parsed_date ? b._parsed_date.getTime() : 0;
        if(da !== db) return da - db;
        if(a.sku !== b.sku) return a.sku.localeCompare(b.sku);
        return 0;
      });
    }

    // build HTML
    let html = '';
    let i=0;
    let currentState = null;
    let stateAcc = null;
    let overall = 0;

    while(i < rows.length){
      const r = rows[i];
      const ST = r.state;
      if(currentState && currentState !== ST){
        html += stateGrandRow(stateAcc);
        stateAcc = null;
      }
      if(!stateAcc){ stateAcc = { state: ST, qty: 0 }; currentState = ST; }

      // group by date inside state
      // gather all rows for this state
      const stateRows = [];
      let j = i;
      while(j < rows.length && rows[j].state === ST){ stateRows.push(rows[j]); j++; }

      // now group by date inside that
      let k = 0;
      while(k < stateRows.length){
        const dateRaw = stateRows[k].date;
        const dateRows = [];
        let m = k;
        while(m < stateRows.length && stateRows[m].date === dateRaw){
          dateRows.push(stateRows[m]);
          m++;
        }

        // render each grouped row (already merged earlier so each is one group)
        dateRows.forEach(rr=>{
          const fdate = rr._parsed_date ? formatDateDDMMYYYYUTC(rr._parsed_date) : rr.date;
          html += `<tr>
            <td class="center" data-col="state">${escapeHtml(rr.state)}</td>
            <td class="center" data-col="date">${fdate}</td>
            <td class="left" data-col="party_name">${escapeHtml(rr.party_name)}</td>
            <td class="center" data-col="district">${escapeHtml(rr.district)}</td>
            <td class="left" data-col="sku">${escapeHtml(rr.sku)}</td>
            <td class="center" data-col="quantity">${fmt(rr.quantity)}</td>
          </tr>`;
        });

        // subtotal for date
        const subtotal = dateRows.reduce((s,rr)=>(s + (Number(rr.quantity)||0)), 0);
        const span = getDynamicColspan();
        html += `<tr class="subtotal-row"><td colspan="${span}">subtotal of Date (${formatDateDDMMYYYYUTC(dateRows[0]._parsed_date || new Date(dateRows[0].date))})</td><td class="center" data-col="quantity">${fmt(subtotal)}</td></tr>`;

        stateAcc.qty += subtotal;
        overall += subtotal;

        k = m;
      }

      i = j;
    }

    if(stateAcc) html += stateGrandRow(stateAcc);
    html += overallGrandRow({ qty: overall });

    tbody.innerHTML = html;

    computeColumnWidthsFromStrings(
      '#saleTable',
      ['state','date','party_name','district','sku','quantity'],
      MERGED.length ? MERGED : RAW
    );

    reapplyColumnVisibility();
    if(rows.length === 0){
      tbody.insertAdjacentHTML('afterbegin', `<tr><td colspan="${getVisibleColumnCount()}" class="text-center p-3 text-muted">No data for selected filters.</td></tr>`);
    }
  }

  // ---------- Month summary (Option 2) ----------
  // Group by state||party_name||district||sku (NO date)
  function renderMonthSummary(){
    // groups map
    const groups = new Map();
    FILTERED.forEach(r=>{
      const key = `${r.state}||${r.party_name}||${r.district}||${r.sku}`;
      if(!groups.has(key)){
        groups.set(key, {
          state: r.state,
          party_name: r.party_name,
          district: r.district,
          sku: r.sku,
          qty: r.quantity || 0,
          // keep earliest date to show as representative if needed
          earliestDate: r._parsed_date || null
        });
      } else {
        const g = groups.get(key);
        g.qty += r.quantity || 0;
        if(r._parsed_date && (!g.earliestDate || r._parsed_date < g.earliestDate)) g.earliestDate = r._parsed_date;
      }
    });

    let rows = Array.from(groups.values());

    // sorting
    if(currentSort.col){
      const c = currentSort.col;
      rows.sort((a,b)=>{
        let va = (a[c] ?? ''), vb = (b[c] ?? '');
        if(c === 'quantity') return ((Number(va)||0) - (Number(vb)||0)) * currentSort.dir;
        va = String(va).toLowerCase(); vb = String(vb).toLowerCase();
        return va.localeCompare(vb) * currentSort.dir;
      });
    } else {
      rows.sort((a,b)=>{
        if(a.state !== b.state) return a.state.localeCompare(b.state);
        if(a.district !== b.district) return a.district.localeCompare(b.district);
        return a.sku.localeCompare(b.sku);
      });
    }

    let html = '';
    let i = 0, currentState = null, stateAcc = null;
    const overall = rows.reduce((s,r)=> s + (r.qty||0), 0);

    while(i < rows.length){
      const gr = rows[i];
      const ST = gr.state;
      if(currentState && currentState !== ST){ html += stateGrandRow(stateAcc); stateAcc = null; }
      if(!stateAcc){ stateAcc = { state: ST, qty: 0 }; currentState = ST; }

      // collect all for this state
      let j = i;
      const batch = [];
      while(j < rows.length && rows[j].state === ST){ batch.push(rows[j]); j++; }

      batch.forEach(r=>{
        html += `<tr>
          <td class="center" data-col="state">${escapeHtml(r.state)}</td>
          <td class="center" data-col="date"></td>
          <td class="left" data-col="party_name">${escapeHtml(r.party_name)}</td>
          <td class="center" data-col="district">${escapeHtml(r.district)}</td>
          <td class="left" data-col="sku">${escapeHtml(r.sku)}</td>
          <td class="center" data-col="quantity">${fmt(r.qty)}</td>
        </tr>`;
        stateAcc.qty += r.qty;
      });

      i = j;
    }

    if(stateAcc) html += stateGrandRow(stateAcc);
    html += overallGrandRow({ qty: overall });

    tbody.innerHTML = html;

    computeColumnWidthsFromStrings(
      '#saleTable',
      ['state','date','party_name','district','sku','quantity'],
      MERGED.length ? MERGED : RAW
    );

    reapplyColumnVisibility();

    if(rows.length === 0){
      tbody.insertAdjacentHTML('afterbegin', `<tr><td colspan="${getVisibleColumnCount()}" class="text-center p-3 text-muted">No data for selected month/filters.</td></tr>`);
    }
  }

  // ---------- Helpers ----------
  function getVisibleColumnCount(){
    const ths = Array.from(document.querySelectorAll('thead th'));
    return ths.filter(th => th.style.display !== 'none').length;
  }
  function getDynamicColspan(){
    const visible = getVisibleColumnCount();
    const numericCols = 1; // Quantity
    return Math.max(1, visible - numericCols);
  }

  function reapplyColumnVisibility(){
    colCheckboxes.forEach(ch=>{
      const col = ch.dataset.col;
      const show = ch.checked;
      const th = document.querySelector(`thead th[data-col="${col}"]`);
      if(th) th.style.display = show ? '' : 'none';
      document.querySelectorAll(`td[data-col="${col}"]`).forEach(td => td.style.display = show ? '' : 'none');
    });
  }

  function stateGrandRow(acc){
    const span = getDynamicColspan();
    return `<tr class="state-grand-row"><td colspan="${span}">GRAND TOTAL OF ${escapeHtml(acc.state)}</td><td class="center" data-col="quantity">${fmt(acc.qty)}</td></tr>`;
  }
  function overallGrandRow(acc){
    const span = getDynamicColspan();
    return `<tr class="overall-grand-row"><td colspan="${span}">OVERALL GRAND TOTAL</td><td class="center" data-col="quantity">${fmt(acc.qty || 0)}</td></tr>`;
  }

  // ---------- Export visible table ----------
  exportBtn.addEventListener('click', ()=>{
    const header = ["State","Date","Party Name","District","SKU","Quantity"];
    const ws_data = [header];
    const rows = Array.from(tbody.querySelectorAll('tr'));
    rows.forEach(tr=>{
      const cells = Array.from(tr.querySelectorAll('td')).map(td=>td.textContent.trim());
      while(cells.length < 6) cells.splice(0,0,'');
      ws_data.push(cells.slice(0,6));
    });
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    XLSX.utils.book_append_sheet(wb, ws, 'DailySale');
    XLSX.writeFile(wb, `daily_sale_export_${new Date().toISOString().slice(0,10)}.xlsx`);
  });

  // ---------- Column width helper ----------
  function computeColumnWidthsFromStrings(tableSelector, columns, rowsOfObjects, sampleLimit=500){
   const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');
   const tableEl=document.querySelector(tableSelector)||document.body;
   const font=window.getComputedStyle(tableEl).font||"600 14px Inter";ctx.font=font;
   const thEls=[...document.querySelectorAll(tableSelector+' thead th')];
   const headerWidths={};thEls.forEach(th=>{const c=th.dataset.col;headerWidths[c]=ctx.measureText(th.textContent.trim()).width+24;});
   const maxW={...headerWidths};const sample=(rowsOfObjects||[]).slice(0,sampleLimit);
   sample.forEach(r=>{columns.forEach(c=>{const w=ctx.measureText(String(r[c]||'')).width+24;if(w>maxW[c])maxW[c]=w;});});
   const MIN=40,MAX=900;
   thEls.forEach(th=>{const c=th.dataset.col;const w=Math.max(MIN,Math.min(MAX,maxW[c]||MIN));th.style.width=w+'px';});
  }

  // ---------- Init ----------
  loadData();

  // accessibility
  document.addEventListener('keydown', (e)=>{ if(e.key === 'f' || e.key === 'F') toggleFiltersBtn.click(); });
  </script>
</body>
</html>
