<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC - Daily Sale (Optimized)</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --smc-blue:#0d6efd;
      --muted:#6b7280;
      --border:#9fb1c8;
      --card-bg:#ffffff;
      --row-height:44px;
    }
    body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;margin:14px;background:linear-gradient(180deg,#f6fbff,#f2f6fb 60%)}
    .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
    .logo-title{display:flex;align-items:center;gap:12px;padding:8px 12px;border-left:6px solid var(--smc-blue);background:linear-gradient(90deg,#0d6efd22,#0d6efd11);border-radius:8px}
    .logo-title img{height:40px} .logo-title h1{margin:0;font-size:1.05rem;color:#073763;font-weight:800}
    .controls{display:flex;gap:8px;align-items:center}
    .filter-panel{background:linear-gradient(180deg,#ffffffd8,#ffffffcc);border-radius:10px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px rgba(2,6,23,0.05)}
    .filter-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
    .filter-row .form-label{font-weight:600;color:var(--muted);font-size:.9rem}

    /* table container */
    .table-wrap{border-radius:10px;overflow:hidden;background:var(--card-bg);box-shadow:0 8px 30px rgba(2,6,23,0.05);border:2px solid var(--border);height:62vh;display:flex;flex-direction:column}
    .table-head{overflow:hidden}
    table{width:100%;border-collapse:collapse;min-width:900px}
    table,th,td{border:2px solid var(--border)}
    thead th{position:sticky;top:0;z-index:6;background:linear-gradient(90deg,#f0f8ff,#ffffff);padding:10px;text-align:center;font-weight:800;color:#0b3b66}
    tbody{display:block;overflow:auto;flex:1;height:100%}
    tbody tr{display:flex;align-items:center;height:var(--row-height)}
    tbody td{padding:6px 10px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    td.center{text-align:center}
    td.left{text-align:left;padding-left:8px}

    /* column width helper classes */
    .col-state{width:120px}
    .col-date{width:110px}
    .col-party{width:320px}
    .col-district{width:150px}
    .col-sku{width:300px}
    .col-qty{width:110px;text-align:right;padding-right:12px}

    /* totals styling */
    .subtotal-row td{background:#e6f0ff !important;font-weight:700;text-align:center}
    .depot-grand-row td{background:#e0ecff !important;font-weight:800;text-align:center}
    .state-grand-row td{background:#d4e7ff !important;font-weight:900;text-align:center}
    .overall-grand-row td{background:linear-gradient(90deg,#cfe4ff,#bfe0ff) !important;font-weight:900;text-align:center;color:#05284a}

    /* skeleton */
    #skeleton{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
    .skeleton-box{width:92%;height:60%;border-radius:8px;background:linear-gradient(90deg,#f3f6fb,#eef6ff);display:flex;align-items:center;justify-content:center}

    .col-toggle{max-height:320px;overflow:auto;padding:10px;width:260px}

    /* mobile: M1 default visible columns (party_name, sku, quantity) */
    @media (max-width:520px){
      thead th[data-col="state"], thead th[data-col="date"], thead th[data-col="district"],
      tbody .cell-state, tbody .cell-date, tbody .cell-district { display:none !important; }
      /* allow toggling via Columns menu to show them if needed */
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="top-row">
      <div class="logo-title">
        <img src="/static/onlylogo.png" alt="SMC" onerror="this.style.display='none'">
        <h1>SMC - Daily Sale</h1>
      </div>

      <div class="controls">
        <a href="{{ url_for('sales_levels') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
        <a href="{{ url_for('dashboard_stock') }}" class="btn btn-outline-primary btn-sm">Stock</a>

        <button id="toggleFiltersBtn" class="btn btn-light btn-sm">Filters</button>
        <button id="yesterdayBtn" class="btn btn-info btn-sm text-white">Yesterday</button>

        <div class="dropdown">
          <button class="btn btn-outline-dark btn-sm dropdown-toggle" data-bs-toggle="dropdown">Columns</button>
          <div class="dropdown-menu dropdown-menu-end col-toggle" id="colToggleMenu">
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="state" type="checkbox" checked> <label class="form-check-label">State</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="date" type="checkbox" checked> <label class="form-check-label">Date</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="party_name" type="checkbox" checked> <label class="form-check-label">Party Name</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="district" type="checkbox" checked> <label class="form-check-label">District</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="sku" type="checkbox" checked> <label class="form-check-label">SKU</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="quantity" type="checkbox" checked> <label class="form-check-label">Quantity</label></div>
          </div>
        </div>

        <button id="exportBtn" class="btn btn-success btn-sm">Export Excel</button>
      </div>
    </div>

    <div id="filterPanel" class="filter-panel" style="display:none;">
      <div class="filter-row">
        <div style="flex:1;min-width:140px"><label class="form-label">Month</label><select id="filterMonth" class="form-select"><option value="">All</option></select></div>
        <div style="flex:1;min-width:120px"><label class="form-label">State</label><select id="filterState" class="form-select"><option value="">All</option></select></div>
        <div style="flex:1;min-width:120px"><label class="form-label">District</label><select id="filterDistrict" class="form-select"><option value="">All</option></select></div>
        <div style="flex:2;min-width:200px"><label class="form-label">SKU (search)</label><input id="filterSKU" list="skuList" class="form-control" placeholder="Type or pick SKU"><datalist id="skuList"></datalist></div>
        <div style="min-width:120px"><label class="form-label">From</label><input id="filterFrom" type="date" class="form-control"></div>
        <div style="min-width:120px"><label class="form-label">To</label><input id="filterTo" type="date" class="form-control"></div>
        <div style="min-width:120px;display:flex;align-items:end"><button id="clearFilters" class="btn btn-outline-secondary w-100">Reset</button></div>
      </div>
    </div>

    <div class="table-wrap" id="tableWrap">
      <div class="table-head">
        <table><thead><tr id="theadRow">
          <th data-col="state" class="col-state">State</th>
          <th data-col="date" class="col-date">Date</th>
          <th data-col="party_name" class="col-party" style="text-align:left">Party Name</th>
          <th data-col="district" class="col-district">District</th>
          <th data-col="sku" class="col-sku" style="text-align:left">SKU</th>
          <th data-col="quantity" class="col-qty">Quantity</th>
        </tr></thead></table>
      </div>

      <div id="skeleton"><div class="skeleton-box">Loading daily sale — preparing fast view...</div></div>

      <tbody id="vbody" style="display:none" aria-live="polite"></tbody>
    </div>
  </div>

  <!-- bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


  <script>
  // Worker code as blob — will dedupe exact duplicate rows (merge identical rows),
  // heavy grouping (month summary) is done on main thread to preserve party_name behavior.
  const workerDailyCode = `
    self.onmessage = function(e){
      try {
        const { cmd, rows } = e.data;
        if(cmd === 'process'){
          const map = new Map();
          rows.forEach(r=>{
            const o={};
            for(const k in r) o[String(k).trim().toLowerCase()] = r[k];
            const state=(o.state||'').toString().trim();
            const date=(o.date||'').toString().trim();
            const party=(o.party_name||'').toString().trim();
            const district=(o.district||'').toString().trim();
            const sku=(o.sku||'').toString().trim();
            const qty = Number(o.quantity)||0;
            const key = state+'||'+date+'||'+party+'||'+district+'||'+sku;
            if(!map.has(key)){
              map.set(key, { state, date, party_name:party, district, sku, quantity: qty });
            } else {
              const g = map.get(key);
              g.quantity += qty;
            }
          });
          self.postMessage({ ok:true, merged: Array.from(map.values()) });
        }
      } catch(err){
        self.postMessage({ ok:false, error: String(err) });
      }
    };
  `;
  const blob = new Blob([workerDailyCode], { type: 'application/javascript' });
  const workerDailyUrl = URL.createObjectURL(blob);
  let dailyWorker = null;
  try { dailyWorker = new Worker(workerDailyUrl); } catch(e){ dailyWorker = null; console.warn('Worker not available for daily sale.'); }

  // utilities
  const pad2 = n => String(n).padStart(2,'0');
  const fmt = v => (v==null || isNaN(+v)) ? '' : Number(v).toLocaleString();
  function parseDMYtoUTC(s){
    if(!s) return null;
    const m = String(s).trim().match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
    if(m) return new Date(Date.UTC(+m[3], +m[2]-1, +m[1]));
    const iso = new Date(s);
    return isNaN(iso)?null:new Date(Date.UTC(iso.getUTCFullYear(), iso.getUTCMonth(), iso.getUTCDate()));
  }
  function parseInputDateUTC(val){ if(!val) return null; const [y,m,d] = val.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
  function formatDateDDMMYYYYUTC(d){ if(!d) return ''; return `${pad2(d.getUTCDate())}-${pad2(d.getUTCMonth()+1)}-${d.getUTCFullYear()}`; }
  function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // DOM refs
  const vbody = document.getElementById('vbody');
  const theadRow = document.getElementById('theadRow');
  const skeleton = document.getElementById('skeleton');
  const filterPanel = document.getElementById('filterPanel');
  const toggleFiltersBtn = document.getElementById('toggleFiltersBtn');
  const yesterdayBtn = document.getElementById('yesterdayBtn');
  const filterMonth = document.getElementById('filterMonth');
  const filterState = document.getElementById('filterState');
  const filterDistrict = document.getElementById('filterDistrict');
  const filterSKU = document.getElementById('filterSKU');
  const filterFrom = document.getElementById('filterFrom');
  const filterTo = document.getElementById('filterTo');
  const clearFilters = document.getElementById('clearFilters');
  const skuList = document.getElementById('skuList');
  const exportBtn = document.getElementById('exportBtn');
  const colCheckboxes = Array.from(document.querySelectorAll('.col-toggle-checkbox'));

  // state
  let RAW = [], MERGED = [], FILTERED = [];
  const ROW_HEIGHT = 44, BUFFER = 10;
  let pool = [], poolCount = 0;

  // fetch and process via worker
  function fetchDaily(){
    showSkeleton(true);
    fetch('/api/get_daily_sale').then(r=>r.json()).then(rows=>{
      RAW = rows.map(r=>{
        const o={};
        for(const k in r) o[String(k).trim().toLowerCase()] = r[k];
        const state=(o.state||'').toString().trim();
        const date=(o.date||'').toString().trim();
        const party=(o.party_name||'').toString().trim();
        const district=(o.district||'').toString().trim();
        const sku=(o.sku||'').toString().trim();
        const quantity = Number(o.quantity)||0;
        const _parsed_date = parseDMYtoUTC(date);
        const _month_key = _parsed_date ? `${_parsed_date.getUTCFullYear()}-${pad2(_parsed_date.getUTCMonth()+1)}` : '';
        return { state, date, party_name:party, district, sku, quantity, _parsed_date, _month_key };
      });

      if(dailyWorker){
        dailyWorker.onmessage = function(ev){
          if(ev.data && ev.data.ok && ev.data.merged){
            MERGED = ev.data.merged.map(r=>{
              r._parsed_date = parseDMYtoUTC(r.date);
              r._month_key = r._parsed_date ? `${r._parsed_date.getUTCFullYear()}-${pad2(r._parsed_date.getUTCMonth()+1)}` : '';
              return { state: r.state, date: r.date, party_name: r.party_name, district: r.district, sku: r.sku, quantity: r.quantity, _parsed_date: r._parsed_date, _month_key: r._month_key };
            });
            populateFilters();
            applyFilters();
            showSkeleton(false);
          } else {
            MERGED = mergeSync(RAW);
            populateFilters();
            applyFilters();
            showSkeleton(false);
          }
        };
        dailyWorker.postMessage({ cmd:'process', rows: RAW });
      } else {
        MERGED = mergeSync(RAW);
        populateFilters();
        applyFilters();
        showSkeleton(false);
      }
    }).catch(err=>{
      console.error('fetch daily error', err);
      skeleton.innerHTML = '<div class="skeleton-box">Failed to load daily sale data.</div>';
    });
  }

  function mergeSync(rows){
    const map = new Map();
    rows.forEach(r=>{
      const key = `${r.state}||${r.date}||${r.party_name}||${r.district}||${r.sku}`;
      if(!map.has(key)) map.set(key, {...r});
      else {
        const g = map.get(key);
        g.quantity += r.quantity;
      }
    });
    return Array.from(map.values());
  }

  // UI events
  toggleFiltersBtn.addEventListener('click', ()=>{ filterPanel.style.display = filterPanel.style.display==='none' ? 'block' : 'none'; });
  clearFilters.addEventListener('click', ()=>{ filterMonth.value=''; filterState.value=''; filterDistrict.value=''; filterSKU.value=''; filterFrom.value=''; filterTo.value=''; applyFilters(); });
  colCheckboxes.forEach(ch=>ch.addEventListener('change', ()=>{ renderSmart(); }));

  yesterdayBtn.addEventListener('click', ()=>{
    const now = new Date(); const y = new Date(now.getFullYear(), now.getMonth(), now.getDate()-1);
    const val = `${y.getFullYear()}-${pad2(y.getMonth()+1)}-${pad2(y.getDate())}`;
    filterFrom.value = val; filterTo.value = val; applyFilters();
    yesterdayBtn.classList.add('btn-success'); setTimeout(()=>yesterdayBtn.classList.remove('btn-success'),700);
  });


  <script>
  // populate filter dropdowns
  function populateFilters(){
    const months = Array.from(new Set(MERGED.map(r=>r._month_key).filter(Boolean))).sort();
    filterMonth.innerHTML = '<option value="">All</option>' + months.map(m=>{
      const [y,mm]=m.split('-'); const d=new Date(Date.UTC(y,mm-1,1));
      return `<option value="${m}">${d.toLocaleString(undefined,{month:'long'})} ${y}</option>`;
    }).join('');
    const states = Array.from(new Set(MERGED.map(r=>r.state).filter(Boolean))).sort();
    filterState.innerHTML = '<option value="">All</option>' + states.map(s=>`<option>${s}</option>`).join('');
    const districts = Array.from(new Set(MERGED.map(r=>r.district).filter(Boolean))).sort();
    filterDistrict.innerHTML = '<option value="">All</option>' + districts.map(d=>`<option>${d}</option>`).join('');
    const skus = Array.from(new Set(MERGED.map(r=>r.sku).filter(Boolean))).sort();
    skuList.innerHTML = skus.map(s=>`<option value="${s}">`).join('');
  }

  [filterMonth, filterState, filterDistrict, filterFrom, filterTo].forEach(el=>el.addEventListener('change', applyFilters));
  filterSKU.addEventListener('input', applyFilters);

  function applyFilters(){
    const m = filterMonth.value, s = filterState.value, d = filterDistrict.value, skuQ = (filterSKU.value||'').toLowerCase().trim();
    const from = parseInputDateUTC(filterFrom.value), to = parseInputDateUTC(filterTo.value);
    FILTERED = MERGED.filter(r=>{
      if(m && r._month_key !== m) return false;
      if(s && r.state !== s) return false;
      if(d && r.district !== d) return false;
      if(skuQ && !r.sku.toLowerCase().includes(skuQ)) return false;
      if(from && (!r._parsed_date || r._parsed_date < from)) return false;
      if(to && (!r._parsed_date || r._parsed_date > to)) return false;
      return true;
    });
    renderSmart();
  }

  function renderSmart(){
    const monthSelected = !!filterMonth.value;
    const dateVisible = document.querySelector('input[data-col="date"]').checked;
    const summaryMode = monthSelected || !dateVisible;
    if(summaryMode) prepareMonthSummaryAndRender();
    else prepareNormalAndRender();
  }

  // Normal mode: show rows grouped by state->district->date and subtotal per date
  function prepareNormalAndRender(){
    const items = [];
    FILTERED.sort((a,b)=>{
      if(a.state!==b.state) return a.state.localeCompare(b.state);
      if(a.district!==b.district) return a.district.localeCompare(b.district);
      const da = a._parsed_date?a._parsed_date.getTime():0; const db = b._parsed_date?b._parsed_date.getTime():0;
      if(da!==db) return da-db;
      return a.sku.localeCompare(b.sku);
    });

    let i=0;
    const overall = { qty:0 };
    while(i<FILTERED.length){
      const r = FILTERED[i];
      const ST = r.state, DT = r.district;
      // collect district block
      const block = []; let j=i;
      while(j<FILTERED.length && FILTERED[j].state===ST && FILTERED[j].district===DT){
        block.push(FILTERED[j]); j++;
      }
      // within block group by date
      let k=0;
      let districtAcc = { district: DT, qty:0 };
      while(k<block.length){
        const dateVal = block[k].date;
        const group = []; let m=k;
        while(m<block.length && block[m].date===dateVal){
          group.push(block[m]); m++;
        }
        group.forEach(row => items.push({ type:'row', data: row }));
        const subQty = group.reduce((s,t)=>s + (Number(t.quantity)||0), 0);
        items.push({ type:'subtotal', data: { labelDate: group[0]._parsed_date || group[0].date, qty: subQty }});
        districtAcc.qty += subQty;
        overall.qty += subQty;
        k = m;
      }
      items.push({ type:'districtTotal', data: districtAcc });
      // state total
      const nextIdx = j;
      if(nextIdx >= FILTERED.length || FILTERED[nextIdx].state !== ST){
        const stateQty = FILTERED.filter(x=>x.state===ST).reduce((s,t)=>s + (Number(t.quantity)||0), 0);
        items.push({ type:'stateTotal', data: { state: ST, qty: stateQty }});
      }
      i = j;
    }
    items.push({ type:'overall', data: overall });
    window._renderItems = items;
    initVirtualRenderer(items);
  }

  // Month summary: group by state+district+sku (sum quantity)
  function prepareMonthSummaryAndRender(){
    const groups = new Map();
    FILTERED.forEach(r=>{
      const key = `${r.state}||${r.district}||${r.sku}`;
      if(!groups.has(key)) groups.set(key, { state: r.state, district: r.district, sku: r.sku, qty: 0 });
      groups.get(key).qty += Number(r.quantity)||0;
    });
    const rows = Array.from(groups.values()).map(g=>({ state: g.state, district: g.district, sku: g.sku, quantity: g.qty }));
    rows.sort((a,b)=>{ if(a.state!==b.state) return a.state.localeCompare(b.state); if(a.district!==b.district) return a.district.localeCompare(b.district); return a.sku.localeCompare(b.sku); });

    const items = []; let i=0; const overall={qty:0};
    while(i<rows.length){
      const ST = rows[i].state, DT = rows[i].district;
      const depotRows = []; let j=i;
      while(j<rows.length && rows[j].state===ST && rows[j].district===DT){ depotRows.push(rows[j]); j++; }
      depotRows.forEach(r=>{ items.push({ type:'row', data: r }); overall.qty += r.quantity; });
      const depotAcc = depotRows.reduce((a,t)=>{ a.qty+=t.quantity; return a; },{qty:0});
      items.push({ type:'districtTotal', data: { district: DT, qty: depotAcc.qty }});
      if(j >= rows.length || rows[j].state !== ST){
        const stateAcc = rows.filter(x=>x.state===ST).reduce((a,t)=>{ a.qty+=t.quantity; return a; },{qty:0});
        items.push({ type:'stateTotal', data: { state: ST, qty: stateAcc.qty }});
      }
      i = j;
    }
    items.push({ type:'overall', data: overall });
    window._renderItems = items;
    initVirtualRenderer(items);
  }

  // virtual renderer (recycled pool)
  function initVirtualRenderer(items){
    vbody.style.display = '';
    skeleton.style.display = 'none';
    const total = items.length;
    // spacer
    vbody.innerHTML = '';
    const spacer = document.createElement('div'); spacer.id = 'vSpacer'; spacer.style.height = (total * ROW_HEIGHT) + 'px';
    vbody.appendChild(spacer);

    // determine visible count
    const wrap = document.querySelector('.table-wrap');
    const avail = Math.max(3, Math.floor((wrap.clientHeight - 40) / ROW_HEIGHT));
    const poolSize = avail + BUFFER*2;

    pool = [];
    for(let p=0;p<Math.min(poolSize, total);p++){
      const tr = document.createElement('div'); tr.className='vrow'; tr.style.position='absolute'; tr.style.left='0'; tr.style.right='0'; tr.style.display='flex';
      // render children for current visible columns
      const cols = getVisibleColumnsOrder();
      cols.forEach(col=>{
        const td = document.createElement('div'); td.className='cell cell-'+col; td.setAttribute('data-col', col);
        if(col==='state') td.classList.add('col-state');
        if(col==='date') td.classList.add('col-date');
        if(col==='party_name') td.classList.add('col-party');
        if(col==='district') td.classList.add('col-district');
        if(col==='sku') td.classList.add('col-sku');
        if(col==='quantity') td.classList.add('col-qty');
        tr.appendChild(td);
      });
      vbody.appendChild(tr);
      pool.push(tr);
    }

    vbody.onscroll = onScrollDaily;
    // initial paint
    onScrollDaily();
  }

  function getVisibleColumnsOrder(){
    const ths = Array.from(document.querySelectorAll('thead th'));
    return ths.filter(th => th.style.display !== 'none').map(th => th.dataset.col);
  }

  function paintDailyRowAt(poolIndex, itemIndex){
    const node = pool[poolIndex];
    const items = window._renderItems || [];
    if(itemIndex < 0 || itemIndex >= items.length){ node.style.display = 'none'; return; }
    const it = items[itemIndex];
    node.style.display = 'flex';
    node.style.top = (itemIndex * ROW_HEIGHT) + 'px';

    const cols = getVisibleColumnsOrder();
    // ensure children count matches
    if(node.children.length !== cols.length){
      node.innerHTML = '';
      cols.forEach(col=>{
        const td = document.createElement('div'); td.className='cell cell-'+col; td.setAttribute('data-col', col);
        if(col==='state') td.classList.add('col-state');
        if(col==='date') td.classList.add('col-date');
        if(col==='party_name') td.classList.add('col-party');
        if(col==='district') td.classList.add('col-district');
        if(col==='sku') td.classList.add('col-sku');
        if(col==='quantity') td.classList.add('col-qty');
        node.appendChild(td);
      });
    }

    cols.forEach((col,ci)=>{
      const td = node.children[ci];
      td.classList.remove('center','left');
      if(col==='quantity') td.classList.add('center'); else if(col==='party_name' || col==='sku') td.classList.add('left'); else td.classList.add('center');

      if(it.type === 'row'){
        const d = it.data;
        if(col==='state') td.textContent = d.state||'';
        else if(col==='date') td.textContent = d._parsed_date ? formatDateDDMMYYYYUTC(d._parsed_date) : (d.date||'');
        else if(col==='party_name') td.textContent = d.party_name || '';
        else if(col==='district') td.textContent = d.district || '';
        else if(col==='sku') td.textContent = d.sku || '';
        else if(col==='quantity') td.textContent = fmt(d.quantity);
      } else if(it.type === 'subtotal'){
        if(ci === 0){
          td.textContent = `subtotal of Date (${ it.data.labelDate instanceof Date ? formatDateDDMMYYYYUTC(it.data.labelDate) : it.data.labelDate })`;
          td.style.fontWeight = '700';
        } else {
          if(col==='quantity') td.textContent = fmt(it.data.qty); else td.textContent = '';
        }
      } else if(it.type === 'districtTotal'){
        if(ci===0){ td.textContent = `GRAND TOTAL OF ${it.data.district || ''}`; td.style.fontWeight='800'; }
        else { if(col==='quantity') td.textContent = fmt(it.data.qty); else td.textContent = ''; }
      } else if(it.type === 'stateTotal'){
        if(ci===0){ td.textContent = `GRAND TOTAL OF ${it.data.state || ''}`; td.style.fontWeight='800'; }
        else { if(col==='quantity') td.textContent = fmt(it.data.qty); else td.textContent = ''; }
      } else if(it.type === 'overall'){
        if(ci===0){ td.textContent = `OVERALL GRAND TOTAL`; td.style.fontWeight='900'; }
        else { if(col==='quantity') td.textContent = fmt(it.data.qty); else td.textContent = ''; }
      }
    });
  }

  function onScrollDaily(){
    const sTop = vbody.scrollTop;
    const firstIndex = Math.max(0, Math.floor(sTop / ROW_HEIGHT) - BUFFER);
    const items = window._renderItems || [];
    for(let p=0;p<pool.length;p++){
      const itemIndex = firstIndex + p;
      paintDailyRowAt(p, itemIndex);
    }
  }

  // reapply column visibility
  function reapplyColumnVisibilityDaily(){
    colCheckboxes.forEach(ch=>{
      const col = ch.dataset.col, show = ch.checked;
      const th = document.querySelector(`thead th[data-col="${col}"]`);
      if(th) th.style.display = show ? '' : 'none';
    });
    if(window._renderItems) initVirtualRenderer(window._renderItems);
  }

  // export
  exportBtn.addEventListener('click', ()=>{
    const header = getVisibleColumnsOrder().map(c=>{
      if(c==='state') return 'State';
      if(c==='date') return 'Date';
      if(c==='party_name') return 'Party Name';
      if(c==='district') return 'District';
      if(c==='sku') return 'SKU';
      if(c==='quantity') return 'Quantity';
      return c;
    });
    const rows = [];
    const items = window._renderItems || [];
    items.forEach(it=>{
      if(it.type === 'row'){
        const d = it.data;
        rows.push(getVisibleColumnsOrder().map(col=>{
          if(col==='state') return d.state;
          if(col==='date') return d._parsed_date ? formatDateDDMMYYYYUTC(d._parsed_date) : d.date;
          if(col==='party_name') return d.party_name;
          if(col==='district') return d.district;
          if(col==='sku') return d.sku;
          if(col==='quantity') return d.quantity;
          return '';
        }));
      } else if(it.type === 'subtotal'){
        rows.push(getVisibleColumnsOrder().map(col=> col==='quantity' ? it.data.qty : (col==='date'?(`Subtotal (${ it.data.labelDate instanceof Date ? formatDateDDMMYYYYUTC(it.data.labelDate) : it.data.labelDate })`): '')));
      } else if(it.type === 'districtTotal' || it.type === 'stateTotal' || it.type === 'overall'){
        rows.push(getVisibleColumnsOrder().map(col=>{
          if(col==='state' || col==='district'){
            if(it.type==='districtTotal') return `GRAND TOTAL OF ${it.data.district || ''}`;
            if(it.type==='stateTotal') return `GRAND TOTAL OF ${it.data.state || ''}`;
            if(it.type==='overall') return `OVERALL GRAND TOTAL`;
          }
          if(col==='quantity') return it.data.qty;
          return '';
        }));
      }
    });
    const aoa = [header, ...rows];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, 'DailySale');
    XLSX.writeFile(wb, `daily_sale_export_${new Date().toISOString().slice(0,10)}.xlsx`);
  });

  // show skeleton helper
  function showSkeleton(on){
    if(on){ skeleton.style.display='flex'; vbody.style.display='none'; }
    else { skeleton.style.display='none'; vbody.style.display='block'; }
  }

  // watch column checkbox changes
  colCheckboxes.forEach(ch=>ch.addEventListener('change', ()=>{ reapplyColumnVisibilityDaily(); }));

  // init fetch
  fetchDaily();
  </script>
</body>
</html>
