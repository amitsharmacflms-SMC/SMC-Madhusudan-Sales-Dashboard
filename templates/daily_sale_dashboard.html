<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC - Daily Sale (Patched)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--smc-blue:#0d6efd;--soft-blue:#e7f1ff;--muted:#6b7280;--border:#9fb1c8;--card-bg:#ffffff;--totals-shade:#e6f0ff;}
    body{background: linear-gradient(180deg,#f6fbff,#f2f6fb 60%);font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;padding:18px;}
    #saleTable th[data-col="party_name"],#saleTable th[data-col="sku"],#saleTable td[data-col="party_name"],#saleTable td[data-col="sku"] { white-space: normal !important; }
    #saleTable th[data-col="state"],#saleTable th[data-col="date"],#saleTable th[data-col="district"],#saleTable th[data-col="quantity"],#saleTable td[data-col="state"],#saleTable td[data-col="date"],#saleTable td[data-col="district"],#saleTable td[data-col="quantity"] { white-space: nowrap !important; }
    #saleTable { table-layout: auto !important; } #saleTable.table-sm th,#saleTable.table-sm td { padding:8px 12px !important; }
    .top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
    .filter-panel{background:linear-gradient(180deg,#ffffffb8,#ffffffb0);border-radius:10px;padding:14px;margin-bottom:12px}
    .table-wrap{border-radius:10px;overflow:auto;background:var(--card-bg);border:2px solid var(--border);max-height:68vh}
    table{width:100%;border-collapse:collapse;} table,th,td{border:2px solid var(--border)}
    thead th{position:sticky;top:0;background:linear-gradient(90deg,#f0f8ff,#ffffff);padding:12px;text-align:center;font-weight:800;color:#0b3b66}
    td.center{text-align:center} td.left{text-align:left}
    .subtotal-row td{background:var(--totals-shade);font-weight:700;text-align:center}
    th.sortable{cursor:pointer} th.sortable .arrow{font-size:.7em;margin-left:6px;color:#2c5282;opacity:.7}
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="top-row">
      <div><h1>SMC - Daily Sale</h1></div>
      <div class="controls">
        <button id="toggleFiltersBtn" class="btn btn-light btn-pill">Filters</button>
        <button id="exportBtn" class="btn btn-success">Export Excel</button>
      </div>
    </div>

    <div id="filterPanel" class="filter-panel" style="display:none;">
      <div class="filter-row" style="display:flex;gap:12px;flex-wrap:wrap;align-items:end">
        <div style="min-width:160px;"><label>Month</label><select id="filterMonth" class="form-select"><option value="">All</option></select></div>
        <div style="min-width:160px;"><label>State</label><select id="filterState" class="form-select"><option value="">All</option></select></div>
        <div style="min-width:220px;"><label>District (search)</label><input id="filterDistrict" list="districtList" class="form-control"><datalist id="districtList"></datalist></div>
        <div style="min-width:220px;"><label>Party Name (search)</label><input id="filterParty" list="partyList" class="form-control"><datalist id="partyList"></datalist></div>
        <div style="min-width:220px;"><label>SKU (search)</label><input id="filterSKU" list="skuList" class="form-control"><datalist id="skuList"></datalist></div>
        <div style="min-width:140px;"><label>From</label><input id="filterFrom" type="date" class="form-control"></div>
        <div style="min-width:120px;display:flex;align-items:flex-end"><button id="clearFilters" class="btn btn-outline-secondary w-100">Reset</button></div>
      </div>
    </div>

    <div class="table-wrap">
      <table id="saleTable" class="table table-sm mb-0">
        <thead>
          <tr>
            <th class="sortable" data-col="state" data-sort-key="state">State <span class="arrow"></span></th>
            <th class="sortable" data-col="date" data-sort-key="_parsed_date">Date <span class="arrow"></span></th>
            <th class="sortable" data-col="party_name" data-sort-key="party_name">Party Name <span class="arrow"></span></th>
            <th class="sortable" data-col="district" data-sort-key="district">District <span class="arrow"></span></th>
            <th class="sortable" data-col="sku" data-sort-key="sku">SKU <span class="arrow"></span></th>
            <th class="sortable" data-col="quantity" data-sort-key="quantity">Quantity <span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const pad2 = n => String(n).padStart(2,'0');
    const fmt = v => (v==null || isNaN(+v)) ? '' : Number(v).toLocaleString();
    function parseDMYtoUTC(s){ if(!s) return null; const m = String(s).trim().match(/(\\d{1,2})[-\\/](\\d{1,2})[-\\/](\\d{4})/); if(m) return new Date(Date.UTC(+m[3],+m[2]-1,+m[1])); const iso = new Date(s); return isNaN(iso)?null:new Date(Date.UTC(iso.getUTCFullYear(),iso.getUTCMonth(),iso.getUTCDate())); }
    function parseInputDateUTC(val){ if(!val) return null; const [y,m,d]=val.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
    function formatDateDDMMYYYYUTC(d){ if(!d) return ''; return `${pad2(d.getUTCDate())}-${pad2(d.getUTCMonth()+1)}-${d.getUTCFullYear()}`; }

    const tbody = document.querySelector('#saleTable tbody');
    const filterMonth = document.getElementById('filterMonth'), filterState = document.getElementById('filterState'), filterDistrict = document.getElementById('filterDistrict'), filterParty = document.getElementById('filterParty'), filterSKU = document.getElementById('filterSKU'), filterFrom = document.getElementById('filterFrom'), clearFilters = document.getElementById('clearFilters');
    const exportBtn = document.getElementById('exportBtn'), toggleFiltersBtn = document.getElementById('toggleFiltersBtn');
    const skuList = document.getElementById('skuList'), partyList = document.getElementById('partyList'), districtList = document.getElementById('districtList');

    let RAW=[], MERGED=[], FILTERED=[];
    let currentSort = { key: null, dir: 1 };

    async function loadData(){
      try{
        const res = await fetch('/api/get_daily_sale');
        RAW = await res.json();
        RAW = RAW.map(r=>{
          const o={}; for(const k in r) o[k.trim().toLowerCase()] = r[k];
          o.state=(o.state||'').toString().trim(); o.date=(o.date||'').toString().trim(); o.party_name=(o.party_name||'').toString().trim();
          o.district=(o.district||'').toString().trim(); o.sku=(o.sku||'').toString().trim(); o.quantity=Number(o.quantity)||0;
          o._parsed_date = parseDMYtoUTC(o.date); o._month_key = o._parsed_date ? `${o._parsed_date.getUTCFullYear()}-${pad2(o._parsed_date.getUTCMonth()+1)}` : '';
          return o;
        });
        const seen=new Set();
        MERGED = RAW.filter(r=>{ const key=JSON.stringify([r.state,r.date,r.party_name,r.district,r.sku,r.quantity]); if(seen.has(key)) return false; seen.add(key); return true; });
        populateFilters(); applyFilters();
      }catch(e){ console.error(e); tbody.innerHTML='<tr><td colspan="6">Failed to load</td></tr>'; }
    }

    function populateFilters(){
      const months = Array.from(new Set(MERGED.map(r=>r._month_key).filter(Boolean))).sort();
      filterMonth.innerHTML = '<option value=\"\">All</option>' + months.map(m=>{ const [y,mm]=m.split('-'); const d=new Date(Date.UTC(y,Number(mm)-1,1)); return `<option value=\"${m}\">${d.toLocaleString(undefined,{month:'long'})} ${y}</option>`; }).join('');
      const states = Array.from(new Set(MERGED.map(r=>r.state).filter(Boolean))).sort();
      filterState.innerHTML = '<option value=\"\">All</option>' + states.map(s=>`<option>${s}</option>`).join('');
      skuList.innerHTML = Array.from(new Set(MERGED.map(r=>r.sku).filter(Boolean))).sort().map(s=>`<option value=\"${s}\">`).join('');
      partyList.innerHTML = Array.from(new Set(MERGED.map(r=>r.party_name).filter(Boolean))).sort().map(p=>`<option value=\"${p}\">`).join('');
      districtList.innerHTML = Array.from(new Set(MERGED.map(r=>r.district).filter(Boolean))).sort().map(d=>`<option value=\"${d}\">`).join('');
    }

    [filterMonth,filterState,filterFrom,filterDistrict,filterParty].forEach(el=>el.addEventListener('change', applyFilters));
    filterSKU.addEventListener('input', applyFilters);
    clearFilters.addEventListener('click', ()=>{ filterMonth.value=''; filterState.value=''; filterSKU.value=''; filterFrom.value=''; filterDistrict.value=''; filterParty.value=''; applyFilters(); });
    toggleFiltersBtn.addEventListener('click', ()=>{ const fp=document.getElementById('filterPanel'); fp.style.display = (fp.style.display==='none' || !fp.style.display)? 'block' : 'none'; });

    document.querySelectorAll('th.sortable').forEach(h=>{ h.addEventListener('click', ()=>{ const key = h.dataset.sortKey || h.dataset.col; if(currentSort.key===key) currentSort.dir *= -1; else { currentSort = { key, dir: 1 }; } document.querySelectorAll('th.sortable .arrow').forEach(a=>a.textContent=''); const a=h.querySelector('.arrow'); if(a) a.textContent = currentSort.dir===1 ? '▲' : '▼'; applyFilters(); }); });

    function applyFilters(){
      const m = filterMonth.value, s=filterState.value, skuQ=(filterSKU.value||'').toLowerCase().trim(), from = parseInputDateUTC(filterFrom.value), districtQ=(filterDistrict.value||'').toLowerCase().trim(), partyQ=(filterParty.value||'').toLowerCase().trim();
      FILTERED = MERGED.filter(r=>{ if(m && r._month_key !== m) return false; if(s && r.state !== s) return false; if(skuQ && !r.sku.toLowerCase().includes(skuQ)) return false; if(from && (!r._parsed_date || r._parsed_date < from)) return false; if(districtQ && !r.district.toLowerCase().includes(districtQ)) return false; if(partyQ && !r.party_name.toLowerCase().includes(partyQ)) return false; return true; });
      if(currentSort.key){ const key=currentSort.key; FILTERED.sort((a,b)=>{ let va=a[key], vb=b[key]; if(key==='_parsed_date'){ va=a._parsed_date? a._parsed_date.getTime():0; vb=b._parsed_date? b._parsed_date.getTime():0; } if(typeof va==='string') va=va.toLowerCase(); if(typeof vb==='string') vb=vb.toLowerCase(); if(va<vb) return -1*currentSort.dir; if(va>vb) return 1*currentSort.dir; return 0; }); }
      renderSmart();
    }

    function renderSmart(){ const monthSelected=!!filterMonth.value; if(monthSelected) renderMonthSummary(); else renderDateMode(); }

    function renderDateMode(){
      if(!currentSort.key){
        FILTERED.sort((a,b)=>{ if(a.state!==b.state) return a.state.localeCompare(b.state); const da=a._parsed_date?a._parsed_date.getTime():0; const db=b._parsed_date?b._parsed_date.getTime():0; if(da!==db) return da-db; if(a.sku!==b.sku) return a.sku.localeCompare(b.sku); return 0; });
      }
      let html=''; let overall=0; let i=0;
      while(i<FILTERED.length){
        const row=FILTERED[i]; const ST=row.state;
        // collect state rows
        let j=i; const stateRows=[];
        while(j<FILTERED.length && FILTERED[j].state===ST){ stateRows.push(FILTERED[j]); j++; }
        let k=0;
        while(k<stateRows.length){
          const dateRaw=stateRows[k].date; const dateRows=[]; let m=k;
          while(m<stateRows.length && stateRows[m].date===dateRaw){ dateRows.push(stateRows[m]); m++; }
          dateRows.forEach(r=>{ const fdate = r._parsed_date? formatDateDDMMYYYYUTC(r._parsed_date): r.date; html += `<tr><td class="center" data-col="state">${escapeHtml(r.state)}</td><td class="center" data-col="date">${fdate}</td><td class="left" data-col="party_name">${escapeHtml(r.party_name)}</td><td class="center" data-col="district">${escapeHtml(r.district)}</td><td class="left" data-col="sku">${escapeHtml(r.sku)}</td><td class="center" data-col="quantity">${fmt(r.quantity)}</td></tr>`; });
          const subtotal = dateRows.reduce((s,r)=>s + (Number(r.quantity)||0),0); const span = Math.max(1, getVisibleColumnCount()-1);
          if(dateRows.length>=1){ html += `<tr class="subtotal-row"><td colspan="${span}">subtotal of Date (${formatDateDDMMYYYYUTC(dateRows[0]._parsed_date || new Date(dateRows[0].date))})</td><td class="center" data-col="quantity">${fmt(subtotal)}</td></tr>`; }
          overall += subtotal; k=m;
        }
        // state grand after block
        const stateTotal = stateRows.reduce((s,r)=>s + (Number(r.quantity)||0),0);
        html += `<tr class="state-grand-row"><td colspan="${Math.max(1,getVisibleColumnCount()-1)}">GRAND TOTAL OF ${escapeHtml(ST)}</td><td class="center" data-col="quantity">${fmt(stateTotal)}</td></tr>`;
        i = j;
      }
      html += `<tr class="overall-grand-row"><td colspan="${Math.max(1,getVisibleColumnCount()-1)}">OVERALL GRAND TOTAL</td><td class="center" data-col="quantity">${fmt(overall)}</td></tr>`;
      tbody.innerHTML = html;
      reapplyColumnVisibility();
      if(FILTERED.length===0) tbody.insertAdjacentHTML('afterbegin', `<tr><td colspan="${getVisibleColumnCount()}" class="text-center p-3 text-muted">No data for selected filters.</td></tr>`);
    }

    function renderMonthSummary(){
      const groups=new Map();
      FILTERED.forEach(r=>{ const key = `${r.state}||${r.district}||${r.sku}`; if(!groups.has(key)) groups.set(key,{state:r.state,district:r.district,sku:r.sku,qty:r.quantity||0,parties:new Set(r.party_name? [r.party_name]:[]),earliestDate:r._parsed_date||null}); else { const g=groups.get(key); g.qty += r.quantity||0; if(r.party_name) g.parties.add(r.party_name); if(r._parsed_date && (!g.earliestDate || r._parsed_date < g.earliestDate)) g.earliestDate = r._parsed_date; } });
      const rows = Array.from(groups.values()).sort((a,b)=> a.state.localeCompare(b.state) || a.district.localeCompare(b.district) || a.sku.localeCompare(b.sku));
      let html=''; let i=0; let currentState=null; let stateAcc=null; const overall = rows.reduce((s,r)=> s + (r.qty||0), 0);
      while(i<rows.length){
        const gr = rows[i]; const ST = gr.state;
        if(currentState && currentState !== ST){ html += `<tr class="state-grand-row"><td colspan="${Math.max(1,getVisibleColumnCount()-1)}">GRAND TOTAL OF ${escapeHtml(stateAcc.state)}</td><td class="center" data-col="quantity">${fmt(stateAcc.qty)}</td></tr>`; stateAcc=null; }
        if(!stateAcc){ stateAcc={state:ST,qty:0}; currentState=ST; }
        let j=i; const depotRows=[];
        while(j<rows.length && rows[j].state===ST){ depotRows.push(rows[j]); j++; }
        depotRows.forEach(r=>{ const party = (r.parties && r.parties.size===1) ? Array.from(r.parties)[0] : ''; html += `<tr><td class="center" data-col="state">${escapeHtml(r.state)}</td><td class="center" data-col="date"></td><td class="left" data-col="party_name">${escapeHtml(party)}</td><td class="center" data-col="district">${escapeHtml(r.district)}</td><td class="left" data-col="sku">${escapeHtml(r.sku)}</td><td class="center" data-col="quantity">${fmt(r.qty)}</td></tr>`; stateAcc.qty += r.qty; }); i=j;
      }
      if(stateAcc) html += `<tr class="state-grand-row"><td colspan="${Math.max(1,getVisibleColumnCount()-1)}">GRAND TOTAL OF ${escapeHtml(stateAcc.state)}</td><td class="center" data-col="quantity">${fmt(stateAcc.qty)}</td></tr>`;
      html += `<tr class="overall-grand-row"><td colspan="${Math.max(1,getVisibleColumnCount()-1)}">OVERALL GRAND TOTAL</td><td class="center" data-col="quantity">${fmt(overall)}</td></tr>`;
      tbody.innerHTML = html; reapplyColumnVisibility();
      if(rows.length===0) tbody.insertAdjacentHTML('afterbegin', `<tr><td colspan="${getVisibleColumnCount()}" class="text-center p-3 text-muted">No data for selected month/filters.</td></tr>`);
    }

    function getVisibleColumnCount(){ const ths = Array.from(document.querySelectorAll('thead th')); return ths.filter(th=>th.style.display !== 'none').length; }
    function reapplyColumnVisibility(){ Array.from(document.querySelectorAll('.col-toggle-checkbox')).forEach(ch=>{ const col=ch.dataset.col; const show=ch.checked; const th=document.querySelector(`thead th[data-col="${col}"]`); if(th) th.style.display = show? '': 'none'; document.querySelectorAll(`td[data-col="${col}"]`).forEach(td=>td.style.display = show? '': 'none'); }); }

    function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // export
    exportBtn.addEventListener('click', ()=>{
      const header=["State","Date","Party Name","District","SKU","Quantity"];
      const ws = [header];
      Array.from(tbody.querySelectorAll('tr')).forEach(tr=>{ const cols = Array.from(tr.querySelectorAll('td')).map(td=>td.textContent.trim()); while(cols.length<6) cols.splice(0,0,''); ws.push(cols.slice(0,6)); });
      const wb = XLSX.utils.book_new(); const wsheet = XLSX.utils.aoa_to_sheet(ws); XLSX.utils.book_append_sheet(wb, wsheet, 'DailySale'); XLSX.writeFile(wb, `daily_sale_export_${new Date().toISOString().slice(0,10)}.xlsx`);
    });

    loadData();
  </script>
</body>
</html>
