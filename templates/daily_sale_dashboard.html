<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC - Daily Sale (Select2)</title>

  <!-- Bootstrap & Select2 & SheetJS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Select2 + bootstrap 5 theme -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@ttskch/select2-bootstrap4-theme@1.6.2/dist/select2-bootstrap4.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --smc-blue:#0d6efd;
      --soft-blue:#e7f1ff;
      --muted:#6b7280;
      --border:#9fb1c8;
      --card-bg:#ffffff;
      --totals-shade:#e6f0ff;
    }
    body{
      background: linear-gradient(180deg,#f6fbff,#f2f6fb 60%);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      padding:18px;
    }

    /* AUTO-WIDTH FIX — allow wrapping in some columns */
    #saleTable th[data-col="party_name"],
    #saleTable th[data-col="sku"],
    #saleTable td[data-col="party_name"],
    #saleTable td[data-col="sku"] {
        white-space: normal !important;
    }

    /* Keep technical columns single-line */
    #saleTable th[data-col="state"],
    #saleTable th[data-col="date"],
    #saleTable th[data-col="district"],
    #saleTable th[data-col="quantity"],
    #saleTable td[data-col="state"],
    #saleTable td[data-col="date"],
    #saleTable td[data-col="district"],
    #saleTable td[data-col="quantity"] {
        white-space: nowrap !important;
    }

    /* FINAL AUTO-WIDTH FIX */
    #saleTable {
        table-layout: auto !important;
    }

    /* OVERRIDE BOOTSTRAP table-sm (critical for auto-width) */
    #saleTable.table-sm th,
    #saleTable.table-sm td {
        padding: 8px 12px !important;
    }

    .top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
    .logo-title{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#0d6efd22,#0d6efd11);
      border-radius:10px;padding:10px 14px;border-left:6px solid var(--smc-blue);box-shadow:0 6px 18px rgba(13,110,253,0.06)}
    .logo-title img{height:46px}
    .logo-title h1{margin:0;font-size:1.05rem;color:#073763;font-weight:800}

    .controls{display:flex;gap:8px;align-items:center}
    .btn-pill{border-radius:999px;padding:8px 14px}

    .filter-panel{background:linear-gradient(180deg,#ffffffb8,#ffffffb0);border-radius:10px;padding:14px;
      box-shadow:0 6px 18px rgba(2,6,23,0.06);margin-bottom:12px;transition:all .28s ease}
    .filter-row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
    .filter-row .form-label{font-weight:600;color:var(--muted);font-size:.9rem}

    .table-wrap{border-radius:10px;overflow:auto;background:var(--card-bg);box-shadow:0 8px 30px rgba(2,6,23,0.05);
      border:2px solid var(--border);max-height:68vh}
    table{width:100%;border-collapse:collapse;}
    table,th,td{border:2px solid var(--border)}
    thead th{position:sticky;top:0;z-index:6;background:linear-gradient(90deg,#f0f8ff,#ffffff);padding:12px;text-align:center;
      font-weight:800;color:#0b3b66;box-shadow:inset 0 -1px 0 rgba(0,0,0,0.02); cursor: pointer;}
    thead th .sort-ind { font-size:0.8rem; margin-left:6px; opacity:.6; }
    tbody td{padding:10px 12px;vertical-align:middle}
    td.center{text-align:center}
    td.left{text-align:left}

    tr:hover td{background:#fbfdff}

    .subtotal-row td{background:var(--totals-shade);font-weight:700;text-align:center}
    .state-grand-row td{background:var(--totals-shade);font-weight:900;text-align:center}
    .overall-grand-row td{background:linear-gradient(90deg,#dff2ff,#d0eaff);font-weight:900;text-align:center;color:#05284a}

    .col-toggle{max-height:260px;overflow:auto;padding:10px;width:260px}

    @media (max-width:900px){.filter-row{display:block}.top-row{flex-direction:column;align-items:flex-start;gap:8px}}
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="top-row">
      <div class="logo-title">
        <img src="/static/onlylogo.png" alt="SMC" onerror="this.style.display='none'">
        <h1>SMC - Daily Sale</h1>
      </div>

      <div class="controls">
        <a href="{{ url_for('dashboard_stock') }}" class="btn btn-outline-secondary btn-sm">← Stock</a>

        <button id="toggleFiltersBtn" class="btn btn-light btn-pill">Filters</button>
        <button id="yesterdayBtn" class="btn btn-info btn-pill text-white">Yesterday</button>

        <div class="dropdown">
          <button class="btn btn-outline-dark btn-sm dropdown-toggle" id="colToggleBtn" data-bs-toggle="dropdown">Columns</button>
          <div class="dropdown-menu dropdown-menu-end col-toggle" aria-labelledby="colToggleBtn">
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="state" type="checkbox" checked> <label class="form-check-label">State</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" id="dateColCheckbox" data-col="date" type="checkbox" checked> <label class="form-check-label">Date</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="party_name" type="checkbox" checked> <label class="form-check-label">Party Name</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="district" type="checkbox" checked> <label class="form-check-label">District</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="sku" type="checkbox" checked> <label class="form-check-label">SKU</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="quantity" type="checkbox" checked> <label class="form-check-label">Quantity</label></div>
          </div>
        </div>

        <button id="exportBtn" class="btn btn-success">Export Excel</button>
      </div>
    </div>

    <div id="filterPanel" class="filter-panel" style="display:none;">
      <div class="filter-row">
        <div style="flex:1; min-width:160px;">
          <label class="form-label">Month</label>
          <select id="filterMonth" class="form-select"><option value="">All</option></select>
        </div>

        <div style="flex:1; min-width:160px;">
          <label class="form-label">State</label>
          <select id="filterState" class="form-select select2"><option value="">All</option></select>
        </div>

        <div style="flex:1; min-width:160px;">
          <label class="form-label">District</label>
          <select id="filterDistrict" class="form-select select2"><option value="">All</option></select>
        </div>

        <div style="flex:2; min-width:220px;">
          <label class="form-label">Party Name</label>
          <select id="filterParty" class="form-select select2"><option value="">All</option></select>
        </div>

        <div style="flex:2; min-width:220px;">
          <label class="form-label">SKU (search)</label>
          <select id="filterSKU" class="form-select select2"><option value="">All</option></select>
        </div>

        <div style="min-width:140px;">
          <label class="form-label">From</label>
          <input id="filterFrom" type="date" class="form-control">
        </div>

        <div style="min-width:120px; display:flex; align-items:end;">
          <button id="clearFilters" class="btn btn-outline-secondary w-100">Reset</button>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table id="saleTable" class="table table-sm mb-0">
        <thead>
          <tr>
            <th data-col="state" data-sort="none">State <span class="sort-ind"></span></th>
            <th data-col="date" data-sort="none">Date <span class="sort-ind"></span></th>
            <th data-col="party_name" data-sort="none">Party Name <span class="sort-ind"></span></th>
            <th data-col="district" data-sort="none">District <span class="sort-ind"></span></th>
            <th data-col="sku" data-sort="none">SKU <span class="sort-ind"></span></th>
            <th data-col="quantity" data-sort="none">Quantity <span class="sort-ind"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  /* ------------------ Utilities ------------------ */
  const pad2 = n => String(n).padStart(2,'0');
  const fmt = v => (v == null || isNaN(+v)) ? '' : Number(v).toLocaleString();
  function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function parseDMYtoUTC(s){
    if(!s) return null;
    const m = String(s).trim().match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
    if(m){ const day=+m[1], mon=+m[2], year=+m[3]; return new Date(Date.UTC(year,mon-1,day)); }
    const iso = new Date(s); return isNaN(iso) ? null : new Date(Date.UTC(iso.getUTCFullYear(), iso.getUTCMonth(), iso.getUTCDate()));
  }
  function parseInputDateUTC(val){ if(!val) return null; const [y,m,d] = val.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
  function formatDateDDMMYYYYUTC(d){ if(!d) return ''; return `${pad2(d.getUTCDate())}-${pad2(d.getUTCMonth()+1)}-${d.getUTCFullYear()}`; }

  /* ------------------ DOM refs ------------------ */
  const tbody = document.querySelector('#saleTable tbody');
  const filterPanel = document.getElementById('filterPanel');
  const toggleFiltersBtn = document.getElementById('toggleFiltersBtn');
  const yesterdayBtn = document.getElementById('yesterdayBtn');

  const filterMonth = document.getElementById('filterMonth');
  const filterState = document.getElementById('filterState');
  const filterDistrict = document.getElementById('filterDistrict');
  const filterParty = document.getElementById('filterParty');
  const filterSKU = document.getElementById('filterSKU');
  const filterFrom = document.getElementById('filterFrom');
  const clearFilters = document.getElementById('clearFilters');
  const exportBtn = document.getElementById('exportBtn');
  const colCheckboxes = Array.from(document.querySelectorAll('.col-toggle-checkbox'));
  const headerCells = Array.from(document.querySelectorAll('#saleTable thead th'));

  /* ------------------ App state ------------------ */
  let RAW = [], MERGED = [], FILTERED = [];
  // sort state: { col: 'state'|'date'|..., dir: 1|-1|0 }
  let sortState = { col: null, dir: 0 };

  /* ------------------ Init Select2 ------------------ */
  function initSelect2(){
    $('.select2').select2({
      theme: 'bootstrap4',
      width: '100%',
      placeholder: 'All',
      allowClear: true,
      dropdownAutoWidth: true
    });
  }

  /* ------------------ Load data ------------------ */
  async function loadData(){
    try{
      const res = await fetch('/api/get_daily_sale');
      RAW = await res.json();

      // normalize keys + compute parsed date + month key
      RAW = RAW.map(r=>{
        const o = {};
        for(const k in r) o[k.trim().toLowerCase()] = r[k];
        o.state = (o.state||'').toString().trim();
        o.date = (o.date||'').toString().trim();
        o.party_name = (o.party_name||'').toString().trim();
        o.district = (o.district||'').toString().trim();
        o.sku = (o.sku||'').toString().trim();
        o.quantity = Number(o.quantity) || 0;
        o._parsed_date = parseDMYtoUTC(o.date); // might be null
        o._month_key = o._parsed_date ? `${o._parsed_date.getUTCFullYear()}-${pad2(o._parsed_date.getUTCMonth()+1)}` : '';
        return o;
      });

      // MERGE exact duplicates (same state,date,party_name,district,sku)
      const seen = new Map();
      MERGED = [];
      for(const r of RAW){
        const key = `${r.state}||${r.date}||${r.party_name}||${r.district}||${r.sku}`;
        if(!seen.has(key)){
          seen.set(key, MERGED.length);
          MERGED.push(Object.assign({}, r));
        } else {
          MERGED[seen.get(key)].quantity += r.quantity;
        }
      }

      populateFilters();
      initSelect2();
      applyFilters();
    }catch(err){
      console.error('Failed to load daily sale', err);
      tbody.innerHTML = '<tr><td colspan="6" class="text-danger p-3">Failed to load data</td></tr>';
    }
  }

  /* ------------------ Populate filters ------------------ */
  function populateFilters(){
    // Month
    const months = Array.from(new Set(MERGED.map(r=>r._month_key).filter(Boolean))).sort();
    filterMonth.innerHTML = '<option value="">All</option>' + months.map(m=>{
      const [y,mm]=m.split('-'); const d = new Date(Date.UTC(y,mm-1,1));
      return `<option value="${m}">${d.toLocaleString(undefined,{month:'long'})} ${y}</option>`;
    }).join('');

    // State, District, Party, SKU
    const states = Array.from(new Set(MERGED.map(r=>r.state).filter(Boolean))).sort();
    const districts = Array.from(new Set(MERGED.map(r=>r.district).filter(Boolean))).sort();
    const parties = Array.from(new Set(MERGED.map(r=>r.party_name).filter(Boolean))).sort();
    const skus = Array.from(new Set(MERGED.map(r=>r.sku).filter(Boolean))).sort();

    filterState.innerHTML = '<option value="">All</option>' + states.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    filterDistrict.innerHTML = '<option value="">All</option>' + districts.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    filterParty.innerHTML = '<option value="">All</option>' + parties.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    filterSKU.innerHTML = '<option value="">All</option>' + skus.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');

    // refresh select2 (if already initialised)
    if($ && $('.select2').data('select2')) {
      $('#filterState').trigger('change.select2');
      $('#filterDistrict').trigger('change.select2');
      $('#filterParty').trigger('change.select2');
      $('#filterSKU').trigger('change.select2');
    }
  }

  /* ------------------ Events ------------------ */
  [filterMonth, filterState, filterDistrict, filterParty, filterFrom].forEach(el => el.addEventListener('change', applyFilters));
  $('#filterSKU').on('change', applyFilters);
  $('#filterParty').on('change', applyFilters);
  $('#filterDistrict').on('change', applyFilters);
  $('#filterState').on('change', applyFilters);

  clearFilters.addEventListener('click', ()=>{
    filterMonth.value=''; filterState.value=''; filterDistrict.value=''; filterParty.value=''; $('#filterState').val('').trigger('change');
    $('#filterDistrict').val('').trigger('change'); $('#filterParty').val('').trigger('change'); $('#filterSKU').val('').trigger('change');
    filterFrom.value=''; applyFilters();
  });

  yesterdayBtn.addEventListener('click', ()=>{
    const now = new Date();
    const y = new Date(now.getFullYear(), now.getMonth(), now.getDate()-1);
    const val = `${y.getFullYear()}-${pad2(y.getMonth()+1)}-${pad2(y.getDate())}`;
    filterFrom.value = val; applyFilters();
    yesterdayBtn.classList.add('btn-success'); setTimeout(()=>yesterdayBtn.classList.remove('btn-success'),900);
  });

  toggleFiltersBtn.addEventListener('click', ()=> {
    if(filterPanel.style.display === 'none' || filterPanel.style.display === '') { filterPanel.style.display='block'; toggleFiltersBtn.classList.add('active'); }
    else { filterPanel.style.display='none'; toggleFiltersBtn.classList.remove('active'); }
  });

  // Column toggles
  colCheckboxes.forEach(ch => ch.addEventListener('change', ()=>{
    const col = ch.dataset.col; const show = ch.checked;
    const th = document.querySelector(`thead th[data-col="${col}"]`);
    if(th) th.style.display = show ? '' : 'none';
    document.querySelectorAll(`td[data-col="${col}"]`).forEach(td => td.style.display = show ? '' : 'none');
    // no re-render needed because we always render current view
  }));

  // Header sorting
  headerCells.forEach(th=>{
    th.addEventListener('click', (ev)=>{
      const col = th.dataset.col;
      // toggle: none -> asc -> desc -> none
      if(sortState.col !== col){ sortState.col = col; sortState.dir = 1; }
      else if(sortState.dir === 1) sortState.dir = -1;
      else if(sortState.dir === -1) { sortState.col = null; sortState.dir = 0; }
      applyFilters(); // re-render uses current sortState
      updateSortIndicators();
    });
  });

  function updateSortIndicators(){
    headerCells.forEach(h=>{
      const ind = h.querySelector('.sort-ind');
      if(!ind) return;
      if(sortState.col === h.dataset.col){
        ind.textContent = sortState.dir === 1 ? '▲' : (sortState.dir === -1 ? '▼' : '');
      } else ind.textContent = '';
    });
  }

  /* ------------------ Apply filters ------------------ */
  function applyFilters(){
    const m = filterMonth.value;
    const s = (filterState.value || '').toString();
    const d = (filterDistrict.value || '').toString();
    const p = (filterParty.value || '').toString();
    const skuQ = ($('#filterSKU').val() || '').toString().toLowerCase().trim();
    const from = parseInputDateUTC(filterFrom.value);

    FILTERED = MERGED.filter(r=>{
      if(m && r._month_key !== m) return false;
      if(s && r.state !== s) return false;
      if(d && r.district !== d) return false;
      if(p && r.party_name !== p) return false;
      if(skuQ && !r.sku.toLowerCase().includes(skuQ)) return false;
      if(from && (!r._parsed_date || r._parsed_date < from)) return false;
      return true;
    });

    renderSmart();
  }

  /* ------------------ Smart render decision ------------------ */
  function renderSmart(){
    const monthSelected = !!filterMonth.value;
    const dateColVisible = document.querySelector('input[data-col="date"]').checked;
    const summaryMode = monthSelected; // only month triggers summary as requested

    if(summaryMode) renderMonthSummary();
    else renderDateMode();
  }

  /* ------------------ Date mode (detailed rows grouped) ------------------ */
  function renderDateMode(){
    // group and merge: group by state -> date -> party_name -> district -> sku
    // We want one row per unique (state,date,party_name,district,sku) with summed quantity
    const map = new Map();
    for(const r of FILTERED){
      const key = `${r.state}||${r.date}||${r.party_name}||${r.district}||${r.sku}`;
      if(!map.has(key)) map.set(key, Object.assign({}, r));
      else map.get(key).quantity += r.quantity;
    }
    const rows = Array.from(map.values());

    // apply sorting (if any)
    if(sortState.col){
      const col = sortState.col;
      const dir = sortState.dir || 0;
      rows.sort((a,b)=>{
        if(col === 'quantity'){
          return dir * ((Number(a.quantity) || 0) - (Number(b.quantity) || 0));
        }
        if(col === 'date'){
          const da = a._parsed_date ? a._parsed_date.getTime() : 0;
          const db = b._parsed_date ? b._parsed_date.getTime() : 0;
          return dir * (da - db);
        }
        return dir * String(a[col]||'').localeCompare(String(b[col]||''));
      });
    } else {
      // default grouping order: state, date, sku
      rows.sort((a,b)=>{
        if(a.state !== b.state) return a.state.localeCompare(b.state);
        const da = a._parsed_date ? a._parsed_date.getTime() : 0;
        const db = b._parsed_date ? b._parsed_date.getTime() : 0;
        if(da !== db) return da - db;
        if(a.party_name !== b.party_name) return a.party_name.localeCompare(b.party_name);
        if(a.district !== b.district) return a.district.localeCompare(b.district);
        return a.sku.localeCompare(b.sku);
      });
    }

    // render grouped rows with subtotals per date and grand totals per state
    let html = '';
    let i = 0;
    let overall = 0;
    while(i < rows.length){
      const r = rows[i];
      const ST = r.state;
      // slice of rows for this state
      const stateRows = rows.filter(rr => rr.state === ST);

      // within state, group by date
      let j = 0;
      while(j < stateRows.length){
        const dateVal = stateRows[j].date;
        const dateGroup = stateRows.filter(x => x.date === dateVal);
        // render each row in dateGroup
        dateGroup.forEach(row=>{
          html += `<tr>
            <td class="center" data-col="state">${escapeHtml(row.state)}</td>
            <td class="center" data-col="date">${row._parsed_date ? formatDateDDMMYYYYUTC(row._parsed_date) : escapeHtml(row.date)}</td>
            <td class="left" data-col="party_name">${escapeHtml(row.party_name)}</td>
            <td class="center" data-col="district">${escapeHtml(row.district)}</td>
            <td class="left" data-col="sku">${escapeHtml(row.sku)}</td>
            <td class="center" data-col="quantity">${fmt(row.quantity)}</td>
          </tr>`;
        });
        // subtotal for this date
        const subtotal = dateGroup.reduce((s,r)=>s + (Number(r.quantity)||0), 0);
        const span = getDynamicColspan();
        html += `<tr class="subtotal-row">
          <td colspan="${span}">subtotal of Date (${dateGroup[0]._parsed_date ? formatDateDDMMYYYYUTC(dateGroup[0]._parsed_date) : escapeHtml(dateVal)})</td>
          <td class="center" data-col="quantity">${fmt(subtotal)}</td>
        </tr>`;
        overall += subtotal;
        // move j forward
        j += dateGroup.length;
      }

      // state grand total
      const stateTotal = stateRows.reduce((s,x)=> s + (Number(x.quantity)||0), 0);
      html += `<tr class="state-grand-row"><td colspan="${getDynamicColspan()}">GRAND TOTAL OF ${escapeHtml(ST)}</td><td class="center" data-col="quantity">${fmt(stateTotal)}</td></tr>`;
      // skip state rows
      i += stateRows.length;
      // but our outer loop uses rows[] index; to fast-forward, find next index after last state occurrence
      // simpler: find index of first row not this state
      let nextIdx = i;
      while(nextIdx < rows.length && rows[nextIdx].state === ST) nextIdx++;
      i = nextIdx;
    }

    // overall grand total
    html += `<tr class="overall-grand-row"><td colspan="${getDynamicColspan()}">OVERALL GRAND TOTAL</td><td class="center" data-col="quantity">${fmt(overall)}</td></tr>`;

    tbody.innerHTML = html;

    computeColumnWidthsFromStrings('#saleTable', ['state','date','party_name','district','sku','quantity'], MERGED.length ? MERGED : RAW);
    reapplyColumnVisibility();

    if(rows.length === 0){
      tbody.insertAdjacentHTML('afterbegin', `<tr><td colspan="${getVisibleColumnCount()}" class="text-center p-3 text-muted">No data for selected filters.</td></tr>`);
    }
  }

  /* ------------------ Month summary (grouped) ------------------ */
  function renderMonthSummary(){
    // Group by state || district || sku || party_name (pick earliest party_name per group)
    // The user asked "grouping of STATE, DATE, PARTY NAME, DISTRICT & SKU" — month summary shows grouped SKU rows; we'll keep party_name representative.
    const groups = new Map();
    for(const r of FILTERED){
      // group key: state|district|sku (but we will store earliest party_name)
      const key = `${r.state}||${r.district}||${r.sku}`;
      if(!groups.has(key)){
        groups.set(key, {
          state: r.state,
          district: r.district,
          sku: r.sku,
          qty: r.quantity || 0,
          earliestDate: r._parsed_date || null,
          party_name: r.party_name || ''
        });
      } else {
        const g = groups.get(key);
        g.qty += r.quantity || 0;
        if(r._parsed_date && (!g.earliestDate || r._parsed_date < g.earliestDate)){
          g.earliestDate = r._parsed_date;
          g.party_name = r.party_name || g.party_name;
        }
      }
    }

    const rows = Array.from(groups.values());
    // sort
    rows.sort((a,b)=>{
      if(a.state !== b.state) return a.state.localeCompare(b.state);
      if(a.district !== b.district) return a.district.localeCompare(b.district);
      return a.sku.localeCompare(b.sku);
    });

    // optional sort from header
    if(sortState.col){
      const col = sortState.col, dir = sortState.dir || 0;
      rows.sort((a,b)=>{
        if(col === 'quantity') return dir * ((Number(a.qty)||0) - (Number(b.qty)||0));
        return dir * String(a[col]||'').localeCompare(String(b[col]||''));
      });
    }

    let html = '';
    let i = 0;
    let overall = 0;
    while(i < rows.length){
      const ST = rows[i].state;
      const block = rows.filter(rr => rr.state === ST);
      block.forEach(r=>{
        html += `<tr>
          <td class="center" data-col="state">${escapeHtml(r.state)}</td>
          <td class="center" data-col="date"></td>
          <td class="left" data-col="party_name">${escapeHtml(r.party_name)}</td>
          <td class="center" data-col="district">${escapeHtml(r.district)}</td>
          <td class="left" data-col="sku">${escapeHtml(r.sku)}</td>
          <td class="center" data-col="quantity">${fmt(r.qty)}</td>
        </tr>`;
        overall += r.qty;
      });
      // state grand
      const stateTotal = block.reduce((s,x)=> s + (Number(x.qty)||0), 0);
      html += `<tr class="state-grand-row"><td colspan="${getDynamicColspan()}">GRAND TOTAL OF ${escapeHtml(ST)}</td><td class="center" data-col="quantity">${fmt(stateTotal)}</td></tr>`;
      i += block.length;
    }

    html += `<tr class="overall-grand-row"><td colspan="${getDynamicColspan()}">OVERALL GRAND TOTAL</td><td class="center" data-col="quantity">${fmt(overall)}</td></tr>`;

    tbody.innerHTML = html;
    computeColumnWidthsFromStrings('#saleTable', ['state','date','party_name','district','sku','quantity'], MERGED.length ? MERGED : RAW);
    reapplyColumnVisibility();

    if(rows.length === 0){
      tbody.insertAdjacentHTML('afterbegin', `<tr><td colspan="${getVisibleColumnCount()}" class="text-center p-3 text-muted">No data for selected month/filters.</td></tr>`);
    }
  }

  /* ------------------ Column helpers ------------------ */
  function getVisibleColumnCount(){
    const ths = Array.from(document.querySelectorAll('thead th'));
    return ths.filter(th => th.style.display !== 'none').length;
  }
  function getDynamicColspan(){
    const visible = getVisibleColumnCount();
    const numericCols = 1; // only Quantity numeric
    return Math.max(1, visible - numericCols);
  }
  function reapplyColumnVisibility(){
    colCheckboxes.forEach(ch=>{
      const col = ch.dataset.col;
      const show = ch.checked;
      const th = document.querySelector(`thead th[data-col="${col}"]`);
      if(th) th.style.display = show ? '' : 'none';
      document.querySelectorAll(`td[data-col="${col}"]`).forEach(td => td.style.display = show ? '' : 'none');
    });
  }

  /* ------------------ Export ------------------ */
  exportBtn.addEventListener('click', ()=>{
    // Build export from currently displayed rows (tbody)
    const header = ["State","Date","Party Name","District","SKU","Quantity"];
    const rows = Array.from(tbody.querySelectorAll('tr')).map(tr=>{
      const cells = Array.from(tr.querySelectorAll('td')).map(td=>td.textContent.trim());
      // normalize to 6 columns (prepend blank if colspan used)
      while(cells.length < 6) cells.splice(0,0,'');
      return cells.slice(0,6);
    });
    const wsData = [header, ...rows];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    XLSX.utils.book_append_sheet(wb, ws, 'DailySale');
    XLSX.writeFile(wb, `daily_sale_export_${new Date().toISOString().slice(0,10)}.xlsx`);
  });

  /* ------------------ Visual helpers ------------------ */
  function computeColumnWidthsFromStrings(tableSelector, columns, rowsOfObjects, sampleLimit=500){
    const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d');
    const tableEl=document.querySelector(tableSelector)||document.body;
    const font=window.getComputedStyle(tableEl).font||"600 14px Inter"; ctx.font=font;
    const thEls=[...document.querySelectorAll(tableSelector+' thead th')];
    const headerWidths={}; thEls.forEach(th=>{ const c=th.dataset.col; headerWidths[c]=ctx.measureText(th.textContent.trim()).width+24; });
    const maxW={...headerWidths}; const sample=rowsOfObjects.slice(0,sampleLimit);
    sample.forEach(r=>{ columns.forEach(c=>{ const w=ctx.measureText(String(r[c]||'')).width+24; if(w>maxW[c]) maxW[c]=w; }); });
    const MIN=40, MAX=900;
    thEls.forEach(th=>{ const c=th.dataset.col; const w=Math.max(MIN, Math.min(MAX, maxW[c]||MIN)); th.style.width = w+'px'; });
  }

  /* ------------------ Startup ------------------ */
  loadData();
  updateSortIndicators();

  // keyboard shortcut
  document.addEventListener('keydown', (e)=>{ if(e.key === 'f' || e.key === 'F'){ toggleFiltersBtn.click(); } });

  </script>
</body>
