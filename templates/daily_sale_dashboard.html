<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC - Stock Position</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --border-color:#9aa6b3;
      --header-blue:#e7f1ff;
    }
    body {
      padding:18px;
      background:#f8fafc;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }

    /* Logo block */
    .logo-header {
      text-align:center;
      padding:10px 16px;
      border:3px solid #0d6efd;
      border-radius:8px;
      background: var(--header-blue);
      margin-bottom:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
    }
    .logo-header img { height:56px; display:block; }
    .logo-header h2 { margin:0; font-weight:700; font-size:1.25rem; color:#073763; }

    /* Table */
    .table-wrap {
      width:100%; overflow:auto; max-height:72vh;
      border:1.5px solid var(--border-color);
      border-radius:6px; background:#fff;
    }
    table { border-collapse:collapse; width:100%; }
    table,th,td { border:1.5px solid var(--border-color); }
    thead th {
      position:sticky; top:0; z-index:5;
      background:#ffffff; text-align:center; vertical-align:middle;
      padding:10px; font-weight:700;
    }
    tbody td { padding:8px; vertical-align:middle; }
    td.center { text-align:center; }
    td.left { text-align:left; padding-left:10px; }

    .subtotal-row td { background:#f3f6f9; font-weight:700; text-align:center; }
    .depot-grand-row td { background:#e1ecff; font-weight:800; text-align:center; }
    .state-grand-row td { background:#cfe1ff; font-weight:900; text-align:center; }
    .overall-grand-row td { background:#c1daff; font-weight:900; text-align:center; }

    .col-toggle { max-height:240px; overflow:auto; padding:8px; width:220px; }
  </style>
</head>

<body>
  <div class="container-fluid">

    <!-- Logo + Header -->
    <div class="logo-header">
      <img src="/static/onlylogo.png" onerror="this.style.display='none'">
      <h2>SMC - Stock Position</h2>
    </div>

    <!-- Top controls -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="d-flex gap-2">
        <a href="{{ url_for('sales_levels') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
        <a href="{{ url_for('dashboard_daily_sale') }}" class="btn btn-outline-primary btn-sm">Daily Sale</a>
      </div>

      <div class="d-flex align-items-center">

        <!-- Column toggle -->
        <div class="dropdown me-2">
          <button class="btn btn-outline-dark btn-sm dropdown-toggle" data-bs-toggle="dropdown">
            Columns
          </button>
          <div class="dropdown-menu dropdown-menu-end col-toggle">
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="state" type="checkbox" checked> <label class="form-check-label">State</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="depot" type="checkbox" checked> <label class="form-check-label">Depot</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="date" type="checkbox" checked> <label class="form-check-label">Date</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="sku_name" type="checkbox" checked> <label class="form-check-label">SKU Name</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="opening" type="checkbox" checked> <label class="form-check-label">Opening</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="qty_recd" type="checkbox" checked> <label class="form-check-label">Received</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="qty_sale" type="checkbox" checked> <label class="form-check-label">Sales</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="closing" type="checkbox" checked> <label class="form-check-label">Closing</label></div>
          </div>
        </div>

        <button id="exportBtn" class="btn btn-success btn-sm">Export Excel</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-2">
            <label class="form-label small-muted">Month</label>
            <select id="filterMonth" class="form-select"></select>
          </div>
          <div class="col-md-2">
            <label class="form-label small-muted">State</label>
            <select id="filterState" class="form-select"><option value="">All</option></select>
          </div>
          <div class="col-md-2">
            <label class="form-label small-muted">Depot</label>
            <select id="filterDepot" class="form-select"><option value="">All</option></select>
          </div>
          <div class="col-md-3">
            <label class="form-label small-muted">SKU (search)</label>
            <input id="filterSKU" list="skuList" class="form-control">
            <datalist id="skuList"></datalist>
          </div>
          <div class="col-md-1">
            <label class="form-label small-muted">From</label>
            <input id="filterFrom" type="date" class="form-control">
          </div>
          <div class="col-md-1">
            <label class="form-label small-muted">To</label>
            <input id="filterTo" type="date" class="form-control">
          </div>
          <div class="col-md-1 d-flex align-items-end">
            <button id="clearFilters" class="btn btn-outline-secondary btn-sm w-100">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table id="stockTable" class="table table-sm mb-0">
        <thead>
          <tr>
            <th data-col="state"    style="min-width:130px;">State</th>
            <th data-col="depot"    style="min-width:150px;">Depot</th>
            <th data-col="date"     style="min-width:110px;">Date</th>
            <th data-col="sku_name" style="min-width:300px; text-align:left;">SKU Name</th>
            <th data-col="opening"  style="min-width:110px;">Opening</th>
            <th data-col="qty_recd" style="min-width:110px;">Received</th>
            <th data-col="qty_sale" style="min-width:110px;">Sales</th>
            <th data-col="closing"  style="min-width:110px;">Closing</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/*** UTILITIES ***/
const pad2 = n => String(n).padStart(2,'0');
const fmt = v => (v==null || isNaN(+v) ? '' : Number(v).toLocaleString());

/* ⛔ FIXED: Always parse dates in UTC to avoid timezone shifting */
function parseDMYtoUTC(s){
  if(!s) return null;
  const m = String(s).trim().match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if (m){
    const d = +m[1], mn = +m[2], y = +m[3];
    return new Date(Date.UTC(y, mn-1, d));
  }
  return null;
}

/* Parse <input type="date"> safely (YYYY-MM-DD → UTC date) */
function parseInputDateUTC(val){
  if(!val) return null;
  const [y,m,d] = val.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,d));
}

/*** DOM REFS ***/
const table=document.getElementById('stockTable');
const tbody=table.querySelector('tbody');

const fMonth=document.getElementById('filterMonth');
const fState=document.getElementById('filterState');
const fDepot=document.getElementById('filterDepot');
const fSKU=document.getElementById('filterSKU');
const skuList=document.getElementById('skuList');
const fFrom=document.getElementById('filterFrom');
const fTo=document.getElementById('filterTo');
const clearBtn=document.getElementById('clearFilters');
const exportBtn=document.getElementById('exportBtn');
const colBoxes=[...document.querySelectorAll('.col-toggle-checkbox')];

/*** INTERNAL DATA ***/
let RAW=[];     // raw from API
let MERGED=[];  // merged rows
let FILTERED=[]; // merged+filtered

/* Load + merge-first */
async function loadData(){
  const res = await fetch('/api/get_stock_data');
  let rows = await res.json();

  rows = rows.map(r=>{
    const o={};
    for(const k in r) o[k.trim().toLowerCase()] = r[k];
    o.state=(o.state||'').trim();
    o.depot=(o.depot||'').trim();
    o.date =(o.date ||'').trim();
    o.sku_name=(o.sku_name||'').trim();

    o.opening = Number(o.opening)||0;
    o.qty_recd=Number(o.qty_recd)||0;
    o.qty_sale=Number(o.qty_sale)||0;
    o.closing =Number(o.closing)||0;

    o._parsed_date=parseDMYtoUTC(o.date);
    o._month_key=o._parsed_date ? `${o._parsed_date.getUTCFullYear()}-${pad2(o._parsed_date.getUTCMonth()+1)}` : '';

    return o;
  });

  RAW=rows;

  // MERGE FIRST (mode A)
  MERGED = mergeGroups(RAW);

  populateFilters();
  applyFilters();
}

/* Merge by state+depot+date+sku */
function mergeGroups(rows){
  const map=new Map();
  rows.forEach(r=>{
    const key=`${r.state}||${r.depot}||${r.date}||${r.sku_name}`;
    if(!map.has(key)){
      map.set(key,{...r});
    } else {
      const g=map.get(key);
      g.opening += r.opening;
      g.qty_recd += r.qty_recd;
      g.qty_sale += r.qty_sale;
      g.closing += r.closing;
    }
  });
  return [...map.values()];
}

/**** Populate filters ****/
function populateFilters(){
  const months=[...new Set(MERGED.map(r=>r._month_key).filter(Boolean))].sort();
  fMonth.innerHTML='<option value="">All</option>' +
    months.map(m=>{
      const [y,mm]=m.split('-');
      const dt=new Date(Date.UTC(y,mm-1,1));
      return `<option value="${m}">${dt.toLocaleString('en-IN',{month:'long'})} ${y}</option>`;
    }).join('');

  const states=[...new Set(MERGED.map(r=>r.state).filter(Boolean))].sort();
  fState.innerHTML='<option value="">All</option>' + states.map(s=>`<option>${s}</option>`).join('');

  const depots=[...new Set(MERGED.map(r=>r.depot).filter(Boolean))].sort();
  fDepot.innerHTML='<option value="">All</option>' + depots.map(d=>`<option>${d}</option>`).join('');

  const skus=[...new Set(MERGED.map(r=>r.sku_name).filter(Boolean))].sort();
  skuList.innerHTML=skus.map(s=>`<option value="${s}">`).join('');
}

/*** Filter events ***/
[fMonth,fState,fDepot,fFrom,fTo].forEach(el=>el.addEventListener('change',applyFilters));
fSKU.addEventListener('input',applyFilters);
clearBtn.addEventListener('click',()=>{
  fMonth.value=''; fState.value=''; fDepot.value='';
  fSKU.value=''; fFrom.value=''; fTo.value='';
  applyFilters();
});

/*** APPLY FILTERS ***/
function applyFilters(){
  const m=fMonth.value;
  const s=fState.value;
  const d=fDepot.value;
  const skuQ=(fSKU.value||'').toLowerCase().trim();

  const from=parseInputDateUTC(fFrom.value);
  const to=parseInputDateUTC(fTo.value);

  FILTERED=MERGED.filter(r=>{
    if(m && r._month_key!==m) return false;
    if(s && r.state!==s) return false;
    if(d && r.depot!==d) return false;
    if(skuQ && !r.sku_name.toLowerCase().includes(skuQ)) return false;

    if(from && (!r._parsed_date || r._parsed_date < from)) return false;
    if(to && (!r._parsed_date || r._parsed_date > to)) return false;

    return true;
  });

  renderGrouped();
}

/*** RENDER GROUPED VIEW ***/
function renderGrouped(){
  // Sort
  FILTERED.sort((a,b)=>{
    if(a.state!==b.state) return a.state.localeCompare(b.state);
    if(a.depot!==b.depot) return a.depot.localeCompare(b.depot);
    const da=a._parsed_date ? a._parsed_date.getTime():0;
    const db=b._parsed_date ? b._parsed_date.getTime():0;
    if(da!==db) return da-db;
    return a.sku_name.localeCompare(b.sku_name);
  });

  // Overall totals
  const overall=FILTERED.reduce((acc,r)=>{
    acc.open+=r.opening;
    acc.rec +=r.qty_recd;
    acc.sale+=r.qty_sale;
    acc.close+=r.closing;
    return acc;
  },{open:0,rec:0,sale:0,close:0});

  let html="";
  let i=0;
  let currentState=null;
  let stateAcc=null;

  while(i<FILTERED.length){
    const row=FILTERED[i];
    const ST=row.state;
    const DP=row.depot;

    // new state?
    if(currentState && currentState!==ST){
      html+= stateGrandRow(stateAcc);
      stateAcc=null;
    }
    if(!stateAcc){
      stateAcc={state:ST,open:0,rec:0,sale:0,close:0};
      currentState=ST;
    }

    const depotAcc={depot:DP,open:0,rec:0,sale:0,close:0};

    // depot rows
    const depotRows=[];
    let j=i;
    while(j<FILTERED.length && FILTERED[j].state===ST && FILTERED[j].depot===DP){
      depotRows.push(FILTERED[j]);
      j++;
    }

    // group by date
    let k=0;
    while(k<depotRows.length){
      const dateRaw=depotRows[k].date;
      const dateRows=[];
      let m=k;
      while(m<depotRows.length && depotRows[m].date===dateRaw){
        dateRows.push(depotRows[m]);
        m++;
      }

      // rows of this date
      dateRows.forEach(r=>{
        const d=r._parsed_date;
        const fdate = `${pad2(d.getUTCDate())}-${pad2(d.getUTCHours() ? d.getUTCMonth()+1 : d.getUTCMonth()+1)}-${d.getUTCFullYear()}`;
      });

      // date subtotal
      const sub=dateRows.reduce((a,r)=>{
        a.open+=r.opening;
        a.rec+=r.qty_recd;
        a.sale+=r.qty_sale;
        a.close+=r.closing;
        return a;
      },{open:0,rec:0,sale:0,close:0});

      depotAcc.open+=sub.open;
      depotAcc.rec+=sub.rec;
      depotAcc.sale+=sub.sale;
      depotAcc.close+=sub.close;

      stateAcc.open+=sub.open;
      stateAcc.rec+=sub.rec;
      stateAcc.sale+=sub.sale;
      stateAcc.close+=sub.close;

      // render each row
      dateRows.forEach(r=>{
        const d=r._parsed_date;
        const fdate=`${pad2(d.getUTCDate())}-${pad2(d.getUTCMonth()+1)}-${d.getUTCFullYear()}`;

        html+=`
          <tr>
            <td class="center" data-col="state">${r.state}</td>
            <td class="center" data-col="depot">${r.depot}</td>
            <td class="center" data-col="date">${fdate}</td>
            <td class="left"   data-col="sku_name">${r.sku_name}</td>
            <td class="center" data-col="opening">${fmt(r.opening)}</td>
            <td class="center" data-col="qty_recd">${fmt(r.qty_recd)}</td>
            <td class="center" data-col="qty_sale">${fmt(r.qty_sale)}</td>
            <td class="center" data-col="closing">${fmt(r.closing)}</td>
          </tr>`;
      });

      // subtotal label
      const d0=dateRows[0]._parsed_date;
      const fLabel=`${pad2(d0.getUTCDate())}-${pad2(d0.getUTCMonth()+1)}-${d0.getUTCFullYear()}`;

      html+=`
        <tr class="subtotal-row">
          <td colspan="4">subtotal of Date (${fLabel})</td>
          <td class="center" data-col="opening">${fmt(sub.open)}</td>
          <td class="center" data-col="qty_recd">${fmt(sub.rec)}</td>
          <td class="center" data-col="qty_sale">${fmt(sub.sale)}</td>
          <td class="center" data-col="closing">${fmt(sub.close)}</td>
        </tr>`;

      k=m;
    }

    // depot grand
    html+= depotGrandRow(depotAcc);

    i=j;
  }

  // last state
  if(stateAcc){
    html+= stateGrandRow(stateAcc);
  }

  // overall
  html+= overallGrandRow(overall);

  tbody.innerHTML=html;

  // apply column visibility
  colBoxes.forEach(ch=>{
    const col=ch.dataset.col;
    const show=ch.checked;
    const th=table.querySelector(`thead th[data-col="${col}"]`);
    if(th) th.style.display = show ? '' : 'none';
    table.querySelectorAll(`td[data-col="${col}"]`).forEach(td=>{
      td.style.display = show ? '' : 'none';
    });
  });
}

/* Row helpers */
function depotGrandRow(a){
  return `
  <tr class="depot-grand-row">
    <td colspan="4">GRAND TOTAL OF ${a.depot}</td>
    <td class="center">${fmt(a.open)}</td>
    <td class="center">${fmt(a.rec)}</td>
    <td class="center">${fmt(a.sale)}</td>
    <td class="center">${fmt(a.close)}</td>
  </tr>`;
}

function stateGrandRow(a){
  return `
  <tr class="state-grand-row">
    <td colspan="4">GRAND TOTAL OF ${a.state}</td>
    <td class="center">${fmt(a.open)}</td>
    <td class="center">${fmt(a.rec)}</td>
    <td class="center">${fmt(a.sale)}</td>
    <td class="center">${fmt(a.close)}</td>
  </tr>`;
}

function overallGrandRow(a){
  return `
  <tr class="overall-grand-row">
    <td colspan="4">OVERALL GRAND TOTAL</td>
    <td class="center">${fmt(a.open)}</td>
    <td class="center">${fmt(a.rec)}</td>
    <td class="center">${fmt(a.sale)}</td>
    <td class="center">${fmt(a.close)}</td>
  </tr>`;
}

/*** EXPORT TO XLS ***/
exportBtn.addEventListener('click',()=>{
  const header=["State","Depot","Date","SKU Name","Opening","Received","Sales","Closing"];
  const wsData=[header];
  const trs=[...tbody.querySelectorAll('tr')];
  trs.forEach(tr=>{
    const tds=[...tr.querySelectorAll('td')].map(td=>td.textContent.trim());
    while(tds.length<8) tds.push("");
    wsData.push(tds);
  });
  const ws=XLSX.utils.aoa_to_sheet(wsData);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Stock");
  XLSX.writeFile(wb,`stock_export_${new Date().toISOString().slice(0,10)}.xlsx`);
});

/*** INIT ***/
loadData();
</script>

</body>
</html>
