<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Lighthouse Sales</title>

  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <style>
    body{font-family:Inter,system-ui;background:#f6f9fc;margin:0;padding:0;color:#111827;}
    header{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:10px 16px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
    header img{height:40px;}
    header h1{font-size:1rem;color:#1e3a8a;font-weight:800;margin-left:8px;}
    .toolbar button{border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:700;}
    .btn-blue{background:linear-gradient(90deg,#2563eb,#4f46e5);color:#fff;}
    .btn-gray{background:#f3f4f6;color:#111827;border:1px solid #e2e8f0;}

    #filtersWrapper{transition:all .3s ease;overflow:hidden;}
    #filtersWrapper.hidden{max-height:0;opacity:0;pointer-events:none;}
    #filtersContainer{display:flex;gap:10px;overflow-x:auto;background:#fff;padding:10px;border-radius:10px;}
    .filter-box{border:2px solid #1e3a8a;border-radius:10px;padding:6px 10px;min-width:160px;background:#fff;}
    .filter-box strong{display:block;color:#1e3a8a;font-weight:800;text-align:center;margin-bottom:4px;border-bottom:1px solid #e5e7eb;}
    .filter-box label{display:block;font-size:.8rem;padding:2px 4px;}
    table{border-collapse:collapse;width:100%;min-width:1000px;}
    th,td{padding:6px 8px;border:1px solid #cbd5e1;text-align:center;font-weight:600;}
    thead th{position:sticky;top:0;background:linear-gradient(90deg,#eef2ff,#e0e7ff);}
    .subtotal-row td{background:#fef9c3;font-weight:700;}
    .grandtotal-row td{background:#e0f2fe;font-weight:800;}
    .table-wrapper{background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(4,8,15,0.05);overflow:auto;max-height:75vh;margin-top:10px;}
    .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.6);font-weight:800;font-size:1rem;color:#1e3a8a;z-index:999;}
    .overlay.show{display:flex;}
  </style>
</head>

<body>
  <header>
    <div style="display:flex;align-items:center;">
      <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo">
      <h1>SMC Lighthouse Sales</h1>
    </div>
    <div class="toolbar">
      <button id="exportBtn" class="btn-blue">Export</button>
      <button id="clearBtn" class="btn-gray">Clear Filters</button>
      <button id="toggleFiltersBtn" class="btn-gray">Hide Filters</button>
    </div>
  </header>

  <main style="max-width:1500px;margin:10px auto;padding:0 10px;">
    <div id="filtersWrapper">
      <div style="margin-bottom:8px;">
        From: <input type="date" id="dateFrom"> 
        To: <input type="date" id="dateTo"> 
        <button id="yesterdayBtn" class="btn-gray">Yesterday</button>
        Invoice Month: <select id="monthQuick"></select>
        <span id="recordsInfo" style="margin-left:10px;font-size:.85rem;color:#6b7280"></span>
      </div>
      <div id="filtersContainer"></div>
    </div>

    <div class="table-wrapper">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
  </main>

  <div id="overlay" class="overlay">Processing...</div>

<script>
const API_URL="/get_data/lighthouse_sales";
let rawData=[];

/* ---------- Helpers ---------- */
function parseDate(s){const d=new Date(s);return isNaN(d)?null:d;}
function monthLabel(s){const d=parseDate(s);return !d?"":d.toLocaleString("default",{month:"short",year:"numeric"});}
function formatDate(s){const d=parseDate(s);return !d?s:`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;}
function showOverlay(){document.getElementById("overlay").classList.add("show");}
function hideOverlay(){document.getElementById("overlay").classList.remove("show");}

/* ---------- Load Data ---------- */
async function loadData(){
  showOverlay();
  const res=await fetch(API_URL);
  const data=await res.json();
  rawData=data.map(r=>({
    state:r.state,party_name:r.party_name,item_name:r.item_name,invoice_date:r.invoice_date,
    quantity_kg:+r.quantity_kg||0,bill_amount:+r.bill_amount||0,quantity_cs:+r.quantity_cs||0
  }));
  const months=[...new Set(rawData.map(r=>monthLabel(r.invoice_date)))].filter(Boolean);
  document.getElementById("monthQuick").innerHTML=`<option value="">--All--</option>`+months.map(m=>`<option>${m}</option>`).join("");
  buildFilters();
  applyFilters();
  hideOverlay();
}

/* ---------- Build Filters ---------- */
function buildFilters(){
  const c=document.getElementById("filtersContainer");
  c.innerHTML="";
  const boxes=[
    {key:"SHOW COLUMNS",vals:["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE"]},
    {key:"STATE",vals:[...new Set(rawData.map(r=>r.state))].filter(Boolean).sort()},
    {key:"PARTY_NAME",vals:[...new Set(rawData.map(r=>r.party_name))].filter(Boolean).sort()},
    {key:"ITEM_NAME",vals:[...new Set(rawData.map(r=>r.item_name))].filter(Boolean).sort()},
    {key:"TOTAL",vals:["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE"]}
  ];
  boxes.forEach(b=>{
    const div=document.createElement("div");
    div.className="filter-box";
    div.innerHTML=`<strong>${b.key}</strong>
      <label><input type="checkbox" data-all="${b.key}"> All</label>
      <div>${b.vals.map(v=>`<label><input type="checkbox" name="${b.key}" value="${v}"> ${v}</label>`).join("")}</div>`;
    c.appendChild(div);
  });
  c.querySelectorAll("input[data-all]").forEach(cb=>{
    cb.addEventListener("change",e=>{
      const key=e.target.dataset.all;
      c.querySelectorAll(`input[name='${key}']`).forEach(i=>i.checked=e.target.checked);
      applyFilters();
    });
  });
  c.addEventListener("change",()=>applyFilters());
}

/* ---------- Cascade + Aggregate (Fixed Grouping) ---------- */
function cascadeAndAggregate(sel){
  let f=[...rawData];
  const from=document.getElementById("dateFrom").value?new Date(document.getElementById("dateFrom").value):null;
  const to=document.getElementById("dateTo").value?new Date(document.getElementById("dateTo").value):null;
  const monthQ=document.getElementById("monthQuick").value;

  if(monthQ)f=f.filter(r=>monthLabel(r.invoice_date)===monthQ);
  else if(from||to)f=f.filter(r=>{const d=parseDate(r.invoice_date);if(!d)return false;if(from&&d<from)return false;if(to&&d>to)return false;return true;});

  ["STATE","PARTY_NAME","ITEM_NAME"].forEach(k=>{
    const vals=sel[k]||[];
    if(vals.length)f=f.filter(r=>vals.includes(r[k.toLowerCase()]));
  });

  // Smart cascade - hide unavailable options
  const sets={STATE:new Set(f.map(r=>r.state)),PARTY_NAME:new Set(f.map(r=>r.party_name)),ITEM_NAME:new Set(f.map(r=>r.item_name))};
  ["STATE","PARTY_NAME","ITEM_NAME"].forEach(k=>{
    document.querySelectorAll(`input[name='${k}']`).forEach(cb=>{
      const lab=cb.closest("label");
      if(!sets[k].has(cb.value)){lab.style.display="none";cb.checked=false;} else lab.style.display="";
    });
  });

  // --- TRUE GROUP AGGREGATION FIX ---
  const totals=sel["TOTAL"]||[];
  let keyFields=[];
  if(totals.includes("STATE"))keyFields.push("state");
  if(totals.includes("PARTY_NAME"))keyFields.push("party_name");
  if(totals.includes("ITEM_NAME"))keyFields.push("item_name");
  if(totals.includes("INVOICE_DATE"))keyFields.push("invoice_date");
  if(!keyFields.length)keyFields=["state","party_name","item_name","invoice_date"];

  // 🧮 Aggregate properly (1 row per unique combination)
  const map=new Map();
  f.forEach(r=>{
    const key=keyFields.map(k=>r[k]).join("|");
    if(!map.has(key)){
      map.set(key,{
        STATE:r.state,
        PARTY_NAME:r.party_name,
        ITEM_NAME:r.item_name,
        INVOICE_DATE:keyFields.includes("invoice_date")?formatDate(r.invoice_date):"",
        SUM_QUANTITY_KG:r.quantity_kg,
        SUM_BILL_AMOUNT:r.bill_amount,
        SUM_QUANTITY_CS:r.quantity_cs
      });
    } else {
      const obj=map.get(key);
      obj.SUM_QUANTITY_KG+=r.quantity_kg;
      obj.SUM_BILL_AMOUNT+=r.bill_amount;
      obj.SUM_QUANTITY_CS+=r.quantity_cs;
    }
  });
  const rows=[...map.values()];
  const grand=rows.reduce((a,r)=>({
    SUM_QUANTITY_KG:a.SUM_QUANTITY_KG+r.SUM_QUANTITY_KG,
    SUM_BILL_AMOUNT:a.SUM_BILL_AMOUNT+r.SUM_BILL_AMOUNT,
    SUM_QUANTITY_CS:a.SUM_QUANTITY_CS+r.SUM_QUANTITY_CS
  }),{SUM_QUANTITY_KG:0,SUM_BILL_AMOUNT:0,SUM_QUANTITY_CS:0});

  return {rows,grand};
}

/* ---------- Get Selections ---------- */
function getSelected(){
  const s={};
  document.querySelectorAll(".filter-box").forEach(b=>{
    const t=b.querySelector("strong").textContent.trim();
    s[t]=[...b.querySelectorAll(`input[name='${t}']:checked`)].map(i=>i.value);
  });
  return s;
}

/* ---------- Render (One Row Per Group) ---------- */
function renderTable(result,sel){
  const head=document.getElementById("tableHead"),body=document.getElementById("tableBody"),foot=document.getElementById("tableFoot");
  const show=sel["SHOW COLUMNS"].length?sel["SHOW COLUMNS"]:["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE"];
  const header=[...show,"SUM_QUANTITY_KG","SUM_BILL_AMOUNT","SUM_QUANTITY_CS"];
  head.innerHTML="<tr>"+header.map(h=>`<th>${h.replace(/_/g," ")}</th>`).join("")+"</tr>";

  body.innerHTML=result.rows.map(r=>
    "<tr>"+header.map(c=>{
      if(c==="SUM_QUANTITY_KG")return`<td>${r.SUM_QUANTITY_KG.toLocaleString()}</td>`;
      if(c==="SUM_BILL_AMOUNT")return`<td>${r.SUM_BILL_AMOUNT.toLocaleString()}</td>`;
      if(c==="SUM_QUANTITY_CS")return`<td>${r.SUM_QUANTITY_CS.toLocaleString()}</td>`;
      return`<td>${r[c]||""}</td>`;
    }).join("")+"</tr>"
  ).join("");

  foot.innerHTML=`<tr class='grandtotal-row'>${header.map((c,i)=>{
    if(c==="SUM_QUANTITY_KG")return`<td>${result.grand.SUM_QUANTITY_KG.toLocaleString()}</td>`;
    if(c==="SUM_BILL_AMOUNT")return`<td>${result.grand.SUM_BILL_AMOUNT.toLocaleString()}</td>`;
    if(c==="SUM_QUANTITY_CS")return`<td>${result.grand.SUM_QUANTITY_CS.toLocaleString()}</td>`;
    return i===0?`<td><b>GRAND TOTAL</b></td>`:`<td></td>`;
  }).join("")}</tr>`;

  document.getElementById("recordsInfo").textContent=`Rows: ${result.rows.length}`;
}

/* ---------- Apply Filters ---------- */
function applyFilters(){
  const s=getSelected();
  const result=cascadeAndAggregate(s);
  renderTable(result,s);
}

/* ---------- Buttons ---------- */
document.getElementById("clearBtn").onclick=()=>{document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false);document.getElementById("dateFrom").value="";document.getElementById("dateTo").value="";document.getElementById("monthQuick").value="";applyFilters();};
document.getElementById("yesterdayBtn").onclick=()=>{const d=new Date();d.setDate(d.getDate()-1);const s=d.toISOString().slice(0,10);document.getElementById("dateFrom").value=s;document.getElementById("dateTo").value=s;applyFilters();};
document.getElementById("toggleFiltersBtn").onclick=()=>{const fw=document.getElementById("filtersWrapper");fw.classList.toggle("hidden");document.getElementById("toggleFiltersBtn").textContent=fw.classList.contains("hidden")?"Show Filters":"Hide Filters";};

/* ---------- Export ---------- */
document.getElementById("exportBtn").onclick=async()=>{
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Lighthouse");
  const rows=[...document.querySelectorAll("#dataTable tr")].map(tr=>[...tr.children].map(td=>td.innerText));
  rows.forEach((r,i)=>{const row=ws.addRow(r);if(i===0){row.font={bold:true};row.fill={type:"pattern",pattern:"solid",fgColor:{argb:"E0E7FF"}};}});
  const buf=await wb.xlsx.writeBuffer();saveAs(new Blob([buf]),`lighthouse_${new Date().toISOString().slice(0,10)}.xlsx`);
};

/* ---------- Init ---------- */
loadData();
</script>
</body>
</html>
