<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SMC Sales Dashboard</title>
<link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
:root{--navy:#1e3a8a;--accent1:#2563eb;--accent2:#4f46e5}
body{font-family:Inter,system-ui,Arial;margin:0;background:#f6f9fc;color:#0f172a}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff}
header h1{margin:0;font-weight:800;font-size:1.05rem}
header .left{display:flex;align-items:center;gap:12px}
.toolbar{display:flex;gap:8px;align-items:center}
.btn{border:0;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:700}
.btn-blue{background:#fff;color:var(--navy)}
.btn-gray{background:#eef2ff;color:#1e3a8a}
main{max-width:1500px;margin:14px auto;padding:0 12px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.controls input[type=date],.controls select{padding:6px;border-radius:6px;border:1px solid #dbeafe;background:#fff}
#filtersContainer{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.filter-box{background:linear-gradient(180deg,#fff,#f0f4ff);border:2px solid var(--navy);border-radius:12px;padding:10px 12px;flex:1 1 240px;box-shadow:0 6px 18px rgba(30,58,138,0.06)}
.filter-box strong{display:block;text-align:center;color:var(--navy);font-weight:900;margin-bottom:6px;border-bottom:2px solid #e6eef9;padding-bottom:6px}
.filter-box .options{max-height:220px;overflow:auto;padding-top:6px}
.filter-box label{display:block;padding:6px 8px;margin:4px 0;border-radius:8px;font-weight:700;cursor:pointer;transition:all .2s}
.filter-box label.invalid{opacity:.4;pointer-events:none}
.table-wrapper{background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(4,8,15,0.05);overflow:auto;max-height:72vh}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{border:1.5px solid #65738a;padding:6px 8px;text-align:center;font-weight:800;height:20px}
thead th{position:sticky;top:0;background:linear-gradient(90deg,#e0e7ff,#c7d2fe);color:#1e3a8a}
tr.subtotal-row td{background:#fff7cc;font-weight:900}
tr.grandtotal-row td{background:#bae6fd;font-weight:900}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.7);z-index:3000;font-weight:900;color:#1e3a8a}
.overlay.show{display:flex}
@media(max-width:900px){.filter-box{flex:1 1 100%}th,td{font-size:.85rem}}
</style>
</head>
<body>
<header>
  <div class="left">
    <img src="{{ url_for('static', filename='onlylogo.png') }}" style="height:40px">
    <h1>SMC ERP Sales</h1>
  </div>
  <div class="toolbar">
    <a href="/sales_levels"><button class="btn btn-gray">← Back</button></a>
    <button id="exportBtn" class="btn btn-blue">Export</button>
    <button id="clearBtn" class="btn btn-gray">Clear</button>
    <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
    <a href="/comparison_new1"><button class="btn btn-blue">Comparison</button></a>


  </div>
</header>

<main>
  <div class="controls">
    From: <input type="date" id="dateFrom">
    To: <input type="date" id="dateTo">
    <button id="yesterdayBtn" class="btn btn-gray">Yesterday</button>
    Invoice Month: <select id="monthQuick"><option value="">--All--</option></select>
    <small id="recordsInfo" style="margin-left:auto;color:#6b7280"></small>
  </div>

  <div id="filtersWrapper"><div id="filtersContainer"></div></div>

  <div class="table-wrapper">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
      <tfoot id="tableFoot"></tfoot>
    </table>
  </div>
</main>








<div id="overlay" class="overlay">Processing...</div>

<script>
const API_URL = "/get_data/lighthouse_sales";

// --- CONSTANTS FOR IMPROVED READABILITY ---
const FILTER_KEYS = {
  SHOW_COLUMNS: "SHOW_COLUMNS",
  STATE: "STATE",
  PARTY_NAME: "PARTY_NAME",
  ITEM_NAME: "ITEM_NAME",
};

const COLUMN_DISPLAY_NAMES = {
  STATE: "State",
  PARTY_NAME: "Party Name",
  ITEM_NAME: "Item Name",
  INVOICE_DATE: "Invoice Date",
  INVOICE_MONTH: "Invoice Month",
  SUM_QUANTITY_CS: "Quantity (CS)",
  SUM_QUANTITY_KG: "Quantity (KG)",
  SUM_BILL_AMOUNT: "Bill Amount",
};

const DEFAULT_DISPLAY_COLUMNS = new Set([
  COLUMN_DISPLAY_NAMES.STATE,
  COLUMN_DISPLAY_NAMES.PARTY_NAME,
  COLUMN_DISPLAY_NAMES.INVOICE_MONTH,
  COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS,
]);

// All possible columns for the "SHOW COLUMNS" filter
const ALL_SELECTABLE_COLUMNS = [
  COLUMN_DISPLAY_NAMES.STATE,
  COLUMN_DISPLAY_NAMES.PARTY_NAME,
  COLUMN_DISPLAY_NAMES.ITEM_NAME,
  COLUMN_DISPLAY_NAMES.INVOICE_DATE,
  COLUMN_DISPLAY_NAMES.INVOICE_MONTH,
  COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS,
  COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG,
  COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT,
];
// --- END CONSTANTS ---

let rawData = [];
let allStates = [], allParties = [], allItems = []; // Removed allPartyGroups

function parseDateFlexible(s){
  if(!s)return null;
  s=String(s).trim();
  if(/^\d{8}$/.test(s)){const d=+s.slice(0,2),m=+s.slice(2,4),y=+s.slice(4,8);return new Date(y,m-1,d);}
  const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  const d=new Date(s);
  return isNaN(d)?null:d;
}
function invoiceMonthLabel(s){const dt=parseDateFlexible(s);if(!dt)return "";return dt.toLocaleString('default',{month:'short',year:'numeric'});}
function formatDateInputISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function toNum(v){return Number(v)||0;}
function showOverlay(){document.getElementById('overlay').classList.add('show');}
function hideOverlay(){document.getElementById('overlay').classList.remove('show');}

// Debounce utility function
function debounce(func, delay) {
  let timeout;
  return function(...args) {
    const context = this;
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(context, args), delay);
  };
}

// --- Data Loading ---
async function loadData(){
  showOverlay();
  try{
    const res = await axios.get(API_URL);
    const data = Array.isArray(res.data) ? res.data : [];
    rawData = data.map(r => {
      const rawDate = (r.invoice_date || r.INVOICE_DATE || "").toString().trim();
      const parsedDate = parseDateFlexible(rawDate);
      return {
        state: (r.state || r.STATE || "").trim(),
        partyName: (r.party_name || r.PARTY_NAME || "").trim(),
        itemName: (r.item_name || r.ITEM_NAME || "").trim(),
        invoiceDate: parsedDate ? `${String(parsedDate.getDate()).padStart(2,'0')}${String(parsedDate.getMonth()+1).padStart(2,'0')}${parsedDate.getFullYear()}` : "",
        invoiceMonth: invoiceMonthLabel(rawDate),
        invoiceDateObj: parsedDate,
        quantityCs: toNum(r.quantity_cs || r.Quantity_CS || 0),
        quantityKg: toNum(r.quantity_kg || r.Quantity_KG || 0),
        billAmount: toNum(r.bill_amount || r.Bill_Amount || 0)
      };
    }).filter(r => r.invoiceDateObj !== null); // Filter out rows with invalid dates

    allStates = [...new Set(rawData.map(r => r.state))].sort();
    allParties = [...new Set(rawData.map(r => r.partyName))].sort();
    allItems = [...new Set(rawData.map(r => r.itemName))].sort();

    // Fill Invoice months dropdown
    const months = [...new Set(rawData.map(r => r.invoiceMonth).filter(Boolean))].sort((a,b)=>new Date(a)-new Date(b));
    document.getElementById("monthQuick").innerHTML = `<option value="">--All--</option>` + months.map(m=>`<option value="${m}">${m}</option>`).join("");

    // Set default date range to current month
    const now = new Date(), first = new Date(now.getFullYear(), now.getMonth(), 1), last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    document.getElementById("dateFrom").value = formatDateInputISO(first);
    document.getElementById("dateTo").value = formatDateInputISO(last);

    buildFilters();
    debouncedApplyFilters(); // Initial table render
  } finally {
    hideOverlay();
  }
}

// --- Filter Building ---
function buildFilters(){
  const container = document.getElementById("filtersContainer");
  container.innerHTML = ""; // Clear existing filters

  const makeFilterBox = (title, vals, defaultSelections = []) => {
    const defaultSet = new Set(defaultSelections);
    return `
      <div class="filter-box"><strong>${title}</strong>
        <label><input type="checkbox" data-all-group="${title}"> All</label>
        <div class="options">
          ${vals.map(v => `<label><input type="checkbox" name="${title}" value="${v}" ${defaultSet.has(v) ? 'checked' : ''}> ${v}</label>`).join("")}
        </div>
      </div>`;
  };

  container.innerHTML += makeFilterBox(FILTER_KEYS.SHOW_COLUMNS, ALL_SELECTABLE_COLUMNS, [...DEFAULT_DISPLAY_COLUMNS]);
  container.innerHTML += makeFilterBox(FILTER_KEYS.STATE, allStates);
  container.innerHTML += makeFilterBox(FILTER_KEYS.PARTY_NAME, allParties);
  container.innerHTML += makeFilterBox(FILTER_KEYS.ITEM_NAME, allItems);

  // Event listeners for "All" checkboxes and filter changes
  container.querySelectorAll("input[data-all-group]").forEach(cb => {
    cb.addEventListener("change", e => {
      const group = e.target.dataset.allGroup;
      container.querySelectorAll(`input[name='${group}']`).forEach(i => i.checked = e.target.checked);
      debouncedApplyFilters();
    });
  });
  container.addEventListener("change", (e) => {
    // Check if it's a specific filter option, not the "All" checkbox
    if (e.target.name && e.target.name !== FILTER_KEYS.SHOW_COLUMNS) {
      updateAllCheckboxState(e.target.name);
    } else if (e.target.dataset.allGroup === FILTER_KEYS.SHOW_COLUMNS) {
       updateAllCheckboxState(FILTER_KEYS.SHOW_COLUMNS);
    }
    debouncedApplyFilters();
  });

  // Initialize "All" checkbox states
  Object.values(FILTER_KEYS).forEach(key => updateAllCheckboxState(key));
}

// Function to update the "All" checkbox's indeterminate/checked state
function updateAllCheckboxState(groupName) {
  const checkboxes = document.querySelectorAll(`input[name='${groupName}']`);
  const allCheckbox = document.querySelector(`input[data-all-group='${groupName}']`);

  if (!checkboxes.length || !allCheckbox) return;

  const checkedCount = [...checkboxes].filter(cb => cb.checked).length;
  allCheckbox.checked = checkedCount === checkboxes.length;
  allCheckbox.indeterminate = checkedCount > 0 && checkedCount < checkboxes.length;
}

// --- Filter Application and Table Rendering ---
function getSelectedFilters() {
  const selected = {};
  document.querySelectorAll(".filter-box strong").forEach(h => {
    const key = h.textContent.trim();
    selected[key] = [...document.querySelectorAll(`input[name='${key}']:checked`)].map(i => i.value);
  });
  return selected;
}

function getFilteredData(selectedFilters, dateFrom, dateTo) {
  let filtered = rawData.filter(r => r.invoiceDateObj >= dateFrom && r.invoiceDateObj <= dateTo);

  if (selectedFilters[FILTER_KEYS.STATE].length) filtered = filtered.filter(r => selectedFilters[FILTER_KEYS.STATE].includes(r.state));
  if (selectedFilters[FILTER_KEYS.PARTY_NAME].length) filtered = filtered.filter(r => selectedFilters[FILTER_KEYS.PARTY_NAME].includes(r.partyName));
  if (selectedFilters[FILTER_KEYS.ITEM_NAME].length) filtered = filtered.filter(r => selectedFilters[FILTER_KEYS.ITEM_NAME].includes(r.itemName));

  return filtered;
}






function updateFilterCascades(filteredData) {
  const validStates = [...new Set(filteredData.map(r => r.state))];
  const validParties = [...new Set(filteredData.map(r => r.partyName))];
  const validItems = [...new Set(filteredData.map(r => r.itemName))];

  [FILTER_KEYS.STATE, FILTER_KEYS.PARTY_NAME, FILTER_KEYS.ITEM_NAME].forEach(type => {
    document.querySelectorAll(`input[name='${type}']`).forEach(cb => {
      const val = cb.value;
      let isValid = false;
      if (type === FILTER_KEYS.STATE) isValid = validStates.includes(val);
      else if (type === FILTER_KEYS.PARTY_NAME) isValid = validParties.includes(val);
      else if (type === FILTER_KEYS.ITEM_NAME) isValid = validItems.includes(val);

      // 👇 visually mark invalid options only, still allow user to select multiple
      cb.closest("label").style.opacity = isValid ? "1" : "0.4";
      cb.closest("label").style.pointerEvents = "auto"; 
    });
    updateAllCheckboxState(type);
  });
}

function groupAndAggregateData(filteredData, selectedDisplayColumns) {
  // Determine actual grouping keys based on selected display columns
  const groupingKeys = selectedDisplayColumns.filter(k => !k.startsWith("Sum")); // Exclude sums for grouping
  const map = new Map();

  filteredData.forEach(r => {
    // Dynamically create a key for grouping based on selected grouping keys
    const key = groupingKeys.map(k => {
      // Map display names back to raw data properties for grouping
      if (k === COLUMN_DISPLAY_NAMES.STATE) return r.state;
      if (k === COLUMN_DISPLAY_NAMES.PARTY_NAME) return r.partyName;
      if (k === COLUMN_DISPLAY_NAMES.ITEM_NAME) return r.itemName;
      if (k === COLUMN_DISPLAY_NAMES.INVOICE_DATE) return r.invoiceDate;
      if (k === COLUMN_DISPLAY_NAMES.INVOICE_MONTH) return r.invoiceMonth;
      return ""; // Fallback
    }).join("|");

    if (!map.has(key)) {
      map.set(key, {
        [COLUMN_DISPLAY_NAMES.STATE]: r.state,
        [COLUMN_DISPLAY_NAMES.PARTY_NAME]: r.partyName,
        [COLUMN_DISPLAY_NAMES.ITEM_NAME]: r.itemName,
        [COLUMN_DISPLAY_NAMES.INVOICE_DATE]: r.invoiceDate,
        [COLUMN_DISPLAY_NAMES.INVOICE_MONTH]: r.invoiceMonth,
        [COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS]: r.quantityCs,
        [COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG]: r.quantityKg,
        [COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT]: r.billAmount
      });
    } else {
      const o = map.get(key);
      o[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS] += r.quantityCs;
      o[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG] += r.quantityKg;
      o[COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT] += r.billAmount;
    }
  });

  return [...map.values()];
}







function renderTable(rowsToRender, selectedDisplayColumns) {
  const thead = document.getElementById("tableHead");
  const tbody = document.getElementById("tableBody");
  const tfoot = document.getElementById("tableFoot");

  // --- Header ---
  thead.innerHTML = `<tr>${selectedDisplayColumns.map(h => `<th>${h}</th>`).join("")}</tr>`;

  // --- Determine dynamic grouping hierarchy ---
  const groupingHierarchy = selectedDisplayColumns.filter(c =>
    [COLUMN_DISPLAY_NAMES.STATE, COLUMN_DISPLAY_NAMES.PARTY_NAME, COLUMN_DISPLAY_NAMES.ITEM_NAME].includes(c)
  );

  // --- Recursive function to group and render rows ---
  function renderGroupedRows(data, level = 0, parentGroup = "") {
    if (level >= groupingHierarchy.length) return "";

    const key = groupingHierarchy[level];
    const groupMap = new Map();

    data.forEach(r => {
      const val = r[key] || "Undefined";
      if (!groupMap.has(val)) groupMap.set(val, []);
      groupMap.get(val).push(r);
    });

    let html = "";

    groupMap.forEach((groupRows, groupValue) => {
      // If deeper levels exist, render recursively
      if (level < groupingHierarchy.length - 1) {
        html += renderGroupedRows(groupRows, level + 1, groupValue);
      } else {
        // Render data rows at the last level
        groupRows.forEach(r => {
          html += "<tr>" + selectedDisplayColumns.map(c => `<td>${r[c] ?? ""}</td>`).join("") + "</tr>";
        });
      }

      // --- Subtotal if group has ≥2 rows ---
      if (groupRows.length >= 2) {
        const sub = groupRows.reduce((a, r) => {
          a[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS] += r[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS] || 0;
          a[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG] += r[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG] || 0;
          a[COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT] += r[COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT] || 0;
          return a;
        }, {
          [COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS]: 0,
          [COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG]: 0,
          [COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT]: 0
        });

        const indent = "&nbsp;".repeat(level * 6);
        html += `<tr class='subtotal-row'>` +
          selectedDisplayColumns.map((c, i) => {
            if (c === COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS) return `<td>${sub[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS].toLocaleString()}</td>`;
            if (c === COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG) return `<td>${sub[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG].toLocaleString()}</td>`;
            if (c === COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT) return `<td>${sub[COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT].toLocaleString()}</td>`;
            return i === 0 ? `<td><b>${indent}Subtotal - ${groupValue}</b></td>` : `<td></td>`;
          }).join("") + `</tr>`;
      }
    });

    return html;
  }

  // --- Build body ---
  let html = "";
  if (groupingHierarchy.length > 0) {
    html = renderGroupedRows(rowsToRender, 0);
  } else {
    // No grouping columns, show flat rows
    html = rowsToRender.map(r => "<tr>" + selectedDisplayColumns.map(c => `<td>${r[c] ?? ""}</td>`).join("") + "</tr>").join("");
  }

  tbody.innerHTML = html || `<tr><td colspan="${selectedDisplayColumns.length}">No data</td></tr>`;

  // --- Grand Total ---
  const grand = rowsToRender.reduce((a, r) => {
    a[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS] += r[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS] || 0;
    a[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG] += r[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG] || 0;
    a[COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT] += r[COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT] || 0;
    return a;
  }, {
    [COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS]: 0,
    [COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG]: 0,
    [COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT]: 0
  });

  tfoot.innerHTML = `<tr class='grandtotal-row'>` +
    selectedDisplayColumns.map((c, i) => {
      if (c === COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS) return `<td>${grand[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_CS].toLocaleString()}</td>`;
      if (c === COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG) return `<td>${grand[COLUMN_DISPLAY_NAMES.SUM_QUANTITY_KG].toLocaleString()}</td>`;
      if (c === COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT) return `<td>${grand[COLUMN_DISPLAY_NAMES.SUM_BILL_AMOUNT].toLocaleString()}</td>`;
      return i === 0 ? `<td><b>GRAND TOTAL</b></td>` : `<td></td>`;
    }).join("") + `</tr>`;

  document.getElementById("recordsInfo").textContent = `Rows: ${rowsToRender.length}`;
}


const debouncedApplyFilters = debounce(applyFilters, 300); // Debounce filter application

function applyFilters(){
  showOverlay();
  setTimeout(()=>{ // Use a small timeout to allow overlay to render, actual debouncing is handled by debouncedApplyFilters
    const selected = getSelectedFilters();

    const dateFrom = new Date(document.getElementById("dateFrom").value + "T00:00:00");
    const dateTo = new Date(document.getElementById("dateTo").value + "T23:59:59");

    const filteredData = getFilteredData(selected, dateFrom, dateTo);
    updateFilterCascades(filteredData);

    const selectedDisplayColumns = selected[FILTER_KEYS.SHOW_COLUMNS].length ?
      selected[FILTER_KEYS.SHOW_COLUMNS] : [...DEFAULT_DISPLAY_COLUMNS]; // Use default if nothing selected for show columns

    const aggregatedRows = groupAndAggregateData(filteredData, selectedDisplayColumns);
    renderTable(aggregatedRows, selectedDisplayColumns);

    hideOverlay();
  }, 50); // Small delay for UI update
}

// --- Event Listeners ---
document.getElementById("toggleFiltersBtn").addEventListener("click",()=>{
  const wrapper = document.getElementById("filtersWrapper");
  const btn = document.getElementById("toggleFiltersBtn");
  if(wrapper.style.display==="none"){wrapper.style.display="block";btn.textContent="Hide Filters";}else{wrapper.style.display="none";btn.textContent="Show Filters";}
});

document.getElementById("clearBtn").addEventListener("click",()=>{
  // Reset date range to current month
  const now = new Date(), first = new Date(now.getFullYear(), now.getMonth(), 1), last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  document.getElementById("dateFrom").value = formatDateInputISO(first);
  document.getElementById("dateTo").value = formatDateInputISO(last);
  document.getElementById("monthQuick").value = ""; // Clear invoice month quick filter

  buildFilters(); // Rebuild filters to reset all checkboxes to default
  debouncedApplyFilters();
});

document.getElementById("yesterdayBtn").addEventListener("click", () => {
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  document.getElementById("dateFrom").value = formatDateInputISO(yesterday);
  document.getElementById("dateTo").value = formatDateInputISO(yesterday);
  document.getElementById("monthQuick").value = ""; // Clear invoice month quick filter if "Yesterday" is clicked
  debouncedApplyFilters();
});

document.getElementById("monthQuick").addEventListener("change", (e) => {
  const selectedMonth = e.target.value;
  if (selectedMonth) {
    const [monthStr, yearStr] = selectedMonth.split(' ');
    const monthIndex = new Date(Date.parse(monthStr +" 1, "+ yearStr)).getMonth();
    const year = parseInt(yearStr);

    const firstDayOfMonth = new Date(year, monthIndex, 1);
    const lastDayOfMonth = new Date(year, monthIndex + 1, 0);

    document.getElementById("dateFrom").value = formatDateInputISO(firstDayOfMonth);
    document.getElementById("dateTo").value = formatDateInputISO(lastDayOfMonth);
  }
  debouncedApplyFilters();
});


// Event listeners for date range inputs
document.getElementById("dateFrom").addEventListener("change", debouncedApplyFilters);
document.getElementById("dateTo").addEventListener("change", debouncedApplyFilters);


document.getElementById("exportBtn").addEventListener("click",async()=>{
  showOverlay();
  try {
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet("Lighthouse Sales");

    // Get table headers
    const headerCells = [...document.querySelectorAll("#tableHead th")].map(th => th.innerText.trim());
    const headerRow = ws.addRow(headerCells);
    headerRow.font = { bold: true };

    // Get table body rows
    const bodyRows = [...document.querySelectorAll("#tableBody tr")].map(tr =>
      [...tr.children].map(td => td.innerText.trim())
    );
    bodyRows.forEach(r => ws.addRow(r));

    // Get table footer (grand total)
    const footerCells = [...document.querySelectorAll("#tableFoot tr.grandtotal-row td")].map(td => td.innerText.trim());
    const footerRow = ws.addRow(footerCells);
    footerRow.font = { bold: true };
    footerRow.fill = {
        type: 'pattern',
        pattern: 'solid',
        fgColor: { argb: 'FFBAE6FD' } // Light blue for grand total
    };


    ws.columns.forEach(c => c.width = 18); // Set a default width for columns
    const buf = await wb.xlsx.writeBuffer();
    saveAs(new Blob([buf]),`lighthouse_sales_${new Date().toISOString().slice(0,10)}.xlsx`);
  } catch (error) {
    console.error("Export failed:", error);
    alert("Failed to export data. Please try again.");
  } finally {
    hideOverlay();
  }
});

// Initial data load
loadData();
</script>
</body>
</html>
