<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Lighthouse Sales Dashboard</title>

  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <!-- Excel export + axios -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    :root{--navy:#1e3a8a;--accent1:#2563eb;--accent2:#4f46e5}
    body{font-family:Inter,system-ui,Arial;margin:0;background:#f6f9fc;color:#0f172a}
    header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff}
    header h1{margin:0;font-weight:800;font-size:1.05rem;display:inline-block}
    header .left{display:flex;align-items:center;gap:12px}
    .toolbar{display:flex;gap:8px;align-items:center}
    .btn{border:0;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:700}
    .btn-blue{background:#fff;color:var(--navy)}
    .btn-gray{background:#eef2ff;color:var(--navy)}
    main{max-width:1500px;margin:14px auto;padding:0 12px}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
    .controls input[type=date],.controls select{padding:6px;border-radius:6px;border:1px solid #dbeafe;background:#fff}
    #filtersWrapper{transition:all .25s ease}
    #filtersContainer{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
    .filter-box{background:linear-gradient(180deg,#fff,#f0f4ff);border:2px solid var(--navy);border-radius:12px;padding:10px 12px;flex:1 1 240px;box-shadow:0 6px 18px rgba(30,58,138,0.06)}
    .filter-box strong{display:block;text-align:center;color:var(--navy);font-weight:900;margin-bottom:6px;border-bottom:2px solid #e6eef9;padding-bottom:6px}
    .filter-box .options{max-height:220px;overflow:auto;padding-top:6px}
    .filter-box label{display:block;padding:6px 8px;margin:6px;border-radius:8px;background:#fbfeff;font-weight:800;cursor:pointer}
    .table-wrapper{background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(4,8,15,0.05);overflow:auto;max-height:72vh}
    table{border-collapse:collapse;width:100%;min-width:1100px}
    th,td{border:1.6px solid #65738a;padding:6px 8px;text-align:center;font-weight:800;height:20px}
    thead th{position:sticky;top:0;background:linear-gradient(90deg,#e0e7ff,#c7d2fe);z-index:5;color:var(--navy)}
    tr.subtotal-row td{background:#fff7cc;font-weight:900}
    tr.grandtotal-row td{background:#bae6fd;font-weight:900}
    .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.7);z-index:3000;font-weight:900;color:var(--navy)}
    .overlay.show{display:flex}
    @media(max-width:900px){ .filter-box{flex:1 1 100%} th,td{font-size:.85rem} }
  </style>
</head>
<body>
  <header>
    <div class="left">
      <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo" style="height:40px">
      <h1>SMC Lighthouse Sales</h1>
    </div>

    <div class="toolbar">
      <a href="/sales_levels"><button class="btn btn-gray">← Back</button></a>
      <button id="exportBtn" class="btn btn-blue">Export</button>
      <button id="clearBtn" class="btn btn-gray">Clear</button>
      <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
    </div>
  </header>

  <main>
    <div class="controls">
      From: <input type="date" id="dateFrom">
      To: <input type="date" id="dateTo">
      <button id="yesterdayBtn" class="btn btn-gray">Yesterday</button>
      Invoice Month: <select id="monthQuick"><option value="">--All--</option></select>
      <small id="recordsInfo" style="margin-left:auto;color:#6b7280"></small>
    </div>

    <div id="filtersWrapper">
      <div id="filtersContainer"></div>
    </div>

    <div class="table-wrapper" aria-live="polite">
      <table id="dataTable" role="table" aria-label="Lighthouse aggregated table">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
  </main>

  <div id="overlay" class="overlay">Processing...</div>

<script>
const API_URL = "/get_data/lighthouse_sales";
let rawData=[],allStates=[],allParties=[],allItems=[];

function parseDateFlexible(s){if(!s)return null;s=String(s).trim();if(/^\d{8}$/.test(s)){const d=+s.slice(0,2),m=+s.slice(2,4),y=+s.slice(4,8);return new Date(y,m-1,d);}let m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(s);return isNaN(d.getTime())?null:d;}
function formatDisplayDate(d){const dt=(typeof d==="string")?parseDateFlexible(d):d;if(!dt)return"";return `${String(dt.getDate()).padStart(2,'0')}${String(dt.getMonth()+1).padStart(2,'0')}${dt.getFullYear()}`;}
function formatDateInputISO(d){const dt=(typeof d==="string")?parseDateFlexible(d):d;if(!dt)return"";return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}
function invoiceMonthLabel(s){const dt=parseDateFlexible(s);if(!dt)return"";return dt.toLocaleString('default',{month:'short',year:'numeric'});}
function toNum(v){return Number(v)||0;}
function showOverlay(){document.getElementById('overlay').classList.add('show');}
function hideOverlay(){document.getElementById('overlay').classList.remove('show');}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');}

/* ---------- Load data ---------- */
async function loadData(){
  showOverlay();
  try{
    const res=await axios.get(API_URL);
    const data=Array.isArray(res.data)?res.data:[];
    rawData=data.map(r=>{
      const raw=(r.invoice_date||r.INVOICE_DATE||"").toString().trim();
      const parsed=parseDateFlexible(raw);
      return{
        state:(r.state||r.STATE||"").trim(),
        party_name:(r.party_name||r.PARTY_NAME||"").trim(),
        item_name:(r.item_name||r.ITEM_NAME||"").trim(),
        invoice_date:formatDisplayDate(parsed),
        invoice_date_obj:parsed,
        invoice_month:invoiceMonthLabel(raw),
        quantity_kg:toNum(r.quantity_kg||r.Quantity_KG||0),
        bill_amount:toNum(r.bill_amount||r.Bill_Amount||0),
        quantity_cs:toNum(r.quantity_cs||r.Quantity_CS||0)
      };
    });
    allStates=[...new Set(rawData.map(r=>r.state).filter(Boolean))].sort();
    allParties=[...new Set(rawData.map(r=>r.party_name).filter(Boolean))].sort();
    allItems=[...new Set(rawData.map(r=>r.item_name).filter(Boolean))].sort();
    const months=[...new Set(rawData.map(r=>r.invoice_month).filter(Boolean))];
    document.getElementById("monthQuick").innerHTML=`<option value="">--All--</option>`+months.map(m=>`<option value="${m}">${m}</option>`).join("");
    const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1),last=new Date(now.getFullYear(),now.getMonth()+1,0);
    document.getElementById("dateFrom").value=formatDateInputISO(first);
    document.getElementById("dateTo").value=formatDateInputISO(last);
    buildFilters();applyFilters();
  }catch(e){console.error(e);}finally{hideOverlay();}
}

/* ---------- Build filters ---------- */
function buildFilters(){
  const container=document.getElementById("filtersContainer");
  container.innerHTML="";
  const showCols=["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE","INVOICE_MONTH","SUM_QUANTITY_KG","SUM_BILL_AMOUNT","SUM_QUANTITY_CS"];
  const defaultChecked=new Set(["STATE","PARTY_NAME","INVOICE_DATE","SUM_QUANTITY_CS"]);
  container.innerHTML+=`<div class="filter-box"><strong>SHOW COLUMNS</strong><label><input type="checkbox" data-all="SHOW COLUMNS"> All</label><div class="options">${showCols.map(v=>`<label><input type="checkbox" name="SHOW COLUMNS" value="${v}" ${defaultChecked.has(v)?'checked':''}> ${v}</label>`).join("")}</div></div>`;
  const makeBox=(title,vals)=>`<div class="filter-box"><strong>${title}</strong><label><input type="checkbox" data-all="${title}"> All</label><div class="options">${vals.map(v=>`<label><input type="checkbox" name="${title}" value="${escapeHtml(v)}"> ${escapeHtml(v)}</label>`).join("")}</div></div>`;
  container.innerHTML+=makeBox("STATE",allStates)+makeBox("PARTY_NAME",allParties)+makeBox("ITEM_NAME",allItems);
  container.querySelectorAll("input[data-all]").forEach(cb=>{
    cb.addEventListener("change",e=>{
      const grp=e.target.dataset.all;
      container.querySelectorAll(`input[name='${grp}']`).forEach(i=>i.checked=e.target.checked);
      setTimeout(applyFilters,80);
    });
  });
  container.addEventListener("change",()=>setTimeout(applyFilters,120));
}

/* ---------- Apply filters + cascade + aggregation ---------- */
function applyFilters(){
  showOverlay();
  setTimeout(()=>{
    const selected={};
    document.querySelectorAll(".filter-box strong").forEach(h=>{
      const k=h.textContent.trim();
      selected[k]=[...document.querySelectorAll(`input[name='${k}']:checked`)].map(i=>i.value);
    });
    const selShow=selected["SHOW COLUMNS"]||[],selStates=selected["STATE"]||[],selParties=selected["PARTY_NAME"]||[],selItems=selected["ITEM_NAME"]||[];
    const fromISO=document.getElementById("dateFrom").value,toISO=document.getElementById("dateTo").value;
    const fromD=fromISO?new Date(fromISO+"T00:00:00"):null,toD=toISO?new Date(toISO+"T23:59:59"):null;
    const monthVal=document.getElementById("monthQuick").value;
    let preview=[...rawData];
    if(monthVal)preview=preview.filter(r=>r.invoice_month===monthVal);
    else if(fromD||toD)preview=preview.filter(r=>{const d=r.invoice_date_obj;if(!d)return false;if(fromD&&d<fromD)return false;if(toD&&d>toD)return false;return true;});
    if(selStates.length)preview=preview.filter(r=>selStates.includes(r.state));
    if(selParties.length)preview=preview.filter(r=>selParties.includes(r.party_name));
    if(selItems.length)preview=preview.filter(r=>selItems.includes(r.item_name));
    const validStates=[...new Set(preview.map(r=>r.state).filter(Boolean))].sort();
    const validParties=[...new Set(preview.map(r=>r.party_name).filter(Boolean))].sort();
    const validItems=[...new Set(preview.map(r=>r.item_name).filter(Boolean))].sort();
    document.querySelectorAll("input[name='STATE']").forEach(cb=>{const lbl=cb.closest("label");if(validStates.includes(cb.value)){lbl.style.display="";}else{lbl.style.display="none";cb.checked=false;}});
    const checkedParties=[...document.querySelectorAll("input[name='PARTY_NAME']:checked")].map(i=>i.value);
    const checkedItems=[...document.querySelectorAll("input[name='ITEM_NAME']:checked")].map(i=>i.value);
    document.querySelectorAll(".filter-box").forEach(box=>{const t=box.querySelector("strong")?.textContent.trim();if(t==="PARTY_NAME"){const d=box.querySelector(".options");d.innerHTML=validParties.map(v=>`<label><input type="checkbox" name="PARTY_NAME" value="${escapeHtml(v)}"> ${escapeHtml(v)}</label>`).join("");}if(t==="ITEM_NAME"){const d=box.querySelector(".options");d.innerHTML=validItems.map(v=>`<label><input type="checkbox" name="ITEM_NAME" value="${escapeHtml(v)}"> ${escapeHtml(v)}</label>`).join("");}});
    checkedParties.forEach(v=>{const el=document.querySelector(`input[name='PARTY_NAME'][value="${CSS.escape(v)}"]`);if(el)el.checked=true;});
    checkedItems.forEach(v=>{const el=document.querySelector(`input[name='ITEM_NAME'][value="${CSS.escape(v)}"]`);if(el)el.checked=true;});
    let filtered=[...rawData];
    if(monthVal)filtered=filtered.filter(r=>r.invoice_month===monthVal);
    else if(fromD||toD)filtered=filtered.filter(r=>{const d=r.invoice_date_obj;if(!d)return false;if(fromD&&d<fromD)return false;if(toD&&d>toD)return false;return true;});
    if(selStates.length)filtered=filtered.filter(r=>selStates.includes(r.state));
    const finalParties=[...document.querySelectorAll("input[name='PARTY_NAME']:checked")].map(i=>i.value);
    const finalItems=[...document.querySelectorAll("input[name='ITEM_NAME']:checked")].map(i=>i.value);
    if(finalParties.length)filtered=filtered.filter(r=>finalParties.includes(r.party_name));
    if(finalItems.length)filtered=filtered.filter(r=>finalItems.includes(r.item_name));
    let groupCols=selShow.length?selShow.slice():["STATE","PARTY_NAME","INVOICE_DATE","SUM_QUANTITY_CS"];
    groupCols=groupCols.map(c=>c==="INVOICE_DATE"?"invoice_date":c==="INVOICE_MONTH"?"invoice_month":c.startsWith("SUM_")?c:c.toLowerCase());
    const groupingKeys=groupCols.filter(k=>!k.startsWith("SUM_"));
    const effectiveGroups=groupingKeys.length?groupingKeys:["state","party_name","item_name"];
    const map=new Map();
    filtered.forEach(r=>{const key=effectiveGroups.map(k=>(r[k]??"").toString().trim()).join("|");if(!map.has(key)){map.set(key,{STATE:r.state,PARTY_NAME:r.party_name,ITEM_NAME:r.item_name,INVOICE_DATE:r.invoice_date,INVOICE_MONTH:r.invoice_month,SUM_QUANTITY_KG:r.quantity_kg,SUM_BILL_AMOUNT:r.bill_amount,SUM_QUANTITY_CS:r.quantity_cs});}else{const o=map.get(key);o.SUM_QUANTITY_KG+=r.quantity_kg;o.SUM_BILL_AMOUNT+=r.bill_amount;o.SUM_QUANTITY_CS+=r.quantity_cs;}});
    const rows=[...map.values()];
    const topKey=effectiveGroups[0]||"state";
    const groupMap=new Map();
    rows.forEach(r=>{const topVal=r[topKey.toUpperCase()]||r[topKey]||"";if(!groupMap.has(topVal))groupMap.set(topVal,[]);groupMap.get(topVal).push(r);});
    const numericCols=["SUM_QUANTITY_KG","SUM_BILL_AMOUNT","SUM_QUANTITY_CS"];
    let headerCols=selShow.length?selShow.slice():["STATE","PARTY_NAME","INVOICE_DATE","SUM_QUANTITY_CS"];
    numericCols.forEach(n=>{if(!headerCols.includes(n))headerCols.push(n);});
    const thead=document.getElementById("tableHead"),tbody=document.getElementById("tableBody"),tfoot=document.getElementById("tableFoot");
    thead.innerHTML="<tr>"+headerCols.map(h=>`<th>${escapeHtml(h.replace(/_/g,' '))}</th>`).join("")+"</tr>";
    let html="";
    groupMap.forEach((arr,grp)=>{arr.forEach(r=>{html+="<tr>"+headerCols.map(c=>c.startsWith("SUM_")?`<td>${(r[c]||0).toLocaleString()}</td>`:c==="INVOICE_MONTH"?`<td>${escapeHtml(r.INVOICE_MONTH||"")}</td>`:c==="INVOICE_DATE"?`<td>${escapeHtml(r.INVOICE_DATE||"")}</td>`:`<td>${escapeHtml(r[c]??"")}</td>`).join("")+"</tr>";});if(arr.length>=2){const sub=arr.reduce((a,x)=>{a.SUM_QUANTITY_KG+=toNum(x.SUM_QUANTITY_KG);a.SUM_BILL_AMOUNT+=toNum(x.SUM_BILL_AMOUNT);a.SUM_QUANTITY_CS+=toNum(x.SUM_QUANTITY_CS);return a;},{SUM_QUANTITY_KG:0,SUM_BILL_AMOUNT:0,SUM_QUANTITY_CS:0});html+=`<tr class="subtotal-row">`+headerCols.map((c,i)=>c==="SUM_QUANTITY_KG"?`<td>${sub.SUM_QUANTITY_KG.toLocaleString()}</td>`:c==="SUM_BILL_AMOUNT"?`<td>${sub.SUM_BILL_AMOUNT.toLocaleString()}</td>`:c==="SUM_QUANTITY_CS"?`<td>${sub.SUM_QUANTITY_CS.toLocaleString()}</td>`:i===0?`<td><b>Subtotal - ${escapeHtml(grp)}</b></td>`:`<td></td>`).join("")+`</tr>`;}});
    tbody.innerHTML=html||`<tr><td colspan="${headerCols.length}">No data</td></tr>`;
    const grand=rows.reduce((a,r)=>{a.SUM_QUANTITY_KG+=toNum(r.SUM_QUANTITY_KG);a.SUM_BILL_AMOUNT+=toNum(r.SUM_BILL_AMOUNT);a.SUM_QUANTITY_CS+=toNum(r.SUM_QUANTITY_CS);return a;},{SUM_QUANTITY_KG:0,SUM_BILL_AMOUNT:0,SUM_QUANTITY_CS:0});
    tfoot.innerHTML=`<tr class="grandtotal-row">`+headerCols.map((c,i)=>c==="SUM_QUANTITY_KG"?`<td>${grand.SUM_QUANTITY_KG.toLocaleString()}</td>`:c==="SUM_BILL_AMOUNT"?`<td>${grand.SUM_BILL_AMOUNT.toLocaleString()}</td>`:c==="SUM_QUANTITY_CS"?`<td>${grand.SUM_QUANTITY_CS.toLocaleString()}</td>`:i===0?`<td><b>GRAND TOTAL</b></td>`:`<td></td>`).join("")+`</tr>`;
    document.getElementById("recordsInfo").textContent=`Rows: ${rows.length}`;
    hideOverlay();
  },80);
}

/* ---------- Buttons ---------- */
document.getElementById("toggleFiltersBtn").addEventListener("click",()=>{
  const wrapper=document.getElementById("filtersWrapper");
  const btn=document.getElementById("toggleFiltersBtn");
  if(wrapper.style.display==="none"){wrapper.style.display="block";btn.textContent="Hide Filters";}
  else{wrapper.style.display="none";btn.textContent="Show Filters";}
});
document.getElementById("clearBtn").addEventListener("click",()=>{document.querySelectorAll("#filtersContainer input[type=checkbox]").forEach(cb=>cb.checked=false);document.getElementById("monthQuick").value="";const now=new Date();document.getElementById("dateFrom").value=formatDateInputISO(new Date(now.getFullYear(),now.getMonth(),1));document.getElementById("dateTo").value=formatDateInputISO(new Date(now.getFullYear(),now.getMonth()+1,0));buildFilters();applyFilters();});
document.getElementById("yesterdayBtn").addEventListener("click",()=>{const d=new Date();d.setDate(d.getDate()-1);document.getElementById("dateFrom").value=formatDateInputISO(d);document.getElementById("dateTo").value=formatDateInputISO(d);document.getElementById("monthQuick").value="";applyFilters();});
document.getElementById("dateFrom").addEventListener("change",()=>{document.getElementById("monthQuick").value="";applyFilters();});
document.getElementById("dateTo").addEventListener("change",()=>{document.getElementById("monthQuick").value="";applyFilters();});
document.getElementById("monthQuick").addEventListener("change",e=>{const val=e.target.value;if(!val){applyFilters();return;}const[mon,yr]=val.split(" ");const mIdx=new Date(`${mon} 1, ${yr}`).getMonth();const f=new Date(yr,mIdx,1),l=new Date(yr,mIdx+1,0);document.getElementById("dateFrom").value=formatDateInputISO(f);document.getElementById("dateTo").value=formatDateInputISO(l);applyFilters();});

/* ---------- Export ---------- */
document.getElementById("exportBtn").addEventListener("click",async()=>{try{showOverlay();const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet("Lighthouse");const rows=[...document.querySelectorAll("#dataTable tr")].map(tr=>[...tr.children].map(td=>td.innerText.trim()));rows.forEach((r,i)=>{const row=ws.addRow(r);if(i===0)row.font={bold:true};});ws.columns.forEach(c=>c.width=18);const buf=await wb.xlsx.writeBuffer();saveAs(new Blob([buf]),`lighthouse_export_${new Date().toISOString().slice(0,10)}.xlsx`);}catch(e){alert("Export failed: "+e.message);}finally{hideOverlay();}});

loadData();
</script>
</body>
</html>
