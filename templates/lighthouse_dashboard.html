<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>🌈 Lighthouse ERP Dashboard</title>

  <!-- jQuery + DataTables -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <link href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" rel="stylesheet" />
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #eef2f3, #dfe9f3);
      margin: 0; padding: 20px;
      color: #1e293b;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      background: linear-gradient(90deg, #2563eb, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    .dashboard-card {
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      backdrop-filter: blur(8px);
      margin-bottom: 20px;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }
    .dashboard-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0,0,0,0.08);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }

    .filter-group {
      flex: 1 1 220px;
      background: linear-gradient(145deg, #3b82f6, #2563eb);
      color: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.2), 0 3px 8px rgba(0,0,0,0.15);
    }

    .filter-group:nth-child(2n) {
      background: linear-gradient(145deg, #10b981, #059669);
    }
    .filter-group:nth-child(3n) {
      background: linear-gradient(145deg, #f59e0b, #d97706);
    }
    .filter-group:nth-child(4n) {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
    }

    .filter-group h4 {
      margin-top: 0;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      padding-bottom: 4px;
    }

    .filter-options {
      max-height: 160px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
    }

    .filter-options label {
      display: flex;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
      gap: 6px;
    }

    .filter-options input[type="checkbox"] {
      accent-color: #2563eb;
      cursor: pointer;
    }

    .filter-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px 0;
    }

    .filter-actions button {
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      transition: transform 0.15s;
    }
    .apply-btn { background: linear-gradient(90deg,#2563eb,#9333ea); }
    .reset-btn { background: linear-gradient(90deg,#f59e0b,#d97706); }
    .filter-actions button:hover { transform: scale(1.05); }

    #erpTable_wrapper {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    }

    table.dataTable {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: none;
    }

    table.dataTable thead {
      background: linear-gradient(90deg,#2563eb,#9333ea);
      color: white;
    }

    table.dataTable tbody tr:nth-child(odd) {
      background-color: #f9fafb;
    }
    table.dataTable tbody tr:hover {
      background-color: #e0f2fe;
      cursor: pointer;
    }

    .date-range {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    input[type="date"] {
      border: 1px solid #cbd5e1;
      padding: 4px 6px;
      border-radius: 6px;
    }

    #showColumnsContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      justify-content: center;
    }

    .col-toggle {
      accent-color: #9333ea;
    }
  </style>
</head>

<body>
  <h1>🌈 Lighthouse ERP Dashboard (Plant ➜ Depot / Direct)</h1>

  <div class="dashboard-card">
    <div class="filter-actions">
      <button class="apply-btn" id="applyAllFilters">Apply Filters</button>
      <button class="reset-btn" id="resetAll">Reset All</button>
    </div>

    <div class="date-range">
      <label>From:</label><input type="date" id="dateFrom">
      <label>To:</label><input type="date" id="dateTo">
    </div>

    <div id="showColumnsContainer"></div>

    <div class="filters">
      <div class="filter-group"><h4>State</h4><div id="stateOptions" class="filter-options"></div></div>
      <div class="filter-group"><h4>District</h4><div id="districtOptions" class="filter-options"></div></div>
      <div class="filter-group"><h4>Category</h4><div id="categoryOptions" class="filter-options"></div></div>
      <div class="filter-group"><h4>Customer</h4><div id="customerOptions" class="filter-options"></div></div>
      <div class="filter-group"><h4>Item</h4><div id="itemOptions" class="filter-options"></div></div>
      <div class="filter-group"><h4>Invoice Dates</h4><div id="dateCheckboxes" class="filter-options"></div></div>
    </div>
  </div>

  <table id="erpTable" class="display">
    <thead>
      <tr>
        <th>Invoice_Date</th>
        <th>State</th>
        <th>District</th>
        <th>Category</th>
        <th>Customer_Name</th>
        <th>Item_Name</th>
        <th>Rate</th>
        <th>Material_Amount</th>
        <th>Bill_Amount</th>
        <th>Total_Tax_Value_GST</th>
        <th>AQTYISSUED</th>
        <th>TCS_Amount</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const columns = [
      "invoice_date","state","district","category","customer_name","item_name",
      "rate","material_amount","bill_amount","total_tax_value_gst","aqtyissued","tcs_amount"
    ];
    let fullData = [];
    let table;

    const formatDate = (d) => {
      if (!d) return "";
      const dt = new Date(d);
      if (isNaN(dt)) return d;
      return dt.getDate().toString().padStart(2,'0') +
             (dt.getMonth()+1).toString().padStart(2,'0') +
             dt.getFullYear();
    };

    async function loadData() {
      const res = await axios.get("/get_data/lighthouse_sales");
      fullData = res.data.map(r => ({...r, invoice_date_display: formatDate(r.invoice_date)}));
      initTable();
      buildFilters();
    }

    function initTable() {
      if (table) table.destroy();
      table = $("#erpTable").DataTable({
        data: fullData,
        columns: columns.map(c => ({ data: c === "invoice_date" ? "invoice_date_display" : c, title: c })),
        pageLength: 25,
        scrollX: true
      });
      renderShowColumns();
    }

    function renderShowColumns() {
      const cont = document.getElementById("showColumnsContainer");
      cont.innerHTML = "";
      columns.forEach((col, i) => {
        const label = document.createElement("label");
        label.innerHTML = `<input type="checkbox" class="col-toggle" data-index="${i}" checked> ${col}`;
        cont.appendChild(label);
      });
      document.querySelectorAll(".col-toggle").forEach(c => {
        c.addEventListener("change", e => {
          table.column(e.target.dataset.index).visible(e.target.checked);
        });
      });
    }

    function buildFilters() {
      const unique = (key) => [...new Set(fullData.map(d => d[key]).filter(Boolean))].sort();
      fillFilter("stateOptions", unique("state"));
      fillFilter("districtOptions", unique("district"));
      fillFilter("categoryOptions", unique("category"));
      fillFilter("customerOptions", unique("customer_name"));
      fillFilter("itemOptions", unique("item_name"));
      fillFilter("dateCheckboxes", unique("invoice_date"), true);
    }

    function fillFilter(id, list, isDate=false) {
      const container = document.getElementById(id);
      container.innerHTML = list.map(v =>
        `<label><input type="checkbox" data-type="${id}" value="${v}"> ${isDate ? formatDate(v) : v}</label>`
      ).join("");
    }

    document.getElementById("applyAllFilters").addEventListener("click", () => {
      const state = checked("stateOptions");
      const district = checked("districtOptions");
      const cat = checked("categoryOptions");
      const cust = checked("customerOptions");
      const item = checked("itemOptions");
      const dateC = checked("dateCheckboxes");
      const from = document.getElementById("dateFrom").value;
      const to = document.getElementById("dateTo").value;

      let filtered = fullData.filter(r => {
        if (state.length && !state.includes(r.state)) return false;
        if (district.length && !district.includes(r.district)) return false;
        if (cat.length && !cat.includes(r.category)) return false;
        if (cust.length && !cust.includes(r.customer_name)) return false;
        if (item.length && !item.includes(r.item_name)) return false;
        if (dateC.length && !dateC.includes(r.invoice_date)) return false;
        if (from && new Date(r.invoice_date) < new Date(from)) return false;
        if (to && new Date(r.invoice_date) > new Date(to)) return false;
        return true;
      });

      table.clear().rows.add(filtered).draw();
    });

    document.getElementById("resetAll").addEventListener("click", () => {
      document.querySelectorAll("input[type=checkbox]").forEach(c => c.checked = false);
      document.getElementById("dateFrom").value = "";
      document.getElementById("dateTo").value = "";
      table.clear().rows.add(fullData).draw();
    });

    const checked = (id) => [...document.querySelectorAll(`#${id} input:checked`)].map(i => i.value);

    loadData();
  </script>
</body>
</html>
