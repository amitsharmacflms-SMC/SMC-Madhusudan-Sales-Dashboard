<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Lighthouse Sales Dashboard</title>

  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <!-- TomSelect for multi-selects -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

  <!-- Excel export + axios -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    body { font-family: "Inter", system-ui, sans-serif; background:#f6f9fc; color:#111827; margin:0; }
    header { display:flex; justify-content:space-between; align-items:center;
      background:linear-gradient(90deg,#2563eb,#4f46e5); color:#fff; padding:10px 16px; box-shadow:0 3px 12px rgba(0,0,0,.15); }
    header img{height:42px} header h1{font-size:1.05rem;margin-left:8px;font-weight:800}

    .toolbar button{border:none;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer}
    .btn-blue{background:#fff;color:#1e3a8a} .btn-gray{background:#e5e7eb;color:#111827}

    main{max-width:1500px;margin:16px auto;padding:0 12px}

    .controls {display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    .controls input[type=date], .controls select {padding:6px;border-radius:6px;border:1px solid #e6eef9;background:#fff}

    #filtersContainer {display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px}
    .filter-box {
      background:linear-gradient(180deg,#fff,#f0f4ff);
      border:2px solid #1e3a8a;border-radius:12px;padding:10px 12px;flex:1 1 220px;
      box-shadow:0 4px 12px rgba(30,58,138,0.12);transition:transform .18s ease;
    }
    .filter-box:hover{transform:translateY(-2px)}
    .filter-box strong{display:block;text-align:center;color:#1e3a8a;font-weight:800;margin-bottom:6px;border-bottom:2px solid #c7d2fe;padding-bottom:4px}
    .filter-box .options{max-height:220px;overflow:auto;padding-top:6px}
    .filter-box label{display:inline-block;background:#f8fafc;border-radius:6px;padding:4px 6px;margin:3px;cursor:pointer;font-weight:600}

    .table-wrapper{background:#fff;border-radius:10px;box-shadow:0 5px 20px rgba(4,8,15,0.06);overflow:auto;max-height:74vh}
    table{border-collapse:collapse;width:100%;min-width:1100px}
    th,td{border:1.5px solid #9ca3af;padding:4px 4px;text-align:center;font-weight:700;height:20px;line-height:1.2}
    thead th{position:sticky;top:0;background:linear-gradient(90deg,#e0e7ff,#c7d2fe);color:#1e3a8a;z-index:5}
    tr.subtotal-row td{background:#fff7cc;font-weight:800} tr.grandtotal-row td{background:#bae6fd;font-weight:900}

    .overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;color:#1e3a8a;z-index:2000}
    .overlay.show{display:flex}

    @media(max-width:768px){ .filter-box{flex:1 1 100%} th,td{font-size:.8rem} }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center">
      <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo">
      <h1>SMC Lighthouse Sales</h1>
    </div>
    <div class="toolbar">
      <button id="exportBtn" class="btn-blue">Export</button>
      <button id="clearBtn" class="btn-gray">Clear</button>
      <button id="toggleFiltersBtn" class="btn-gray">Hide Filters</button>
    </div>
  </header>

  <main>
    <div class="controls">
      From: <input type="date" id="dateFrom">
      To: <input type="date" id="dateTo">
      <button id="yesterdayBtn" class="btn-gray">Yesterday</button>
      Invoice Month: <select id="monthQuick"><option value="">--All--</option></select>
      <small id="recordsInfo" style="margin-left:auto;color:#6b7280"></small>
    </div>

    <div id="filtersWrapper">
      <div id="filtersContainer"></div>
    </div>

    <div class="table-wrapper">
      <table id="dataTable" aria-label="Lighthouse">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
  </main>

  <div id="overlay" class="overlay">Processing...</div>





<script>
/* ---------- JS for drilldown + TomSelect ---------- */

const API_URL = "/get_data/lighthouse_sales";
let rawData = [];
let partyTS = null;
let itemTS = null;

/* --- date helpers --- */
function parseDateFlexible(s){
  if(!s) return null;
  s=String(s).trim();
  if(/^\d{8}$/.test(s)){const d=parseInt(s.slice(0,2)),m=parseInt(s.slice(2,4)),y=parseInt(s.slice(4,8));return new Date(y,m-1,d);}
  let mMatch=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);if(mMatch)return new Date(mMatch[3],mMatch[2]-1,mMatch[1]);
  mMatch=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(mMatch)return new Date(mMatch[1],mMatch[2]-1,mMatch[3]);
  const d=new Date(s);return isNaN(d)?null:d;
}
function formatDisplayDate(d){const dt=typeof d==="string"?parseDateFlexible(d):d;if(!dt)return"";return `${String(dt.getDate()).padStart(2,'0')}${String(dt.getMonth()+1).padStart(2,'0')}${dt.getFullYear()}`;}
function formatDateInputISO(d){const dt=typeof d==="string"?parseDateFlexible(d):d;if(!dt)return"";return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}
function invoiceMonthLabel(s){const dt=parseDateFlexible(s);return dt?dt.toLocaleString('default',{month:'short',year:'numeric'}):"";}
function toNum(v){return Number(v)||0;}
function showOverlay(){document.getElementById("overlay").classList.add("show");}
function hideOverlay(){document.getElementById("overlay").classList.remove("show");}

/* --- load data --- */
async function loadData(){
  showOverlay();
  try{
    const res=await axios.get(API_URL);
    rawData=(Array.isArray(res.data)?res.data:[]).map(r=>{
      const raw=(r.invoice_date||r.INVOICE_DATE||"").trim();
      const dt=parseDateFlexible(raw);
      return {
        state:(r.state||r.STATE||"").trim(),
        party_name:(r.party_name||r.PARTY_NAME||"").trim(),
        item_name:(r.item_name||r.ITEM_NAME||"").trim(),
        invoice_date:formatDisplayDate(dt),
        invoice_date_obj:dt,
        invoice_month:invoiceMonthLabel(raw),
        quantity_cs:toNum(r.quantity_cs||r.Quantity_CS||0),
        quantity_kg:toNum(r.quantity_kg||r.Quantity_KG||0),
        bill_amount:toNum(r.bill_amount||r.Bill_Amount||0)
      };
    });

    const months=[...new Set(rawData.map(r=>r.invoice_month).filter(Boolean))];
    const mq=document.getElementById("monthQuick");
    mq.innerHTML=`<option value="">--All--</option>`+months.map(m=>`<option>${m}</option>`).join("");
    const now=new Date(),f=new Date(now.getFullYear(),now.getMonth(),1),l=new Date(now.getFullYear(),now.getMonth()+1,0);
    document.getElementById("dateFrom").value=formatDateInputISO(f);
    document.getElementById("dateTo").value=formatDateInputISO(l);
    buildFilters();
    applyFilters();
  }catch(e){console.error(e);}finally{hideOverlay();}
}

/* --- build filters (removed TOTAL) --- */
function buildFilters(){
  const fc=document.getElementById("filtersContainer");fc.innerHTML="";
  const boxes=[
    {key:"SHOW COLUMNS",vals:["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE","INVOICE_MONTH","SUM_QUANTITY_KG","SUM_BILL_AMOUNT","SUM_QUANTITY_CS"]},
    {key:"STATE",vals:[...new Set(rawData.map(r=>r.state))].filter(Boolean).sort()}
  ];
  boxes.forEach(b=>{
    const div=document.createElement("div");div.className="filter-box";
    div.innerHTML=`<strong>${b.key}</strong>
      <label><input type="checkbox" data-all="${b.key}"> All</label>
      <div class="options">${b.vals.map(v=>`<label><input type="checkbox" name="${b.key}" value="${v}">${v}</label>`).join("")}</div>`;
    fc.appendChild(div);
  });

  // PARTY_NAME
  const pb=document.createElement("div");pb.className="filter-box";
  pb.innerHTML=`<strong>PARTY_NAME</strong><select id="partySelect" multiple placeholder="Select Parties"></select>`;
  fc.appendChild(pb);
  const parties=[...new Set(rawData.map(r=>r.party_name))].filter(Boolean).sort();
  const ps=document.getElementById("partySelect");
  parties.forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p;ps.appendChild(o);});
  if(partyTS){partyTS.destroy();}
  partyTS=new TomSelect(ps,{plugins:['remove_button'],maxOptions:1000,create:false});

  // ITEM_NAME
  const ib=document.createElement("div");ib.className="filter-box";
  ib.innerHTML=`<strong>ITEM_NAME</strong><select id="itemSelect" multiple placeholder="Select Items"></select>`;
  fc.appendChild(ib);
  const items=[...new Set(rawData.map(r=>r.item_name))].filter(Boolean).sort();
  const is=document.getElementById("itemSelect");
  items.forEach(i=>{const o=document.createElement("option");o.value=i;o.textContent=i;is.appendChild(o);});
  if(itemTS){itemTS.destroy();}
  itemTS=new TomSelect(is,{plugins:['remove_button'],maxOptions:1000,create:false});

  // event wiring
  fc.querySelectorAll("input[data-all]").forEach(cb=>{
    cb.addEventListener("change",e=>{
      const grp=e.target.dataset.all;
      fc.querySelectorAll(`input[name='${grp}']`).forEach(i=>i.checked=e.target.checked);
      applyFilters();
    });
  });
  fc.addEventListener("change",()=>setTimeout(applyFilters,120));
  partyTS.on('change',applyFilters);
  itemTS.on('change',applyFilters);
}

/* --- apply filters (drilldown + cascade) --- */
function applyFilters(){
  showOverlay();
  setTimeout(()=>{
    const sel={};
    document.querySelectorAll(".filter-box strong").forEach(h=>{
      const k=h.textContent.trim();
      sel[k]=[...document.querySelectorAll(`input[name='${k}']:checked`)].map(i=>i.value);
    });
    const sStates=sel["STATE"]||[],sCols=sel["SHOW COLUMNS"]||[];
    const sParties=partyTS.getValue()||[],sItems=itemTS.getValue()||[];

    const fromIso=document.getElementById("dateFrom").value,toIso=document.getElementById("dateTo").value;
    const from=fromIso?new Date(fromIso+"T00:00:00"):null,to=toIso?new Date(toIso+"T23:59:59"):null;
    const mSel=document.getElementById("monthQuick").value;

    let filtered=[...rawData];
    if(mSel)filtered=filtered.filter(r=>r.invoice_month===mSel);
    else if(from||to)filtered=filtered.filter(r=>{
      const d=r.invoice_date_obj;if(!d)return false;
      if(from&&d<from)return false;if(to&&d>to)return false;return true;
    });
    if(sStates.length)filtered=filtered.filter(r=>sStates.includes(r.state));
    if(sParties.length)filtered=filtered.filter(r=>sParties.includes(r.party_name));
    if(sItems.length)filtered=filtered.filter(r=>sItems.includes(r.item_name));

    // drill-down cascade
    const validStates=[...new Set(filtered.map(r=>r.state))];
    document.querySelectorAll("input[name='STATE']").forEach(cb=>{
      cb.closest("label").style.display=validStates.includes(cb.value)?"":"none";
      if(!validStates.includes(cb.value))cb.checked=false;
    });
    const validParties=[...new Set(filtered.map(r=>r.party_name))].sort();
    const validItems=[...new Set(filtered.map(r=>r.item_name))].sort();

    const keepP=partyTS.getValue().filter(v=>validParties.includes(v));
    partyTS.clearOptions();validParties.forEach(p=>partyTS.addOption({value:p,text:p}));partyTS.clear(true);if(keepP.length)partyTS.setValue(keepP);
    const keepI=itemTS.getValue().filter(v=>validItems.includes(v));
    itemTS.clearOptions();validItems.forEach(i=>itemTS.addOption({value:i,text:i}));itemTS.clear(true);if(keepI.length)itemTS.setValue(keepI);

    // aggregate & render
    const map=new Map();
    filtered.forEach(r=>{
      const key=[r.state,r.party_name,r.item_name,r.invoice_date].join("|");
      if(!map.has(key)){
        map.set(key,{STATE:r.state,PARTY_NAME:r.party_name,ITEM_NAME:r.item_name,INVOICE_DATE:r.invoice_date,
          SUM_QUANTITY_KG:r.quantity_kg,SUM_BILL_AMOUNT:r.bill_amount,SUM_QUANTITY_CS:r.quantity_cs});
      }else{
        const o=map.get(key);o.SUM_QUANTITY_KG+=r.quantity_kg;o.SUM_BILL_AMOUNT+=r.bill_amount;o.SUM_QUANTITY_CS+=r.quantity_cs;
      }
    });
    const rows=[...map.values()];
    const showCols=(sCols.length?sCols:["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE","SUM_QUANTITY_CS"]);
    const thead=document.getElementById("tableHead"),tbody=document.getElementById("tableBody"),tfoot=document.getElementById("tableFoot");
    thead.innerHTML="<tr>"+showCols.map(c=>`<th>${c.replace(/_/g," ")}</th>`).join("")+"</tr>";
    tbody.innerHTML=rows.map(r=>"<tr>"+showCols.map(c=>{
      if(c.startsWith("SUM_"))return `<td>${(r[c]||0).toLocaleString()}</td>`;
      return `<td>${r[c]||""}</td>`;
    }).join("")+"</tr>").join("")||( "<tr><td colspan='"+showCols.length+"'>No data</td></tr>");
    const total=rows.reduce((a,r)=>{a.cs+=r.SUM_QUANTITY_CS||0;a.kg+=r.SUM_QUANTITY_KG||0;a.amt+=r.SUM_BILL_AMOUNT||0;return a;},{cs:0,kg:0,amt:0});
    tfoot.innerHTML=`<tr class='grandtotal-row'><td><b>GRAND TOTAL</b></td><td colspan='${showCols.length-3}'></td>
      <td>${total.kg.toLocaleString()}</td><td>${total.amt.toLocaleString()}</td><td>${total.cs.toLocaleString()}</td></tr>`;
    document.getElementById("recordsInfo").textContent=`Rows: ${rows.length}`;
  },60);
  hideOverlay();
}

/* --- buttons --- */
document.getElementById("toggleFiltersBtn").addEventListener("click",()=>{
  const fw=document.getElementById("filtersWrapper");
  fw.style.display=fw.style.display==="none"?"block":"none";
});
document.getElementById("clearBtn").addEventListener("click",()=>{
  document.querySelectorAll("#filtersContainer input[type=checkbox]").forEach(cb=>cb.checked=false);
  if(partyTS){partyTS.clear();partyTS.clearOptions();const p=[...new Set(rawData.map(r=>r.party_name))];p.forEach(v=>partyTS.addOption({value:v,text:v}));}
  if(itemTS){itemTS.clear();itemTS.clearOptions();const i=[...new Set(rawData.map(r=>r.item_name))];i.forEach(v=>itemTS.addOption({value:v,text:v}));}
  applyFilters();
});
document.getElementById("yesterdayBtn").addEventListener("click",()=>{
  const d=new Date();d.setDate(d.getDate()-1);
  document.getElementById("dateFrom").value=formatDateInputISO(d);
  document.getElementById("dateTo").value=formatDateInputISO(d);
  document.getElementById("monthQuick").value="";
  applyFilters();
});
document.getElementById("dateFrom").addEventListener("change",applyFilters);
document.getElementById("dateTo").addEventListener("change",applyFilters);
document.getElementById("monthQuick").addEventListener("change",applyFilters);

/* --- export --- */
document.getElementById("exportBtn").addEventListener("click",async()=>{
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Lighthouse");
  const rows=[...document.querySelectorAll("#dataTable tr")].map(tr=>[...tr.children].map(td=>td.innerText));
  rows.forEach((r,i)=>{const row=ws.addRow(r);if(i===0)row.font={bold:true};});
  ws.columns.forEach(c=>c.width=16);
  const buf=await wb.xlsx.writeBuffer();saveAs(new Blob([buf]),`lighthouse_${new Date().toISOString().slice(0,10)}.xlsx`);
});

/* --- init --- */
loadData();
</script>
</body>
</html>
