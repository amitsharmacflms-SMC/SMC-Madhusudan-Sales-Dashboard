<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Lighthouse Sales Dashboard</title>

  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <!-- ✅ TomSelect for multi-select -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

  <!-- ✅ Excel Export + Axios -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    body { font-family: "Inter", system-ui, sans-serif; background:#f6f9fc; color:#111827; margin:0; }

    header {
      display:flex; justify-content:space-between; align-items:center;
      background:linear-gradient(90deg,#2563eb,#4f46e5);
      color:#fff; padding:10px 16px; box-shadow:0 3px 12px rgba(0,0,0,.15);
    }
    header img { height:42px; }
    header h1 { font-size:1.1rem; font-weight:800; margin-left:10px; }
    .toolbar button { border:none; border-radius:6px; padding:6px 10px; cursor:pointer; font-weight:700; }
    .btn-blue { background:#fff; color:#1e3a8a; }
    .btn-gray { background:#e5e7eb; color:#111827; }

    main { max-width:1500px; margin:16px auto; padding:0 12px; }

    /* Filters */
    #filtersContainer { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:12px; }
    .filter-box {
      background:linear-gradient(180deg,#ffffff,#f0f4ff);
      border:2px solid #1e3a8a; border-radius:12px; padding:10px 12px;
      flex:1 1 220px; box-shadow:0 4px 12px rgba(30,58,138,0.15); transition:transform 0.2s ease;
    }
    .filter-box:hover { transform:translateY(-2px); }
    .filter-box strong {
      display:block; text-align:center; color:#1e3a8a; font-weight:800; margin-bottom:6px;
      border-bottom:2px solid #c7d2fe; padding-bottom:4px;
    }
    .filter-box label { display:inline-block; background:#f8fafc; border-radius:6px;
      padding:4px 6px; margin:3px; cursor:pointer; font-size:13px; font-weight:600;
    }

    /* Table Styling */
    .table-wrapper { background:#fff; border-radius:10px;
      box-shadow:0 5px 20px rgba(4,8,15,0.06); overflow:auto; max-height:74vh;
    }
    table { border-collapse:collapse; width:100%; min-width:1100px; }
    th,td {
      border:1.5px solid #9ca3af; padding:4px 4px; text-align:center;
      font-weight:700; height:20px; line-height:1.2;
    }
    thead th {
      position:sticky; top:0; background:linear-gradient(90deg,#e0e7ff,#c7d2fe);
      color:#1e3a8a; z-index:5;
    }
    tr.subtotal-row td { background:#fff7cc; font-weight:800; }
    tr.grandtotal-row td { background:#bae6fd; font-weight:900; }

    .overlay {
      position:fixed; inset:0; background:rgba(255,255,255,.7);
      display:none; align-items:center; justify-content:center;
      font-weight:800; font-size:1.1rem; color:#1e3a8a; z-index:2000;
    }
    .overlay.show { display:flex; }

    @media(max-width:768px){ .filter-box{flex:1 1 100%;} th,td{font-size:.8rem;} }
  </style>
</head>

<body>
  <header>
    <div style="display:flex;align-items:center">
      <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo">
      <h1>SMC Lighthouse Sales Dashboard</h1>
    </div>
    <div class="toolbar">
      <button id="exportBtn" class="btn-blue">Export</button>
      <button id="clearBtn" class="btn-gray">Clear</button>
      <button id="toggleFiltersBtn" class="btn-gray">Hide Filters</button>
    </div>
  </header>

  <main>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;">
      From: <input type="date" id="dateFrom">
      To: <input type="date" id="dateTo">
      <button id="yesterdayBtn" class="btn-gray">Yesterday</button>
      Invoice Month:
      <select id="monthQuick"><option value="">--All--</option></select>
      <small id="recordsInfo" style="margin-left:auto;color:#6b7280"></small>
    </div>

    <div id="filtersWrapper"><div id="filtersContainer"></div></div>

    <div class="table-wrapper">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
  </main>

  <div id="overlay" class="overlay">Processing...</div>

<script>
const API_URL="/get_data/lighthouse_sales";
let rawData=[];

/* ✅ Force correct parsing: DD-MM-YYYY format everywhere */
function parseDate(s){
  if(!s)return null;
  const parts=s.split(/[-/]/);
  if(parts.length===3){
    const [day,month,year]=parts.map(Number);
    return new Date(year,month-1,day);
  }
  const d=new Date(s);
  return isNaN(d)?null:d;
}

/* ✅ Format for display: DDMMYYYY (no dash) */
function formatDate(d){
  const dateObj=typeof d==="string"?parseDate(d):d;
  if(!dateObj)return"";
  return `${String(dateObj.getDate()).padStart(2,"0")}${String(dateObj.getMonth()+1).padStart(2,"0")}${dateObj.getFullYear()}`;
}

/* ✅ For <input type="date"> — always ISO (yyyy-MM-dd) */
function formatDateInput(d){
  const dateObj=typeof d==="string"?parseDate(d):d;
  if(!dateObj)return"";
  return `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,"0")}-${String(dateObj.getDate()).padStart(2,"0")}`;
}

function toNum(v){return Number(v)||0;}
function invoiceMonth(s){const d=parseDate(s);if(!d)return"";return d.toLocaleString('default',{month:'short',year:'numeric'});}
function showOverlay(){document.getElementById('overlay').classList.add('show');}
function hideOverlay(){document.getElementById('overlay').classList.remove('show');}

/* ---------------- Load Data ---------------- */
async function loadData(){
  showOverlay();
  const res=await axios.get(API_URL);
  rawData=res.data.map(r=>({
    state:r.state, party_name:r.party_name, item_name:r.item_name,
    invoice_date:formatDate(r.invoice_date),  // formatted to DDMMYYYY
    invoice_month:invoiceMonth(r.invoice_date),
    quantity_kg:toNum(r.quantity_kg), bill_amount:toNum(r.bill_amount), quantity_cs:toNum(r.quantity_cs)
  }));

  const months=[...new Set(rawData.map(r=>r.invoice_month).filter(Boolean))];
  const sel=document.getElementById("monthQuick");
  sel.innerHTML=`<option value="">--All--</option>`+months.map(m=>`<option value="${m}">${m}</option>`).join("");

  const now=new Date(), first=new Date(now.getFullYear(),now.getMonth(),1), last=new Date(now.getFullYear(),now.getMonth()+1,0);
  const curMonthLabel=now.toLocaleString('default',{month:'short',year:'numeric'});
  if(months.includes(curMonthLabel))sel.value=curMonthLabel;

  document.getElementById("dateFrom").value=formatDateInput(first);
  document.getElementById("dateTo").value=formatDateInput(last);

  buildFilters(); applyFilters(); hideOverlay();
}

/* ---------------- Build Filters ---------------- */
function buildFilters(){
  const fc=document.getElementById("filtersContainer");
  fc.innerHTML="";
  const filters=[
    {key:"SHOW COLUMNS",vals:["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE","INVOICE_MONTH","SUM_QUANTITY_KG","SUM_BILL_AMOUNT","SUM_QUANTITY_CS"]},
    {key:"STATE",vals:[...new Set(rawData.map(r=>r.state))].filter(Boolean).sort()},
    {key:"PARTY_NAME",vals:[...new Set(rawData.map(r=>r.party_name))].filter(Boolean).sort()},
    {key:"TOTAL",vals:["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE","INVOICE_MONTH"]}
  ];
  filters.forEach(f=>{
    const box=document.createElement("div");
    box.className="filter-box";
    box.innerHTML=`<strong>${f.key}</strong>
      <label><input type="checkbox" data-all="${f.key}"> All</label>
      <div class="options">${f.vals.map(v=>`<label><input type="checkbox" name="${f.key}" value="${v}"> ${v}</label>`).join("")}</div>`;
    fc.appendChild(box);
  });

  const itemBox=document.createElement("div");
  itemBox.className="filter-box";
  itemBox.innerHTML=`<strong>ITEM_NAME</strong><select id="itemSelect" multiple placeholder="Select Items"></select>`;
  fc.appendChild(itemBox);
  const items=[...new Set(rawData.map(r=>r.item_name))].filter(Boolean).sort();
  const select=document.getElementById("itemSelect");
  items.forEach(i=>{const o=document.createElement("option");o.value=i;o.textContent=i;select.appendChild(o);});
  new TomSelect(select,{plugins:['remove_button'],maxOptions:500,create:false});

  fc.querySelectorAll("input[data-all]").forEach(cb=>{
    cb.addEventListener("change",e=>{
      const grp=e.target.dataset.all;
      fc.querySelectorAll(`input[name='${grp}']`).forEach(i=>i.checked=e.target.checked);
      applyFilters();
    });
  });
  fc.addEventListener("change",()=>setTimeout(applyFilters,200));
}

/* ---------------- Apply Filters (Smart Cascade) ---------------- */
function applyFilters(){
  showOverlay();
  setTimeout(()=>{
    const s={};
    document.querySelectorAll(".filter-box strong").forEach(st=>{
      const t=st.textContent.trim();
      s[t]=[...document.querySelectorAll(`input[name='${t}']:checked`)].map(i=>i.value);
    });
    s.ITEM_NAME=Array.from(document.getElementById("itemSelect")?.options||[]).filter(o=>o.selected).map(o=>o.value);

    const from=parseDate(document.getElementById("dateFrom").value);
    const to=parseDate(document.getElementById("dateTo").value);
    const monthSel=document.getElementById("monthQuick").value;
    let f=[...rawData];
    if(monthSel)f=f.filter(r=>r.invoice_month===monthSel);
    else if(from||to)f=f.filter(r=>{
      const d=parseDate(r.invoice_date);
      if(!d)return false;
      if(from&&d<from)return false;
      if(to&&d>to)return false;
      return true;
    });

    ["STATE","PARTY_NAME"].forEach(k=>{const vals=s[k]||[];if(vals.length)f=f.filter(r=>vals.includes(r[k.toLowerCase()]));});
    if(s.ITEM_NAME.length)f=f.filter(r=>s.ITEM_NAME.includes(r.item_name));

    const totals=s["TOTAL"]||[];
    let groupKeys=[];
    if(totals.length){
      totals.forEach(t=>{
        if(t==="INVOICE_MONTH")groupKeys.push("invoice_month");
        else if(t==="INVOICE_DATE")groupKeys.push("invoice_date");
        else groupKeys.push(t.toLowerCase());
      });
    } else groupKeys=["state","party_name","item_name"];

    const map=new Map();
    f.forEach(r=>{
      const key=groupKeys.map(k=>r[k]||"").join("|");
      if(!map.has(key)){
        map.set(key,{STATE:r.state,PARTY_NAME:r.party_name,ITEM_NAME:r.item_name,INVOICE_DATE:r.invoice_date,INVOICE_MONTH:r.invoice_month,
          SUM_QUANTITY_KG:r.quantity_kg,SUM_BILL_AMOUNT:r.bill_amount,SUM_QUANTITY_CS:r.quantity_cs});
      } else {
        const o=map.get(key);
        o.SUM_QUANTITY_KG+=r.quantity_kg;o.SUM_BILL_AMOUNT+=r.bill_amount;o.SUM_QUANTITY_CS+=r.quantity_cs;
      }
    });
    const rows=[...map.values()];

    const subtotalKey=groupKeys[0]||"state";
    const groupMap=new Map();
    rows.forEach(r=>{
      const top=r[subtotalKey.toUpperCase()]||r[subtotalKey]||"";
      if(!groupMap.has(top))groupMap.set(top,[]);
      groupMap.get(top).push(r);
    });

    const defaultShow=["STATE","PARTY_NAME","ITEM_NAME","SUM_QUANTITY_KG","SUM_QUANTITY_CS"];
    const show=s["SHOW COLUMNS"].length?s["SHOW COLUMNS"]:defaultShow;
    const head=document.getElementById("tableHead"),body=document.getElementById("tableBody"),foot=document.getElementById("tableFoot");
    head.innerHTML="<tr>"+show.map(c=>`<th>${c.replace(/_/g,' ')}</th>`).join("")+"</tr>";

    let html="";
    groupMap.forEach((arr,top)=>{
      arr.forEach(r=>{
        html+="<tr>"+show.map(c=>{
          if(c.includes("SUM_"))return`<td>${(r[c]||0).toLocaleString()}</td>`;
          if(c==="INVOICE_MONTH")return`<td>${r.INVOICE_MONTH}</td>`;
          if(c==="INVOICE_DATE")return`<td>${r.INVOICE_DATE}</td>`;
          return`<td>${r[c]}</td>`;
        }).join("")+"</tr>";
      });
      const sub=arr.reduce((a,b)=>{a.SUM_QUANTITY_KG+=b.SUM_QUANTITY_KG;a.SUM_BILL_AMOUNT+=b.SUM_BILL_AMOUNT;a.SUM_QUANTITY_CS+=b.SUM_QUANTITY_CS;return a;},{SUM_QUANTITY_KG:0,SUM_BILL_AMOUNT:0,SUM_QUANTITY_CS:0});
      html+=`<tr class="subtotal-row">`+show.map((c,i)=>{
        if(c==="SUM_QUANTITY_KG")return`<td>${sub.SUM_QUANTITY_KG.toLocaleString()}</td>`;
        if(c==="SUM_BILL_AMOUNT")return`<td>${sub.SUM_BILL_AMOUNT.toLocaleString()}</td>`;
        if(c==="SUM_QUANTITY_CS")return`<td>${sub.SUM_QUANTITY_CS.toLocaleString()}</td>`;
        return i===0?`<td><b>Subtotal - ${top}</b></td>`:`<td></td>`;
      }).join("")+`</tr>`;
    });

    const grand={SUM_QUANTITY_KG:0,SUM_BILL_AMOUNT:0,SUM_QUANTITY_CS:0};
    rows.forEach(r=>{grand.SUM_QUANTITY_KG+=r.SUM_QUANTITY_KG;grand.SUM_BILL_AMOUNT+=r.SUM_BILL_AMOUNT;grand.SUM_QUANTITY_CS+=r.SUM_QUANTITY_CS;});
    const grandHtml="<tr class='grandtotal-row'>"+show.map((c,i)=>{
      if(c==="SUM_QUANTITY_KG")return`<td>${grand.SUM_QUANTITY_KG.toLocaleString()}</td>`;
      if(c==="SUM_BILL_AMOUNT")return`<td>${grand.SUM_BILL_AMOUNT.toLocaleString()}</td>`;
      if(c==="SUM_QUANTITY_CS")return`<td>${grand.SUM_QUANTITY_CS.toLocaleString()}</td>`;
      return i===0?`<td><b>GRAND TOTAL</b></td>`:`<td></td>`;
    }).join("")+"</tr>";

    body.innerHTML=html;foot.innerHTML=grandHtml;
    document.getElementById("recordsInfo").textContent=`Rows: ${rows.length}`;
    hideOverlay();
  },100);
}

/* Buttons */
document.getElementById("toggleFiltersBtn").addEventListener("click",()=>{
  const fw=document.getElementById("filtersWrapper");
  fw.style.display=fw.style.display==="none"?"block":"none";
});
document.getElementById("clearBtn").addEventListener("click",()=>loadData());
document.getElementById("yesterdayBtn").addEventListener("click",()=>{
  const d=new Date();d.setDate(d.getDate()-1);
  const iso=d.toISOString().slice(0,10);
  document.getElementById("dateFrom").value=iso;
  document.getElementById("dateTo").value=iso;
  document.getElementById("monthQuick").value="";
  applyFilters();
});

/* ✅ Sync From–To when Month changes */
document.getElementById("monthQuick").addEventListener("change",e=>{
  const val=e.target.value;
  if(!val){applyFilters();return;}
  const [mon,yr]=val.split(" ");
  const monthIdx=new Date(`${mon} 1, ${yr}`).getMonth();
  const first=new Date(yr,monthIdx,1);
  const last=new Date(yr,monthIdx+1,0);
  document.getElementById("dateFrom").value=formatDateInput(first);
  document.getElementById("dateTo").value=formatDateInput(last);
  applyFilters();
});

/* Export */
document.getElementById("exportBtn").addEventListener("click",async()=>{
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet("Lighthouse");
  const rows=[...document.querySelectorAll("#dataTable tr")].map(tr=>[...tr.children].map(td=>td.innerText));
  rows.forEach((r,i)=>{const row=ws.addRow(r);if(i===0)row.font={bold:true};});
  ws.columns.forEach(c=>c.width=16);
  const buf=await wb.xlsx.writeBuffer();
  saveAs(new Blob([buf]),`lighthouse_${new Date().toISOString().slice(0,10)}.xlsx`);
});

/* Init */
loadData();
</script>
</body>
</html>
