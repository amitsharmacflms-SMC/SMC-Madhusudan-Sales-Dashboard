<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Lighthouse Sales Dashboard</title>

  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <!-- TomSelect for multi-selects -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

  <!-- Excel export + axios -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    body { font-family: "Inter", system-ui, sans-serif; background:#f6f9fc; color:#111827; margin:0; }
    header { display:flex; justify-content:space-between; align-items:center;
      background:linear-gradient(90deg,#2563eb,#4f46e5); color:#fff; padding:10px 16px; box-shadow:0 3px 12px rgba(0,0,0,.15); }
    header img{height:42px} header h1{font-size:1.05rem;margin-left:8px;font-weight:800}

    .toolbar button{border:none;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer}
    .btn-blue{background:#fff;color:#1e3a8a} .btn-gray{background:#e5e7eb;color:#111827}

    main{max-width:1500px;margin:16px auto;padding:0 12px}

    .controls {display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    .controls input[type=date], .controls select {padding:6px;border-radius:6px;border:1px solid #e6eef9;background:#fff}

    #filtersContainer {display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px}
    .filter-box {
      background:linear-gradient(180deg,#fff,#f0f4ff);
      border:2px solid #1e3a8a;border-radius:12px;padding:10px 12px;flex:1 1 220px;
      box-shadow:0 4px 12px rgba(30,58,138,0.12);transition:transform .18s ease;
    }
    .filter-box:hover{transform:translateY(-2px)}
    .filter-box strong{display:block;text-align:center;color:#1e3a8a;font-weight:800;margin-bottom:6px;border-bottom:2px solid #c7d2fe;padding-bottom:4px}
    .filter-box .options{max-height:220px;overflow:auto;padding-top:6px}
    .filter-box label{display:inline-block;background:#f8fafc;border-radius:6px;padding:4px 6px;margin:3px;cursor:pointer;font-weight:600}

    .table-wrapper{background:#fff;border-radius:10px;box-shadow:0 5px 20px rgba(4,8,15,0.06);overflow:auto;max-height:74vh}
    table{border-collapse:collapse;width:100%;min-width:1100px}
    th,td{border:1.5px solid #9ca3af;padding:4px 4px;text-align:center;font-weight:700;height:20px;line-height:1.2}
    thead th{position:sticky;top:0;background:linear-gradient(90deg,#e0e7ff,#c7d2fe);color:#1e3a8a;z-index:5}
    tr.subtotal-row td{background:#fff7cc;font-weight:800} tr.grandtotal-row td{background:#bae6fd;font-weight:900}

    .overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;color:#1e3a8a;z-index:2000}
    .overlay.show{display:flex}

    @media(max-width:768px){ .filter-box{flex:1 1 100%} th,td{font-size:.8rem} }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center">
      <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo">
      <h1>SMC Lighthouse Sales</h1>
    </div>
    <div class="toolbar">
      <button id="exportBtn" class="btn-blue">Export</button>
      <button id="clearBtn" class="btn-gray">Clear</button>
      <button id="toggleFiltersBtn" class="btn-gray">Hide Filters</button>
    </div>
  </header>

  <main>
    <div class="controls">
      From: <input type="date" id="dateFrom">
      To: <input type="date" id="dateTo">
      <button id="yesterdayBtn" class="btn-gray">Yesterday</button>
      Invoice Month: <select id="monthQuick"><option value="">--All--</option></select>
      <small id="recordsInfo" style="margin-left:auto;color:#6b7280"></small>
    </div>

    <div id="filtersWrapper">
      <div id="filtersContainer"></div>
    </div>

    <div class="table-wrapper">
      <table id="dataTable" aria-label="Lighthouse">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
  </main>

  <div id="overlay" class="overlay">Processing...</div>

<script>
/* ---------------- Config & helpers ---------------- */
const API_URL = "/get_data/lighthouse_sales";
let rawData = [];   // array of objects
let partyTS = null;
let itemTS = null;

function parseDateFlexible(s){
  if(!s) return null;
  s = String(s).trim();
  // DDMMYYYY (8 digits)
  if(/^\d{8}$/.test(s)){
    const d = parseInt(s.slice(0,2),10), m = parseInt(s.slice(2,4),10), y = parseInt(s.slice(4,8),10);
    return new Date(y, m-1, d);
  }
  // DD-MM-YYYY or DD/MM/YYYY
  let mMatch = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(mMatch) return new Date(parseInt(mMatch[3],10), parseInt(mMatch[2],10)-1, parseInt(mMatch[1],10));
  // YYYY-MM-DD
  mMatch = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(mMatch) return new Date(parseInt(mMatch[1],10), parseInt(mMatch[2],10)-1, parseInt(mMatch[3],10));
  // fallback to Date()
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function formatDisplayDate(d){
  const dt = typeof d === "string" ? parseDateFlexible(d) : d;
  if(!dt) return "";
  return `${String(dt.getDate()).padStart(2,'0')}${String(dt.getMonth()+1).padStart(2,'0')}${dt.getFullYear()}`; // DDMMYYYY
}
function formatDateInputISO(d){
  const dt = typeof d === "string" ? parseDateFlexible(d) : d;
  if(!dt) return "";
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function invoiceMonthLabel(s){
  const dt = parseDateFlexible(s);
  if(!dt) return "";
  return dt.toLocaleString('default',{month:'short', year:'numeric'});
}
function toNum(v){ return Number(v)||0; }
function showOverlay(){ document.getElementById("overlay").classList.add("show"); }
function hideOverlay(){ document.getElementById("overlay").classList.remove("show"); }

/* ---------------- Load data & init ---------------- */
async function loadData(){
  showOverlay();
  try{
    const res = await axios.get(API_URL);
    const data = Array.isArray(res.data) ? res.data : [];
    rawData = data.map(r=>{
      const rawDate = (r.invoice_date || r.INVOICE_DATE || r.Invoice_Date || "").toString().trim();
      const parsed = parseDateFlexible(rawDate);
      return {
        state: (r.state || r.STATE || "").toString().trim(),
        party_name: (r.party_name || r.PARTY_NAME || "").toString().trim(),
        item_name: (r.item_name || r.ITEM_NAME || "").toString().trim(),
        invoice_date_raw: rawDate,
        invoice_date_obj: parsed,                 // Date or null
        invoice_date: formatDisplayDate(parsed),  // DDMMYYYY
        invoice_month: invoiceMonthLabel(rawDate),
        quantity_kg: toNum(r.quantity_kg || r.Quantity_KG || r.QTY || 0),
        bill_amount: toNum(r.bill_amount || r.Bill_Amount || 0),
        quantity_cs: toNum(r.quantity_cs || r.Quantity_CS || 0)
      };
    });

    // populate month dropdown
    const months = [...new Set(rawData.map(r=>r.invoice_month).filter(Boolean))].sort((a,b)=>{
      // sort by date
      const da = new Date(a), db = new Date(b);
      return da - db;
    });
    const monthQuick = document.getElementById("monthQuick");
    monthQuick.innerHTML = `<option value="">--All--</option>` + months.map(m=>`<option value="${m}">${m}</option>`).join("");

    // default current month
    const now = new Date();
    const curMonthLabel = now.toLocaleString('default',{month:'short',year:'numeric'});
    if(months.includes(curMonthLabel)) monthQuick.value = curMonthLabel;

    // set date inputs to first & last of current month
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
    document.getElementById("dateFrom").value = formatDateInputISO(first);
    document.getElementById("dateTo").value = formatDateInputISO(last);

    buildFilters();
    applyFilters();
  } catch(err){
    console.error("loadData error", err);
  } finally {
    hideOverlay();
  }
}

/* ---------------- Build Filters (with TomSelect for PARTY_NAME & ITEM_NAME) ---------------- */
function buildFilters(){
  const fc = document.getElementById("filtersContainer");
  fc.innerHTML = "";

  // SHOW COLUMNS, STATE, TOTAL (checkbox-based)
  const boxes = [
    {key:"SHOW COLUMNS", vals:["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE","INVOICE_MONTH","SUM_QUANTITY_KG","SUM_BILL_AMOUNT","SUM_QUANTITY_CS"]},
    {key:"STATE", vals:[...new Set(rawData.map(r=>r.state))].filter(Boolean).sort()},
    {key:"TOTAL", vals:["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE","INVOICE_MONTH"]}
  ];
  boxes.forEach(b=>{
    const div = document.createElement("div"); div.className = "filter-box";
    div.innerHTML = `<strong>${b.key}</strong>
      <label><input type="checkbox" data-all="${b.key}"> All</label>
      <div class="options">${b.vals.map(v=>`<label><input type="checkbox" name="${b.key}" value="${v}"> ${v}</label>`).join("")}</div>`;
    fc.appendChild(div);
  });

  // PARTY_NAME - TomSelect multi
  const partyBox = document.createElement("div"); partyBox.className="filter-box";
  partyBox.innerHTML = `<strong>PARTY_NAME</strong><select id="partySelect" multiple placeholder="Select Parties"></select>`;
  fc.appendChild(partyBox);
  const parties = [...new Set(rawData.map(r=>r.party_name))].filter(Boolean).sort();
  const partySelect = document.getElementById("partySelect");
  parties.forEach(p=>{ const o = document.createElement("option"); o.value = p; o.textContent = p; partySelect.appendChild(o); });
  if(partyTS) partyTS.destroy();
  partyTS = new TomSelect(partySelect, { plugins:['remove_button'], maxOptions:500, create:false });

  // ITEM_NAME - TomSelect multi
  const itemBox = document.createElement("div"); itemBox.className="filter-box";
  itemBox.innerHTML = `<strong>ITEM_NAME</strong><select id="itemSelect" multiple placeholder="Select Items"></select>`;
  fc.appendChild(itemBox);
  const items = [...new Set(rawData.map(r=>r.item_name))].filter(Boolean).sort();
  const itemSelect = document.getElementById("itemSelect");
  items.forEach(it=>{ const o = document.createElement("option"); o.value=it; o.textContent=it; itemSelect.appendChild(o); });
  if(itemTS) itemTS.destroy();
  itemTS = new TomSelect(itemSelect, { plugins:['remove_button'], maxOptions:800, create:false });

  // wire up "All" checkboxes
  fc.querySelectorAll("input[data-all]").forEach(cb=>{
    cb.addEventListener("change", e=>{
      const grp = e.target.dataset.all;
      fc.querySelectorAll(`input[name='${grp}']`).forEach(i=>i.checked = e.target.checked);
      applyFilters();
    });
  });

  // any change triggers apply (debounced small delay)
  fc.addEventListener("change", ()=> setTimeout(applyFilters, 180));
}






function applyFilters(){
  showOverlay();
  setTimeout(()=>{ // Using setTimeout to allow overlay to show and defer heavy computation

    // 1. Get ALL current selections from filters (before any updates)
    const selections = {};
    document.querySelectorAll(".filter-box strong").forEach(h=>{
      const k = h.textContent.trim();
      selections[k] = [...document.querySelectorAll(`input[name='${k}']:checked`)].map(i=>i.value);
    });

    const selectedStates = selections["STATE"] || [];
    const selectedShowCols = selections["SHOW COLUMNS"] || [];
    const selectedTotals = selections["TOTAL"] || [];
    const currentSelectedParties = partyTS ? partyTS.getValue() : []; // Capture current TomSelect selections
    const currentSelectedItems = itemTS ? itemTS.getValue() : [];     // Capture current TomSelect selections

    // Date/Month Filters
    const fromISO = document.getElementById("dateFrom").value;
    const toISO = document.getElementById("dateTo").value;
    const fromDate = fromISO ? new Date(fromISO + "T00:00:00") : null;
    const toDate = toISO ? new Date(toISO + "T23:59:59") : null;
    const monthSel = document.getElementById("monthQuick").value;

    // Start Building the Filtered Dataset for the TABLE ---
    // Apply date/month filters first as they are often primary
    let filteredDataForTable = rawData.filter(r => {
      if (monthSel) return r.invoice_month === monthSel;
      if (fromDate || toDate) {
        const d = r.invoice_date_obj;
        if (!d) return false;
        if (fromDate && d < fromDate) return false;
        if (toDate && d > toDate) return false;
      }
      return true;
    });

    // Apply state, party, item filters to this intermediate data
    if (selectedStates.length) filteredDataForTable = filteredDataForTable.filter(r => selectedStates.includes(r.state));
    if (currentSelectedParties.length) filteredDataForTable = filteredDataForTable.filter(r => currentSelectedParties.includes(r.party_name));
    if (currentSelectedItems.length) filteredDataForTable = filteredDataForTable.filter(r => currentSelectedItems.includes(r.item_name));

    // Now, determine VALID OPTIONS for the filters based on the `filteredDataForTable` ---
    // This creates the cascading effect: options for a filter only show what's available
    // after other filters have been applied.

    // Update STATE checkboxes visibility
    const validStatesForOptions = new Set(filteredDataForTable.map(r=>r.state).filter(Boolean));
    document.querySelectorAll("input[name='STATE']").forEach(cb=>{
      const lbl = cb.closest("label");
      if(validStatesForOptions.has(cb.value)) { lbl.style.display = ""; }
      else { lbl.style.display = "none"; cb.checked = false; } // Uncheck if invalid
    });
    // Re-capture selected states after potentially unchecking invalid ones
    // NOTE: This 'finalSelectedStates' is not used in the subsequent filtering,
    // as 'selectedStates' (captured at the beginning) is used for the main data filter.
    // If you intend for the table filter to react to the 'unchecking of invalid' states,
    // you'd need to re-apply the state filter using 'finalSelectedStates' here,
    // or restructure to derive table data later. For now, it's just a variable.
    const finalSelectedStates = [...document.querySelectorAll(`input[name='STATE']:checked`)].map(i=>i.value);


    // Update PARTY_NAME TomSelect options
    const validPartiesForOptions = [...new Set(filteredDataForTable.map(r=>r.party_name).filter(Boolean))].sort();
    partyTS.clearOptions();
    validPartiesForOptions.forEach(p => partyTS.addOption({value:p, text:p}));
    // Preserve only those previously selected parties that are still valid
    const partiesToSet = currentSelectedParties.filter(v => validPartiesForOptions.includes(v));
    partyTS.setValue(partiesToSet);


    // Update ITEM_NAME TomSelect options
    const validItemsForOptions = [...new Set(filteredDataForTable.map(r=>r.item_name).filter(Boolean))].sort();
    itemTS.clearOptions();
    validItemsForOptions.forEach(it => itemTS.addOption({value:it, text:it}));
    // Preserve only those previously selected items that are still valid
    const itemsToSet = currentSelectedItems.filter(v => validItemsForOptions.includes(v));
    itemTS.setValue(itemsToSet);

    // The `filteredDataForTable` is already the final dataset to be aggregated and displayed ---
    // This is the data that will be used to render the table.

    // Determine grouping keys (same logic as before)
    let groupKeys = [];
    if(selectedTotals.length){
      selectedTotals.forEach(t => {
        if(t === "INVOICE_MONTH") groupKeys.push("invoice_month");
        else if(t === "INVOICE_DATE") groupKeys.push("invoice_date");
        else groupKeys.push(t.toLowerCase());
      });
    } else {
      const textCols = (selectedShowCols.length ? selectedShowCols : ["STATE","PARTY_NAME","ITEM_NAME"]);
      textCols.forEach(c => {
        if(c === "INVOICE_MONTH") groupKeys.push("invoice_month");
        else if(c === "INVOICE_DATE") groupKeys.push("invoice_date");
        else groupKeys.push(c.toLowerCase());
      });
    }
    if(groupKeys.length === 0) groupKeys = ["state","party_name","item_name"];

    // Aggregate: one row per unique groupKey combination
    const map = new Map();
    filteredDataForTable.forEach(r => { // Use filteredDataForTable here
      const key = groupKeys.map(k => (r[k] ?? r[k.toUpperCase()] ?? "") ).join("|");
      if(!map.has(key)){
        map.set(key, {
          STATE: r.state,
          PARTY_NAME: r.party_name,
          ITEM_NAME: r.item_name,
          INVOICE_DATE: r.invoice_date,   // DDMMYYYY string
          INVOICE_MONTH: r.invoice_month,
          SUM_QUANTITY_KG: r.quantity_kg,
          SUM_BILL_AMOUNT: r.bill_amount,
          SUM_QUANTITY_CS: r.quantity_cs
        });
      } else {
        const obj = map.get(key);
        obj.SUM_QUANTITY_KG += r.quantity_kg;
        obj.SUM_BILL_AMOUNT += r.bill_amount;
        obj.SUM_QUANTITY_CS += r.quantity_cs;
      }
    });
    const rows = [...map.values()];

    // Prepare groups for subtotals: by first group key (same logic)
    const topKey = groupKeys[0] || "state";
    const groupMap = new Map();
    rows.forEach(row => {
      const topVal = (row[topKey.toUpperCase()] ?? row[topKey] ?? "");
      if(!groupMap.has(topVal)) groupMap.set(topVal, []);
      groupMap.get(topVal).push(row);
    });

    // Columns to show (same logic)
    const defaultShow = ["STATE","PARTY_NAME","ITEM_NAME","SUM_QUANTITY_KG","SUM_QUANTITY_CS"];
    const showCols = (selectedShowCols.length ? selectedShowCols : defaultShow);

    // Render table (same logic)
    const thead = document.getElementById("tableHead"), tbody = document.getElementById("tableBody"), tfoot = document.getElementById("tableFoot");
    thead.innerHTML = "<tr>" + showCols.map(c => `<th>${c.replace(/_/g,' ')}</th>`).join("") + "</tr>";

    let html = "";
    groupMap.forEach((arr, grp) => {
      arr.forEach(r => {
        html += "<tr>" + showCols.map(c => {
          if(c === "INVOICE_MONTH") return `<td>${r.INVOICE_MONTH || ""}</td>`;
          if(c === "INVOICE_DATE") return `<td>${r.INVOICE_DATE || ""}</td>`; // already DDMMYYYY
          if(c.startsWith("SUM_")) return `<td>${(r[c]||0).toLocaleString()}</td>`;
          return `<td>${r[c] ?? ""}</td>`;
        }).join("") + "</tr>`;
      });
      // subtotal row for this group
      const subtotal = arr.reduce((acc, x) => {
        acc.SUM_QUANTITY_KG += toNum(x.SUM_QUANTITY_KG);
        acc.SUM_BILL_AMOUNT += toNum(x.SUM_BILL_AMOUNT);
        acc.SUM_QUANTITY_CS += toNum(x.SUM_QUANTITY_CS);
        return acc;
      }, {SUM_QUANTITY_KG:0,SUM_BILL_AMOUNT:0,SUM_QUANTITY_CS:0});
      html += `<tr class="subtotal-row">` + showCols.map((c,i) => {
        if(c === "SUM_QUANTITY_KG") return `<td>${subtotal.SUM_QUANTITY_KG.toLocaleString()}</td>`;
        if(c === "SUM_BILL_AMOUNT") return `<td>${subtotal.SUM_BILL_AMOUNT.toLocaleString()}</td>`;
        if(c === "SUM_QUANTITY_CS") return `<td>${subtotal.SUM_QUANTITY_CS.toLocaleString()}</td>`;
        return i===0 ? `<td><b>Subtotal - ${grp}</b></td>` : `<td></td>`;
      }).join("") + `</tr>`;
    });

    // Grand total (same logic)
    const grand = rows.reduce((acc, r) => {
      acc.SUM_QUANTITY_KG += toNum(r.SUM_QUANTITY_KG);
      acc.SUM_BILL_AMOUNT += toNum(r.SUM_BILL_AMOUNT);
      acc.SUM_QUANTITY_CS += toNum(r.SUM_QUANTITY_CS);
      return acc;
    }, {SUM_QUANTITY_KG:0,SUM_BILL_AMOUNT:0,SUM_QUANTITY_CS:0});
    const grandHtml = `<tr class="grandtotal-row">` + showCols.map((c,i) => {
      if(c === "SUM_QUANTITY_KG") return `<td>${grand.SUM_QUANTITY_KG.toLocaleString()}</td>`;
      if(c === "SUM_BILL_AMOUNT") return `<td>${grand.SUM_BILL_AMOUNT.toLocaleString()}</td>`;
      if(c === "SUM_QUANTITY_CS") return `<td>${grand.SUM_QUANTITY_CS.toLocaleString()}</td>`;
      return i===0 ? `<td><b>GRAND TOTAL</b></td>` : `<td></td>`;
    }).join("") + `</tr>`;

    tbody.innerHTML = html || `<tr><td colspan="${showCols.length}">No data</td></tr>`;
    tfoot.innerHTML = grandHtml;
    document.getElementById("recordsInfo").textContent = `Rows: ${rows.length} (filtered: ${filteredDataForTable.length})`;
  }, 80); // Small delay to ensure overlay shows
  hideOverlay();
}
/* ---------------- UI events ---------------- */
document.getElementById("toggleFiltersBtn").addEventListener("click", ()=>{
  const fw = document.getElementById("filtersWrapper");
  fw.style.display = (fw.style.display === "none") ? "block" : "none";
});
document.getElementById("clearBtn").addEventListener("click", ()=>{
  // reset selects and checkboxes
  document.querySelectorAll("#filtersContainer input[type=checkbox]").forEach(cb => cb.checked = false);
  if(partyTS) { partyTS.clear(); partyTS.clearOptions(); rawData && [...new Set(rawData.map(r=>r.party_name))].filter(Boolean).sort().forEach(p=>partyTS.addOption({value:p,text:p})); }
  if(itemTS) { itemTS.clear(); itemTS.clearOptions(); rawData && [...new Set(rawData.map(r=>r.item_name))].filter(Boolean).sort().forEach(i=>itemTS.addOption({value:i,text:i})); }
  // reset month and dates
  const now = new Date(); const first = new Date(now.getFullYear(), now.getMonth(),1); const last = new Date(now.getFullYear(), now.getMonth()+1,0);
  document.getElementById("monthQuick").value = "";
  document.getElementById("dateFrom").value = formatDateInputISO(first);
  document.getElementById("dateTo").value = formatDateInputISO(last);
  buildFilters();
  applyFilters();
});
document.getElementById("yesterdayBtn").addEventListener("click", ()=>{
  const d = new Date(); d.setDate(d.getDate()-1);
  document.getElementById("dateFrom").value = formatDateInputISO(d);
  document.getElementById("dateTo").value = formatDateInputISO(d);
  document.getElementById("monthQuick").value = "";
  applyFilters();
});
document.getElementById("dateFrom").addEventListener("change", ()=>{ document.getElementById("monthQuick").value = ""; applyFilters(); });
document.getElementById("dateTo").addEventListener("change", ()=>{ document.getElementById("monthQuick").value = ""; applyFilters(); });
document.getElementById("monthQuick").addEventListener("change", (e)=>{
  const val = e.target.value;
  if(!val){ applyFilters(); return; }
  // val like "Sep 2025"
  const parts = val.split(" ");
  const mon = parts[0], yr = parts[1];
  const monthIdx = new Date(`${mon} 1, ${yr}`).getMonth();
  const first = new Date(yr, monthIdx, 1);
  const last = new Date(yr, monthIdx+1, 0);
  document.getElementById("dateFrom").value = formatDateInputISO(first);
  document.getElementById("dateTo").value = formatDateInputISO(last);
  applyFilters();
});

/* Export function */
document.getElementById("exportBtn").addEventListener("click", async ()=>{
  try{
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet("Lighthouse");
    const rows = [...document.querySelectorAll("#dataTable tr")].map(tr => [...tr.children].map(td => td.innerText.trim()));
    rows.forEach((r,i) => { const row = ws.addRow(r); if(i===0) row.font = {bold:true}; });
    ws.columns.forEach(c => c.width = 16);
    const buf = await wb.xlsx.writeBuffer();
    saveAs(new Blob([buf]), `lighthouse_${new Date().toISOString().slice(0,10)}.xlsx`);
  } catch(err){ console.error("Export failed", err); alert("Export failed: " + err.message); }
});
