<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC Lighthouse Sales Dashboard</title>

  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <!-- TomSelect for multi-selects -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

  <!-- Excel export + axios -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    body { font-family: "Inter", system-ui, sans-serif; background:#f6f9fc; color:#111827; margin:0; }
    header { display:flex; justify-content:space-between; align-items:center;
      background:linear-gradient(90deg,#2563eb,#4f46e5); color:#fff; padding:10px 16px; box-shadow:0 3px 12px rgba(0,0,0,.15); }
    header img{height:42px} header h1{font-size:1.05rem;margin-left:8px;font-weight:800}

    .toolbar button{border:none;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer}
    .btn-blue{background:#fff;color:#1e3a8a} .btn-gray{background:#e5e7eb;color:#111827}

    main{max-width:1500px;margin:16px auto;padding:0 12px}

    .controls {display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    .controls input[type=date], .controls select {padding:6px;border-radius:6px;border:1px solid #e6eef9;background:#fff}

    #filtersContainer {display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px}
    .filter-box {
      background:linear-gradient(180deg,#fff,#f0f4ff);
      border:2px solid #1e3a8a;border-radius:12px;padding:10px 12px;flex:1 1 220px;
      box-shadow:0 4px 12px rgba(30,58,138,0.12);transition:transform .18s ease;
    }
    .filter-box:hover{transform:translateY(-2px)}
    .filter-box strong{display:block;text-align:center;color:#1e3a8a;font-weight:800;margin-bottom:6px;border-bottom:2px solid #c7d2fe;padding-bottom:4px}
    .filter-box .options{max-height:220px;overflow:auto;padding-top:6px}
    .filter-box label{display:inline-block;background:#f8fafc;border-radius:6px;padding:4px 6px;margin:3px;cursor:pointer;font-weight:600}

    .table-wrapper{background:#fff;border-radius:10px;box-shadow:0 5px 20px rgba(4,8,15,0.06);overflow:auto;max-height:74vh}
    table{border-collapse:collapse;width:100%;min-width:1100px}
    th,td{border:1.5px solid #9ca3af;padding:4px 4px;text-align:center;font-weight:700;height:20px;line-height:1.2}
    thead th{position:sticky;top:0;background:linear-gradient(90deg,#e0e7ff,#c7d2fe);color:#1e3a8a;z-index:5}
    tr.subtotal-row td{background:#fff7cc;font-weight:800} tr.grandtotal-row td{background:#bae6fd;font-weight:900}

    .overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;color:#1e3a8a;z-index:2000}
    .overlay.show{display:flex}

    @media(max-width:768px){ .filter-box{flex:1 1 100%} th,td{font-size:.8rem} }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center">
      <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo">
      <h1>SMC Lighthouse Sales</h1>
    </div>
    <div class="toolbar">
      <button id="exportBtn" class="btn-blue">Export</button>
      <button id="clearBtn" class="btn-gray">Clear</button>
      <button id="toggleFiltersBtn" class="btn-gray">Hide Filters</button>
    </div>
  </header>

  <main>
    <div class="controls">
      From: <input type="date" id="dateFrom">
      To: <input type="date" id="dateTo">
      <button id="yesterdayBtn" class="btn-gray">Yesterday</button>
      Invoice Month: <select id="monthQuick"><option value="">--All--</option></select>
      <small id="recordsInfo" style="margin-left:auto;color:#6b7280"></small>
    </div>

    <div id="filtersWrapper">
      <div id="filtersContainer"></div>
    </div>

    <div class="table-wrapper">
      <table id="dataTable" aria-label="Lighthouse">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
  </main>

  <div id="overlay" class="overlay">Processing...</div>





<script>
/* ---------- Updated JS with: 
   - TOTAL filter removed
   - Drill-down + multi-selection cascade for PARTY_NAME & ITEM_NAME ---------- */

const API_URL = "/get_data/lighthouse_sales";
let rawData = [];
let partyTS = null;
let itemTS = null;

/* --------- Date helpers (unchanged) --------- */
function parseDateFlexible(s){
  if(!s) return null;
  s = String(s).trim();
  if(/^\d{8}$/.test(s)){
    const d = parseInt(s.slice(0,2),10), m = parseInt(s.slice(2,4),10), y = parseInt(s.slice(4,8),10);
    return new Date(y,m-1,d);
  }
  let mMatch = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(mMatch) return new Date(parseInt(mMatch[3],10), parseInt(mMatch[2],10)-1, parseInt(mMatch[1],10));
  mMatch = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(mMatch) return new Date(parseInt(mMatch[1],10), parseInt(mMatch[2],10)-1, parseInt(mMatch[3],10));
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function formatDisplayDate(d){
  const dt = typeof d === "string" ? parseDateFlexible(d) : d;
  if(!dt) return "";
  return `${String(dt.getDate()).padStart(2,'0')}${String(dt.getMonth()+1).padStart(2,'0')}${dt.getFullYear()}`; 
}
function formatDateInputISO(d){
  const dt = typeof d === "string" ? parseDateFlexible(d) : d;
  if(!dt) return "";
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function invoiceMonthLabel(s){
  const dt = parseDateFlexible(s);
  if(!dt) return "";
  return dt.toLocaleString('default',{month:'short', year:'numeric'});
}
function toNum(v){ return Number(v)||0; }
function showOverlay(){ document.getElementById("overlay").classList.add("show"); }
function hideOverlay(){ document.getElementById("overlay").classList.remove("show"); }

/* --------- loadData --------- */
async function loadData(){
  showOverlay();
  try{
    const res = await axios.get(API_URL);
    const data = Array.isArray(res.data) ? res.data : [];
    rawData = data.map(r=>{
      const rawDate = (r.invoice_date || r.INVOICE_DATE || r.Invoice_Date || "").toString().trim();
      const parsed = parseDateFlexible(rawDate);
      return {
        state: (r.state || r.STATE || "").trim(),
        party_name: (r.party_name || r.PARTY_NAME || "").trim(),
        item_name: (r.item_name || r.ITEM_NAME || "").trim(),
        invoice_date_raw: rawDate,
        invoice_date_obj: parsed,
        invoice_date: formatDisplayDate(parsed),
        invoice_month: invoiceMonthLabel(rawDate),
        quantity_kg: toNum(r.quantity_kg || r.Quantity_KG || 0),
        bill_amount: toNum(r.bill_amount || r.Bill_Amount || 0),
        quantity_cs: toNum(r.quantity_cs || r.Quantity_CS || 0)
      };
    });

    // Populate month list
    const months = [...new Set(rawData.map(r=>r.invoice_month).filter(Boolean))];
    const monthQuick = document.getElementById("monthQuick");
    monthQuick.innerHTML = `<option value="">--All--</option>` + months.map(m=>`<option value="${m}">${m}</option>`).join("");

    const now = new Date();
    const curMonthLabel = now.toLocaleString('default',{month:'short',year:'numeric'});
    if(months.includes(curMonthLabel)) monthQuick.value = curMonthLabel;
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
    document.getElementById("dateFrom").value = formatDateInputISO(first);
    document.getElementById("dateTo").value = formatDateInputISO(last);

    buildFilters();
    applyFilters();
  } finally { hideOverlay(); }
}

/* --------- Build Filters (TOTAL removed) --------- */
function buildFilters(){
  const fc = document.getElementById("filtersContainer");
  fc.innerHTML = "";

  const boxes = [
    {key:"SHOW COLUMNS", vals:["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE","INVOICE_MONTH","SUM_QUANTITY_KG","SUM_BILL_AMOUNT","SUM_QUANTITY_CS"]},
    {key:"STATE", vals:[...new Set(rawData.map(r=>r.state))].filter(Boolean).sort()}
  ];
  boxes.forEach(b=>{
    const div = document.createElement("div"); div.className="filter-box";
    div.innerHTML = `<strong>${b.key}</strong>
      <label><input type="checkbox" data-all="${b.key}"> All</label>
      <div class="options">${b.vals.map(v=>`<label><input type="checkbox" name="${b.key}" value="${v}"> ${v}</label>`).join("")}</div>`;
    fc.appendChild(div);
  });

  // PARTY_NAME multi select
  const partyBox = document.createElement("div");
  partyBox.className="filter-box";
  partyBox.innerHTML = `<strong>PARTY_NAME</strong><select id="partySelect" multiple placeholder="Select Parties"></select>`;
  fc.appendChild(partyBox);
  const parties = [...new Set(rawData.map(r=>r.party_name))].filter(Boolean).sort();
  const partySelect = document.getElementById("partySelect");
  parties.forEach(p=>{ const o=document.createElement("option"); o.value=p; o.textContent=p; partySelect.appendChild(o); });
  if(partyTS) { partyTS.destroy(); }
  partyTS = new TomSelect(partySelect,{plugins:['remove_button'],create:false,maxOptions:1000});

  // ITEM_NAME multi select
  const itemBox = document.createElement("div");
  itemBox.className="filter-box";
  itemBox.innerHTML = `<strong>ITEM_NAME</strong><select id="itemSelect" multiple placeholder="Select Items"></select>`;
  fc.appendChild(itemBox);
  const items = [...new Set(rawData.map(r=>r.item_name))].filter(Boolean).sort();
  const itemSelect = document.getElementById("itemSelect");
  items.forEach(i=>{ const o=document.createElement("option"); o.value=i; o.textContent=i; itemSelect.appendChild(o); });
  if(itemTS) { itemTS.destroy(); }
  itemTS = new TomSelect(itemSelect,{plugins:['remove_button'],create:false,maxOptions:1000});

  // "All" checkbox handling
  fc.querySelectorAll("input[data-all]").forEach(cb=>{
    cb.addEventListener("change", e=>{
      const grp=e.target.dataset.all;
      fc.querySelectorAll(`input[name='${grp}']`).forEach(i=>i.checked=e.target.checked);
      applyFilters();
    });
  });

  // On change listeners
  fc.addEventListener("change", ()=> setTimeout(applyFilters,150));
  partyTS.on('change', ()=> applyFilters());
  itemTS.on('change', ()=> applyFilters());
}

/* --------- Apply Filters + Drill-down logic --------- */
function applyFilters(){
  showOverlay();
  setTimeout(()=>{
    const sel={};
    document.querySelectorAll(".filter-box strong").forEach(h=>{
      const k=h.textContent.trim();
      sel[k]=[...document.querySelectorAll(`input[name='${k}']:checked`)].map(i=>i.value);
    });
    const selectedStates=sel["STATE"]||[];
    const selectedShowCols=sel["SHOW COLUMNS"]||[];
    const selectedParties=partyTS.getValue();
    const selectedItems=itemTS.getValue();

    const from=new Date(document.getElementById("dateFrom").value+"T00:00:00");
    const to=new Date(document.getElementById("dateTo").value+"T23:59:59");
    const monthSel=document.getElementById("monthQuick").value;

    // Preview subset for valid cascade values
    let preview=[...rawData];
    if(monthSel) preview=preview.filter(r=>r.invoice_month===monthSel);
    else preview=preview.filter(r=>{
      const d=r.invoice_date_obj;
      if(!d) return false;
      if(from && d<from) return false;
      if(to && d>to) return false;
      return true;
    });

    if(selectedStates.length) preview=preview.filter(r=>selectedStates.includes(r.state));
    if(selectedParties.length) preview=preview.filter(r=>selectedParties.includes(r.party_name));
    if(selectedItems.length) preview=preview.filter(r=>selectedItems.includes(r.item_name));

    // valid lists
    const validParties=[...new Set(preview.map(r=>r.party_name))].filter(Boolean).sort();
    const validItems=[...new Set(preview.map(r=>r.item_name))].filter(Boolean).sort();

    // drill-down updates
    const keepP=partyTS.getValue().filter(v=>validParties.includes(v));
    const keepI=itemTS.getValue().filter(v=>validItems.includes(v));

    partyTS.clearOptions();
    validParties.forEach(p=>partyTS.addOption({value:p,text:p}));
    partyTS.setValue(keepP);
    itemTS.clearOptions();
    validItems.forEach(i=>itemTS.addOption({value:i,text:i}));
    itemTS.setValue(keepI);

    // actual data filter
    let filtered=[...rawData];
    if(monthSel) filtered=filtered.filter(r=>r.invoice_month===monthSel);
    else filtered=filtered.filter(r=>{
      const d=r.invoice_date_obj;
      if(!d) return false;
      if(from && d<from) return false;
      if(to && d>to) return false;
      return true;
    });
    if(selectedStates.length) filtered=filtered.filter(r=>selectedStates.includes(r.state));
    if(selectedParties.length) filtered=filtered.filter(r=>selectedParties.includes(r.party_name));
    if(selectedItems.length) filtered=filtered.filter(r=>selectedItems.includes(r.item_name));

    // Render same as before
    renderTable(filtered,selectedShowCols);
    hideOverlay();
  },100);
}

/* --------- Render Table (unchanged) --------- */
function renderTable(filtered,selectedShowCols){
  const showCols=(selectedShowCols.length?selectedShowCols:["STATE","PARTY_NAME","ITEM_NAME","SUM_QUANTITY_CS"]);
  const map=new Map();
  filtered.forEach(r=>{
    const key=[r.state,r.party_name,r.item_name,r.invoice_date].join("|");
    if(!map.has(key)){
      map.set(key,{STATE:r.state,PARTY_NAME:r.party_name,ITEM_NAME:r.item_name,
        INVOICE_DATE:r.invoice_date,SUM_QUANTITY_CS:r.quantity_cs,SUM_BILL_AMOUNT:r.bill_amount});
    }else{
      const o=map.get(key);
      o.SUM_QUANTITY_CS+=r.quantity_cs;
      o.SUM_BILL_AMOUNT+=r.bill_amount;
    }
  });
  const rows=[...map.values()];
  const tbody=document.getElementById("tableBody");
  const thead=document.getElementById("tableHead");
  const tfoot=document.getElementById("tableFoot");
  thead.innerHTML="<tr>"+showCols.map(c=>`<th>${c}</th>`).join("")+"</tr>";
  tbody.innerHTML=rows.map(r=>"<tr>"+showCols.map(c=>`<td>${r[c]||""}</td>`).join("")+"</tr>").join("");
  const totalCS=rows.reduce((s,r)=>s+toNum(r.SUM_QUANTITY_CS),0);
  tfoot.innerHTML=`<tr class='grandtotal-row'><td><b>GRAND TOTAL</b></td><td colspan='${showCols.length-1}'>${totalCS.toLocaleString()}</td></tr>`;
  document.getElementById("recordsInfo").textContent=`Rows: ${rows.length}`;
}

/* --------- Buttons / Events --------- */
document.getElementById("toggleFiltersBtn").addEventListener("click",()=>{
  const fw=document.getElementById("filtersWrapper");
  fw.style.display=(fw.style.display==="none")?"block":"none";
});
document.getElementById("clearBtn").addEventListener("click",()=>{
  document.querySelectorAll("#filtersContainer input[type=checkbox]").forEach(cb=>cb.checked=false);
  partyTS.clear(); itemTS.clear();
  buildFilters(); applyFilters();
});
document.getElementById("yesterdayBtn").addEventListener("click",()=>{
  const d=new Date();d.setDate(d.getDate()-1);
  document.getElementById("dateFrom").value=formatDateInputISO(d);
  document.getElementById("dateTo").value=formatDateInputISO(d);
  applyFilters();
});
document.getElementById("dateFrom").addEventListener("change",applyFilters);
document.getElementById("dateTo").addEventListener("change",applyFilters);
document.getElementById("monthQuick").addEventListener("change",applyFilters);

/* --------- Export --------- */
document.getElementById("exportBtn").addEventListener("click",async()=>{
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Lighthouse");
  const rows=[...document.querySelectorAll("#dataTable tr")].map(tr=>[...tr.children].map(td=>td.innerText));
  rows.forEach((r,i)=>{const row=ws.addRow(r);if(i===0)row.font={bold:true};});
  ws.columns.forEach(c=>c.width=16);
  const buf=await wb.xlsx.writeBuffer();
  saveAs(new Blob([buf]),`lighthouse_${new Date().toISOString().slice(0,10)}.xlsx`);
});

/* --------- Init --------- */
loadData();
</script>
</body>
</html>
