<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ERP — Plant → Depot / Direct</title>

  <!-- ✅ Fix favicon 404 -->
  <link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

  <!-- ExcelJS + FileSaver + axios -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    :root { --navy:#1e3a8a; --accent-1:#2563eb; --accent-2:#9333ea; }
    body { font-family: Inter, system-ui, Arial; margin:0; padding:18px; background:#f6f9fc; color:#0f172a; }
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    header h1{margin:0;color:var(--navy);font-weight:800}
    .toolbar{display:flex;gap:8px}
    .btn{border:0;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
    .btn-blue{background:linear-gradient(90deg,var(--accent-2),var(--accent-1));color:#fff}
    .btn-gray{background:#f3f4f6;color:#0f172a;border:1px solid #e6eef9}
    .card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 8px 30px rgba(2,6,23,0.04);margin-bottom:12px}
    .filter-box{min-width:160px;border:2px solid var(--navy);border-radius:10px;padding:8px;background:#fff}
    .filter-box strong{display:block;text-align:center;margin-bottom:6px;font-weight:800;color:var(--navy);font-size:12px}
    .filter-box .options{max-height:220px;overflow:auto;padding-right:6px}
    .filter-box label{display:inline-block;margin:3px 6px;padding:3px 6px;border-radius:6px;background:#f8fafc;cursor:pointer;font-size:13px}
    table{border-collapse:collapse;width:100%;min-width:980px}
    thead th{position:sticky;top:0;background:linear-gradient(90deg,var(--accent-1),var(--accent-2));color:#fff;padding:8px;border:1px solid rgba(255,255,255,0.06);font-weight:800}
    td,th{padding:8px;border:1px solid #c7d2fe;text-align:center;vertical-align:middle;font-weight:700}
    .grandtotal-row td{background:#e0f2fe;color:#083344;font-weight:900}
    .subtotal-row td{background:#f8fafc;font-weight:900}
    .controls-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
    .quick-date { margin-left:8px; }
    @media(max-width:920px){ .filter-box{min-width:unset} table{font-size:13px} }
  </style>
</head>

<body>
  <header>
    <div style="display:flex;align-items:center;gap:12px">
      <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo" style="height:44px">
      <h1>SMC — ERP (Plant → Depot / Direct)</h1>
    </div>

    <div class="toolbar">
      <!-- fixed: use anchor directly so navigation works -->
      <a href="sales_levels.html" class="btn btn-gray">⬅ Back</a>
      <button id="exportBtn" class="btn btn-blue">Export</button>
      <button id="clearBtn" class="btn btn-gray">Clear Filters</button>
      <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
    </div>
  </header>

  <main style="max-width:1400px;margin:0 auto">
    <div class="card" id="filtersWrapper">
      <div class="controls-row">
        <div>
          From: <input type="date" id="dateFrom">
          To: <input type="date" id="dateTo">
          <button id="yesterdayBtn" class="btn btn-gray quick-date" title="Set both From & To to yesterday">Yesterday</button>
          Invoice Month: <select id="monthQuick"><option value="">--All--</option></select>
        </div>
        <div><small id="recordsInfo" style="color:#6b7280"></small></div>
      </div>
      <div id="filtersContainer" style="display:flex;gap:10px;overflow:auto"></div>
    </div>

    <!-- loader removed as requested -->

    <div class="card" style="overflow:auto;max-height:70vh">
      <table id="dataTable" aria-label="ERP aggregated table">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
  </main>

  <footer style="text-align:center;padding:8px;margin-top:12px">
    <small>© {{ current_year }} — Amit Sharma</small>
  </footer>

<script>
const API_ENDPOINT = "/get_data/lighthouse_sales";
let rawData = [];
const TEXT_COLS = ["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE"];
const STORAGE_KEY = "lighthouse_saved_filters_v2";

/* ---------- Helpers ---------- */
function num(v){ return Number(v)||0; }
function debounce(fn,ms=220){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

function parseDDMMYYYY(s) {
  if (!s) return null;
  s = String(s).trim();

  const ddmmyyyy = s.match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if (ddmmyyyy) {
    const [_, d, m, y] = ddmmyyyy;
    return new Date(+y, +m - 1, +d);
  }

  const yyyymmdd = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (yyyymmdd) {
    const [_, y, m, d] = yyyymmdd;
    return new Date(+y, +m - 1, +d);
  }

  if (s.includes("GMT") || s.includes("UTC")) {
    const d = new Date(s);
    if (!isNaN(d.getTime())) return d;
  }

  const d2 = new Date(s);
  return isNaN(d2.getTime()) ? null : d2;
}

function monthLabel(s){
  const d=parseDDMMYYYY(s); if(!d)return""; 
  return d.toLocaleString('default',{month:'short',year:'numeric'});
}
function formatDate(s){
  const d=parseDDMMYYYY(s); if(!d)return s;
  return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
}

/* ---------- Build Filters ---------- */
function buildFiltersUI(){
  const c=document.getElementById("filtersContainer"); c.innerHTML="";
  // Removed INVOICE_MONTH from the boxes to avoid duplicate "Invoice Month"
  const boxes=[
    {key:"SHOW COLUMNS",vals:TEXT_COLS},
    {key:"STATE",vals:[...new Set(rawData.map(r=>r.state).filter(Boolean))].sort()},
    {key:"PARTY_NAME",vals:[...new Set(rawData.map(r=>r.party_name).filter(Boolean))].sort()},
    {key:"ITEM_NAME",vals:[...new Set(rawData.map(r=>r.item_name).filter(Boolean))].sort()},
    {key:"TOTAL",vals:TEXT_COLS}
  ];
  boxes.forEach(b=>{
    const div=document.createElement("div"); div.className="filter-box";
    div.innerHTML=`<strong>${b.key}</strong><label><input type="checkbox" data-all="${b.key}"> All</label>
      <div class="options">${b.vals.map(v=>`<label><input type="checkbox" name="${b.key}" value="${v}"> ${v}</label>`).join("")}</div>`;
    c.appendChild(div);
  });
  c.querySelectorAll("input[data-all]").forEach(cb=>{
    cb.addEventListener("change",e=>{
      const k=e.target.dataset.all; c.querySelectorAll(`input[name='${k}']`).forEach(i=>i.checked=e.target.checked); debounceApply();
    });
  });
  c.addEventListener("change",debounceApply);
}

/* ---------- Load Data ---------- */
async function loadData(){
  try{
    const res=await axios.get(API_ENDPOINT);
    rawData=(Array.isArray(res.data)?res.data:[]).map(r=>({
      state:r.state||r.STATE||"",
      party_name:r.party_name||r.PARTY_NAME||"",
      item_name:r.item_name||r.ITEM_NAME||"",
      invoice_date:(r.invoice_date||r.Invoice_Date||"").trim(),
      quantity_kg:num(r.quantity_kg||r.Quantity_KG),
      bill_amount:num(r.bill_amount||r.Bill_Amount),
      quantity_cs:num(r.quantity_cs||r.Quantity_CS)
    }));
    const months=[...new Set(rawData.map(r=>monthLabel(r.invoice_date)).filter(Boolean))].sort((a,b)=>new Date(a)-new Date(b));
    document.getElementById("monthQuick").innerHTML=`<option value="">--All--</option>`+months.map(m=>`<option value="${m}">${m}</option>`).join("");
    buildFiltersUI();
    debounceApply();
  }catch(err){
    console.error("Failed to load data",err);
    document.getElementById("tableBody").innerHTML=`<tr><td colspan="8">Error loading data</td></tr>`;
  }
}

/* ---------- Get Selected ---------- */
function getSelected(){
  const s={};
  document.querySelectorAll(".filter-box").forEach(b=>{
    const t=b.querySelector("strong").textContent.trim();
    s[t]=[...b.querySelectorAll("input[name]")].filter(i=>i.checked).map(i=>i.value);
  });
  s.__from=document.getElementById("dateFrom").value; s.__to=document.getElementById("dateTo").value;
  s.__monthQuick=document.getElementById("monthQuick").value;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
  return s;
}

function cascadeAndAggregate(s){
  let f=[...rawData];
  const from=s.__from?new Date(s.__from):null,to=s.__to?new Date(s.__to):null;
  if(s.__monthQuick) f = f.filter(r=> monthLabel(r.invoice_date) === s.__monthQuick);
  else if(from||to) f = f.filter(r=>{
    const d=parseDDMMYYYY(r.invoice_date);
    if(!d) return false;
    if(from && d < from) return false;
    if(to && d > to) return false;
    return true;
  });

  ["STATE","PARTY_NAME","ITEM_NAME"].forEach(k=>{
    const vals=s[k]||[]; if(!vals.length) return;
    f = f.filter(r => vals.includes(r[k.toLowerCase()]));
  });

  const sets={STATE:new Set(f.map(r=>r.state)),PARTY_NAME:new Set(f.map(r=>r.party_name)),ITEM_NAME:new Set(f.map(r=>r.item_name))};
  ["STATE","PARTY_NAME","ITEM_NAME"].forEach(k=>{
    document.querySelectorAll(`input[name='${k}']`).forEach(cb=>{
      const lab=cb.closest("label"); if(!sets[k].has(cb.value)){lab.style.display="none";cb.checked=false;} else lab.style.display="";
    });
  });

  /* --- 🧠 Dynamic aggregation key --- */
  const totals = s["TOTAL"] || [];
  let keyFields = ["state","party_name","item_name","invoice_date"];
  // If TOTAL includes STATE/PARTY_NAME/ITEM_NAME → remove invoice_date from grouping
  if (totals.length) keyFields = ["state","party_name","item_name"];

  const map=new Map();
  f.forEach(r=>{
    const key = keyFields.map(k=>r[k]).join("|");
    if(!map.has(key)) map.set(key,{
      STATE:r.state,
      PARTY_NAME:r.party_name,
      ITEM_NAME:r.item_name,
      INVOICE_DATE: totals.length ? "" : formatDate(r.invoice_date),
      SUM_QUANTITY_KG:r.quantity_kg,
      SUM_BILL_AMOUNT:r.bill_amount,
      SUM_QUANTITY_CS:r.quantity_cs
    });
    else {
      const o=map.get(key);
      o.SUM_QUANTITY_KG += r.quantity_kg;
      o.SUM_BILL_AMOUNT += r.bill_amount;
      o.SUM_QUANTITY_CS += r.quantity_cs;
    }
  });

  const rows = [...map.values()];
  rows.sort((a,b)=>
    (a.STATE||"").localeCompare(b.STATE||"") ||
    (a.PARTY_NAME||"").localeCompare(b.PARTY_NAME||"") ||
    (a.ITEM_NAME||"").localeCompare(b.ITEM_NAME||"")
  );

  // Compute grand total
  const grand = rows.reduce((acc,r)=>{
    acc.SUM_QUANTITY_KG += r.SUM_QUANTITY_KG;
    acc.SUM_BILL_AMOUNT += r.SUM_BILL_AMOUNT;
    acc.SUM_QUANTITY_CS += r.SUM_QUANTITY_CS;
    return acc;
  },{SUM_QUANTITY_KG:0,SUM_BILL_AMOUNT:0,SUM_QUANTITY_CS:0});

  return {rows, grand};
}

/* ---------- Render Table (supports subtotal rows) ---------- */
function renderTable(resultObj, s){
  const rows = resultObj.rows || [];
  const grand = resultObj.grand || {SUM_QUANTITY_KG:0,SUM_BILL_AMOUNT:0,SUM_QUANTITY_CS:0};
  const th=document.getElementById("tableHead"),tb=document.getElementById("tableBody"),tf=document.getElementById("tableFoot");
  const show=s["SHOW COLUMNS"].length?s["SHOW COLUMNS"]:TEXT_COLS;
  const header=[...show,"SUM_QUANTITY_KG","SUM_BILL_AMOUNT","SUM_QUANTITY_CS"];
  th.innerHTML="<tr>"+header.map(h=>`<th>${h.replace(/_/g," ")}</th>`).join("")+"</tr>";

  // find index of a field (uppercase keys)
  function colIndexFor(key){
    const idx = header.findIndex(h=>h.toUpperCase()===key);
    return idx >= 0 ? idx : 0;
  }

  tb.innerHTML = rows.map(r=>{
    const isSubtotal = !!r.__subtotal_level;
    const cells = header.map((c,ci)=>{
      if(isSubtotal){
        // put subtotal label in the corresponding column for the subtotal level
        if(ci === colIndexFor(r.__subtotal_level)){
          return `<td class="subtotal-row">${r.__subtotal_level.replace(/_/g," ")} SUBTOTAL — ${r.__subtotal_for}</td>`;
        }
        if(c==="SUM_QUANTITY_KG") return `<td class="subtotal-row">${(r.SUM_QUANTITY_KG||0).toLocaleString()}</td>`;
        if(c==="SUM_BILL_AMOUNT") return `<td class="subtotal-row">${(r.SUM_BILL_AMOUNT||0).toLocaleString()}</td>`;
        if(c==="SUM_QUANTITY_CS") return `<td class="subtotal-row">${(r.SUM_QUANTITY_CS||0).toLocaleString()}</td>`;
        return `<td class="subtotal-row"></td>`;
      } else {
        if(c==="SUM_QUANTITY_KG") return `<td>${(r.SUM_QUANTITY_KG||0).toLocaleString()}</td>`;
        if(c==="SUM_BILL_AMOUNT") return `<td>${(r.SUM_BILL_AMOUNT||0).toLocaleString()}</td>`;
        if(c==="SUM_QUANTITY_CS") return `<td>${(r.SUM_QUANTITY_CS||0).toLocaleString()}</td>`;
        return `<td>${r[c]??""}</td>`;
      }
    });
    return `<tr>${cells.join("")}</tr>`;
  }).join("") || `<tr><td colspan="${header.length}">No data</td></tr>`;

  // Grand totals only when TOTAL filter checked (any)
  const totalCols = s["TOTAL"]||[];
  if(totalCols.length){
    tf.innerHTML=`<tr class='grandtotal-row'>${header.map((c,ci)=>{
      if(c==="SUM_QUANTITY_KG") return `<td>${grand.SUM_QUANTITY_KG.toLocaleString()}</td>`;
      if(c==="SUM_BILL_AMOUNT") return `<td>${grand.SUM_BILL_AMOUNT.toLocaleString()}</td>`;
      if(c==="SUM_QUANTITY_CS") return `<td>${grand.SUM_QUANTITY_CS.toLocaleString()}</td>`;
      if(ci===0) return `<td><b>GRAND TOTAL</b></td>`;
      return `<td></td>`;
    }).join("")}</tr>`;
  } else tf.innerHTML="";

  document.getElementById("recordsInfo").textContent=`Rows: ${rows.length}`;
}

/* ---------- Debounced Apply ---------- */
const debounceApply=debounce(()=>{const s=getSelected();const d=cascadeAndAggregate(s);renderTable(d,s);},200);

/* ---------- Events ---------- */
document.getElementById("dateFrom").addEventListener("change",debounceApply);
document.getElementById("dateTo").addEventListener("change",debounceApply);
document.getElementById("monthQuick").addEventListener("change",debounceApply);

document.getElementById("yesterdayBtn").addEventListener("click",()=>{
  const t = new Date();
  t.setDate(t.getDate()-1);
  const iso = t.toISOString().slice(0,10);
  document.getElementById("dateFrom").value = iso;
  document.getElementById("dateTo").value = iso;
  debounceApply();
});

document.getElementById("clearBtn").addEventListener("click",()=>{
  document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false);
  document.getElementById("dateFrom").value="";document.getElementById("dateTo").value="";document.getElementById("monthQuick").value="";
  localStorage.removeItem(STORAGE_KEY);debounceApply();
});
document.getElementById("exportBtn").addEventListener("click",async()=>{
  const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet("ERP Export");
  const rows=[...document.querySelectorAll("#dataTable tr")].map(tr=>[...tr.children].map(td=>td.innerText.trim()));
  rows.forEach(r=>ws.addRow(r));ws.eachRow((r,i)=>{if(i===1)r.font={bold:true};});
  const buf=await wb.xlsx.writeBuffer();saveAs(new Blob([buf]),`ERP_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
});
document.getElementById("toggleFiltersBtn").addEventListener("click",()=>{
  const w=document.getElementById("filtersWrapper");
  if(w.style.display==="none"){w.style.display="block";document.getElementById("toggleFiltersBtn").textContent="Hide Filters";}
  else{w.style.display="none";document.getElementById("toggleFiltersBtn").textContent="Show Filters";}
});

/* ---------- INIT ---------- */
loadData();
</script>
</body>
</html>
