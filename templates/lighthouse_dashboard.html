<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SMC Lighthouse Sales Dashboard</title>
<link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">

<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>
:root{--navy:#1e3a8a;--accent1:#2563eb;--accent2:#4f46e5}
body{font-family:Inter,system-ui,Arial;margin:0;background:#f6f9fc;color:#0f172a}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff}
header h1{margin:0;font-weight:800;font-size:1.05rem}
header .left{display:flex;align-items:center;gap:12px}
.toolbar{display:flex;gap:8px;align-items:center}
.btn{border:0;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:700}
.btn-blue{background:#fff;color:var(--navy)}
.btn-gray{background:#eef2ff;color:#1e3a8a}
main{max-width:1500px;margin:14px auto;padding:0 12px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.controls input[type=date],.controls select{padding:6px;border-radius:6px;border:1px solid #dbeafe;background:#fff}
#filtersContainer{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.filter-box{background:linear-gradient(180deg,#fff,#f0f4ff);border:2px solid var(--navy);border-radius:12px;padding:10px 12px;flex:1 1 240px;box-shadow:0 6px 18px rgba(30,58,138,0.06)}
.filter-box strong{display:block;text-align:center;color:var(--navy);font-weight:900;margin-bottom:6px;border-bottom:2px solid #e6eef9;padding-bottom:6px}
.filter-box .options{max-height:220px;overflow:auto;padding-top:6px}
.filter-box label{display:block;padding:6px 8px;margin:4px 0;border-radius:8px;font-weight:700;cursor:pointer;transition:all .2s}
.filter-box label.invalid{opacity:.4;pointer-events:none}
.table-wrapper{background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(4,8,15,0.05);overflow:auto;max-height:72vh}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{border:1.5px solid #65738a;padding:6px 8px;text-align:center;font-weight:800;height:20px}
thead th{position:sticky;top:0;background:linear-gradient(90deg,#e0e7ff,#c7d2fe);color:#1e3a8a}
tr.subtotal-row td{background:#fff7cc;font-weight:900}
tr.grandtotal-row td{background:#bae6fd;font-weight:900}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.7);z-index:3000;font-weight:900;color:#1e3a8a}
.overlay.show{display:flex}
@media(max-width:900px){.filter-box{flex:1 1 100%}th,td{font-size:.85rem}}
</style>
</head>
<body>
<header>
  <div class="left">
    <img src="{{ url_for('static', filename='onlylogo.png') }}" style="height:40px">
    <h1>SMC Lighthouse Sales</h1>
  </div>
  <div class="toolbar">
    <a href="/sales_levels"><button class="btn btn-gray">← Back</button></a>
    <button id="exportBtn" class="btn btn-blue">Export</button>
    <button id="clearBtn" class="btn btn-gray">Clear</button>
    <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
  </div>
</header>

<main>
  <div class="controls">
    From: <input type="date" id="dateFrom"> 
    To: <input type="date" id="dateTo">
    <button id="yesterdayBtn" class="btn btn-gray">Yesterday</button>
    Invoice Month: <select id="monthQuick"><option value="">--All--</option></select>
    <small id="recordsInfo" style="margin-left:auto;color:#6b7280"></small>
  </div>

  <div id="filtersWrapper"><div id="filtersContainer"></div></div>

  <div class="table-wrapper">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
      <tfoot id="tableFoot"></tfoot>
    </table>
  </div>
</main>

<div id="overlay" class="overlay">Processing...</div>

<script>
const API_URL="/get_data/lighthouse_sales";
let rawData=[],allStates=[],allParties=[],allItems=[];

function parseDateFlexible(s){
  if(!s)return null;
  s=String(s).trim();
  if(/^\d{8}$/.test(s)){const d=+s.slice(0,2),m=+s.slice(2,4),y=+s.slice(4,8);return new Date(y,m-1,d);}
  const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  const d=new Date(s);
  return isNaN(d)?null:d;
}
function invoiceMonthLabel(s){const dt=parseDateFlexible(s);if(!dt)return"";return dt.toLocaleString('default',{month:'short',year:'numeric'});}
function formatDateInputISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function toNum(v){return Number(v)||0;}
function showOverlay(){document.getElementById('overlay').classList.add('show');}
function hideOverlay(){document.getElementById('overlay').classList.remove('show');}

async function loadData(){
  showOverlay();
  try{
    const res=await axios.get(API_URL);
    const data=Array.isArray(res.data)?res.data:[];
    rawData=data.map(r=>{
      const raw=(r.invoice_date||r.INVOICE_DATE||"").toString().trim();
      const parsed=parseDateFlexible(raw);
      return{
        state:(r.state||r.STATE||"").trim(),
        party_name:(r.party_name||r.PARTY_NAME||"").trim(),
        item_name:(r.item_name||r.ITEM_NAME||"").trim(),
        invoice_date:parsed?`${String(parsed.getDate()).padStart(2,'0')}${String(parsed.getMonth()+1).padStart(2,'0')}${parsed.getFullYear()}`:"",
        invoice_month:invoiceMonthLabel(raw),
        invoice_date_obj:parsed,
        quantity_cs:toNum(r.quantity_cs||r.Quantity_CS||0),
        quantity_kg:toNum(r.quantity_kg||r.Quantity_KG||0),
        bill_amount:toNum(r.bill_amount||r.Bill_Amount||0)
      };
    });

    allStates=[...new Set(rawData.map(r=>r.state))].sort();
    allParties=[...new Set(rawData.map(r=>r.party_name))].sort();
    allItems=[...new Set(rawData.map(r=>r.item_name))].sort();

    const months=[...new Set(rawData.map(r=>r.invoice_month).filter(Boolean))].sort();
    document.getElementById("monthQuick").innerHTML=`<option value="">--All--</option>`+months.map(m=>`<option value="${m}">${m}</option>`).join("");

    const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1),last=new Date(now.getFullYear(),now.getMonth()+1,0);
    document.getElementById("dateFrom").value=formatDateInputISO(first);
    document.getElementById("dateTo").value=formatDateInputISO(last);

    buildFilters();
    applyFilters();
  }finally{hideOverlay();}
}

function buildFilters(){
  const c=document.getElementById("filtersContainer");
  c.innerHTML="";
  const allCols=["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE","INVOICE_MONTH","SUM_QUANTITY_KG","SUM_BILL_AMOUNT","SUM_QUANTITY_CS"];
  const showHtml=allCols.map(v=>`<label><input type="checkbox" name="SHOW COLUMNS" value="${v}" checked> ${v}</label>`).join("");
  c.innerHTML+=`<div class="filter-box"><strong>SHOW COLUMNS</strong><label><input type="checkbox" data-all="SHOW COLUMNS"> All</label><div class="options">${showHtml}</div></div>`;

  const makeBox=(title,vals)=>`
    <div class="filter-box"><strong>${title}</strong>
      <label><input type="checkbox" data-all="${title}"> All</label>
      <div class="options">${vals.map(v=>`<label><input type="checkbox" name="${title}" value="${v}"> ${v}</label>`).join("")}</div>
    </div>`;
  c.innerHTML+=makeBox("STATE",allStates)+makeBox("PARTY_NAME",allParties)+makeBox("ITEM_NAME",allItems);

  c.querySelectorAll("input[data-all]").forEach(cb=>cb.addEventListener("change",e=>{
    const grp=e.target.dataset.all;
    c.querySelectorAll(`input[name='${grp}']`).forEach(i=>i.checked=e.target.checked);
    setTimeout(applyFilters,150);
  }));

  c.addEventListener("change",()=>setTimeout(applyFilters,150));
}

function applyFilters(){
  showOverlay();
  setTimeout(()=>{
    const selected={};
    document.querySelectorAll(".filter-box strong").forEach(h=>{
      const k=h.textContent.trim();
      selected[k]=[...document.querySelectorAll(`input[name='${k}']:checked`)].map(i=>i.value);
    });

    const selShow=selected["SHOW COLUMNS"]||[];
    const selState=selected["STATE"]||[],selParty=selected["PARTY_NAME"]||[],selItem=selected["ITEM_NAME"]||[];
    const from=new Date(document.getElementById("dateFrom").value+"T00:00:00");
    const to=new Date(document.getElementById("dateTo").value+"T23:59:59");

    let filtered=rawData.filter(r=>r.invoice_date_obj>=from&&r.invoice_date_obj<=to);
    if(selState.length)filtered=filtered.filter(r=>selState.includes(r.state));
    if(selParty.length)filtered=filtered.filter(r=>selParty.includes(r.party_name));
    if(selItem.length)filtered=filtered.filter(r=>selItem.includes(r.item_name));

    // Smart cascade
    const validStates=[...new Set(filtered.map(r=>r.state))];
    const validParties=[...new Set(filtered.map(r=>r.party_name))];
    const validItems=[...new Set(filtered.map(r=>r.item_name))];
    ["STATE","PARTY_NAME","ITEM_NAME"].forEach(type=>{
      document.querySelectorAll(`input[name='${type}']`).forEach(cb=>{
        const val=cb.value;
        const valid=(type==="STATE"?validStates:type==="PARTY_NAME"?validParties:validItems);
        cb.closest("label").classList.toggle("invalid",!valid.includes(val));
      });
    });

    const groupKey="STATE"; // top-level grouping for subtotal
    const map=new Map();
    filtered.forEach(r=>{
      const key=r[groupKey.toLowerCase()]||"";
      if(!map.has(key))map.set(key,[]);
      map.get(key).push(r);
    });

    const headerCols=selShow.length?selShow:["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE","INVOICE_MONTH","SUM_QUANTITY_KG","SUM_BILL_AMOUNT","SUM_QUANTITY_CS"];
    const thead=document.getElementById("tableHead"),tbody=document.getElementById("tableBody"),tfoot=document.getElementById("tableFoot");
    thead.innerHTML="<tr>"+headerCols.map(h=>`<th>${h.replace(/_/g,' ')}</th>`).join("")+"</tr>";

    let html="";
    map.forEach((arr,grp)=>{
      arr.forEach(r=>{
        html+="<tr>"+headerCols.map(c=>{
          if(c==="SUM_QUANTITY_KG")return `<td>${r.quantity_kg.toLocaleString()}</td>`;
          if(c==="SUM_BILL_AMOUNT")return `<td>${r.bill_amount.toLocaleString()}</td>`;
          if(c==="SUM_QUANTITY_CS")return `<td>${r.quantity_cs.toLocaleString()}</td>`;
          return `<td>${r[c.toLowerCase()]||r[c.toUpperCase()]||""}</td>`;
        }).join("")+"</tr>";
      });
      if(arr.length>1){
        const sub=arr.reduce((a,x)=>{a.kg+=x.quantity_kg;a.amt+=x.bill_amount;a.cs+=x.quantity_cs;return a;},{kg:0,amt:0,cs:0});
        html+=`<tr class="subtotal-row">`+headerCols.map((c,i)=>{
          if(c==="SUM_QUANTITY_KG")return `<td>${sub.kg.toLocaleString()}</td>`;
          if(c==="SUM_BILL_AMOUNT")return `<td>${sub.amt.toLocaleString()}</td>`;
          if(c==="SUM_QUANTITY_CS")return `<td>${sub.cs.toLocaleString()}</td>`;
          return i===0?`<td><b>Subtotal - ${grp}</b></td>`:`<td></td>`;
        }).join("")+`</tr>`;
      }
    });
    tbody.innerHTML=html||`<tr><td colspan="${headerCols.length}">No data</td></tr>`;

    const grand=filtered.reduce((a,r)=>{a.kg+=r.quantity_kg;a.amt+=r.bill_amount;a.cs+=r.quantity_cs;return a;},{kg:0,amt:0,cs:0});
    tfoot.innerHTML=`<tr class='grandtotal-row'>`+headerCols.map((c,i)=>{
      if(c==="SUM_QUANTITY_KG")return `<td>${grand.kg.toLocaleString()}</td>`;
      if(c==="SUM_BILL_AMOUNT")return `<td>${grand.amt.toLocaleString()}</td>`;
      if(c==="SUM_QUANTITY_CS")return `<td>${grand.cs.toLocaleString()}</td>`;
      return i===0?`<td><b>GRAND TOTAL</b></td>`:`<td></td>`;
    }).join("")+`</tr>`;

    document.getElementById("recordsInfo").textContent=`Rows: ${filtered.length}`;
    hideOverlay();
  },120);
}

document.getElementById("toggleFiltersBtn").addEventListener("click",()=>{
  const w=document.getElementById("filtersWrapper"),btn=document.getElementById("toggleFiltersBtn");
  if(w.style.display==="none"){w.style.display="block";btn.textContent="Hide Filters";}else{w.style.display="none";btn.textContent="Show Filters";}
});
document.getElementById("clearBtn").addEventListener("click",()=>{buildFilters();applyFilters();});
document.getElementById("exportBtn").addEventListener("click",async()=>{
  showOverlay();
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Lighthouse");
  const rows=[...document.querySelectorAll("#dataTable tr")].map(tr=>[...tr.children].map(td=>td.innerText.trim()));
  rows.forEach((r,i)=>{const row=ws.addRow(r);if(i===0)row.font={bold:true};});
  ws.columns.forEach(c=>c.width=18);
  const buf=await wb.xlsx.writeBuffer();
  saveAs(new Blob([buf]),`lighthouse_${new Date().toISOString().slice(0,10)}.xlsx`);
  hideOverlay();
});

loadData();
</script>
</body>
</html>
