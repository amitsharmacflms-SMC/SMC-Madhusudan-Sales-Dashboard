<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ERP — Plant → Depot / Direct</title>

  <!-- ExcelJS + FileSaver -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    :root {
      --navy:#1e3a8a; --accent-1:#2563eb; --accent-2:#9333ea;
      --muted:#6b7280; --success:#16a34a; --danger:#ef4444;
    }
    body {
      font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
      margin: 0; padding: 18px;
      background: linear-gradient(135deg,#eef2f3,#f7f8fc);
      color: #0f172a;
    }
    header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }
    header h1 { color: var(--navy); font-size: 1.05rem; font-weight: 800; margin: 0; }
    header img { height: 44px; }
    .toolbar { display: flex; gap: 8px; }
    .btn {
      border: none; padding: 8px 10px; border-radius: 8px;
      cursor: pointer; font-weight: 700;
    }
    .btn-blue { background: linear-gradient(90deg,var(--accent-2),var(--accent-1)); color: #fff; }
    .btn-gray { background: #f3f4f6; color: #0f172a; border: 1px solid #e6eef9; }
    .card {
      background: #fff; border-radius: 12px;
      padding: 12px; box-shadow: 0 8px 30px rgba(2,6,23,0.04); margin-bottom: 12px;
    }
    .filter-box {
      min-width: 180px; border: 2px solid var(--navy);
      border-radius: 10px; padding: 8px; background: #fff;
      box-shadow: 0 2px 10px rgba(2,6,23,0.04);
    }
    .filter-box strong {
      display: block; text-align: center; margin-bottom: 6px;
      font-weight: 800; color: var(--navy); font-size: 12px;
    }
    .filter-box label {
      display: inline-block; margin: 3px 6px; padding: 3px 6px;
      border-radius: 6px; background: #f8fafc; cursor: pointer;
      font-size: 13px;
    }
    table { border-collapse: collapse; width: 100%; min-width: 980px; }
    thead th {
      position: sticky; top: 0;
      background: linear-gradient(90deg,var(--accent-1),var(--accent-2));
      color: #fff; padding: 8px; font-weight: 800;
    }
    td, th { border: 1px solid #c7d2fe; text-align: center; padding: 8px; font-weight: 700; }
    .subtotal-row td { background: #f3e8ff; color: #2b154f; }
    .grandtotal-row td { background: #e0f2fe; color: #083344; font-weight: 900; }
  </style>
</head>

<body>
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo">
      <h1>SMC — ERP (Plant → Depot / Direct)</h1>
    </div>

    <div class="toolbar">
      <a href="sales_levels.html"><button class="btn btn-gray">⬅ Back</button></a>
      <a href="depot_direct.html"><button class="btn btn-blue">🏭 Depot - SS / Direct</button></a>
      <button id="exportBtn" class="btn btn-blue">Export</button>
      <button id="clearBtn" class="btn btn-gray">Clear Filters</button>
      <button id="toggleFiltersBtn" class="btn btn-gray">Hide Filters</button>
      <button id="themeToggle" class="btn btn-gray">Dark Mode</button>
    </div>
  </header>

  <main>
    <div class="card" id="filtersWrapper">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div>
          From: <input type="date" id="dateFrom">
          To: <input type="date" id="dateTo">
        </div>
        <small id="recordsInfo" style="color:var(--muted)"></small>
      </div>
      <div id="filtersContainer" style="display:flex;gap:10px;overflow:auto;"></div>
    </div>

    <div id="loader" class="card" style="text-align:center">Loading data…</div>

    <div class="card" style="overflow:auto;max-height:70vh;">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
  </main>

<script>
const API_ENDPOINT = "/get_data/lighthouse_sales";
let rawData = [];
const TEXT_COLS = ["STATE","PARTY_NAME","ITEM_NAME","INVOICE_DATE"];
const STORAGE_KEY = "lighthouse_saved_filters_final";

/* -------- Parse DD-MM-YYYY manually -------- */
function parseDDMMYYYY(str){
  if(!str) return null;
  const parts = str.split("-");
  if(parts.length === 3){
    const [dd,mm,yyyy] = parts.map(p=>parseInt(p));
    if(dd && mm && yyyy) return new Date(yyyy,mm-1,dd);
  }
  return null;
}

/* ---------- Helpers ---------- */
function num(v){return Number(v)||0;}
function debounce(fn,ms=250){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);}}

/* ---------- Build Filters ---------- */
function buildFiltersUI(){
  const f=document.getElementById("filtersContainer");
  f.innerHTML="";
  const boxes=[
    {key:"SHOW COLUMNS",vals:TEXT_COLS},
    {key:"STATE",vals:[...new Set(rawData.map(r=>r.state).filter(Boolean))].sort()},
    {key:"PARTY_NAME",vals:[...new Set(rawData.map(r=>r.party_name).filter(Boolean))].sort()},
    {key:"ITEM_NAME",vals:[...new Set(rawData.map(r=>r.item_name).filter(Boolean))].sort()},
    {key:"TOTAL",vals:TEXT_COLS}
  ];
  boxes.forEach(b=>{
    const div=document.createElement("div");
    div.className="filter-box";
    div.innerHTML=`<strong>${b.key}</strong>
      <label><input type="checkbox" data-all="${b.key}"> All</label>
      <div class="options">${b.vals.map(v=>`<label><input type="checkbox" name="${b.key}" value="${v}"> ${v}</label>`).join("")}</div>`;
    f.appendChild(div);
  });
  f.querySelectorAll("input[data-all]").forEach(cb=>{
    cb.addEventListener("change",e=>{
      const key=e.target.dataset.all;
      f.querySelectorAll(`input[name='${key}']`).forEach(i=>i.checked=e.target.checked);
      debounceApply();
    });
  });
  f.addEventListener("change",debounceApply);
}

/* ---------- Load Data ---------- */
async function loadData(){
  document.getElementById("loader").classList.remove("hidden");
  const res=await axios.get(API_ENDPOINT);
  rawData=res.data.map(r=>({
    state:r.state||r.STATE||"",
    party_name:r.party_name||r.PARTY_NAME||"",
    item_name:r.item_name||r.ITEM_NAME||"",
    invoice_date:(r.invoice_date||r.Invoice_Date||"").trim(),
    quantity_kg:num(r.quantity_kg||r.Quantity_KG),
    bill_amount:num(r.bill_amount||r.Bill_Amount),
    quantity_cs:num(r.quantity_cs||r.Quantity_CS)
  }));
  document.getElementById("recordsInfo").textContent=`Rows loaded: ${rawData.length}`;
  buildFiltersUI();
  debounceApply();
  document.getElementById("loader").classList.add("hidden");
}

/* ---------- Get selected filters ---------- */
function getSelected(){
  const s={};
  document.querySelectorAll(".filter-box").forEach(b=>{
    const t=b.querySelector("strong").textContent.trim();
    s[t]=[...b.querySelectorAll("input[name]")].filter(i=>i.checked).map(i=>i.value);
  });
  s.__from=document.getElementById("dateFrom").value;
  s.__to=document.getElementById("dateTo").value;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
  return s;
}

/* ---------- Cascade + Group ---------- */
function cascadeAndAggregate(sel){
  let f=[...rawData];

  // Date range filter (using manual DD-MM-YYYY parse)
  const from=sel.__from?new Date(sel.__from):null,to=sel.__to?new Date(sel.__to):null;
  if(from||to){
    f=f.filter(r=>{
      const d=parseDDMMYYYY(r.invoice_date);
      if(!d)return false;
      if(from&&d<from)return false;
      if(to&&d>to)return false;
      return true;
    });
  }

  // Cascade filters
  ["STATE","PARTY_NAME","ITEM_NAME"].forEach(k=>{
    const vals=sel[k]||[];
    if(vals.length) f=f.filter(r=>vals.includes(r[k.toLowerCase()]));
  });

  // Update downstream visibility (smart cascade)
  const sets={
    STATE:new Set(f.map(r=>r.state)),
    PARTY_NAME:new Set(f.map(r=>r.party_name)),
    ITEM_NAME:new Set(f.map(r=>r.item_name))
  };
  ["STATE","PARTY_NAME","ITEM_NAME"].forEach(k=>{
    document.querySelectorAll(`input[name='${k}']`).forEach(cb=>{
      const lbl=cb.closest("label");
      if(sets[k].has(cb.value)){lbl.style.display="";} else {lbl.style.display="none";cb.checked=false;}
    });
  });

  // Group by PARTY_NAME + ITEM_NAME
  const map=new Map();
  f.forEach(r=>{
    const key=[r.state,r.party_name,r.item_name].join("|");
    if(!map.has(key))
      map.set(key,{STATE:r.state,PARTY_NAME:r.party_name,ITEM_NAME:r.item_name,
        SUM_QUANTITY_KG:r.quantity_kg,SUM_BILL_AMOUNT:r.bill_amount,SUM_QUANTITY_CS:r.quantity_cs});
    else{
      const o=map.get(key);
      o.SUM_QUANTITY_KG+=r.quantity_kg;
      o.SUM_BILL_AMOUNT+=r.bill_amount;
      o.SUM_QUANTITY_CS+=r.quantity_cs;
    }
  });
  return [...map.values()];
}

/* ---------- Render with subtotal & grand total ---------- */
function renderTable(rows,sel){
  const th=document.getElementById("tableHead"),tb=document.getElementById("tableBody"),tf=document.getElementById("tableFoot");
  const show=sel["SHOW COLUMNS"].length?sel["SHOW COLUMNS"]:TEXT_COLS;
  const header=[...show,"SUM_QUANTITY_KG","SUM_BILL_AMOUNT","SUM_QUANTITY_CS"];
  th.innerHTML="<tr>"+header.map(h=>`<th>${h.replace(/_/g," ")}</th>`).join("")+"</tr>";
  let html="",curParty=null,acc=null;
  const sorted=[...rows].sort((a,b)=>a.PARTY_NAME.localeCompare(b.PARTY_NAME)||a.ITEM_NAME.localeCompare(b.ITEM_NAME));

  function subtotalRow(a){
    if(!a)return"";
    const c=header.map(h=>{
      if(h==="SUM_QUANTITY_KG")return`<td><b>${a.SUM_QUANTITY_KG.toLocaleString()}</b></td>`;
      if(h==="SUM_BILL_AMOUNT")return`<td><b>${a.SUM_BILL_AMOUNT.toLocaleString()}</b></td>`;
      if(h==="SUM_QUANTITY_CS")return`<td><b>${a.SUM_QUANTITY_CS.toLocaleString()}</b></td>`;
      if(h===header[0])return`<td><b>Subtotal for ${a.PARTY_NAME}</b></td>`;
      return"<td></td>";
    }).join("");
    return`<tr class='subtotal-row'>${c}</tr>`;
  }

  sorted.forEach(r=>{
    if(curParty!==r.PARTY_NAME){
      if(acc)html+=subtotalRow(acc);
      curParty=r.PARTY_NAME;
      acc={PARTY_NAME:r.PARTY_NAME,SUM_QUANTITY_KG:0,SUM_BILL_AMOUNT:0,SUM_QUANTITY_CS:0};
    }
    acc.SUM_QUANTITY_KG+=r.SUM_QUANTITY_KG;
    acc.SUM_BILL_AMOUNT+=r.SUM_BILL_AMOUNT;
    acc.SUM_QUANTITY_CS+=r.SUM_QUANTITY_CS;
    html+="<tr>"+header.map(h=>`<td>${r[h]??r[h.toLowerCase()]??""}</td>`).join("")+"</tr>";
  });
  html+=subtotalRow(acc);
  tb.innerHTML=html||`<tr><td colspan="${header.length}">No data</td></tr>`;

  const g={SUM_QUANTITY_KG:0,SUM_BILL_AMOUNT:0,SUM_QUANTITY_CS:0};
  rows.forEach(r=>{g.SUM_QUANTITY_KG+=r.SUM_QUANTITY_KG;g.SUM_BILL_AMOUNT+=r.SUM_BILL_AMOUNT;g.SUM_QUANTITY_CS+=r.SUM_QUANTITY_CS;});
  tf.innerHTML=`<tr class='grandtotal-row'>${header.map(h=>{
    if(h==="SUM_QUANTITY_KG")return`<td>${g.SUM_QUANTITY_KG.toLocaleString()}</td>`;
    if(h==="SUM_BILL_AMOUNT")return`<td>${g.SUM_BILL_AMOUNT.toLocaleString()}</td>`;
    if(h==="SUM_QUANTITY_CS")return`<td>${g.SUM_QUANTITY_CS.toLocaleString()}</td>`;
    if(h===header[0])return`<td><b>GRAND TOTAL</b></td>`;
    return"<td></td>";
  }).join("")}</tr>`;
}

/* ---------- Debounce Apply ---------- */
const debounceApply=debounce(()=>{
  const s=getSelected();
  const data=cascadeAndAggregate(s);
  renderTable(data,s);
},250);

/* ---------- Events ---------- */
document.getElementById("dateFrom").addEventListener("change",debounceApply);
document.getElementById("dateTo").addEventListener("change",debounceApply);
document.getElementById("clearBtn").addEventListener("click",()=>{
  document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false);
  document.getElementById("dateFrom").value="";
  document.getElementById("dateTo").value="";
  localStorage.removeItem(STORAGE_KEY);
  debounceApply();
});
document.getElementById("exportBtn").addEventListener("click",async()=>{
  const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet("ERP Export");
  const rows=[...document.querySelectorAll("#dataTable tr")].map(tr=>[...tr.children].map(td=>td.innerText.trim()));
  rows.forEach(r=>ws.addRow(r));
  ws.eachRow((r,i)=>{if(i===1)r.font={bold:true};});
  const buf=await wb.xlsx.writeBuffer();saveAs(new Blob([buf]),`ERP_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
});
loadData();
</script>
</body>
</html>
