<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Forgot Password</title></head>
<body class="flex items-center justify-center h-screen bg-gray-100">
  <form method="POST" class="bg-white p-6 rounded shadow-md w-96">
    <h2 class="text-xl mb-4 text-center">Forgot Password</h2>
    <input type="email" name="email" placeholder="Enter your email" class="w-full border p-2 rounded mb-3" required>
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded">Send Reset Link</button>
    <div class="text-center mt-3">
      <a href="/login">Back to Login</a>
    </div>
  </form>
</body>
</html>
