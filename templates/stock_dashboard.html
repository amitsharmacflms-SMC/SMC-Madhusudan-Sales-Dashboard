<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SMC - Stock Position (Optimized F1)</title>

  <!-- Critical CSS inline for faster LCP (header + table-head) -->
  <style>
    :root{
      --smc-blue:#0d6efd;
      --muted:#6b7280;
      --border:#9fb1c8;
      --card-bg:#ffffff;
      --row-height:46px;
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:linear-gradient(180deg,#f6fbff,#f2f6fb 60%)}
    .container{padding:14px}
    .top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
    .logo-title{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#0d6efd22,#0d6efd11);border-radius:10px;padding:8px 12px;border-left:6px solid var(--smc-blue)}
    .logo-title img{height:44px} .logo-title h1{margin:0;font-size:1.05rem;color:#073763;font-weight:800}
    .controls{display:flex;gap:8px;align-items:center}
    .btn-pill{border-radius:999px;padding:8px 12px}

    /* table header & frozen columns critical styles */
    .table-shell{border-radius:10px;background:var(--card-bg);box-shadow:0 6px 18px rgba(2,6,23,0.05);border:2px solid var(--border);overflow:hidden}
    .table-head{display:flex;align-items:stretch;background:linear-gradient(90deg,#f0f8ff,#ffffff);border-bottom:2px solid var(--border)}
    .thead-left, .thead-main{display:flex;align-items:center}
    .thead-left{flex:0 0 auto}
    .thead-main{flex:1 1 auto;overflow:auto}
    .thead-cell{padding:10px 12px;font-weight:800;color:#0b3b66;border-right:2px solid var(--border);white-space:nowrap}
    .thead-cell:last-child{border-right:0}
    /* frozen left layer */
    .frozen-wrap{position:relative;display:flex;z-index:8}
    .frozen-layer{position:relative;background:transparent;z-index:9;overflow:hidden;box-shadow:2px 0 6px rgba(2,6,23,0.04)}
    .main-layer{overflow:auto;flex:1 1 auto}
    /* body area (virtual) - non critical, loaded deferred */
    /* ensure table head height reserved for LCP */
    .thead-reserve{height:var(--row-height);visibility:hidden}
  </style>

  <!-- Defer non-critical styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"></noscript>

  <!-- SheetJS for export (deferred load later) -->
</head>
<body>
  <div class="container">
    <div class="top-row">
      <div class="logo-title">
        <img src="/static/onlylogo.png" alt="SMC" onerror="this.style.display='none'">
        <h1>SMC - Stock Position</h1>
      </div>

      <div class="controls">
        <a href="{{ url_for('sales_levels') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
        <a href="{{ url_for('dashboard_daily_sale') }}" class="btn btn-outline-primary btn-sm">Daily Sale</a>
        <button id="toggleFiltersBtn" class="btn btn-light btn-sm">Filters</button>
        <button id="yesterdayBtn" class="btn btn-info btn-sm text-white">Yesterday</button>

        <div class="dropdown">
          <button class="btn btn-outline-dark btn-sm dropdown-toggle" data-bs-toggle="dropdown">Columns</button>
          <div class="dropdown-menu dropdown-menu-end col-toggle" id="colToggleMenu" style="max-height:320px;overflow:auto;padding:10px;width:260px">
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="state" type="checkbox" checked> <label class="form-check-label">State</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="depot" type="checkbox" checked> <label class="form-check-label">Depot</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" id="dateColCheckbox" data-col="date" type="checkbox" checked> <label class="form-check-label">Date</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="sku_name" type="checkbox" checked> <label class="form-check-label">SKU Name</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="opening" type="checkbox" checked> <label class="form-check-label">Opening</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="qty_recd" type="checkbox" checked> <label class="form-check-label">Received</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="qty_sale" type="checkbox" checked> <label class="form-check-label">Sales</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="closing" type="checkbox" checked> <label class="form-check-label">Closing</label></div>
          </div>
        </div>

        <button id="exportBtn" class="btn btn-success btn-sm">Export</button>
      </div>
    </div>

    <!-- Filter (lazy) -->
    <div id="filterPanel" style="display:none;margin-bottom:10px" class="card p-3">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:end">
        <div style="min-width:150px">
          <label class="form-label">Month</label>
          <select id="filterMonth" class="form-select"><option value="">All</option></select>
        </div>
        <div style="min-width:150px">
          <label class="form-label">State</label>
          <select id="filterState" class="form-select"><option value="">All</option></select>
        </div>
        <div style="min-width:150px">
          <label class="form-label">Depot</label>
          <select id="filterDepot" class="form-select"><option value="">All</option></select>
        </div>
        <div style="min-width:220px;flex:1">
          <label class="form-label">SKU (search)</label>
          <input id="filterSKU" list="skuList" class="form-control" placeholder="Type or pick SKU"><datalist id="skuList"></datalist>
        </div>
        <div style="min-width:140px"><label class="form-label">From</label><input id="filterFrom" type="date" class="form-control"></div>
        <div style="min-width:140px"><label class="form-label">To</label><input id="filterTo" type="date" class="form-control"></div>
        <div style="min-width:120px"><button id="clearFilters" class="btn btn-outline-secondary w-100">Reset</button></div>
      </div>
    </div>

    <!-- Table shell: head + dual layers (frozen left + main scroll) -->
    <div class="table-shell" id="tableShell">
      <!-- table head reserve for LCP (prevents layout shift) -->
      <div class="thead-reserve" aria-hidden="true"></div>

      <!-- table head: frozen left + main -->
      <div class="table-head" role="heading" aria-level="1">
        <div class="thead-left frozen-wrap" id="theadLeft">
          <!-- left frozen header cells (State, Depot) -->
          <div class="thead-cell thead-left thead-cell-state" data-col="state">State
            <span class="resize-handle" data-col="state" style="display:inline-block;width:8px;cursor:col-resize;margin-left:6px"></span>
          </div>
          <div class="thead-cell thead-left thead-cell-depot" data-col="depot">Depot
            <span class="resize-handle" data-col="depot" style="display:inline-block;width:8px;cursor:col-resize;margin-left:6px"></span>
          </div>
        </div>
        <div class="thead-main" id="theadMain">
          <!-- main header (scrollable) -->
          <div class="thead-cell" data-col="date">Date <span class="resize-handle" data-col="date" style="display:inline-block;width:8px;cursor:col-resize;margin-left:6px"></span></div>
          <div class="thead-cell" data-col="sku_name" style="min-width:260px;text-align:left">SKU Name <span class="resize-handle" data-col="sku_name" style="display:inline-block;width:8px;cursor:col-resize;margin-left:6px"></span></div>
          <div class="thead-cell" data-col="opening">Opening <span class="resize-handle" data-col="opening" style="display:inline-block;width:8px;cursor:col-resize;margin-left:6px"></span></div>
          <div class="thead-cell" data-col="qty_recd">Received <span class="resize-handle" data-col="qty_recd" style="display:inline-block;width:8px;cursor:col-resize;margin-left:6px"></span></div>
          <div class="thead-cell" data-col="qty_sale">Sales <span class="resize-handle" data-col="qty_sale" style="display:inline-block;width:8px;cursor:col-resize;margin-left:6px"></span></div>
          <div class="thead-cell" data-col="closing">Closing <span class="resize-handle" data-col="closing" style="display:inline-block;width:8px;cursor:col-resize;margin-left:6px"></span></div>
        </div>
      </div>

      <!-- content wrapper (virtual) -->
      <div style="display:flex;min-height:260px">
        <!-- left frozen layer (virtualized rows for frozen columns) -->
        <div id="frozenLayer" class="frozen-layer" style="flex:0 0 auto;overflow:hidden;background:linear-gradient(90deg,#fff,#ffffff);border-right:2px solid var(--border)">
          <!-- rows injected here -->
        </div>

        <!-- main scroll layer (virtualized rows for remaining columns) -->
        <div id="mainLayer" class="main-layer" style="flex:1 1 auto;overflow:auto;position:relative">
          <!-- spacer and row nodes injected here -->
        </div>
      </div>

      <!-- skeleton loading (safe) -->
      <div id="skeleton" style="display:flex;align-items:center;justify-content:center;padding:16px">
        <div style="width:95%;padding:18px;border-radius:8px;background:linear-gradient(90deg,#f3f6fb,#eef6ff);text-align:center;color:var(--muted)">Loading stock — preparing fast view...</div>
      </div>

    </div>
  </div>

  <!-- defer heavy libs until after LCP -->
  <script>
    // Minimal helpers available early for interactions (LCP safe)
    const $ = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));
    function safeText(s){ return s==null ? '' : String(s); }
  </script>

  <!-- load non-critical scripts after paint using requestIdleCallback or setTimeout fallback -->
  <script>
  (function(){
    // ensure our "heavy" init starts after first paint
    const boot = () => {
      // lazy load XLSX (for export)
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.defer = true;
      document.head.appendChild(s);

      // Now load the main module (inline below)
      setTimeout(mainModule, 60);
    };

    if ('requestIdleCallback' in window) requestIdleCallback(boot, { timeout: 500 });
    else window.setTimeout(boot, 120);
  })();
  </script>

  <!-- mainModule (deferred) -->
  <script>
  function mainModule(){
    // -- Utilities
    const pad2 = n => String(n).padStart(2,'0');
    const fmt = v => (v==null || isNaN(+v)) ? '' : Number(v).toLocaleString();
    function parseDMYtoUTC(s){
      if(!s) return null;
      const m = String(s).trim().match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
      if(m) return new Date(Date.UTC(+m[3], +m[2]-1, +m[1]));
      const iso = new Date(s);
      return isNaN(iso)?null:new Date(Date.UTC(iso.getUTCFullYear(), iso.getUTCMonth(), iso.getUTCDate()));
    }
    function formatDateDDMMYYYYUTC(d){ if(!d) return ''; return `${pad2(d.getUTCDate())}-${pad2(d.getUTCMonth()+1)}-${d.getUTCFullYear()}`; }
    function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // DOM refs
    const filterPanel = document.getElementById('filterPanel');
    const toggleFiltersBtn = document.getElementById('toggleFiltersBtn');
    const yesterdayBtn = document.getElementById('yesterdayBtn');
    const filterMonth = document.getElementById('filterMonth');
    const filterState = document.getElementById('filterState');
    const filterDepot = document.getElementById('filterDepot');
    const filterSKU = document.getElementById('filterSKU');
    const filterFrom = document.getElementById('filterFrom');
    const filterTo = document.getElementById('filterTo');
    const clearFilters = document.getElementById('clearFilters');
    const skuList = document.getElementById('skuList');
    const exportBtn = document.getElementById('exportBtn');
    const colCheckboxes = Array.from(document.querySelectorAll('.col-toggle-checkbox'));
    const dateColCheckbox = document.getElementById('dateColCheckbox');

    const theadLeft = document.getElementById('theadLeft');
    const theadMain = document.getElementById('theadMain');
    const frozenLayer = document.getElementById('frozenLayer');
    const mainLayer = document.getElementById('mainLayer');
    const skeleton = document.getElementById('skeleton');

    // state
    let RAW = [], MERGED = [], FILTERED = [];
    const ROW_HEIGHT = 46;
    const BUFFER = 10;
    const NUMERIC_COLUMNS = ['opening','qty_recd','qty_sale','closing'];

    // store widths
    const defaultWidths = { state:120, depot:140, date:110, sku_name:310, opening:110, qty_recd:110, qty_sale:110, closing:110 };
    let colWidths = JSON.parse(localStorage.getItem('smc_col_widths')||'{}');
    colWidths = Object.assign({}, defaultWidths, colWidths);

    // safe showSkeleton
    function showSkeleton(on){
      if(!skeleton || !frozenLayer || !mainLayer) return;
      skeleton.style.display = on ? 'flex' : 'none';
      frozenLayer.style.display = on ? 'none' : '';
      mainLayer.style.display = on ? 'none' : '';
    }

    // Worker for merging (blob)
    const workerCode = `
      self.onmessage = function(e){
        try{
          const rows = e.data.rows;
          const map = new Map();
          for(const r of rows){
            const o = {};
            for(const k in r) o[String(k).trim().toLowerCase()] = r[k];
            const state = (o.state||'').toString().trim();
            const depot = (o.depot||'').toString().trim();
            const date = (o.date||'').toString().trim();
            const sku = (o.sku_name||'').toString().trim();
            const opening = Number(o.opening)||0;
            const qty_recd = Number(o.qty_recd)||0;
            const qty_sale = Number(o.qty_sale)||0;
            const closing = Number(o.closing)||0;
            const key = state + '||' + depot + '||' + date + '||' + sku;
            if(!map.has(key)) map.set(key, { state, depot, date, sku_name:sku, opening, qty_recd, qty_sale, closing });
            else {
              const g = map.get(key);
              g.opening += opening; g.qty_recd += qty_recd; g.qty_sale += qty_sale; g.closing += closing;
            }
          }
          self.postMessage({ ok:true, merged: Array.from(map.values()) });
        }catch(err){
          self.postMessage({ ok:false, error:String(err) });
        }
      };
    `;
    const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(workerBlob);
    let worker = null;
    try { worker = new Worker(workerUrl); } catch(err){ worker = null; console.warn('Worker not available'); }

    // fetch data + process
    function fetchAndProcess(){
      showSkeleton(true);
      fetch('/api/get_stock_data').then(r => r.json()).then(rows => {
        RAW = rows.map(r=>{
          const o={};
          for(const k in r) o[String(k).trim().toLowerCase()] = r[k];
          const state=(o.state||'').toString().trim();
          const depot=(o.depot||'').toString().trim();
          const date=(o.date||'').toString().trim();
          const sku=(o.sku_name||'').toString().trim();
          const opening=Number(o.opening)||0;
          const qty_recd=Number(o.qty_recd)||0;
          const qty_sale=Number(o.qty_sale)||0;
          const closing=Number(o.closing)||0;
          const _parsed_date = parseDMYtoUTC(date);
          const _month_key = _parsed_date ? \`\${_parsed_date.getUTCFullYear()}-\${pad2(_parsed_date.getUTCMonth()+1)}\` : '';
          return { state, depot, date, sku_name:sku, opening, qty_recd, qty_sale, closing, _parsed_date, _month_key };
        });

        // use worker to merge
        if(worker){
          worker.onmessage = function(ev){
            if(ev.data && ev.data.ok){
              MERGED = ev.data.merged.map(r=>{
                r._parsed_date = parseDMYtoUTC(r.date);
                r._month_key = r._parsed_date ? \`\${r._parsed_date.getUTCFullYear()}-\${pad2(r._parsed_date.getUTCMonth()+1)}\` : '';
                return r;
              });
              populateFilters();
              applyFilters();
              showSkeleton(false);
            } else {
              MERGED = mergeSync(RAW);
              populateFilters();
              applyFilters();
              showSkeleton(false);
            }
          };
          worker.postMessage({ rows: RAW });
        } else {
          MERGED = mergeSync(RAW);
          populateFilters();
          applyFilters();
          showSkeleton(false);
        }
      }).catch(err=>{
        console.error('fetch error', err);
        const e = document.createElement('div'); e.textContent = 'Failed to load data';
        skeleton.innerHTML = ''; skeleton.appendChild(e);
      });
    }

    function mergeSync(rows){
      const map = new Map();
      rows.forEach(r=>{
        const key = \`\${r.state}||\${r.depot}||\${r.date}||\${r.sku_name}\`;
        if(!map.has(key)) map.set(key, {...r});
        else {
          const g = map.get(key);
          g.opening += r.opening; g.qty_recd += r.qty_recd; g.qty_sale += r.qty_sale; g.closing += r.closing;
        }
      });
      return Array.from(map.values());
    }

    // populate filters
    function populateFilters(){
      const months = Array.from(new Set(MERGED.map(r=>r._month_key).filter(Boolean))).sort();
      filterMonth.innerHTML = '<option value="">All</option>' + months.map(m=>{ const [y,mm]=m.split('-'); const d=new Date(Date.UTC(y,mm-1,1)); return \`<option value="\${m}">\${d.toLocaleString(undefined,{month:'long'})} \${y}</option>\`; }).join('');
      const states = Array.from(new Set(MERGED.map(r=>r.state).filter(Boolean))).sort();
      filterState.innerHTML = '<option value="">All</option>' + states.map(s=>\`<option>\${s}</option>\`).join('');
      const depots = Array.from(new Set(MERGED.map(r=>r.depot).filter(Boolean))).sort();
      filterDepot.innerHTML = '<option value="">All</option>' + depots.map(d=>\`<option>\${d}</option>\`).join('');
      const skus = Array.from(new Set(MERGED.map(r=>r.sku_name).filter(Boolean))).sort();
      skuList.innerHTML = skus.map(s=>\`<option value="\${s}">\`).join('');
    }

    // events
    toggleFiltersBtn.addEventListener('click', ()=>{ filterPanel.style.display = filterPanel.style.display === 'none' ? 'block' : 'none'; });
    clearFilters.addEventListener('click', ()=>{ filterMonth.value=''; filterState.value=''; filterDepot.value=''; filterSKU.value=''; filterFrom.value=''; filterTo.value=''; applyFilters(); });
    yesterdayBtn.addEventListener('click', ()=>{ const now=new Date(); const y=new Date(now.getFullYear(), now.getMonth(), now.getDate()-1); const val = \`\${y.getFullYear()}-\${pad2(y.getMonth()+1)}-\${pad2(y.getDate())}\`; filterFrom.value=val; filterTo.value=val; applyFilters(); yesterdayBtn.classList.add('btn-success'); setTimeout(()=>yesterdayBtn.classList.remove('btn-success'),700); });

    [filterMonth, filterState, filterDepot, filterFrom, filterTo].forEach(el=>el.addEventListener('change', applyFilters));
    filterSKU.addEventListener('input', applyFilters);
    colCheckboxes.forEach(ch=>ch.addEventListener('change', ()=>{ reapplyColumnVisibility(); renderSmart(); }));

    // apply filters -> produce FILTERED
    function applyFilters(){
      const m = filterMonth.value; const s = filterState.value; const d = filterDepot.value; const skuQ = (filterSKU.value||'').toLowerCase().trim();
      const from = parseInputDateUTC(filterFrom.value); const to = parseInputDateUTC(filterTo.value);
      FILTERED = MERGED.filter(r=>{
        if(m && r._month_key !== m) return false;
        if(s && r.state !== s) return false;
        if(d && r.depot !== d) return false;
        if(skuQ && !r.sku_name.toLowerCase().includes(skuQ)) return false;
        if(from && (!r._parsed_date || r._parsed_date < from)) return false;
        if(to && (!r._parsed_date || r._parsed_date > to)) return false;
        return true;
      });
      renderSmart();
    }

    // decide normal vs month summary
    function renderSmart(){
      const monthSelected = !!filterMonth.value;
      const dateVisible = dateColCheckbox.checked;
      const summaryMode = monthSelected || !dateVisible;
      if(summaryMode) renderMonthSummary();
      else renderNormalMode();
    }

    // -- Rendering implementations build a list of items, then call virtual renderer
    // For brevity and reliability we reuse the approach of creating an "items" array then virtualizing.

    function renderNormalMode(){
      FILTERED.sort((a,b)=>{
        if(a.state!==b.state) return a.state.localeCompare(b.state);
        if(a.depot!==b.depot) return a.depot.localeCompare(b.depot);
        const da = a._parsed_date ? a._parsed_date.getTime() : 0;
        const db = b._parsed_date ? b._parsed_date.getTime() : 0;
        if(da!==db) return da-db;
        return a.sku_name.localeCompare(b.sku_name);
      });

      const items = [];
      let i=0;
      while(i<FILTERED.length){
        const ST = FILTERED[i].state, DP = FILTERED[i].depot;
        const block = []; let j=i;
        while(j<FILTERED.length && FILTERED[j].state===ST && FILTERED[j].depot===DP){ block.push(FILTERED[j]); j++; }
        let k=0;
        while(k<block.length){
          const dateVal = block[k].date;
          const group=[]; let m=k;
          while(m<block.length && block[m].date===dateVal){ group.push(block[m]); m++; }
          group.forEach(r => items.push({ type:'row', data:r }));
          const sub = group.reduce((acc,r)=>{ acc.open+=r.opening; acc.rec+=r.qty_recd; acc.sale+=r.qty_sale; acc.close+=r.closing; return acc; }, { open:0, rec:0, sale:0, close:0 });
          items.push({ type:'subtotal', data:{ labelDate: group[0]._parsed_date || group[0].date, sub }});
          k = m;
        }
        const depotAcc = block.reduce((acc,r)=>{ acc.open+=r.opening; acc.rec+=r.qty_recd; acc.sale+=r.qty_sale; acc.close+=r.closing; return acc; }, { open:0, rec:0, sale:0, close:0 });
        items.push({ type:'depotTotal', data: depotAcc, depot: DP });
        // state total if boundary
        if(j>=FILTERED.length || FILTERED[j].state !== ST){
          const stateAcc = FILTERED.filter(x=>x.state===ST).reduce((acc,r)=>{ acc.open+=r.opening; acc.rec+=r.qty_recd; acc.sale+=r.qty_sale; acc.close+=r.closing; return acc; }, { open:0, rec:0, sale:0, close:0 });
          items.push({ type:'stateTotal', data: stateAcc, state: ST });
        }
        i = j;
      }
      const overall = items.reduce((acc,it)=>{ if(it.type==='row'){ acc.open+=it.data.opening; acc.rec+=it.data.qty_recd; acc.sale+=it.data.qty_sale; acc.close+=it.data.closing; } else if(it.type==='subtotal'){ acc.open+=it.data.sub.open; acc.rec+=it.data.sub.rec; acc.sale+=it.data.sub.sale; acc.close+=it.data.sub.close; } else if(it.type==='depotTotal' || it.type==='stateTotal'){ acc.open+=it.data.open; acc.rec+=it.data.rec; acc.sale+=it.data.sale; acc.close+=it.data.close; } return acc; }, { open:0, rec:0, sale:0, close:0 });
      items.push({ type:'overall', data: overall });
      window._renderItems = items;
      virtualRender(items, { mode: 'normal' });
    }

    function renderMonthSummary(){
      const usable = FILTERED.slice();
      const groups = new Map();
      usable.forEach(r=>{
        const key = `${r.state}||${r.depot}||${r.sku_name}`;
        if(!groups.has(key)) groups.set(key, { state:r.state, depot:r.depot, sku_name:r.sku_name, openings:[{d:r._parsed_date,o:r.opening}], rec:r.qty_recd, sale:r.qty_sale });
        else { const g=groups.get(key); if(r._parsed_date) g.openings.push({d:r._parsed_date,o:r.opening}); g.rec+=r.qty_recd; g.sale+=r.qty_sale; }
      });
      const rows = Array.from(groups.values()).map(g=>{
        const opens = g.openings.filter(o=>o.d).sort((a,b)=>a.d-b.d);
        const opening = opens.length ? opens[0].o : 0;
        const rec = g.rec || 0, sale = g.sale || 0; const closing = opening + rec - sale;
        return { state:g.state, depot:g.depot, sku_name:g.sku_name, opening, qty_recd:rec, qty_sale:sale, closing };
      });
      rows.sort((a,b)=>{ if(a.state!==b.state) return a.state.localeCompare(b.state); if(a.depot!==b.depot) return a.depot.localeCompare(b.depot); return a.sku_name.localeCompare(b.sku_name); });

      const items = [];
      let i=0;
      while(i<rows.length){
        const ST = rows[i].state, DP = rows[i].depot;
        const block=[]; let j=i;
        while(j<rows.length && rows[j].state===ST && rows[j].depot===DP){ block.push(rows[j]); j++; }
        block.forEach(r=> items.push({ type:'row', data:r }));
        const depotAcc = block.reduce((a,t)=>{ a.open+=t.opening; a.rec+=t.qty_recd; a.sale+=t.qty_sale; a.close+=t.closing; return a; }, { open:0, rec:0, sale:0, close:0 });
        items.push({ type:'depotTotal', data: depotAcc, depot: DP });
        if(j>=rows.length || rows[j].state !== ST){
          const stateAcc = rows.filter(x=>x.state===ST).reduce((a,t)=>{ a.open+=t.opening; a.rec+=t.qty_recd; a.sale+=t.qty_sale; a.close+=t.closing; return a; }, { open:0, rec:0, sale:0, close:0 });
          items.push({ type:'stateTotal', data: stateAcc, state: ST });
        }
        i = j;
      }
      const overall = items.reduce((acc,it)=>{ if(it.type==='row'){ acc.open+=it.data.opening; acc.rec+=it.data.qty_recd; acc.sale+=it.data.qty_sale; acc.close+=it.data.closing; } else if(it.type==='depotTotal' || it.type==='stateTotal'){ acc.open+=it.data.open; acc.rec+=it.data.rec; acc.sale+=it.data.sale; acc.close+=it.data.close; } return acc; }, { open:0, rec:0, sale:0, close:0 });
      items.push({ type:'overall', data: overall });
      window._renderItems = items;
      virtualRender(items, { mode:'month' });
    }

    // virtual renderer: dual-layer approach (frozen + main)
    let poolMain = [], poolFrozen = [], totalItems = 0;
    function virtualRender(items, opts){
      totalItems = items.length;
      // set spacer height
      mainLayer.innerHTML = '';
      frozenLayer.innerHTML = '';

      const spacer = document.createElement('div');
      spacer.style.height = (totalItems * ROW_HEIGHT) + 'px';
      spacer.style.position = 'relative';
      mainLayer.appendChild(spacer);

      // decide visible rows
      const visibleRows = Math.max(3, Math.floor((mainLayer.clientHeight) / ROW_HEIGHT));
      const renderCount = visibleRows + BUFFER*2;

      // create pool
      poolMain = []; poolFrozen = [];
      for(let i=0;i<Math.min(renderCount, totalItems); i++){
        const mainRow = document.createElement('div'); mainRow.style.position='absolute'; mainRow.style.left='0'; mainRow.style.right='0'; mainRow.style.display='flex'; mainRow.style.height = ROW_HEIGHT+'px'; mainRow.className='vrow-main';
        const frozenRow = document.createElement('div'); frozenRow.style.position='absolute'; frozenRow.style.left='0'; frozenRow.style.width = (colWidths.state + colWidths.depot) + 'px'; frozenRow.style.display='flex'; frozenRow.style.height = ROW_HEIGHT+'px'; frozenRow.className='vrow-frozen';

        mainLayer.appendChild(mainRow); frozenLayer.appendChild(frozenRow);
        poolMain.push(mainRow); poolFrozen.push(frozenRow);
      }

      // attach scroll handler
      mainLayer.onscroll = onScroll;
      // initial paint
      onScroll();
    }

    function getVisibleColumns(){
      const ths = Array.from(document.querySelectorAll('.thead-main .thead-cell'));
      const leftThs = Array.from(document.querySelectorAll('#theadLeft .thead-cell'));
      // build order: frozen left (state,depot) + main (ths)
      const visible = [];
      // frozen left visibility comes from checkboxes
      const leftCols = ['state','depot'];
      leftCols.forEach(c=>{
        const ch = document.querySelector(`.col-toggle-checkbox[data-col="${c}"]`);
        if(!ch || ch.checked) visible.push(c);
      });
      ths.forEach(th => {
        const col = th.dataset.col;
        const ch = document.querySelector(`.col-toggle-checkbox[data-col="${col}"]`);
        if(!ch || ch.checked) visible.push(col);
      });
      return visible;
    }

    function onScroll(){
      const scrollTop = mainLayer.scrollTop;
      const firstIndex = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - BUFFER);
      paintRange(firstIndex);
    }

    function paintRange(firstIndex){
      const items = window._renderItems || [];
      for(let i=0;i<poolMain.length;i++){
        const idx = firstIndex + i;
        const mainRow = poolMain[i];
        const frozenRow = poolFrozen[i];
        if(idx >= items.length){
          mainRow.style.display = 'none';
          frozenRow.style.display = 'none';
          continue;
        }
        mainRow.style.display = 'flex';
        frozenRow.style.display = 'flex';
        mainRow.style.top = (idx * ROW_HEIGHT) + 'px';
        frozenRow.style.top = (idx * ROW_HEIGHT) + 'px';

        const it = items[idx];
        renderMainRow(mainRow, it);
        renderFrozenRow(frozenRow, it);
      }
    }

    function renderMainRow(node, it){
      // create cells matching visible main columns (exclude frozen ones)
      const visible = getVisibleColumns();
      // main columns exclude 'state' and 'depot' (that's frozen)
      const mainCols = visible.filter(c => c !== 'state' && c !== 'depot');
      // ensure child count
      if(node.children.length !== mainCols.length){
        node.innerHTML = '';
        mainCols.forEach(col=>{
          const td = document.createElement('div');
          td.setAttribute('data-col', col);
          td.style.whiteSpace='nowrap';
          td.style.overflow='hidden';
          td.style.textOverflow='ellipsis';
          td.style.padding = '8px 10px';
          // set width
          td.style.flex = `0 0 ${colWidths[col] || 120}px`;
          td.style.boxSizing = 'border-box';
          if(NUMERIC_COLUMNS.includes(col)) td.style.textAlign = 'right'; else if(col==='sku_name') td.style.textAlign='left'; else td.style.textAlign='center';
          node.appendChild(td);
        });
      }
      // fill values
      mainCols.forEach((col,ci)=>{
        const td = node.children[ci];
        td.textContent = '';
        if(it.type === 'row'){
          const d = it.data;
          if(col==='date') td.textContent = d._parsed_date ? formatDateDDMMYYYYUTC(d._parsed_date) : d.date || '';
          else if(col==='sku_name') td.textContent = d.sku_name || '';
          else if(col==='opening') td.textContent = fmt(d.opening);
          else if(col==='qty_recd') td.textContent = fmt(d.qty_recd);
          else if(col==='qty_sale') td.textContent = fmt(d.qty_sale);
          else if(col==='closing') td.textContent = fmt(d.closing);
          else td.textContent = d[col] || '';
        } else if(it.type === 'subtotal'){
          if(col === 'date'){ td.textContent = `subtotal of Date (${ it.data.labelDate instanceof Date ? formatDateDDMMYYYYUTC(it.data.labelDate) : it.data.labelDate })`; td.style.fontWeight='700'; td.style.textAlign='center'; }
          else if(col==='opening') td.textContent = fmt(it.data.sub.open);
          else if(col==='qty_recd') td.textContent = fmt(it.data.sub.rec);
          else if(col==='qty_sale') td.textContent = fmt(it.data.sub.sale);
          else if(col==='closing') td.textContent = fmt(it.data.sub.close);
          else td.textContent = '';
        } else if(it.type === 'depotTotal' || it.type === 'stateTotal' || it.type==='overall'){
          if(col==='opening') td.textContent = fmt(it.data.open);
          else if(col==='qty_recd') td.textContent = fmt(it.data.rec);
          else if(col==='qty_sale') td.textContent = fmt(it.data.sale);
          else if(col==='closing') td.textContent = fmt(it.data.close);
          else td.textContent = '';
        }
      });
    }

    function renderFrozenRow(node, it){
      // frozen columns are state + depot (visible depending on toggles)
      const leftCols = [];
      if(document.querySelector(`.col-toggle-checkbox[data-col="state"]`).checked) leftCols.push('state');
      if(document.querySelector(`.col-toggle-checkbox[data-col="depot"]`).checked) leftCols.push('depot');

      // ensure children
      if(node.children.length !== leftCols.length){
        node.innerHTML = '';
        leftCols.forEach(col=>{
          const td = document.createElement('div'); td.setAttribute('data-col',col); td.style.padding='8px 10px'; td.style.boxSizing='border-box'; td.style.flex = `0 0 ${colWidths[col] || 120}px`; td.style.whiteSpace='nowrap'; td.style.overflow='hidden'; td.style.textOverflow='ellipsis'; td.style.borderRight='2px solid var(--border)'; td.style.background='inherit'; node.appendChild(td);
        });
      }
      leftCols.forEach((col,ci)=>{
        const td = node.children[ci];
        td.textContent = '';
        if(it.type === 'row'){ td.textContent = it.data[col] || ''; }
        else if(it.type === 'subtotal'){ if(ci===0) { td.textContent = `subtotal of Date (${ it.data.labelDate instanceof Date ? formatDateDDMMYYYYUTC(it.data.labelDate) : it.data.labelDate })`; td.style.fontWeight='700'; } else td.textContent=''; }
        else if(it.type === 'depotTotal'){ if(ci===0) td.textContent = `GRAND TOTAL OF ${it.depot||''}`; else td.textContent=''; }
        else if(it.type === 'stateTotal'){ if(ci===0) td.textContent = `GRAND TOTAL OF ${it.state||''}`; else td.textContent=''; }
        else if(it.type === 'overall'){ if(ci===0) td.textContent = `OVERALL GRAND TOTAL`; else td.textContent=''; }
      });

      // adjust frozen width
      const width = (leftCols.reduce((s,c)=>s + (colWidths[c]||120), 0));
      node.style.width = width + 'px';
    }

    // column resize logic (drag handle)
    let resizing = null;
    function initResizeHandles(){
      const handles = Array.from(document.querySelectorAll('.resize-handle'));
      handles.forEach(h=>{
        h.addEventListener('mousedown', (ev)=>{
          const col = h.dataset.col;
          resizing = { col, startX: ev.clientX, startWidth: colWidths[col] || defaultWidths[col] };
          document.body.style.cursor = 'col-resize';
          ev.preventDefault();
        });
      });
      window.addEventListener('mousemove', (ev)=>{
        if(!resizing) return;
        const delta = ev.clientX - resizing.startX;
        const newW = Math.max(60, Math.round(resizing.startWidth + delta));
        colWidths[resizing.col] = newW;
        // persist
        localStorage.setItem('smc_col_widths', JSON.stringify(colWidths));
        // update header & pools
        updateHeaderWidths();
        if(window._renderItems) paintRange(Math.max(0, Math.floor((mainLayer.scrollTop) / ROW_HEIGHT) - BUFFER));
      });
      window.addEventListener('mouseup', ()=>{ if(resizing){ resizing = null; document.body.style.cursor = ''; } });
    }

    function updateHeaderWidths(){
      // frozen
      const stateTh = document.querySelector('.thead-cell[data-col="state"]');
      const depotTh = document.querySelector('.thead-cell[data-col="depot"]');
      if(stateTh) stateTh.style.width = (colWidths.state || defaultWidths.state) + 'px';
      if(depotTh) depotTh.style.width = (colWidths.depot || defaultWidths.depot) + 'px';
      // main
      const mainThs = document.querySelectorAll('.thead-main .thead-cell');
      mainThs.forEach(th=>{
        const col = th.dataset.col;
        if(colWidths[col]) th.style.width = (colWidths[col] || defaultWidths[col]) + 'px';
        else th.style.width = '';
      });
      // frozen layer width
      frozenLayer.style.width = ((colWidths.state||defaultWidths.state) + (colWidths.depot||defaultWidths.depot)) + 'px';
    }

    function reapplyColumnVisibility(){
      // header visibility
      const leftCols = ['state','depot'];
      leftCols.forEach(c=>{
        const ch = document.querySelector(`.col-toggle-checkbox[data-col="${c}"]`);
        const elem = document.querySelector(`#theadLeft .thead-cell[data-col="${c}"]`);
        if(elem) elem.style.display = (ch && ch.checked) ? '' : 'none';
      });
      const mainThs = document.querySelectorAll('.thead-main .thead-cell');
      mainThs.forEach(th=>{
        const ch = document.querySelector(`.col-toggle-checkbox[data-col="${th.dataset.col}"]`);
        th.style.display = (ch && ch.checked) ? '' : 'none';
      });

      // adjust frozenLayer display if both hidden
      const stateVisible = document.querySelector(`.col-toggle-checkbox[data-col="state"]`).checked;
      const depotVisible = document.querySelector(`.col-toggle-checkbox[data-col="depot"]`).checked;
      frozenLayer.style.display = (stateVisible || depotVisible) ? '' : 'none';
      updateHeaderWidths();
    }

    // export handler
    exportBtn.addEventListener('click', ()=>{
      // ensure XLSX loaded
      if(typeof XLSX === 'undefined'){ alert('Export library not loaded yet — try again in a moment'); return; }
      const header = ['State','Depot','Date','SKU Name','Opening','Received','Sales','Closing'];
      const rows = [];
      const items = window._renderItems || [];
      items.forEach(it=>{
        if(it.type === 'row'){
          const d = it.data;
          rows.push([d.state,d.depot,d._parsed_date?formatDateDDMMYYYYUTC(d._parsed_date):d.date,d.sku_name,d.opening,d.qty_recd,d.qty_sale,d.closing]);
        } else if(it.type === 'subtotal'){
          rows.push([`Subtotal (${it.data.labelDate instanceof Date ? formatDateDDMMYYYYUTC(it.data.labelDate): it.data.labelDate})`,'','','', it.data.sub.open, it.data.sub.rec, it.data.sub.sale, it.data.sub.close]);
        } else if(it.type === 'depotTotal'){
          rows.push([`GRAND TOTAL OF ${it.depot||''}`,'','','', it.data.open, it.data.rec, it.data.sale, it.data.close]);
        } else if(it.type === 'stateTotal'){
          rows.push([`GRAND TOTAL OF ${it.state||''}`,'','','', it.data.open, it.data.rec, it.data.sale, it.data.close]);
        } else if(it.type === 'overall'){
          rows.push([`OVERALL GRAND TOTAL`,'','','', it.data.open, it.data.rec, it.data.sale, it.data.close]);
        }
      });
      const aoa = [header, ...rows];
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb, ws, 'Stock');
      XLSX.writeFile(wb, `stock_export_${new Date().toISOString().slice(0,10)}.xlsx`);
    });

    // init
    updateHeaderWidths();
    initResizeHandles();
    reapplyColumnVisibility();
    fetchAndProcess();
  } // end mainModule
  </script>
</body>
