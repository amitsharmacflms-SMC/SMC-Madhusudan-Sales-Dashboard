<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stock Position</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- SheetJS for Excel export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body { padding: 18px; background: #f8fafc; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial; }
    .small-muted { font-size:.9rem; color:#6b7280; }
    /* table wrapper: allow horizontal + vertical scroll */
    .table-wrap {
      width: 100%;
      overflow: auto; /* horizontal + vertical */
      max-height: 62vh;
      border: 1px solid #e6e6e6;
      border-radius: 4px;
      background: #fff;
    }
    table { border-collapse: collapse; width: 100%; }
    thead th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      z-index: 3;
      border-bottom: 1px solid #ddd;
      text-align: center; /* headers centered */
      vertical-align: middle;
    }
    tbody td { border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    /* center numeric cells */
    td.center { text-align: center; }
    td.left { text-align: left; padding-left:8px; }
    .totals-row td { font-weight: 700; background:#f1f5f9; text-align:center; }
    /* small scrollbar space */
    .table-wrap::-webkit-scrollbar { height:10px; width:10px; }
    .sticky-footer { background:#fff; border-top:1px solid #e6e6e6; padding-top:8px; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">📦 Stock Position</h4>
      <div>
        <a href="{{ url_for('sales_levels') }}" class="btn btn-outline-secondary btn-sm me-2">← Back</a>
        <a href="{{ url_for('dashboard_daily_sale') }}" class="btn btn-outline-primary btn-sm me-2">Daily Sale</a>
        <button id="exportBtn" class="btn btn-success btn-sm">Export Excel</button>
      </div>
    </div>

    <!-- Filters (top row) -->
    <div class="card mb-3">
      <div class="card-body">
        <form id="filtersForm" class="row g-2 align-items-end">
          <div class="col-md-2">
            <label class="form-label small-muted">Month</label>
            <select id="filterMonth" class="form-select"></select>
          </div>

          <div class="col-md-2">
            <label class="form-label small-muted">State</label>
            <select id="filterState" class="form-select"><option value="">All</option></select>
          </div>

          <div class="col-md-2">
            <label class="form-label small-muted">Depot</label>
            <select id="filterDepot" class="form-select"><option value="">All</option></select>
          </div>

          <div class="col-md-2">
            <label class="form-label small-muted">SKU</label>
            <select id="filterSKU" class="form-select"><option value="">All</option></select>
          </div>

          <div class="col-md-2">
            <label class="form-label small-muted">From (Date)</label>
            <input id="filterFrom" type="date" class="form-control">
          </div>

          <div class="col-md-2">
            <label class="form-label small-muted">To (Date)</label>
            <input id="filterTo" type="date" class="form-control">
          </div>
        </form>
      </div>
    </div>

    <!-- controls: page size + paginator info -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <div>
        <span class="small-muted">Rows</span>
        <select id="pageSize" class="form-select d-inline-block" style="width:90px;">
          <option>10</option><option>25</option><option>50</option><option>100</option>
        </select>
      </div>
      <div class="d-flex align-items-center">
        <div id="rowsInfo" class="small-muted me-3"></div>
        <nav><ul id="paginator" class="pagination pagination-sm mb-0"></ul></nav>
      </div>
    </div>

    <!-- table wrapper (horizontal + vertical scroll) -->
    <div class="table-wrap mb-2">
      <table id="stockTable" class="table table-sm table-bordered mb-0">
        <thead>
          <tr>
            <th style="min-width:140px;">State</th>
            <th style="min-width:160px;">Depot</th>
            <th style="min-width:120px;">Date</th>
            <th style="min-width:300px; text-align:left;">SKU Name</th>
            <th style="min-width:110px;">Opening</th>
            <th style="min-width:110px;">Received</th>
            <th style="min-width:110px;">Sales</th>
            <th style="min-width:110px;">Closing</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr class="totals-row">
            <td colspan="4" class="text-end">Page Total →</td>
            <td id="page_total_open"></td>
            <td id="page_total_rec"></td>
            <td id="page_total_sale"></td>
            <td id="page_total_close"></td>
          </tr>
          <tr class="totals-row">
            <td colspan="4" class="text-end">Grand Total →</td>
            <td id="grand_total_open"></td>
            <td id="grand_total_rec"></td>
            <td id="grand_total_sale"></td>
            <td id="grand_total_close"></td>
          </tr>
        </tfoot>
      </table>
    </div>

  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  // Utilities
  const parseDatePreferDMY = s => {
    if (!s) return null;
    // Try ISO first
    const iso = new Date(s);
    if (!isNaN(iso)) return iso;
    // Try dd-mm-yyyy or d-m-yyyy
    const m = String(s).trim().match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
    if (m) {
      const day = +m[1], mon = +m[2]-1, year = +m[3] < 100 ? 2000 + +m[3] : +m[3];
      return new Date(year, mon, day);
    }
    // fallback
    const fallback = new Date(s);
    return isNaN(fallback) ? null : fallback;
  };
  const fmt = v => (v == null || isNaN(+v)) ? '' : Number(v).toLocaleString();

  // App state
  let RAW = [], FILTERED = [], PAGE = 1, PAGE_SIZE = 25;

  // DOM
  const tbody = document.querySelector("#stockTable tbody");
  const filterMonth = document.getElementById("filterMonth");
  const filterState = document.getElementById("filterState");
  const filterDepot = document.getElementById("filterDepot");
  const filterSKU = document.getElementById("filterSKU");
  const filterFrom = document.getElementById("filterFrom");
  const filterTo = document.getElementById("filterTo");
  const pageSizeSel = document.getElementById("pageSize");
  const paginator = document.getElementById("paginator");
  const rowsInfo = document.getElementById("rowsInfo");
  const exportBtn = document.getElementById("exportBtn");

  // Load data
  async function loadData() {
    try {
      const res = await fetch("/api/get_stock_data");
      RAW = await res.json();

      // normalize keys, ensure numeric, parse date
      RAW = RAW.map(r => {
        const obj = {};
        for (const k in r) obj[k.trim().toLowerCase()] = r[k];
        obj.opening = Number(obj.opening) || 0;
        obj.qty_recd = Number(obj.qty_recd) || 0;
        obj.qty_sale = Number(obj.qty_sale) || 0;
        obj.closing = Number(obj.closing) || 0;
        obj._parsed_date = parseDatePreferDMY(obj.date);
        obj._month_key = obj._parsed_date ? `${obj._parsed_date.getFullYear()}-${String(obj._parsed_date.getMonth()+1).padStart(2,'0')}` : '';
        return obj;
      });

      populateFilters();
      applyFilters(); // initial render
    } catch (err) {
      console.error("Load failed", err);
      tbody.innerHTML = `<tr><td colspan="8" class="text-danger p-3">Failed to load data</td></tr>`;
    }
  }

  // Populate filters including Month dropdown (unique months from data)
  function populateFilters() {
    const months = Array.from(new Set(RAW.map(r => r._month_key).filter(Boolean))).sort();
    // Month names human-friendly: e.g. "2025-11" -> "November 2025"
    filterMonth.innerHTML = "<option value=''>All</option>" + months.map(m => {
      const [y, mm] = m.split("-");
      const date = new Date(y, Number(mm)-1, 1);
      return `<option value="${m}">${date.toLocaleString(undefined, { month: 'long' })} ${y}</option>`;
    }).join("");

    const states = Array.from(new Set(RAW.map(r => r.state || '').filter(Boolean))).sort();
    filterState.innerHTML = "<option value=''>All</option>" + states.map(s => `<option>${s}</option>`).join("");

    const depots = Array.from(new Set(RAW.map(r => r.depot || '').filter(Boolean))).sort();
    filterDepot.innerHTML = "<option value=''>All</option>" + depots.map(d => `<option>${d}</option>`).join("");

    const skus = Array.from(new Set(RAW.map(r => r.sku_name || '').filter(Boolean))).sort();
    filterSKU.innerHTML = "<option value=''>All</option>" + skus.map(s => `<option>${s}</option>`).join("");
  }

  // Instant filtering on change
  [filterMonth, filterState, filterDepot, filterSKU, filterFrom, filterTo].forEach(el => {
    el.addEventListener('change', () => { PAGE = 1; applyFilters(); });
  });

  function applyFilters() {
    const m = filterMonth.value; // "YYYY-MM"
    const s = filterState.value;
    const d = filterDepot.value;
    const sku = filterSKU.value;
    const from = filterFrom.value ? new Date(filterFrom.value) : null;
    const to = filterTo.value ? new Date(filterTo.value) : null;

    FILTERED = RAW.filter(r => {
      if (m && r._month_key !== m) return false;
      if (s && (r.state || '') !== s) return false;
      if (d && (r.depot || '') !== d) return false;
      if (sku && (r.sku_name || '') !== sku) return false;
      if (from && (!r._parsed_date || r._parsed_date < from)) return false;
      if (to && (!r._parsed_date || r._parsed_date > to)) return false;
      return true;
    });
    renderPage();
  }

  // Render + pagination
  function renderPage() {
    PAGE_SIZE = Number(pageSizeSel.value) || 25;
    const total = FILTERED.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (PAGE > totalPages) PAGE = totalPages;
    const start = (PAGE-1)*PAGE_SIZE;
    const end = start + PAGE_SIZE;
    const pageRows = FILTERED.slice(start, end);

    // Build rows - SKU name left align, numeric centered
    tbody.innerHTML = pageRows.map(r => `
      <tr>
        <td class="center">${r.state || ''}</td>
        <td class="center">${r.depot || ''}</td>
        <td class="center">${r.date || ''}</td>
        <td class="left">${(r.sku_name || '')}</td>
        <td class="center">${fmt(r.opening)}</td>
        <td class="center">${fmt(r.qty_recd)}</td>
        <td class="center">${fmt(r.qty_sale)}</td>
        <td class="center">${fmt(r.closing)}</td>
      </tr>`).join('');

    rowsInfo.textContent = `${Math.min(total, start+1)}-${Math.min(total, end)} of ${total}`;

    buildPaginator(totalPages);

    // page totals
    const p = pageRows.reduce((a, r) => { a.open += r.opening; a.rec += r.qty_recd; a.sale += r.qty_sale; a.close += r.closing; return a; }, {open:0,rec:0,sale:0,close:0});
    document.getElementById("page_total_open").textContent = fmt(p.open);
    document.getElementById("page_total_rec").textContent = fmt(p.rec);
    document.getElementById("page_total_sale").textContent = fmt(p.sale);
    document.getElementById("page_total_close").textContent = fmt(p.close);

    // grand totals
    const g = FILTERED.reduce((a, r) => { a.open += r.opening; a.rec += r.qty_recd; a.sale += r.qty_sale; a.close += r.closing; return a; }, {open:0,rec:0,sale:0,close:0});
    document.getElementById("grand_total_open").textContent = fmt(g.open);
    document.getElementById("grand_total_rec").textContent = fmt(g.rec);
    document.getElementById("grand_total_sale").textContent = fmt(g.sale);
    document.getElementById("grand_total_close").textContent = fmt(g.close);
  }

  // Paginator builder
  function buildPaginator(totalPages) {
    paginator.innerHTML = "";
    const create = (p, label=null, disabled=false, active=false) => `<li class="page-item ${disabled?'disabled':''} ${active?'active':''}"><a class="page-link" href="#" data-page="${p}">${label || p}</a></li>`;
    paginator.insertAdjacentHTML("beforeend", create(Math.max(1,PAGE-1), "«", PAGE===1));
    // show window of pages
    const maxButtons = 7;
    let start = Math.max(1, PAGE - Math.floor(maxButtons/2));
    let end = Math.min(totalPages, start + maxButtons - 1);
    if (end - start + 1 < maxButtons) start = Math.max(1, end - maxButtons + 1);
    for (let p = start; p <= end; p++) paginator.insertAdjacentHTML("beforeend", create(p, null, false, p===PAGE));
    paginator.insertAdjacentHTML("beforeend", create(Math.min(totalPages, PAGE+1), "»", PAGE===totalPages));

    // bind
    [...paginator.querySelectorAll("a.page-link")].forEach(a => a.addEventListener('click', ev => {
      ev.preventDefault();
      const p = Number(a.dataset.page);
      if (!isNaN(p) && p >= 1) { PAGE = p; renderPage(); }
    }));
  }

  // Export filtered set to Excel (single sheet)
  function exportToExcel() {
    const wsData = [
      ["State","Depot","Date","SKU Name","Opening","Received","Sales","Closing"],
      ...FILTERED.map(r => [r.state, r.depot, r.date, r.sku_name, r.opening, r.qty_recd, r.qty_sale, r.closing])
    ];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Stock");
    XLSX.writeFile(wb, `stock_export_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  // Event binds
  pageSizeSel.addEventListener('change', () => { PAGE = 1; renderPage(); });
  exportBtn.addEventListener('click', exportToExcel);

  // initialize
  loadData();
  </script>
</body>
</html>
