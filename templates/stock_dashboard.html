<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC - Stock Position</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --border-color: #bfc8d1;
      --header-blue: #e7f1ff;
    }
    body { padding:18px; background:#f8fafc; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial; }
    /* Logo header */
    .logo-header {
      text-align:center;
      padding:10px 16px;
      border:3px solid #0d6efd;
      border-radius:8px;
      background: var(--header-blue);
      margin-bottom:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
    }
    .logo-header img { height:56px; display:block; }
    .logo-header h2 { margin:0; font-weight:700; font-size:1.25rem; color:#073763; }

    /* Controls */
    .controls { display:flex; gap:8px; align-items:center; }
    .small-muted { color:#6b7280; font-size:.9rem; }

    /* Table container */
    .table-wrap { width:100%; overflow:auto; max-height:68vh; border:1.5px solid var(--border-color); border-radius:6px; background:#fff; }
    table { border-collapse: collapse; width:100%; }
    table, th, td { border: 1.5px solid var(--border-color); }
    thead th {
      position: sticky; top:0; z-index:4;
      background:#ffffff; text-align:center; vertical-align:middle; padding:10px;
      font-weight:700;
    }
    tbody td { padding:8px; vertical-align:middle; }
    td.center { text-align:center; }
    td.left { text-align:left; padding-left:10px; }
    .subtotal-row td { background:#f3f6f9; font-weight:700; text-align:center; }
    .depot-grand-row td { background:#e9f0ff; font-weight:800; text-align:center; }
    .state-grand-row td { background:#d8e8ff; font-weight:900; text-align:center; }
    /* small datalist width fix */
    input[list] { width:100%; }
    /* Dropdown column toggles */
    .col-toggle { max-height:260px; overflow:auto; padding:8px; width:220px; }
    /* footer spacing */
    .footer-space { height:8px; }
  </style>
</head>
<body>
  <div class="container-fluid">

    <!-- Logo header -->
    <div class="logo-header">
      <img src="/static/onlylogo.png" alt="SMC logo">
      <h2>SMC - Stock Position</h2>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="d-flex gap-2 align-items-center">
        <a href="{{ url_for('sales_levels') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
        <a href="{{ url_for('dashboard_daily_sale') }}" class="btn btn-outline-primary btn-sm">Daily Sale</a>
      </div>

      <div class="d-flex align-items-center">
        <div class="dropdown me-2">
          <button class="btn btn-outline-dark btn-sm dropdown-toggle" id="colToggleBtn" data-bs-toggle="dropdown">
            Columns
          </button>
          <div class="dropdown-menu dropdown-menu-end p-2 col-toggle" aria-labelledby="colToggleBtn">
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" type="checkbox" data-col="state" checked> <label class="form-check-label">State</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" type="checkbox" data-col="depot" checked> <label class="form-check-label">Depot</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" type="checkbox" data-col="date" checked> <label class="form-check-label">Date</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" type="checkbox" data-col="sku_name" checked> <label class="form-check-label">SKU Name</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" type="checkbox" data-col="opening" checked> <label class="form-check-label">Opening</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" type="checkbox" data-col="qty_recd" checked> <label class="form-check-label">Received</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" type="checkbox" data-col="qty_sale" checked> <label class="form-check-label">Sales</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" type="checkbox" data-col="closing" checked> <label class="form-check-label">Closing</label></div>
          </div>
        </div>

        <button id="exportBtn" class="btn btn-success btn-sm me-2">Export Excel</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-2">
            <label class="form-label small-muted">Month</label>
            <select id="filterMonth" class="form-select"></select>
          </div>
          <div class="col-md-2">
            <label class="form-label small-muted">State</label>
            <select id="filterState" class="form-select"><option value="">All</option></select>
          </div>
          <div class="col-md-2">
            <label class="form-label small-muted">Depot</label>
            <select id="filterDepot" class="form-select"><option value="">All</option></select>
          </div>
          <div class="col-md-3">
            <label class="form-label small-muted">SKU (search)</label>
            <input id="filterSKU" list="skuList" class="form-control" placeholder="Type or choose SKU">
            <datalist id="skuList"></datalist>
          </div>
          <div class="col-md-1">
            <label class="form-label small-muted">From</label>
            <input id="filterFrom" type="date" class="form-control">
          </div>
          <div class="col-md-1">
            <label class="form-label small-muted">To</label>
            <input id="filterTo" type="date" class="form-control">
          </div>
          <div class="col-md-1 d-flex align-items-end">
            <button id="clearFilters" class="btn btn-outline-secondary btn-sm w-100">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table id="stockTable" class="table table-sm mb-0">
        <thead>
          <tr>
            <th data-col="state" style="min-width:130px;">State</th>
            <th data-col="depot" style="min-width:150px;">Depot</th>
            <th data-col="date" style="min-width:110px;">Date</th>
            <th data-col="sku_name" style="min-width:300px; text-align:left;">SKU Name</th>
            <th data-col="opening" style="min-width:110px;">Opening</th>
            <th data-col="qty_recd" style="min-width:110px;">Received</th>
            <th data-col="qty_sale" style="min-width:110px;">Sales</th>
            <th data-col="closing" style="min-width:110px;">Closing</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <!-- state grand rows will be inserted into tbody as rows, but footer reserved for final overall totals if you want -->
        </tfoot>
      </table>
    </div>
    <div class="footer-space"></div>
  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  // Utilities
  const parseDatePreferDMY = s => {
    if (!s) return null;
    const iso = new Date(s);
    if (!isNaN(iso)) return iso;
    const m = String(s).trim().match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
    if (m) {
      const day = +m[1], mon = +m[2]-1, year = +m[3] < 100 ? 2000 + +m[3] : +m[3];
      return new Date(year, mon, day);
    }
    const fb = new Date(s);
    return isNaN(fb) ? null : fb;
  };
  const fmt = v => (v == null || isNaN(+v)) ? '' : Number(v).toLocaleString();

  // Elements
  const table = document.getElementById('stockTable');
  const tbody = table.querySelector('tbody');
  const filterMonth = document.getElementById('filterMonth');
  const filterState = document.getElementById('filterState');
  const filterDepot = document.getElementById('filterDepot');
  const filterSKU = document.getElementById('filterSKU');
  const skuList = document.getElementById('skuList');
  const filterFrom = document.getElementById('filterFrom');
  const filterTo = document.getElementById('filterTo');
  const clearFilters = document.getElementById('clearFilters');
  const exportBtn = document.getElementById('exportBtn');
  const colCheckboxes = Array.from(document.querySelectorAll('.col-toggle-checkbox'));

  // State arrays
  let RAW = []; // cleaned source rows
  let FILTERED = [];

  // Load data from API
  async function loadData() {
    try {
      const res = await fetch('/api/get_stock_data');
      const raw = await res.json();

      RAW = raw.map(r => {
        const obj = {};
        for (const k in r) obj[k.trim().toLowerCase()] = r[k];
        // trim strings and coerce numbers
        obj.state = (obj.state||'').toString().trim();
        obj.depot = (obj.depot||'').toString().trim();
        obj.date = (obj.date||'').toString().trim();
        obj.sku_name = (obj.sku_name||'').toString().trim();
        obj.opening = Number(obj.opening) || 0;
        obj.qty_recd = Number(obj.qty_recd) || 0;
        obj.qty_sale = Number(obj.qty_sale) || 0;
        obj.closing = Number(obj.closing) || 0;
        obj._parsed_date = parseDatePreferDMY(obj.date);
        obj._month_key = obj._parsed_date ? `${obj._parsed_date.getFullYear()}-${String(obj._parsed_date.getMonth()+1).padStart(2,'0')}` : '';
        return obj;
      });

      // Deduplicate exact duplicate rows (stringified key)
      const seen = new Set();
      RAW = RAW.filter(r => {
        const key = JSON.stringify([r.state, r.depot, r.date, r.sku_name, r.opening, r.qty_recd, r.qty_sale, r.closing]);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      populateFilters();
      applyFilters(); // initial render
    } catch (err) {
      console.error('Failed to load /api/get_stock_data', err);
      tbody.innerHTML = '<tr><td colspan="8" class="text-danger p-3">Failed to load data</td></tr>';
    }
  }

  // Populate Month, State, Depot, SKU
  function populateFilters() {
    const months = Array.from(new Set(RAW.map(r => r._month_key).filter(Boolean))).sort();
    filterMonth.innerHTML = '<option value="">All</option>' + months.map(m => {
      const [y,mm] = m.split('-'); const dt = new Date(y, Number(mm)-1, 1);
      return `<option value="${m}">${dt.toLocaleString(undefined, { month: 'long' })} ${y}</option>`;
    }).join('');

    const states = Array.from(new Set(RAW.map(r => r.state).filter(Boolean))).sort();
    filterState.innerHTML = '<option value="">All</option>' + states.map(s => `<option>${s}</option>`).join('');

    const depots = Array.from(new Set(RAW.map(r => r.depot).filter(Boolean))).sort();
    filterDepot.innerHTML = '<option value="">All</option>' + depots.map(d => `<option>${d}</option>`).join('');

    const skus = Array.from(new Set(RAW.map(r => r.sku_name).filter(Boolean))).sort();
    filterSKU.value = '';
    skuList.innerHTML = skus.map(s => `<option value="${s}">`).join('');
  }

  // Instant filters (change -> apply)
  [filterMonth, filterState, filterDepot, filterFrom, filterTo].forEach(el => el.addEventListener('change', applyFilters));
  filterSKU.addEventListener('input', applyFilters);
  clearFilters.addEventListener('click', () => {
    filterMonth.value=''; filterState.value=''; filterDepot.value=''; filterSKU.value=''; filterFrom.value=''; filterTo.value='';
    applyFilters();
  });

  // Column toggle handling
  colCheckboxes.forEach(ch => ch.addEventListener('change', () => {
    const col = ch.dataset.col; const show = ch.checked;
    const th = table.querySelector(`thead th[data-col="${col}"]`);
    if (th) th.style.display = show ? '' : 'none';
    Array.from(table.querySelectorAll(`td[data-col="${col}"]`)).forEach(td => td.style.display = show ? '' : 'none');
  }));

  // Apply current filters to RAW -> FILTERED
  function applyFilters() {
    const m = filterMonth.value;
    const s = filterState.value;
    const d = filterDepot.value;
    const skuQ = (filterSKU.value || '').toLowerCase().trim();
    const from = filterFrom.value ? new Date(filterFrom.value) : null;
    const to = filterTo.value ? new Date(filterTo.value) : null;

    FILTERED = RAW.filter(r => {
      if (m && r._month_key !== m) return false;
      if (s && (r.state || '') !== s) return false;
      if (d && (r.depot || '') !== d) return false;
      if (skuQ && !r.sku_name.toLowerCase().includes(skuQ)) return false;
      if (from && (!r._parsed_date || r._parsed_date < from)) return false;
      if (to && (!r._parsed_date || r._parsed_date > to)) return false;
      return true;
    });

    renderGrouped();
  }

  // Render grouped rows with subtotals and grand totals
  function renderGrouped() {
    // Sort FILTERED by state -> depot -> date -> sku_name
    FILTERED.sort((a,b) => {
      if (a.state !== b.state) return a.state.localeCompare(b.state);
      if (a.depot !== b.depot) return a.depot.localeCompare(b.depot);
      const da = a._parsed_date ? a._parsed_date.getTime() : 0;
      const db = b._parsed_date ? b._parsed_date.getTime() : 0;
      if (da !== db) return da - db;
      if (a.sku_name !== b.sku_name) return a.sku_name.localeCompare(b.sku_name);
      return 0;
    });

    let html = '';
    // Accumulators for overall grand totals by state/depot
    let stateGrand = null; // {state, open, rec, sale, close}
    let depotGrand = null;
    let overallGrand = {open:0, rec:0, sale:0, close:0};

    // iterate through rows grouping by state->depot->date
    let i = 0;
    while (i < FILTERED.length) {
      const row = FILTERED[i];
      const curState = row.state;
      const curDepot = row.depot;

      // initialize stateGrand for new state
      if (!stateGrand || stateGrand.state !== curState) {
        // if previous depot/state exist, flush depot grand and state grand rows
        if (depotGrand) {
          // append depot grand row
          html += `<tr class="depot-grand-row"><td colspan="4">GRAND TOTAL OF ${escapeHtml(depotGrand.depot)}</td>
            <td class="center" data-col="opening">${fmt(depotGrand.open)}</td>
            <td class="center" data-col="qty_recd">${fmt(depotGrand.rec)}</td>
            <td class="center" data-col="qty_sale">${fmt(depotGrand.sale)}</td>
            <td class="center" data-col="closing">${fmt(depotGrand.close)}</td>
          </tr>`;
          depotGrand = null;
        }
        if (stateGrand) {
          // append prior state grand
          html += `<tr class="state-grand-row"><td colspan="4">GRAND TOTAL OF ${escapeHtml(stateGrand.state)}</td>
            <td class="center" data-col="opening">${fmt(stateGrand.open)}</td>
            <td class="center" data-col="qty_recd">${fmt(stateGrand.rec)}</td>
            <td class="center" data-col="qty_sale">${fmt(stateGrand.sale)}</td>
            <td class="center" data-col="closing">${fmt(stateGrand.close)}</td>
          </tr>`;
        }
        // start a new state accumulator
        stateGrand = { state: curState, open:0, rec:0, sale:0, close:0 };
      }

      // start new depot group
      depotGrand = { depot: curDepot, open:0, rec:0, sale:0, close:0 };

      // now process all rows for this depot within current state
      // collect rows by date within depot
      let j = i;
      const depotRows = [];
      while (j < FILTERED.length && FILTERED[j].state === curState && FILTERED[j].depot === curDepot) {
        depotRows.push(FILTERED[j]);
        j++;
      }

      // within depotRows, group by date
      let k = 0;
      while (k < depotRows.length) {
        const dateKey = depotRows[k].date;
        // gather rows for this date
        const dateGroup = [];
        let mIdx = k;
        while (mIdx < depotRows.length && depotRows[mIdx].date === dateKey) {
          dateGroup.push(depotRows[mIdx]);
          mIdx++;
        }

        // render each sku row inside dateGroup
        dateGroup.forEach(r => {
          html += `<tr>
            <td class="center" data-col="state">${escapeHtml(r.state)}</td>
            <td class="center" data-col="depot">${escapeHtml(r.depot)}</td>
            <td class="center" data-col="date">${escapeHtml(r.date)}</td>
            <td class="left" data-col="sku_name">${escapeHtml(r.sku_name)}</td>
            <td class="center" data-col="opening">${fmt(r.opening)}</td>
            <td class="center" data-col="qty_recd">${fmt(r.qty_recd)}</td>
            <td class="center" data-col="qty_sale">${fmt(r.qty_sale)}</td>
            <td class="center" data-col="closing">${fmt(r.closing)}</td>
          </tr>`;
        });

        // compute subtotal for date (sum of dateGroup)
        const subtotal = dateGroup.reduce((acc, r) => {
          acc.open += r.opening; acc.rec += r.qty_recd; acc.sale += r.qty_sale; acc.close += r.closing; return acc;
        }, {open:0, rec:0, sale:0, close:0});

        // append subtotal row for this date (always show, per your example)
        html += `<tr class="subtotal-row">
          <td colspan="4">subtotal of Date (${escapeHtml(dateKey)})</td>
          <td class="center" data-col="opening">${fmt(subtotal.open)}</td>
          <td class="center" data-col="qty_recd">${fmt(subtotal.rec)}</td>
          <td class="center" data-col="qty_sale">${fmt(subtotal.sale)}</td>
          <td class="center" data-col="closing">${fmt(subtotal.close)}</td>
        </tr>`;

        // accumulate depot & state & overall totals from this dateGroup
        subtotalAddTo(subtotal, depotGrand);
        subtotalAddTo(subtotal, stateGrand);
        subtotalAddTo(subtotal, overallGrand);

        // move k forward
        k = mIdx;
      } // end date grouping inside depot

      // after finishing this depot, append depot grand row
      html += `<tr class="depot-grand-row"><td colspan="4">GRAND TOTAL OF ${escapeHtml(depotGrand.depot)}</td>
        <td class="center" data-col="opening">${fmt(depotGrand.open)}</td>
        <td class="center" data-col="qty_recd">${fmt(depotGrand.rec)}</td>
        <td class="center" data-col="qty_sale">${fmt(depotGrand.sale)}</td>
        <td class="center" data-col="closing">${fmt(depotGrand.close)}</td>
      </tr>`;

      // move i to j (next depot)
      i = j;
    } // end while i < FILTERED.length

    // after loop, if stateGrand remains add state grand row
    if (stateGrand) {
      html += `<tr class="state-grand-row"><td colspan="4">GRAND TOTAL OF ${escapeHtml(stateGrand.state)}</td>
            <td class="center" data-col="opening">${fmt(stateGrand.open)}</td>
            <td class="center" data-col="qty_recd">${fmt(stateGrand.rec)}</td>
            <td class="center" data-col="qty_sale">${fmt(stateGrand.sale)}</td>
            <td class="center" data-col="closing">${fmt(stateGrand.close)}</td>
          </tr>`;
    }

    // overall grand (if you want a final overall grand below table rather than inside table footer,
    // we will append a visible row at bottom)
    html += `<tr class="state-grand-row"><td colspan="4">OVERALL GRAND TOTAL</td>
      <td class="center" data-col="opening">${fmt(overallGrand.open)}</td>
      <td class="center" data-col="qty_recd">${fmt(overallGrand.rec)}</td>
      <td class="center" data-col="qty_sale">${fmt(overallGrand.sale)}</td>
      <td class="center" data-col="closing">${fmt(overallGrand.close)}</td>
    </tr>`;

    // set tbody
    tbody.innerHTML = html;

    // enforce column visibility (in case toggles changed)
    colCheckboxes.forEach(ch => {
      const col = ch.dataset.col;
      const show = ch.checked;
      const th = table.querySelector(`thead th[data-col="${col}"]`);
      if (th) th.style.display = show ? '' : 'none';
      Array.from(table.querySelectorAll(`td[data-col="${col}"]`)).forEach(td => td.style.display = show ? '' : 'none');
    });
  }

  function subtotalAddTo(src, target) {
    target.open += src.open; target.rec += src.rec; target.sale += src.sale; target.close += src.close;
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Export function: export exactly what is rendered (includes subtotal/state/depot rows)
  function exportToExcel() {
    const header = ["State","Depot","Date","SKU Name","Opening","Received","Sales","Closing"];
    const wsData = [header];
    const rows = Array.from(tbody.querySelectorAll('tr'));
    rows.forEach(tr => {
      const cells = Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim());
      // Normalize length to 8 columns (subtotal rows may have first 4 columns filled and rest numeric)
      while (cells.length < 8) cells.push('');
      wsData.push(cells);
    });
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    XLSX.utils.book_append_sheet(wb, ws, 'Stock');
    XLSX.writeFile(wb, `stock_export_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  // initialize
  exportBtn.addEventListener('click', exportToExcel);
  // load data on open
  loadData();
  </script>
</body>
</html>
