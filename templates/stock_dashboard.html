<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC - Stock Position (Final)</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --smc-blue:#0d6efd;
      --soft-blue:#e7f0ff;
      --muted:#6b7280;
      --border:#9fb1c8;
      --card-bg:#ffffff;
      --row-height:46px; /* unified final row height */
    }
    html,body{height:100%}
    body{
      background: linear-gradient(180deg,#f6fbff,#f2f6fb 60%);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      padding:16px;
    }

    .top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
    .logo-title{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#0d6efd22,#0d6efd11);border-radius:10px;padding:10px 14px;border-left:6px solid var(--smc-blue)}
    .logo-title img{height:44px} .logo-title h1{margin:0;font-size:1.05rem;color:#073763;font-weight:800}

    .controls{display:flex;gap:8px;align-items:center}
    .btn-pill{border-radius:999px;padding:8px 12px}

    .filter-panel{background:linear-gradient(180deg,#ffffffd8,#ffffffcc);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 6px 18px rgba(2,6,23,0.05)}
    .filter-row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
    .filter-row .form-label{font-weight:600;color:var(--muted);font-size:.88rem}

    /* Table wrap */
    .table-wrap{border-radius:10px;overflow:hidden;background:var(--card-bg);box-shadow:0 8px 30px rgba(2,6,23,0.05);border:2px solid var(--border);height:62vh;display:flex;flex-direction:column}
    .table-head{overflow:hidden}
    table{width:100%;border-collapse:collapse;min-width:1100px}
    table,th,td{border:2px solid var(--border)}
    thead th{position:sticky;top:0;z-index:6;background:linear-gradient(90deg,#f0f8ff,#ffffff);padding:12px;text-align:center;font-weight:800;color:#0b3b66}
    tbody{display:block;overflow:auto;flex:1;height:100%}
    tbody tr{display:flex;align-items:center;height:var(--row-height)}
    tbody td{padding:8px 12px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    td.center{text-align:center}
    td.left{text-align:left;padding-left:8px}

    /* Column widths (unified) */
    .col-state{width:120px}
    .col-depot{width:140px}
    .col-date{width:110px}
    .col-sku{width:310px}
    .col-opening{width:110px;text-align:right;padding-right:12px}
    .col-recd{width:110px;text-align:right;padding-right:12px}
    .col-sale{width:110px;text-align:right;padding-right:12px}
    .col-closing{width:110px;text-align:right;padding-right:12px}

    tr:hover td{background:#fbfdff}

    /* Totals styling */
    .subtotal-row td{background:#e6f0ff !important;font-weight:700;text-align:center}
    .depot-grand-row td{background:#e0ecff !important;font-weight:800;text-align:center}
    .state-grand-row td{background:#d4e7ff !important;font-weight:900;text-align:center}
    .overall-grand-row td{background:linear-gradient(90deg,#cfe4ff,#bfe0ff) !important;font-weight:900;text-align:center;color:#05284a}

    .col-toggle{max-height:320px;overflow:auto;padding:10px;width:260px}

    /* mobile defaults (M1): party & sku & qty visible; others hidden by CSS */
    @media (max-width:520px){
      thead th[data-col="state"], thead th[data-col="depot"], thead th[data-col="date"],
      tbody .cell-state, tbody .cell-depot, tbody .cell-date { display:none !important; }
      /* The Columns menu still allows enabling them */
      .col-sku{width:40%}
      .col-opening{display:none}
      .col-recd{display:none}
      .col-sale{display:none}
      .col-closing{display:none}
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="top-row">
      <div class="logo-title">
        <img src="/static/onlylogo.png" alt="SMC" onerror="this.style.display='none'">
        <h1>SMC - Stock Position</h1>
      </div>

      <div class="controls">
        <a href="{{ url_for('sales_levels') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
        <a href="{{ url_for('dashboard_daily_sale') }}" class="btn btn-outline-primary btn-sm">Daily Sale</a>

        <button id="toggleFiltersBtn" class="btn btn-light btn-pill">Filters</button>
        <button id="yesterdayBtn" class="btn btn-info btn-pill text-white">Yesterday</button>

        <div class="dropdown">
          <button class="btn btn-outline-dark btn-sm dropdown-toggle" data-bs-toggle="dropdown">Columns</button>
          <div class="dropdown-menu dropdown-menu-end col-toggle" id="colToggleMenu">
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="state" type="checkbox" checked> <label class="form-check-label">State</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="depot" type="checkbox" checked> <label class="form-check-label">Depot</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" id="dateColCheckbox" data-col="date" type="checkbox" checked> <label class="form-check-label">Date</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="sku_name" type="checkbox" checked> <label class="form-check-label">SKU Name</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="opening" type="checkbox" checked> <label class="form-check-label">Opening</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="qty_recd" type="checkbox" checked> <label class="form-check-label">Received</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="qty_sale" type="checkbox" checked> <label class="form-check-label">Sales</label></div>
            <div class="form-check"><input class="form-check-input col-toggle-checkbox" data-col="closing" type="checkbox" checked> <label class="form-check-label">Closing</label></div>
          </div>
        </div>

        <button id="exportBtn" class="btn btn-success">Export Excel</button>
      </div>
    </div>

    <div id="filterPanel" class="filter-panel" style="display:none">
      <div class="filter-row">
        <div style="flex:1;min-width:160px"><label class="form-label">Month</label><select id="filterMonth" class="form-select"><option value="">All</option></select></div>
        <div style="flex:1;min-width:140px"><label class="form-label">State</label><select id="filterState" class="form-select"><option value="">All</option></select></div>
        <div style="flex:1;min-width:140px"><label class="form-label">Depot</label><select id="filterDepot" class="form-select"><option value="">All</option></select></div>
        <div style="flex:2;min-width:220px"><label class="form-label">SKU (search)</label><input id="filterSKU" list="skuList" class="form-control" placeholder="Type or pick SKU"><datalist id="skuList"></datalist></div>
        <div style="min-width:140px"><label class="form-label">From</label><input id="filterFrom" type="date" class="form-control"></div>
        <div style="min-width:140px"><label class="form-label">To</label><input id="filterTo" type="date" class="form-control"></div>
        <div style="min-width:120px;display:flex;align-items:end"><button id="clearFilters" class="btn btn-outline-secondary w-100">Reset</button></div>
      </div>
    </div>

    <div class="table-wrap" id="tableWrap">
      <div class="table-head">
        <table><thead><tr id="theadRow">
          <th data-col="state" class="col-state">State</th>
          <th data-col="depot" class="col-depot">Depot</th>
          <th data-col="date" class="col-date">Date</th>
          <th data-col="sku_name" class="col-sku" style="text-align:left">SKU Name</th>
          <th data-col="opening" class="col-opening">Opening</th>
          <th data-col="qty_recd" class="col-recd">Received</th>
          <th data-col="qty_sale" class="col-sale">Sales</th>
          <th data-col="closing" class="col-closing">Closing</th>
        </tr></thead></table>
      </div>

      <div id="skeleton" style="display:flex"><div class="skeleton-box">Loading stock — preparing fast view...</div></div>

      <tbody id="vbody" style="display:none" aria-live="polite"></tbody>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


  <script>
  ////////////////////////////////////////////////////////////////////////////
  // Worker bootstrap code as a blob (no extra file)
  ////////////////////////////////////////////////////////////////////////////
  const workerCode = `
    self.onmessage = function(e){
      const { cmd, rows } = e.data;
      try{
        if(cmd === 'process'){
          const map = new Map();
          rows.forEach(r=>{
            const o = {};
            for(const k in r) o[String(k).trim().toLowerCase()] = r[k];
            const state = (o.state||'').toString().trim();
            const depot = (o.depot||'').toString().trim();
            const date = (o.date||'').toString().trim();
            const sku = (o.sku_name||'').toString().trim();
            const opening = Number(o.opening)||0;
            const qty_recd = Number(o.qty_recd)||0;
            const qty_sale = Number(o.qty_sale)||0;
            const closing = Number(o.closing)||0;
            const key = state+'||'+depot+'||'+date+'||'+sku;
            if(!map.has(key)){
              map.set(key, { state, depot, date, sku_name:sku, opening, qty_recd, qty_sale, closing });
            } else {
              const g = map.get(key);
              g.opening += opening; g.qty_recd += qty_recd; g.qty_sale += qty_sale; g.closing += closing;
            }
          });
          self.postMessage({ ok:true, merged: Array.from(map.values()) });
        }
      }catch(err){
        self.postMessage({ ok:false, error: String(err) });
      }
    };
  `;
  const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
  const workerUrl = URL.createObjectURL(workerBlob);
  let worker = null;
  try { worker = new Worker(workerUrl); } catch(err){ worker = null; console.warn('Worker not available'); }

  ////////////////////////////////////////////////////////////////////////////
  // Utilities
  ////////////////////////////////////////////////////////////////////////////
  const pad2 = n => String(n).padStart(2,'0');
  const fmt = v => (v==null || isNaN(+v)) ? '' : Number(v).toLocaleString();
  function parseDMYtoUTC(s){
    if(!s) return null;
    const m = String(s).trim().match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
    if(m) return new Date(Date.UTC(+m[3], +m[2]-1, +m[1]));
    const iso = new Date(s);
    return isNaN(iso)?null:new Date(Date.UTC(iso.getUTCFullYear(), iso.getUTCMonth(), iso.getUTCDate()));
  }
  function parseInputDateUTC(val){ if(!val) return null; const [y,m,d]=val.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
  function formatDateDDMMYYYYUTC(d){ if(!d) return ''; return `${pad2(d.getUTCDate())}-${pad2(d.getUTCMonth()+1)}-${d.getUTCFullYear()}`; }
  function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  ////////////////////////////////////////////////////////////////////////////
  // DOM refs
  ////////////////////////////////////////////////////////////////////////////
  const vbody = document.getElementById('vbody');
  const theadRow = document.getElementById('theadRow');
  const skeleton = document.getElementById('skeleton');

  const filterPanel = document.getElementById('filterPanel');
  const toggleFiltersBtn = document.getElementById('toggleFiltersBtn');
  const yesterdayBtn = document.getElementById('yesterdayBtn');

  const filterMonth = document.getElementById('filterMonth');
  const filterState = document.getElementById('filterState');
  const filterDepot = document.getElementById('filterDepot');
  const filterSKU = document.getElementById('filterSKU');
  const filterFrom = document.getElementById('filterFrom');
  const filterTo = document.getElementById('filterTo');
  const clearFilters = document.getElementById('clearFilters');
  const skuList = document.getElementById('skuList');
  const exportBtn = document.getElementById('exportBtn');

  const colCheckboxes = Array.from(document.querySelectorAll('.col-toggle-checkbox'));
  const dateColCheckbox = document.getElementById('dateColCheckbox');

  ////////////////////////////////////////////////////////////////////////////
  // App state
  ////////////////////////////////////////////////////////////////////////////
  let RAW = [], MERGED = [], FILTERED = [];
  let visibleStart = 0, visibleCount = 0;
  const ROW_HEIGHT = 46; // unified
  const BUFFER = 12;
  const NUMERIC_COLUMNS = ['opening','qty_recd','qty_sale','closing'];

  ////////////////////////////////////////////////////////////////////////////
  // Fetch & process
  ////////////////////////////////////////////////////////////////////////////
  function fetchAndProcess(){
    showSkeleton(true);
    fetch('/api/get_stock_data').then(r=>r.json()).then(rows=>{
      RAW = rows.map(r=>{
        const o={};
        for(const k in r) o[String(k).trim().toLowerCase()] = r[k];
        const state=(o.state||'').toString().trim();
        const depot=(o.depot||'').toString().trim();
        const date=(o.date||'').toString().trim();
        const sku=(o.sku_name||'').toString().trim();
        const opening=Number(o.opening)||0;
        const qty_recd=Number(o.qty_recd)||0;
        const qty_sale=Number(o.qty_sale)||0;
        const closing=Number(o.closing)||0;
        const _parsed_date = parseDMYtoUTC(date);
        const _month_key = _parsed_date ? `${_parsed_date.getUTCFullYear()}-${pad2(_parsed_date.getUTCMonth()+1)}` : '';
        return { state, depot, date, sku_name:sku, opening, qty_recd, qty_sale, closing, _parsed_date, _month_key };
      });

      if(worker){
        worker.onmessage = function(ev){
          if(ev.data && ev.data.ok && ev.data.merged){
            MERGED = ev.data.merged.map(r=>{
              r._parsed_date = parseDMYtoUTC(r.date);
              r._month_key = r._parsed_date ? `${r._parsed_date.getUTCFullYear()}-${pad2(r._parsed_date.getUTCMonth()+1)}` : '';
              return { state:r.state, depot:r.depot, date:r.date, sku_name:r.sku_name, opening:r.opening, qty_recd:r.qty_recd, qty_sale:r.qty_sale, closing:r.closing, _parsed_date:r._parsed_date, _month_key:r._month_key };
            });
            populateFilters();
            applyFilters();
            showSkeleton(false);
          } else {
            MERGED = mergeGroupsSync(RAW);
            populateFilters();
            applyFilters();
            showSkeleton(false);
          }
        };
        worker.postMessage({ cmd:'process', rows: RAW });
      } else {
        MERGED = mergeGroupsSync(RAW);
        populateFilters();
        applyFilters();
        showSkeleton(false);
      }
    }).catch(err=>{
      console.error('fetch error',err);
      skeleton.innerHTML = '<div class="skeleton-box">Failed to load data.</div>';
    });
  }

  function mergeGroupsSync(rows){
    const map = new Map();
    rows.forEach(r=>{
      const key = `${r.state}||${r.depot}||${r.date}||${r.sku_name}`;
      if(!map.has(key)) map.set(key, {...r});
      else {
        const g = map.get(key);
        g.opening += r.opening; g.qty_recd += r.qty_recd; g.qty_sale += r.qty_sale; g.closing += r.closing;
      }
    });
    return Array.from(map.values());
  }

  ////////////////////////////////////////////////////////////////////////////
  // UI events
  ////////////////////////////////////////////////////////////////////////////
  toggleFiltersBtn.addEventListener('click',()=>{ filterPanel.style.display = filterPanel.style.display==='none'?'block':'none'; });
  clearFilters.addEventListener('click', ()=>{ filterMonth.value=''; filterState.value=''; filterDepot.value=''; filterSKU.value=''; filterFrom.value=''; filterTo.value=''; applyFilters(); });
  colCheckboxes.forEach(ch=>ch.addEventListener('change', ()=>{ renderSmart(); }));
  yesterdayBtn.addEventListener('click', ()=>{ const now=new Date(); const y=new Date(now.getFullYear(), now.getMonth(), now.getDate()-1); const val = `${y.getFullYear()}-${pad2(y.getMonth()+1)}-${pad2(y.getDate())}`; filterFrom.value=val; filterTo.value=val; applyFilters(); yesterdayBtn.classList.add('btn-success'); setTimeout(()=>yesterdayBtn.classList.remove('btn-success'),700); });


  
  ////////////////////////////////////////////////////////////////////////////
  // Filters and render orchestration
  ////////////////////////////////////////////////////////////////////////////
  function populateFilters(){
    const months = Array.from(new Set(MERGED.map(r=>r._month_key).filter(Boolean))).sort();
    filterMonth.innerHTML = '<option value="">All</option>' + months.map(m=>{ const [y,mm]=m.split('-'); const d=new Date(Date.UTC(y,mm-1,1)); return `<option value="${m}">${d.toLocaleString(undefined,{month:'long'})} ${y}</option>`; }).join('');
    const states = Array.from(new Set(MERGED.map(r=>r.state).filter(Boolean))).sort();
    filterState.innerHTML = '<option value="">All</option>' + states.map(s=>`<option>${s}</option>`).join('');
    const depots = Array.from(new Set(MERGED.map(r=>r.depot).filter(Boolean))).sort();
    filterDepot.innerHTML = '<option value="">All</option>' + depots.map(d=>`<option>${d}</option>`).join('');
    const skus = Array.from(new Set(MERGED.map(r=>r.sku_name).filter(Boolean))).sort();
    skuList.innerHTML = skus.map(s=>`<option value="${s}">`).join('');
  }

  [filterMonth, filterState, filterDepot, filterFrom, filterTo].forEach(el=>el.addEventListener('change', applyFilters));
  filterSKU.addEventListener('input', applyFilters);

  function applyFilters(){
    const m = filterMonth.value; const s = filterState.value; const d = filterDepot.value; const skuQ = (filterSKU.value||'').toLowerCase().trim();
    const from = parseInputDateUTC(filterFrom.value); const to = parseInputDateUTC(filterTo.value);
    FILTERED = MERGED.filter(r=>{
      if(m && r._month_key!==m) return false;
      if(s && r.state!==s) return false;
      if(d && r.depot!==d) return false;
      if(skuQ && !r.sku_name.toLowerCase().includes(skuQ)) return false;
      if(from && (!r._parsed_date || r._parsed_date<from)) return false;
      if(to && (!r._parsed_date || r._parsed_date>to)) return false;
      return true;
    });
    renderSmart();
  }

  function renderSmart(){
    const monthSelected = !!filterMonth.value;
    const dateVisible = dateColCheckbox.checked;
    const summaryMode = monthSelected || !dateVisible;
    if(summaryMode) renderMonthSummary();
    else renderNormalMode();
  }

  ////////////////////////////////////////////////////////////////////////////
  // Normal rendering (build flat items list and virtual render)
  ////////////////////////////////////////////////////////////////////////////
  function renderNormalMode(){
    FILTERED.sort((a,b)=>{ if(a.state!==b.state) return a.state.localeCompare(b.state); if(a.depot!==b.depot) return a.depot.localeCompare(b.depot); const da=a._parsed_date?a._parsed_date.getTime():0; const db=b._parsed_date?b._parsed_date.getTime():0; if(da!==db) return da-db; return a.sku_name.localeCompare(b.sku_name); });
    const items = [];
    let i=0;
    while(i<FILTERED.length){
      const ST = FILTERED[i].state, DP = FILTERED[i].depot;
      const block = []; let j=i;
      while(j<FILTERED.length && FILTERED[j].state===ST && FILTERED[j].depot===DP){ block.push(FILTERED[j]); j++; }
      let k=0;
      while(k<block.length){
        const dateVal = block[k].date;
        const group=[]; let m=k;
        while(m<block.length && block[m].date===dateVal){ group.push(block[m]); m++; }
        group.forEach(r=> items.push({ type:'row', data:r }));
        const sub = group.reduce((a,t)=>{ a.open+=t.opening; a.rec+=t.qty_recd; a.sale+=t.qty_sale; a.close+=t.closing; return a; },{open:0,rec:0,sale:0,close:0});
        items.push({ type:'subtotal', data:{ labelDate: group[0]._parsed_date || group[0].date, sub }});
        k = m;
      }
      // depot total
      const depotAcc = block.reduce((a,t)=>{ a.open+=t.opening; a.rec+=t.qty_recd; a.sale+=t.qty_sale; a.close+=t.closing; return a; },{open:0,rec:0,sale:0,close:0});
      items.push({ type:'depotTotal', data: depotAcc });
      // state total when boundary
      const nextIdx = j;
      if(nextIdx >= FILTERED.length || FILTERED[nextIdx].state !== ST){
        const stateAcc = FILTERED.filter(x=>x.state===ST).reduce((a,t)=>{ a.open+=t.opening; a.rec+=t.qty_recd; a.sale+=t.qty_sale; a.close+=t.closing; return a; },{open:0,rec:0,sale:0,close:0});
        items.push({ type:'stateTotal', data: { state: ST, ...stateAcc }});
      }
      i = j;
    }
    // overall
    const overall = items.reduce((a,it)=>{ if(it.type==='row'){ a.open+=it.data.opening; a.rec+=it.data.qty_recd; a.sale+=it.data.qty_sale; a.close+=it.data.closing; } else if(it.type==='subtotal'){ a.open+=it.data.sub.open; a.rec+=it.data.sub.rec; a.sale+=it.data.sub.sale; a.close+=it.data.sub.close; } else if(it.type==='depotTotal'||it.type==='stateTotal'){ a.open+=it.data.open; a.rec+=it.data.rec; a.sale+=it.data.sale; a.close+=it.data.close; } return a; }, {open:0,rec:0,sale:0,close:0});
    items.push({ type:'overall', data: overall });
    window._renderItems = items;
    initVirtualRenderer(items);
  }

  ////////////////////////////////////////////////////////////////////////////
  // Month summary (Opening = earliest opening; Received & Sales = sums; Closing = opening + rec - sale)
  ////////////////////////////////////////////////////////////////////////////
  function renderMonthSummary(){
    const usableRows = FILTERED.slice();
    const groups = new Map();
    usableRows.forEach(r=>{
      const key = `${r.state}||${r.depot}||${r.sku_name}`;
      if(!groups.has(key)) groups.set(key, { state:r.state, depot:r.depot, sku_name:r.sku_name, openings:[{d:r._parsed_date, o:r.opening}], rec:r.qty_recd, sale:r.qty_sale });
      else { const g=groups.get(key); if(r._parsed_date) g.openings.push({d:r._parsed_date,o:r.opening}); g.rec+=r.qty_recd; g.sale+=r.qty_sale; }
    });
    const rows = Array.from(groups.values()).map(g=>{
      const opens = g.openings.filter(o=>o.d).sort((a,b)=>a.d-b.d);
      const opening = opens.length ? opens[0].o : 0;
      const rec = g.rec || 0, sale = g.sale || 0; const closing = opening + rec - sale;
      return { state:g.state, depot:g.depot, sku_name:g.sku_name, opening, qty_recd:rec, qty_sale:sale, closing };
    });

    rows.sort((a,b)=>{ if(a.state!==b.state) return a.state.localeCompare(b.state); if(a.depot!==b.depot) return a.depot.localeCompare(b.depot); return a.sku_name.localeCompare(b.sku_name); });

    const items = [];
    let i=0;
    while(i<rows.length){
      const ST = rows[i].state, DP = rows[i].depot;
      const block=[]; let j=i;
      while(j<rows.length && rows[j].state===ST && rows[j].depot===DP){ block.push(rows[j]); j++; }
      block.forEach(r=> items.push({ type:'row', data:r }));
      const depotAcc = block.reduce((a,t)=>{ a.open+=t.opening; a.rec+=t.qty_recd; a.sale+=t.qty_sale; a.close+=t.closing; return a; },{open:0,rec:0,sale:0,close:0});
      items.push({ type:'depotTotal', data: depotAcc });
      if(j >= rows.length || rows[j].state !== ST){
        const stateAcc = rows.filter(x=>x.state===ST).reduce((a,t)=>{ a.open+=t.opening; a.rec+=t.qty_recd; a.sale+=t.qty_sale; a.close+=t.closing; return a; },{open:0,rec:0,sale:0,close:0});
        items.push({ type:'stateTotal', data: { state: ST, ...stateAcc }});
      }
      i = j;
    }
    const overall = items.reduce((a,it)=>{ if(it.type==='row'){ a.open+=it.data.opening; a.rec+=it.data.qty_recd; a.sale+=it.data.qty_sale; a.close+=it.data.closing; } else if(it.type==='depotTotal'||it.type==='stateTotal'){ a.open+=it.data.open; a.rec+=it.data.rec; a.sale+=it.data.sale; a.close+=it.data.close; } return a; }, {open:0,rec:0,sale:0,close:0});
    items.push({ type:'overall', data: overall });
    window._renderItems = items;
    initVirtualRenderer(items);
  }

  ////////////////////////////////////////////////////////////////////////////
  // Virtual renderer (recycled DOM nodes)
  ////////////////////////////////////////////////////////////////////////////
  let pool = [], poolStartIndex = 0;
  function initVirtualRenderer(items){
    vbody.style.display = '';
    skeleton.style.display = 'none';
    const totalItems = items.length;
    vbody.innerHTML = '';
    const spacer = document.createElement('div'); spacer.id = 'vSpacer'; spacer.style.height = (totalItems * ROW_HEIGHT) + 'px';
    vbody.appendChild(spacer);

    const wrap = document.querySelector('.table-wrap');
    const availableRows = Math.max(3, Math.floor((wrap.clientHeight - 40)/ROW_HEIGHT));
    const visibleCount = availableRows + BUFFER*2;

    pool = [];
    for(let i=0;i<Math.min(visibleCount,totalItems);i++){
      const tr = document.createElement('div'); tr.className='vrow'; tr.style.position='absolute'; tr.style.left='0'; tr.style.right='0'; tr.style.display='flex';
      const cols = getVisibleColumnsOrder();
      cols.forEach(col=>{
        const td = document.createElement('div'); td.className='cell cell-'+col; td.setAttribute('data-col',col);
        if(col==='state') td.classList.add('col-state');
        if(col==='depot') td.classList.add('col-depot');
        if(col==='date') td.classList.add('col-date');
        if(col==='sku_name') td.classList.add('col-sku');
        if(col==='opening') td.classList.add('col-opening');
        if(col==='qty_recd') td.classList.add('col-recd');
        if(col==='qty_sale') td.classList.add('col-sale');
        if(col==='closing') td.classList.add('col-closing');
        tr.appendChild(td);
      });
      vbody.appendChild(tr);
      pool.push(tr);
    }
    vbody.onscroll = onScroll;
    onScroll();
  }

  function getVisibleColumnsOrder(){
    const ths = Array.from(document.querySelectorAll('thead th'));
    return ths.filter(th=>th.style.display !== 'none').map(th=>th.dataset.col);
  }

  function getDynamicColspan_nonNumeric(){
    const visible = getVisibleColumnsOrder();
    return visible.filter(c=>!NUMERIC_COLUMNS.includes(c)).length || 1;
  }

  function paintRowAt(poolIndex, itemIndex){
    const poolNode = pool[poolIndex];
    const items = window._renderItems || [];
    if(itemIndex < 0 || itemIndex >= items.length){ poolNode.style.display = 'none'; return; }
    poolNode.style.display = 'flex';
    poolNode.style.top = (itemIndex * ROW_HEIGHT) + 'px';
    const item = items[itemIndex];
    const cols = getVisibleColumnsOrder();
    if(poolNode.children.length !== cols.length){
      poolNode.innerHTML = '';
      cols.forEach(col=>{
        const td = document.createElement('div'); td.className='cell cell-'+col; td.setAttribute('data-col',col);
        if(col==='state') td.classList.add('col-state');
        if(col==='depot') td.classList.add('col-depot');
        if(col==='date') td.classList.add('col-date');
        if(col==='sku_name') td.classList.add('col-sku');
        if(col==='opening') td.classList.add('col-opening');
        if(col==='qty_recd') td.classList.add('col-recd');
        if(col==='qty_sale') td.classList.add('col-sale');
        if(col==='closing') td.classList.add('col-closing');
        poolNode.appendChild(td);
      });
    }
    cols.forEach((col,ci)=>{
      const td = poolNode.children[ci];
      td.classList.remove('center','left');
      if(['opening','qty_recd','qty_sale','closing'].includes(col)) td.classList.add('center');
      else if(col==='sku_name') td.classList.add('left');
      else td.classList.add('center');

      if(item.type==='row'){
        const d=item.data;
        if(col==='state') td.textContent = d.state || '';
        else if(col==='depot') td.textContent = d.depot || '';
        else if(col==='date') td.textContent = d._parsed_date ? formatDateDDMMYYYYUTC(d._parsed_date) : (d.date||'');
        else if(col==='sku_name') td.textContent = d.sku_name || '';
        else if(col==='opening') td.textContent = fmt(d.opening);
        else if(col==='qty_recd') td.textContent = fmt(d.qty_recd);
        else if(col==='qty_sale') td.textContent = fmt(d.qty_sale);
        else if(col==='closing') td.textContent = fmt(d.closing);
      } else if(item.type==='subtotal'){
        if(ci===0){
          td.textContent = `subtotal of Date (${ item.data.labelDate instanceof Date ? formatDateDDMMYYYYUTC(item.data.labelDate) : item.data.labelDate })`;
          td.style.fontWeight='700';
        } else {
          if(col==='opening') td.textContent = fmt(item.data.sub.open);
          else if(col==='qty_recd') td.textContent = fmt(item.data.sub.rec);
          else if(col==='qty_sale') td.textContent = fmt(item.data.sub.sale);
          else if(col==='closing') td.textContent = fmt(item.data.sub.close);
          else td.textContent = '';
        }
      } else if(item.type==='depotTotal' || item.type==='stateTotal' || item.type==='overall'){
        if(ci===0){
          if(item.type==='depotTotal') td.textContent = `GRAND TOTAL OF ${item.data.depot || ''}`;
          else if(item.type==='stateTotal') td.textContent = `GRAND TOTAL OF ${item.data.state || ''}`;
          else td.textContent = `OVERALL GRAND TOTAL`;
          td.style.fontWeight='800';
        } else {
          if(col==='opening') td.textContent = fmt(item.data.open);
          else if(col==='qty_recd') td.textContent = fmt(item.data.rec);
          else if(col==='qty_sale') td.textContent = fmt(item.data.sale);
          else if(col==='closing') td.textContent = fmt(item.data.close);
          else td.textContent = '';
        }
      }
    });
  }

  function onScroll(){
    const sTop = vbody.scrollTop;
    const first = Math.max(0, Math.floor(sTop / ROW_HEIGHT) - BUFFER);
    for(let p=0;p<pool.length;p++){
      paintRowAt(p, first + p);
    }
  }

  function reapplyColumnVisibility(){
    colCheckboxes.forEach(ch=>{
      const col = ch.dataset.col; const show = ch.checked;
      const th = document.querySelector(`thead th[data-col="${col}"]`);
      if(th) th.style.display = show ? '' : 'none';
    });
    if(window._renderItems) initVirtualRenderer(window._renderItems);
  }

  // Export
  exportBtn.addEventListener('click', ()=>{
    const header=["State","Depot","Date","SKU Name","Opening","Received","Sales","Closing"];
    const rows = [];
    const items = window._renderItems || [];
    items.forEach(it=>{
      if(it.type==='row'){
        const d=it.data;
        rows.push([d.state,d.depot,d._parsed_date?formatDateDDMMYYYYUTC(d._parsed_date):d.date,d.sku_name, d.opening, d.qty_recd, d.qty_sale, d.closing]);
      } else if(it.type==='subtotal'){
        rows.push([`Subtotal (${ it.data.labelDate instanceof Date ? formatDateDDMMYYYYUTC(it.data.labelDate) : it.data.labelDate })`,'','','', it.data.sub.open, it.data.sub.rec, it.data.sub.sale, it.data.sub.close]);
      } else if(it.type==='depotTotal'){
        rows.push([`GRAND TOTAL OF ${it.data.depot||''}`,'','','', it.data.open, it.data.rec, it.data.sale, it.data.close]);
      } else if(it.type==='stateTotal'){
        rows.push([`GRAND TOTAL OF ${it.data.state||''}`,'','','', it.data.open, it.data.rec, it.data.sale, it.data.close]);
      } else if(it.type==='overall'){
        rows.push([`OVERALL GRAND TOTAL`,'','','', it.data.open, it.data.rec, it.data.sale, it.data.close]);
      }
    });
    const aoa = [header, ...rows];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, 'Stock');
    XLSX.writeFile(wb, `stock_export_${new Date().toISOString().slice(0,10)}.xlsx`);
  });

function showSkeleton(on) {
    const sk = document.getElementById('skeleton');
    if (!sk) return;

    if (on) {
        sk.style.display = 'flex';
        vbody.style.display = 'none';
    } else {
        sk.style.display = 'none';
        vbody.style.display = 'block';
    }
}

// Start
fetchAndProcess();
  </script>
</body>
