<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMC - Stock Position (F1)</title>

  <link rel="stylesheet" href="/static/css/f1-style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="/static/js/f1-core.js" defer></script>

  <style>
    /* Small page-specific tweaks */
    .page-pad { padding: 12px; }
    .controls .btn { margin-left: 6px; }
    .f1-table-head { padding: 8px 12px; display:flex; align-items:center; gap:0; overflow:auto; }
    .f1-thead { display:flex; gap:0; }
    /* map known column keys to sensible default widths (also used by F1.init) */
  </style>
</head>
<body>
  <div class="page-pad">
    <div class="f1-header">
      <div class="f1-logo">
        <img src="/static/onlylogo.png" alt="SMC" onerror="this.style.display='none'">
        <h1>SMC - Stock Position</h1>
      </div>

      <div class="f1-controls">
        <a href="{{ url_for('sales_levels') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
        <a href="{{ url_for('dashboard_daily_sale') }}" class="btn btn-outline-primary btn-sm">Daily Sale</a>

        <button id="toggleFiltersBtn" class="btn btn-light btn-sm">Filters</button>
        <button id="yesterdayBtn" class="btn btn-info btn-sm text-white">Yesterday</button>

        <div class="dropdown">
          <button class="btn btn-outline-dark btn-sm dropdown-toggle" data-bs-toggle="dropdown">Columns</button>
          <div class="dropdown-menu dropdown-menu-end col-toggle p-3" id="stockColToggle">
            <!-- Column toggles filled by HTML below; keep in sync with F1.init columns -->
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="state" type="checkbox" checked> <label class="form-check-label">State</label></div>
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="depot" type="checkbox" checked> <label class="form-check-label">Depot</label></div>
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="date" type="checkbox" checked> <label class="form-check-label">Date</label></div>
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="sku_name" type="checkbox" checked> <label class="form-check-label">SKU Name</label></div>
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="opening" type="checkbox" checked> <label class="form-check-label">Opening</label></div>
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="qty_recd" type="checkbox" checked> <label class="form-check-label">Received</label></div>
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="qty_sale" type="checkbox" checked> <label class="form-check-label">Sales</label></div>
            <div class="form-check mb-1"><input class="form-check-input col-toggle-checkbox" data-col="closing" type="checkbox" checked> <label class="form-check-label">Closing</label></div>
          </div>
        </div>

        <button id="exportStockBtn" class="btn btn-success btn-sm">Export Excel</button>
      </div>
    </div>

    <div id="stockFilterPanel" class="f1-filter" style="display:none;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div><label class="form-label small-muted">Month</label><select id="stockFilterMonth" class="form-select"><option value="">All</option></select></div>
        <div><label class="form-label small-muted">State</label><select id="stockFilterState" class="form-select"><option value="">All</option></select></div>
        <div><label class="form-label small-muted">Depot</label><select id="stockFilterDepot" class="form-select"><option value="">All</option></select></div>
        <div style="flex:1"><label class="form-label small-muted">SKU (search)</label><input id="stockFilterSKU" list="stockSkuList" class="form-control" placeholder="Type or pick SKU"><datalist id="stockSkuList"></datalist></div>
        <div><label class="form-label small-muted">From</label><input id="stockFilterFrom" type="date" class="form-control"></div>
        <div><label class="form-label small-muted">To</label><input id="stockFilterTo" type="date" class="form-control"></div>
        <div><button id="stockClearFilters" class="btn btn-outline-secondary">Reset</button></div>
      </div>
    </div>

    <div id="stockContainer" class="f1-table-wrap">
      <div class="f1-table-head">
        <div class="f1-thead"></div>
      </div>
      <div class="f1-body"></div>
    </div>
  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  // Stock page wiring using F1 core
  document.addEventListener('DOMContentLoaded', ()=>{

    const stockCols = [
      { key:'state', label:'State', width:130, frozen:true },
      { key:'depot', label:'Depot', width:150, frozen:true },
      { key:'date', label:'Date', width:110 },
      { key:'sku_name', label:'SKU Name', width:320 },
      { key:'opening', label:'Opening', width:120 },
      { key:'qty_recd', label:'Received', width:120 },
      { key:'qty_sale', label:'Sales', width:120 },
      { key:'closing', label:'Closing', width:120 }
    ];

    F1.init({
      container: '#stockContainer',
      apiUrl: '/api/get_stock_data',
      colWidthsKey: 'smc_col_widths_stock',
      colWidths: { state:130, depot:150, date:110, sku_name:320, opening:120, qty_recd:120, qty_sale:120, closing:120 },
      columns: stockCols,
      onReady: ({ merged })=>{
        // populate filters from merged rows
        const months = [...new Set(merged.map(r=>r._month).filter(Boolean))].sort();
        const monthSel = document.getElementById('stockFilterMonth');
        monthSel.innerHTML = '<option value="">All</option>' + months.map(m=>{ const [y,mm]=m.split('-'); const d=new Date(y,mm-1,1); return `<option value="${m}">${d.toLocaleString(undefined,{month:'long'})} ${y}</option>`; }).join('');
        const states = [...new Set(merged.map(r=>r.state).filter(Boolean))].sort();
        document.getElementById('stockFilterState').innerHTML = '<option value="">All</option>' + states.map(s=>`<option>${s}</option>`).join('');
        const depots = [...new Set(merged.map(r=>r.depot).filter(Boolean))].sort();
        document.getElementById('stockFilterDepot').innerHTML = '<option value="">All</option>' + depots.map(d=>`<option>${d}</option>`).join('');
        const skus = [...new Set(merged.map(r=>r.sku_name).filter(Boolean))].sort();
        document.getElementById('stockSkuList').innerHTML = skus.map(s=>`<option value="${s}">`).join('');
      }
    });

    // UI events: filters + toggles
    document.getElementById('toggleFiltersBtn').addEventListener('click', ()=> {
      const el = document.getElementById('stockFilterPanel') || document.getElementById('stockFilterPanel');
      const panel = document.getElementById('stockFilterPanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('yesterdayBtn').addEventListener('click', ()=> {
      const d = new Date(); d.setDate(d.getDate()-1);
      const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      document.getElementById('stockFilterFrom').value = val;
      document.getElementById('stockFilterTo').value = val;
      // trigger page filters by refreshing F1: simpler to call F1.refresh()
      F1.refresh();
    });

    // column toggles (checkboxes)
    document.querySelectorAll('#stockColToggle .col-toggle-checkbox').forEach(ch=>{
      ch.addEventListener('change', ()=> {
        // toggle header cell visibility directly
        const col = ch.dataset.col;
        document.querySelectorAll(`[data-col="${col}"]`).forEach(el=>{
          el.style.display = ch.checked ? '' : 'none';
        });
        // re-init to compute virtualization with new visible columns (F1.reinit not available, so just refresh)
        F1.refresh();
      });
    });

    document.getElementById('exportStockBtn').addEventListener('click', ()=> {
      F1.export(`stock_export_${new Date().toISOString().slice(0,10)}.xlsx`);
    });

    // Reset filters
    document.getElementById('stockClearFilters').addEventListener('click', ()=>{
      document.getElementById('stockFilterMonth').value=''; document.getElementById('stockFilterState').value=''; document.getElementById('stockFilterDepot').value=''; document.getElementById('stockFilterSKU').value=''; document.getElementById('stockFilterFrom').value=''; document.getElementById('stockFilterTo').value='';
      F1.refresh();
    });

  });
  </script>
</body>
</html>
