<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Plant to Depot Sales Dashboard</title>
<link rel="icon" href="{{ url_for('static', filename='onlylogo.png') }}" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>
:root{
  --navy:#1e3a8a;
  --accent1:#2563eb;
  --accent2:#4f46e5;
  --up-bg:rgba(220,252,231,0.9);
  --down-bg:rgba(254,226,226,0.9);
  --subtotal-overlay:rgba(255,247,204,0.55);
  --state-overlay:rgba(230,246,255,0.55);
  --grand-overlay:rgba(186,230,253,0.6);
  --thead-top:200px;
}

*{box-sizing:border-box}
body{font-family:Inter,system-ui,Arial;margin:0;background:#f6f9fc;color:#0f172a}

header{display:flex;align-items:center;justify-content:center;gap:16px;
  padding:14px 16px;background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#fff;position:sticky;top:0;z-index:1400;}
header img{height:56px}
header h1{margin:0;font-weight:900;font-size:1.35rem}

.toolbar{display:flex;justify-content:center;gap:10px;padding:8px;background:#fff;position:sticky;top:64px;z-index:1350;align-items:center;}
.btn{border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:800}
.btn-blue{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff}
.btn-gray{background:#eef2ff;color:var(--navy)}

#filtersWrapper{display:flex;justify-content:center;background:#f8fafc;border-bottom:1px solid #dbeafe;
  position:sticky;top:calc(64px + 48px);z-index:1320;}
.filters{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding:12px;max-width:1500px;width:100%}
.filter-box{background:#fff;border-radius:12px;padding:10px 12px;border:2px solid #c7d2fe;min-width:160px}
.filter-box label{display:block;font-weight:800;color:var(--navy);margin-bottom:6px}
.filter-box select{width:200px;padding:6px;border-radius:8px;border:1.5px solid #c7d2fe;background:#fff;font-weight:700;height:120px}
select option:disabled{color:#999;background:#f3f4f6}

.table-wrapper{max-width:1500px;margin:18px auto;border-radius:8px;overflow:auto;background:#fff;box-shadow:0 6px 18px rgba(4,8,15,0.06);height:calc(100vh - 260px);}
table{border-collapse:collapse;width:100%;min-width:1100px}
thead th,tbody td{text-align:center;padding:6px 8px;border:2px solid #2d3748;font-weight:700;vertical-align:middle;}
thead th{position:sticky;top:var(--thead-top);background:linear-gradient(90deg,#e0e7ff,#c7d2fe);color:var(--navy);z-index:1310;}
tbody tr:nth-child(odd){background:#ffffff;}
tbody tr:nth-child(even){background:#f9fafb;}

/* total rows with centered alignment */
tr.subtotal-row td,tr.state-total-row td,tr.grandtotal-row td{
  font-weight:900;text-align:center !important;
}
tr.subtotal-row td{background:var(--subtotal-overlay);}
tr.state-total-row td{background:var(--state-overlay);}
tr.grandtotal-row td{background:var(--grand-overlay);}
tbody td{height:34px;}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.75);z-index:3000;font-weight:900;color:var(--navy);}
.overlay.show{display:flex}
</style>
</head>

<body>
<header>
  <img src="{{ url_for('static', filename='onlylogo.png') }}" alt="logo">
  <h1>Plant to Depot Sales Dashboard</h1>
</header>

<div class="toolbar">
  <a href="/dashboard/plant"><button class="btn btn-gray">← Back to Plant</button></a>
  <button id="exportBtn" class="btn btn-blue">Export</button>
  <button id="clearBtn" class="btn btn-gray">Clear</button>
  <button id="toggleFiltersBtn" class="btn btn-blue">Hide Filters</button>
</div>

<div id="filtersWrapper">
  <div class="filters" id="filtersRow">
    <div class="filter-box"><label>Show Columns</label><select id="showColumns" multiple>
      <option value="State" selected>State</option>
      <option value="Party_Name" selected>Party_Name</option>
      <option value="Item_Name" selected>Item_Name</option>
    </select></div>
    <div class="filter-box"><label>State</label><select id="stateFilter" multiple></select></div>
    <div class="filter-box"><label>Party Name</label><select id="partyFilter" multiple></select></div>
    <div class="filter-box"><label>Item Name</label><select id="itemFilter" multiple></select></div>
    <div class="filter-box"><label>Month_Name</label><select id="monthFilter" multiple></select></div>
    <div class="filter-box"><label>Comparison Month</label><select id="comparisonMonth" multiple></select></div>
  </div>
</div>

<div class="table-wrapper">
  <table id="comparisonTable">
    <thead id="comparisonHead"></thead>
    <tbody id="comparisonBody"></tbody>
    <tfoot id="comparisonFoot"></tfoot>
  </table>
</div>

<div id="overlay" class="overlay">Processing...</div>

<script>
const API_URL="/get_data/lighthouse_sales";let rawData=[];
function showOverlay(){document.getElementById('overlay').classList.add('show')}
function hideOverlay(){document.getElementById('overlay').classList.remove('show')}
function toNum(v){return Number(v)||0}
function escapeHTML(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function parseDateFlexible(s){if(!s)return null;s=String(s).trim();if(/^\d{8}$/.test(s)){const d=+s.slice(0,2),m=+s.slice(2,4),y=+s.slice(4,8);return new Date(y,m-1,d)}const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(s);return isNaN(d)?null:d}
function invoiceMonthLabel(s){const dt=parseDateFlexible(s);return dt?dt.toLocaleString('default',{month:'short',year:'2-digit'}):"";}
function debounce(fn,ms=200){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);}}
function setDynamicTheadTop(){const h=document.querySelector('header'),t=document.querySelector('.toolbar'),f=document.getElementById('filtersWrapper');let top=0;if(h)top+=h.getBoundingClientRect().height;if(t)top+=t.getBoundingClientRect().height;if(f)top+=f.getBoundingClientRect().height;document.documentElement.style.setProperty('--thead-top',top+'px');}
async function loadData(){showOverlay();try{const r=await axios.get(API_URL);const rows=Array.isArray(r.data)?r.data:[];rawData=rows.map(v=>{const rawDate=(v.invoice_date||v.INVOICE_DATE||"").toString().trim();const month=invoiceMonthLabel(rawDate);return{state:(v.state||v.STATE||"").trim(),party:(v.party_name||v.PARTY_NAME||"").trim(),item:(v.item_name||v.ITEM_NAME||"").trim().replace(/\s+/g,' '),month,qty:toNum(v.quantity_cs||v.Quantity_CS||0)}}).filter(r=>r.state&&r.party&&r.item);initFilters();setDynamicTheadTop();window.addEventListener('resize',debounce(setDynamicTheadTop,200));applyFilters();}catch(e){alert('Load error');}finally{hideOverlay();}}
function initFilters(){const st=[...new Set(rawData.map(r=>r.state))].sort(),pt=[...new Set(rawData.map(r=>r.party))].sort(),it=[...new Set(rawData.map(r=>r.item))].sort(),mo=[...new Set(rawData.map(r=>r.month).filter(Boolean))].sort((a,b)=>new Date('01 '+a)-new Date('01 '+b));const fill=(id,list)=>{const el=document.getElementById(id);el.innerHTML='';list.forEach(v=>el.innerHTML+=`<option>${v}</option>`)};fill('stateFilter',st);fill('partyFilter',pt);fill('itemFilter',it);fill('monthFilter',mo);fill('comparisonMonth',mo);if(mo.length>=2){const last2=mo.slice(-2);[...document.getElementById('comparisonMonth').options].forEach(o=>{if(last2.includes(o.value))o.selected=true;});}}
function getVals(id){const e=document.getElementById(id);if(!e)return[];return[...e.selectedOptions].map(o=>o.value)}
function updateSoftCascade(mths){const mf=mths&&mths.length?mths:[...new Set(rawData.map(r=>r.month).filter(Boolean))];const a={states:new Set(),parties:new Set(),items:new Set()};rawData.forEach(r=>{if(r.month&&mf.includes(r.month)){a.states.add(r.state);a.parties.add(r.party);a.items.add(r.item);}});const apply=(id,set)=>{const el=document.getElementById(id);if(!el)return;[...el.options].forEach(o=>{if(!set.has(o.value)&&!o.selected)o.disabled=true;else o.disabled=false;});};apply('stateFilter',a.states);apply('partyFilter',a.parties);apply('itemFilter',a.items);}
function renderTotalRow(type,label,totals,headers,cols,months,compPair,rowCount=1){if(type==='party'&&rowCount<2)return'';let rowClass='',itemLabel='';if(type==='party'){rowClass='subtotal-row';itemLabel=`SUM ${escapeHTML(label)}`;}else if(type==='state'){rowClass='state-total-row';itemLabel=`TOTAL ${escapeHTML(label)}`;}else if(type==='grand'){rowClass='grandtotal-row';itemLabel=label;}let h='<tr class="'+rowClass+'">';for(const c of headers){if(cols.includes(c)){if(c==='Item_Name')h+=`<td><b>${itemLabel}</b></td>`;else if(c==='State'&&type==='state')h+=`<td><b>${escapeHTML(label)}</b></td>`;else if(c==='Party_Name'&&type==='party')h+=`<td><b>${escapeHTML(label)}</b></td>`;else h+='<td></td>';}else if(months.includes(c)){h+=`<td><b>${(totals[c]||0).toLocaleString()}</b></td>`;}else if(c==='Δ'||c==='% Change'){if(compPair.length>=2){const v1=totals[compPair[0]]||0,v2=totals[compPair[1]]||0;if(c==='Δ'){const diff=v2-v1,bg=diff>0?'var(--up-bg)':(diff<0?'var(--down-bg)':'');h+=`<td style="background:${bg};"><b>${diff>0?'+':''}${diff.toLocaleString()}</b></td>`;}else{const pct=v1?(((v2-v1)/v1)*100):(v2?100:0),col=pct>0?'#16a34a':(pct<0?'#dc2626':'');h+=`<td style="color:${col}">${pct>0?'+':''}${pct.toFixed(1)}%</td>`;}}else h+='<td></td>';}else h+='<td></td>';}return h+'</tr>'; }
function applyFilters(){showOverlay();setTimeout(()=>{const cols=getVals('showColumns'),stSel=getVals('stateFilter'),ptSel=getVals('partyFilter'),itSel=getVals('itemFilter'),mSel=getVals('monthFilter'),cSel=getVals('comparisonMonth');const mAll=[...new Set(rawData.map(r=>r.month).filter(Boolean))].sort((a,b)=>new Date('01 '+a)-new Date('01 '+b));const months=mSel.length?mSel:mAll;const compSorted=cSel.slice().sort((a,b)=>new Date('01 '+a)-new Date('01 '+b));const compPair=compSorted.length>=2?compSorted.slice(-2):[];updateSoftCascade(months);const grouped=new Map();rawData.forEach(r=>{if(stSel.length&&!stSel.includes(r.state))return;if(ptSel.length&&!ptSel.includes(r.party))return;if(itSel.length&&!itSel.includes(r.item))return;const keyParts=cols.map(c=>c==='State'?r.state:c==='Party_Name'?r.party:c==='Item_Name'?r.item:'');const key=keyParts.join('___');if(!grouped.has(key))grouped.set(key,Object.fromEntries([...cols.map(c=>[c,keyParts[cols.indexOf(c)]]),...months.map(m=>[m,0])]));const g=grouped.get(key);if(r.month&&months.includes(r.month))g[r.month]+=r.qty;});const sorted=[...grouped.keys()].sort();const headers=[...cols,...months];if(compPair.length>=2)headers.push('Δ','% Change');document.getElementById('comparisonHead').innerHTML='<tr>'+headers.map(h=>`<th>${escapeHTML(h)}</th>`).join('')+'</tr>';let html='',grand=Object.fromEntries(months.map(m=>[m,0])),stTotals=new Map(),ptTotals=new Map(),ptCount=new Map();let lastSt=null,lastPt=null;for(const key of sorted){const row=grouped.get(key);if(!months.some(m=>(row[m]||0)>0))continue;const s=row.State,p=row.Party_Name;if(lastPt&&(p!==lastPt||s!==lastSt)){const pk=lastSt+'___'+lastPt;const pt=ptTotals.get(pk)||{},count=ptCount.get(pk)||1;html+=renderTotalRow('party',lastPt,pt,headers,cols,months,compPair,count);}if(lastSt&&s!==lastSt){const st=stTotals.get(lastSt)||{};html+=renderTotalRow('state',lastSt,st,headers,cols,months,compPair);}html+='<tr>';headers.forEach(h=>{if(cols.includes(h))html+=`<td>${escapeHTML(row[h]||'')}</td>`;else if(months.includes(h)){const v=row[h]||0,idx=months.indexOf(h);let bg='';if(compPair.length===0&&idx>0){const prev=months[idx-1];const prevV=row[prev]||0;bg=v>prevV?'background:var(--up-bg);':(v<prevV?'background:var(--down-bg);':'');}html+=`<td style="${bg}">${v?v.toLocaleString():''}</td>`;grand[h]+=v;const st=stTotals.get(s)||Object.fromEntries(months.map(m=>[m,0]));st[h]+=v;stTotals.set(s,st);const pk=s+'___'+p;const pt=ptTotals.get(pk)||Object.fromEntries(months.map(m=>[m,0]));pt[h]+=v;ptTotals.set(pk,pt);ptCount.set(pk,(ptCount.get(pk)||0)+1);}else if(h==='Δ'||h==='% Change'){if(compPair.length>=2){const v1=row[compPair[0]]||0,v2=row[compPair[1]]||0;if(h==='Δ'){const diff=v2-v1,bg=diff>0?'var(--up-bg)':(diff<0?'var(--down-bg)':'');html+=`<td style="background:${bg};">${diff>0?'+':''}${diff.toLocaleString()}</td>`;}else{const pct=v1?(((v2-v1)/v1)*100):(v2?100:0),col=pct>0?'#16a34a':(pct<0?'#dc2626':'');html+=`<td style="color:${col}">${pct>0?'+':''}${pct.toFixed(1)}%</td>`;}}else html+='<td></td>';}else html+='<td></td>';});html+='</tr>';lastSt=s;lastPt=p;}if(lastPt){const pk=lastSt+'___'+lastPt;const pt=ptTotals.get(pk)||{},count=ptCount.get(pk)||1;html+=renderTotalRow('party',lastPt,pt,headers,cols,months,compPair,count);}if(lastSt){const st=stTotals.get(lastSt)||{};html+=renderTotalRow('state',lastSt,st,headers,cols,months,compPair);}html+=renderTotalRow('grand','GRAND TOTAL',grand,headers,cols,months,compPair);document.getElementById('comparisonBody').innerHTML=html||`<tr><td colspan="${headers.length}">No Data</td></tr>`;document.getElementById('comparisonFoot').innerHTML='';hideOverlay();},100);}
document.getElementById('clearBtn').onclick=()=>location.reload();
document.getElementById('toggleFiltersBtn').onclick=()=>{const row=document.getElementById('filtersRow'),btn=document.getElementById('toggleFiltersBtn');if(row.style.display==='none'){row.style.display='flex';btn.textContent='Hide Filters';}else{row.style.display='none';btn.textContent='Show Filters';}setDynamicTheadTop();};
document.getElementById('exportBtn').onclick=async()=>{showOverlay();try{const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet('Comparison');const headerRow=[...document.querySelectorAll('#comparisonHead tr th')].map(th=>th.innerText.trim());ws.addRow(headerRow).font={bold:true};const bodyRows=[...document.querySelectorAll('#comparisonBody tr')].map(tr=>[...tr.children].map(td=>td.innerText.trim()));bodyRows.forEach(r=>ws.addRow(r));ws.columns.forEach(c=>c.width=18);const buf=await wb.xlsx.writeBuffer();saveAs(new Blob([buf]),`comparison_${new Date().toISOString().slice(0,10)}.xlsx`);}catch(e){alert('Export failed');}finally{hideOverlay();}};
loadData();
</script>
</body>
</html>
