{% extends "base.html" %}
{% block title %}User Management{% endblock %}
{% block content %}
<div class="bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-semibold mb-4">👤 User Management (Live)</h2>

  <!-- ✅ Flash box -->
  <div id="flashBox" class="hidden mb-3 p-2 rounded text-white font-medium"></div>

  <!-- Add/Edit User Form -->
  <form id="userForm" class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-4">
    <input id="user_id" placeholder="User ID" class="px-3 py-2 border rounded" required>
    <input id="password" type="password" placeholder="Password" class="px-3 py-2 border rounded">
    <select id="role" class="px-3 py-2 border rounded">
      <option>User</option>
      <option>Admin</option>
    </select>
    <input id="state" placeholder="State" class="px-3 py-2 border rounded">
    <input id="manager_name" placeholder="Manager Name" class="px-3 py-2 border rounded">
    <input id="district" placeholder="District" class="px-3 py-2 border rounded">
    <div class="col-span-full flex justify-end">
      <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">💾 Save User</button>
    </div>
  </form>

  <!-- Table -->
  <table class="min-w-full divide-y" id="usersTable">
    <thead class="bg-slate-50">
      <tr>
        <th class="px-3 py-2 text-left">User ID</th>
        <th class="px-3 py-2 text-left">Role</th>
        <th class="px-3 py-2 text-left">State</th>
        <th class="px-3 py-2 text-left">Manager</th>
        <th class="px-3 py-2 text-left">District</th>
        <th class="px-3 py-2 text-center">Actions</th>
      </tr>
    </thead>
    <tbody id="usersBody" class="divide-y"></tbody>
  </table>
</div>

<script>
async function fetchUsers() {
  const res = await fetch("/admin_api/list_users");
  const data = await res.json();
  const body = document.getElementById("usersBody");
  body.innerHTML = "";
  data.forEach(u => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td class="px-3 py-2">${u.user_id}</td>
      <td class="px-3 py-2">${u.role}</td>
      <td class="px-3 py-2">${u.state || ""}</td>
      <td class="px-3 py-2">${u.manager_name || ""}</td>
      <td class="px-3 py-2">${u.district || ""}</td>
      <td class="px-3 py-2 text-center">
        ${u.user_id !== "admin" ? `
          <button onclick="deleteUser(${u.id})" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">🗑 Delete</button>
        ` : `<span class='text-gray-400 text-sm'>Protected</span>`}
      </td>`;
    body.appendChild(row);
  });
}

async function saveUser(e) {
  e.preventDefault();
  const user = {
    user_id: user_id.value,
    password: password.value,
    role: role.value,
    state: state.value,
    manager_name: manager_name.value,
    district: district.value
  };
  const res = await fetch("/admin_api/create_or_update", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(user)
  });
  const data = await res.json();
  showFlash(data.message || "User updated.", data.success);
  document.getElementById("userForm").reset();
  fetchUsers();
}

async function deleteUser(id) {
  if (!confirm("Delete this user?")) return;
  const res = await fetch(`/admin_api/delete/${id}`, { method: "DELETE" });
  const data = await res.json();
  showFlash(data.message, data.success);
  fetchUsers();
}

function showFlash(msg, success=true) {
  const box = document.getElementById("flashBox");
  box.textContent = msg;
  box.className = success
    ? "mb-3 p-2 rounded bg-green-600 text-white"
    : "mb-3 p-2 rounded bg-red-600 text-white";
  box.classList.remove("hidden");
  setTimeout(() => box.classList.add("hidden"), 2000);
}

document.getElementById("userForm").addEventListener("submit", saveUser);
fetchUsers();
</script>
{% endblock %}
